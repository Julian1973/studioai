:root{
  --bg:#14201a;--surface:#1c2921;--surface2:#223227;--ink:#edf4ee;--muted:#93a89b;--hint:#6b8074;--line:#33473a;
  --brand:#2f9e8f;--brandbg:#1d2f2b;--brandink:#6fe0cf;
  --spark:#f0b542;--sparkbg:#2a2419;--deep:#e8825f;--deepbg:#2c2119;
  --ok:#3ecf8e;--okbg:#16281f;--info:#6ab0e8;--infobg:#1a2430;
  --danger:#e8785a;--dangerbg:#2a1a16;
  --warn:#e8b25a;--warnbg:#2a2318;
  /* ONE MONO TOKEN (2026-07-26). It was retyped three times; monospace is now banned from
     PROSE everywhere in the shot panel and survives only in raw-record wells and hashes. */
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  /* SIX SPACING STEPS. Hand-typed margins are the single largest source of "no rhythm". */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  /* Sized for "SPECIAL REFERENCES", the longest name in cb_departments.SHOT_PANEL — one
     edit if that table ever carries a longer one. */
  --rowtitle-w:184px;
}
*{box-sizing:border-box}
input,textarea,select{background:var(--surface2);color:var(--ink);accent-color:var(--brand)}
body{margin:0;font-family:'Body Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Label Sans',sans-serif}
.logo{width:28px;height:28px;border-radius:8px;background:var(--brandbg);color:var(--brand);display:flex;align-items:center;justify-content:center}
.toplinks{display:flex;gap:8px;align-items:center}
.tl{font-size:13px;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer}
.tl:hover{background:var(--brandbg);color:var(--brandink)}
.tl.on{background:var(--brandbg);color:var(--brandink);font-weight:600}
.epchip{font-size:12px;color:var(--brandink);background:var(--brandbg);border-radius:8px;padding:5px 12px}
.gates{display:flex;gap:8px;align-items:center;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--hint);flex-wrap:wrap}
.gates .on{color:var(--brandink);font-weight:600}.gates .done{color:var(--ok)}
.shell{display:flex;min-height:calc(100vh - 98px)}
.nav{width:172px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:10px}
.nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;margin-bottom:2px}
.nav a.active{background:var(--brandbg);color:var(--brandink);font-weight:600}.nav a:hover:not(.active){background:var(--surface2);color:var(--ink)}
.nav .sep{border-top:1px solid var(--line);margin:8px 6px}
.main{flex:1;padding:22px 26px;min-width:0}
.h1{font-size:21px;font-weight:900;margin:0 0 2px;font-family:'Display Slab',Georgia,serif}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.epcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .12s}
.epcard:hover{border-color:var(--brand)}
.epthumb{height:96px;background:#1a2b24;display:flex;align-items:center;justify-content:center;color:#7fd4c1;font-size:13px}
.epbody{padding:12px 14px}
.epbody .n{font-size:11px;color:var(--hint);font-weight:600}
.epbody .t{font-size:15px;font-weight:900;margin:2px 0 6px;font-family:'Display Slab',Georgia,serif}
.epbody .l{font-size:12px;color:var(--muted);line-height:1.4;height:50px;overflow:hidden}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:10px;border-radius:6px;padding:3px 8px;margin-top:8px}
.addcard{border:1.5px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--brand);cursor:pointer;min-height:170px;font-weight:500}
.addcard:hover{border-color:var(--brand);background:var(--brandbg)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:640px}
.form label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 4px}
.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:var(--surface2);color:var(--ink)}
.form textarea{min-height:220px;resize:vertical;font-size:13px;line-height:1.5}
.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-left:8px}
.scene{margin-bottom:24px}
.scenehd{display:flex;align-items:center;gap:10px;margin:0 0 10px}.scenehd b{font-size:14px}.scenehd .ct{font-size:12px;color:var(--hint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .12s}.card:hover{border-color:var(--brand)}
.thumb{height:108px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb .ph{font-size:24px;opacity:.55}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;background:rgba(16,26,21,.88);color:var(--ink);border-radius:6px;padding:2px 7px}
.wb{position:absolute;top:8px;right:8px;font-size:9px;font-weight:600;border-radius:6px;padding:2px 6px}
.play{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(16,26,21,.85);color:#fff;display:flex;align-items:center;justify-content:center}
.cbody{padding:9px 11px}.crow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.pill{font-size:10px;border-radius:6px;padding:2px 7px}.act{font-size:12.5px;line-height:1.4;margin-bottom:4px}.meta{font-size:11px;color:var(--hint);margin-bottom:6px}
.dlg{font-size:11px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:7px;margin-bottom:7px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10px;border-radius:6px;padding:2px 7px}
.srow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.srow:hover{border-color:var(--brand)}.srow .num{font-size:11px;font-weight:600;color:var(--brandink);min-width:46px}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}.mc[onclick]{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s}.mc[onclick]:hover{border-color:var(--brand);box-shadow:0 3px 14px rgba(0,0,0,.28);transform:translateY(-1px)}.mc .lab{font-size:12px;color:var(--muted)}.mc .num{font-size:24px;font-weight:600;margin-top:3px}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--brand)}
.scriptbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px 18px;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:520px;overflow:auto}
.bible{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 26px;max-width:820px}
.bible h1{font-size:20px}.bible h2{font-size:17px;border-top:1px solid var(--line);padding-top:14px}.bible h3{font-size:15px}
.bible table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}.bible th,.bible td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.modal{position:fixed;inset:0;background:rgba(10,16,13,.62);display:none;align-items:center;justify-content:center;padding:24px;z-index:10}.modal.show{display:flex}
.sheet{background:var(--surface);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px}
.media{width:100%;border-radius:10px;background:var(--surface2);margin:12px 0;max-height:380px;object-fit:contain}
.kv{font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.prompt{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:var(--ink)}
.x{float:right;cursor:pointer;color:var(--muted);font-size:20px;border:none;background:none}
.coming{color:var(--hint);font-size:13px;padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
.live{display:flex;align-items:center;gap:9px;margin:8px 2px;padding:9px 13px;background:var(--infobg);color:var(--info);border-radius:9px;font-weight:600;font-size:13px}
/* ── Gate-flow spine: the 4-gate rail + active panel ── */
.grail{display:flex;align-items:stretch;gap:0;margin:14px 0 4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.gnode{flex:1;min-width:118px;text-align:center;padding:11px 8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:box-shadow .25s,border-color .25s,transform .2s;position:relative}
.gnode:hover{border-color:var(--brand)}
.gnode.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.gnode.locked{opacity:.55;cursor:default}
.gnode.locked:hover{border-color:var(--line)}
.gnode .gglyph{font-size:18px;line-height:1;margin-bottom:5px;font-weight:700}
.gnode .gnum{font-size:9px;letter-spacing:.08em;color:var(--hint)}
.gnode .gname{font-size:12.5px;font-weight:600;margin:1px 0 1px}
.gnode .gph{font-size:10px;font-weight:600}
.gconn{align-self:center;flex:0 0 26px;height:3px;background:var(--line);transition:background .4s}
.gconn.fill{background:var(--ok)}
.justUnlocked{animation:justUnlocked 1.3s ease-out 1}
@keyframes justUnlocked{0%{box-shadow:0 0 0 0 var(--brand)}40%{box-shadow:0 0 0 6px var(--brandbg)}100%{box-shadow:0 0 0 3px var(--brandbg)}}
.sstrip{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 2px}
.schip{padding:5px 13px;border:1px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;transition:border-color .2s}
.schip:hover{border-color:var(--brand)}
.schip.on{border-color:var(--brand);background:var(--brandbg);color:var(--brandink)}
.apanel{border:1.5px solid var(--brand);border-radius:14px;padding:16px 17px;margin-top:10px;background:var(--surface)}
.bigfire{font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:10px;background:var(--brand);color:#fff;border:none;cursor:pointer}
.bigfire:hover{background:var(--brandink)}
.bigsign{font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:10px;background:var(--ok);color:var(--bg);border:none;cursor:pointer}
.bigsign:hover{filter:brightness(1.08)}
.minds{font-size:11px;color:var(--brandink);letter-spacing:.02em}
/* ── Linear Gated Cascade (Ticket 4): stage rail + per-beat timeline + panel ── */
.crail{display:flex;align-items:stretch;gap:0;margin:14px 0 6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.cstage{flex:1;min-width:104px;text-align:center;padding:10px 8px 9px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:box-shadow .25s,border-color .25s,opacity .25s;position:relative}
.cstage:hover:not(.locked){border-color:var(--brand)}
.cstage.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.cstage.locked{opacity:.5;cursor:not-allowed}
.cstage.done{border-color:var(--ok)}
.cstage .cglyph{font-size:17px;line-height:1;margin-bottom:4px;font-weight:700}
.cstage .cnum{font-size:9px;letter-spacing:.08em;color:var(--hint)}
.cstage .cname{font-size:12.5px;font-weight:600;margin:1px 0 1px}
.cstage .cph{font-size:10px;font-weight:600}
.cconn{align-self:center;flex:0 0 22px;height:3px;background:var(--line);transition:background .4s}
.cconn.fill{background:var(--ok)}
.ctl{display:flex;flex-direction:column;gap:6px;margin:10px 0 0}
.cbeat{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.cbeat:hover{border-color:var(--brand)}
.cbeat.current{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandbg)}
.cbeat.locked{opacity:.55;cursor:not-allowed}
.cbeat .cbdot{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cbeat .cbcode{font-weight:700;font-size:12.5px;min-width:52px}
.cbeat .cbact{flex:1;min-width:0;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbeat .cbst{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.cpanel{border:1.5px solid var(--brand);border-radius:14px;padding:16px 17px;margin-top:14px;background:var(--surface)}
.cjson{width:100%;min-height:240px;font-family:var(--mono);font-size:11.5px;line-height:1.45;padding:11px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box;resize:vertical;background:var(--bg);color:var(--ink)}
.cgate-note{font-size:11.5px;color:var(--spark);background:var(--sparkbg);border-radius:7px;padding:8px 11px;margin:8px 0}
/* ── click-to-enlarge lightbox (keyframes + scene plate) ── */
img.zoom{cursor:zoom-in;transition:filter .12s ease}
img.zoom:hover{filter:brightness(1.08)}
.thumb img.zoom:hover{filter:brightness(1.08)}
#lightbox{position:fixed;inset:0;z-index:9999;background:rgba(10,16,13,.90);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;padding:26px;box-sizing:border-box}
#lightbox.open{display:flex}
#lbimg{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:10px;box-shadow:0 12px 60px rgba(0,0,0,.55);background:var(--bg);cursor:zoom-in;transition:transform .15s ease;transform-origin:center}
#lbimg.zoomed{cursor:zoom-out}
#lbcap{color:var(--ink);font-size:12.5px;margin-top:13px;display:flex;gap:16px;align-items:center;max-width:94vw}
#lbcap a{color:var(--brandink);text-decoration:none}#lbcap a:hover{text-decoration:underline}
#lbclose{position:absolute;top:14px;right:22px;color:#fff;font-size:28px;line-height:1;cursor:pointer;opacity:.8}
#lbclose:hover{opacity:1}
/* THE PRODUCTION CONTROL ROOM (2026-07-17 UX replacement) — one sequential pipeline: */
:root{--honey:#d9a441;--honeybg:#2e2416}
/* (2026-07-26) the byte-identical duplicate :root{--deep…} that used to sit here is gone;
   the tokens themselves are live — STATE_COLOR.blocked / STATE_BG.blocked read them. */

/* ── THE PRODUCTION OPERATING SYSTEM — Scene Board + Scene Workspace ── */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filterchip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .12s,color .12s}
.filterchip:hover{border-color:var(--brand);color:var(--ink)}
.filterchip.active{background:var(--surface2);border-color:var(--brand);color:var(--ink);font-weight:600}
.filterchip .fc{opacity:.6;margin-left:3px}

.sceneboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.scenecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.scenecard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.scenecard-thumb{position:relative;aspect-ratio:16/9;background:var(--surface2);overflow:hidden}
.scenecard-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.scenecard-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:12.5px}
.scenecard-dot{position:absolute;top:12px;right:12px;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.scenecard-body{padding:16px 18px 18px}
.scenecard-title{font-family:'Display Slab',Georgia,serif;font-size:14.5px;font-weight:700;letter-spacing:.01em;margin-bottom:12px;line-height:1.3}
.scenecard-stages{display:flex;flex-direction:column;gap:7px}
.stagerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px}
.stagerow-name{color:var(--muted);flex:0 0 auto}

.stbadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2.5px 8px;white-space:nowrap}
.badgesub{display:block;font-size:10.5px;color:var(--hint);margin-top:2px;text-align:right}

/* ── Scene Workspace ── */
.wtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.backlink{color:var(--honey);cursor:pointer;font-size:13px;flex:0 0 auto}
.wtop-crumb{color:var(--muted);font-size:13px;flex:1 1 auto}
.sceneselect{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;max-width:340px}

.jobbanner{background:var(--infobg);border:1px solid var(--info);border-radius:10px;padding:10px 15px;font-size:13px;color:var(--info);margin-bottom:18px}

/* ── THE GLOBAL STATUS BAR (2026-07-20, Julian — "I want to see a clear action and
   status at the top of the studio... this needs to happen on all pages") — sits between
   the persistent header and the gate strip, so it's on screen no matter which page/tab is
   open, not just the pipeline view a department fire happens to live on. Collapses to
   zero height (no border, no padding) when there's genuinely nothing to report — never a
   permanent empty strip taking up space. */
.globalbar{display:none}
.globalbar.show{display:flex;align-items:center;gap:10px;padding:8px 18px;font-size:12.5px;border-bottom:1px solid var(--line)}
.globalbar.working{background:var(--infobg);color:var(--info)}
.globalbar.done{background:var(--okbg);color:var(--ok)}
.globalbar .gb-label{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.globalbar button{flex:0 0 auto}

/* ── PROJECTS SCREEN — the entry point; calm, visual, one obvious next action ── */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.projcard{border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.projcard:hover{border-color:var(--brand);transform:translateY(-1px)}
.projcard-art{aspect-ratio:16/9;background:linear-gradient(135deg,var(--surface2),var(--bg));position:relative;overflow:hidden}
.projcard-art img{width:100%;height:100%;object-fit:cover;display:block}
.projcard-art .initial{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:44px;color:var(--line);font-weight:700}
.projcard-art .archtag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:rgba(0,0,0,.55);color:var(--muted);padding:3px 9px;border-radius:20px}
.projcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.projcard-name{font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:7px}
.projcard-type{font-size:11px;color:var(--brandink);font-weight:600}
.projcard-premise{font-size:12px;color:var(--hint);line-height:1.5}
.projcard-meta{font-size:11px;color:var(--hint)}
.projcard-progress{margin-top:2px}
.projcard-progress-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.projcard-bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.projcard-bar>i{display:block;height:100%;background:var(--brand);border-radius:3px}
.projcard-decisions{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.projcard-activity{font-size:11px;color:var(--hint)}
.projcard-cta{margin-top:auto;padding-top:10px}

.workspace{display:grid;grid-template-columns:220px 1fr 300px;gap:24px;align-items:start}
.wcol{min-width:0}
.wcol-full{grid-column:1/-1}
.wcol-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);font-weight:700;margin-bottom:12px}
.wcol-contents{background:var(--surface);border-radius:14px;padding:16px;position:sticky;top:16px;max-height:calc(100vh - 140px);overflow:auto}
.wcol-artefact{background:var(--surface);border-radius:14px;padding:22px;min-height:340px}
.wcol-decision{background:var(--surface);border-radius:14px;padding:20px;position:sticky;top:16px}
.locked-msg{color:var(--hint);text-align:center;padding:60px 20px;font-size:14px}

.artefact-center{display:flex;flex-direction:column;align-items:center;justify-content:center}
.artefact-center{width:100%}
.artefact-center img.pmedia,.artefact-center video,.artefact-center>img{width:100%;max-width:100%;max-height:64vh;object-fit:contain;border-radius:10px;background:#000;display:block;margin:0 auto}
.artefact-center audio{width:100%}
.artefact-empty{color:var(--hint);text-align:center;padding:50px 20px;font-size:14px}

.dec-title{font-family:'Display Slab',Georgia,serif;font-size:16px;font-weight:700;margin-bottom:4px}
.dec-version{color:var(--muted);font-size:12.5px;margin-bottom:18px}
.dec-actions{display:flex;flex-direction:column;gap:10px}
.dec-actions .btn,.dec-actions .btn.ghost{margin-top:0;width:100%}
.dec-caption{font-size:12px;color:var(--hint)}
.dec-history{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.dec-history summary{cursor:pointer;font-size:12px;color:var(--muted);font-weight:600}
.histrow{margin-top:12px;font-size:12px}
.histmeta{color:var(--hint);margin-left:6px}
.histnote{color:var(--muted);margin-top:3px;line-height:1.4}
.reject-cat{background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:12.5px;width:100%}
.ofc{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.ofc-row .btn,.ofc-row .btn.ghost{width:100%;margin:0}
.ofc-row .btn.ghost[disabled]{opacity:.45;cursor:not-allowed}
.ofc-libitem{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px}
.ofc-libitem img{width:96px;height:54px;object-fit:cover;border-radius:5px;flex:none}
.ofc-libmeta{flex:1;min-width:0}
/* THE CONTAINED CREATIVE CONTROLS — Voice/Animation working versions + the free structure
   check (2026-07-19). Deliberately reuses .dec-caption/.stbadge/.techdetails/.techpre —
   only the container/textarea/row shapes are new. */
.ccpanel{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.cchead{font-size:13px;font-weight:600;margin-bottom:6px}
.ccline{margin-bottom:14px}
.cclabel{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.ccta{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
      font:inherit;font-size:13px;line-height:1.5;background:var(--surface2);color:var(--ink);resize:vertical}
.ccref{font-size:11.5px;color:var(--hint);margin-top:4px;line-height:1.4}
.ccactions{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.ccactions .btn,.ccactions .btn.ghost{margin:0;max-width:100%;white-space:normal;text-align:center;line-height:1.3}
.ccrow{font-size:12.5px;margin-top:6px;line-height:1.5}
.ccdot{font-weight:700;margin-right:2px}
.deptpanel{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.deptperson{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.deptavatar{width:34px;height:34px;border-radius:50%;background:var(--brandbg);color:var(--brandink);
  display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.deptname{font-size:13px;font-weight:700;line-height:1.25}
.deptmeta{font-size:11px;color:var(--hint);line-height:1.4;margin-top:2px}
.deptoutput{font-size:11.5px;line-height:1.5;background:var(--surface2);border-radius:8px;
  padding:10px;margin-top:10px;white-space:pre-wrap;max-height:220px;overflow:auto}
.deptpanel .ccta{min-height:150px;font-size:11.5px}
.deptchecklist{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);display:flex;
  flex-direction:column;gap:5px}
.deptchecklist-row{display:flex;align-items:baseline;gap:7px;font-size:11.5px;flex-wrap:wrap}
.deptchecklist-dot{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.deptchecklist-label{color:var(--ink)}
.deptchecklist-reason{color:var(--hint);font-size:10.5px;flex-basis:100%;margin-left:15px}

.sb-purpose{font-size:14.5px;line-height:1.6;color:var(--ink)}
.beatcard{background:var(--surface2);border-radius:10px;padding:12px 14px;margin-top:8px}
.beatcard-id{font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.beatcard-line{font-size:13px;line-height:1.5;color:var(--muted)}
.shotcard{padding:8px 0;border-bottom:1px solid var(--line)}
.shotcard:last-child{border-bottom:none}
.shotcard-id{font-size:12.5px;font-weight:600}
.shotcard-line{font-size:12px;color:var(--hint);margin-top:2px}
/* ══ THE TREATMENTS (2026-07-26) ═══════════════════════════════════════════════════════
   The creative room writes three named approaches to the scene and the reasoning that
   welded two of them together — 21,537 + 8,958 characters for Scene 1 alone. All of it
   was filed under a "Technical details" disclosure holding
   `JSON.stringify(PSB).slice(0,4000)`, and `treatments` begins at character 5,766 of that
   dump (measured live against Scene 1) — so the slice ended roughly 1,800 characters before
   the first treatment did, and this text had never once been on screen. It is the most
   valuable prose the product generates. It gets a real home. */
.trt-lede{font-size:13px;line-height:1.65;color:var(--muted);max-width:78ch;margin-top:var(--s2)}
.trt-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--s3);margin-top:var(--s3)}
.trt{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:var(--s4);min-width:0}
.trt.is-selected{border-color:var(--honey);background:var(--honeybg)}
.trt-tag{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hint)}
.trt.is-selected .trt-tag{color:var(--honey)}
.trt-name{font-family:'Display Slab',Georgia,serif;font-size:16px;line-height:1.3;margin:var(--s1) 0 var(--s2);letter-spacing:-.2px}
.trt-name em{display:block;font-family:inherit;font-style:normal;font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.45;margin-top:var(--s1)}
.trt-field{margin-top:var(--s3)}
.trt-field>dt{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);margin-bottom:3px}
.trt-field>dd{margin:0;font-size:12.5px;line-height:1.6;color:var(--ink);overflow-wrap:anywhere}
.trt-more>summary{cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--hint);list-style:none;padding:var(--s2) 0 0}
.trt-more>summary::-webkit-details-marker{display:none}
.trt-more>summary::before{content:"▸ "}
.trt-more[open]>summary::before{content:"▾ "}
.trt-sel{border:1px solid var(--honey);border-radius:10px;background:var(--surface);padding:var(--s4);margin-top:var(--s3)}
.trt-sel .trt-field>dd{max-width:78ch}
.trt-from{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
.trt-from span{font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
/* A last-resort floor so a bare <pre> can never again typeset as an unwrapped monospace
   slab. Every existing pre rule is a class selector and still wins on specificity — this
   only ever catches a <pre> nobody styled. */
pre{white-space:pre-wrap;overflow-wrap:anywhere}

.techdetails{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.techdetails summary{cursor:pointer;font-size:11px;color:var(--hint)}
.techmeta{font-size:11px;color:var(--hint);margin-top:8px}
/* THE ONE PLACE MONO SURVIVES: raw records. Never prose. (2026-07-26) */
.techpre{font-family:var(--mono);font-size:11px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface2);border-radius:8px;padding:11px;margin:var(--s2) 0 0;max-height:260px;overflow:auto;color:var(--muted)}

/* .dlgline is the plain locked-script line list (storyboard + the voice row's "the lines
   this take performs"). The DIRECTION document's own dialogue is .vodiff — a diff, not a
   read — and never renders through here. */
.dlgline{font-size:15px;line-height:1.62;margin-bottom:var(--s3);overflow-wrap:anywhere}
.dlgdelivery{color:var(--hint);font-size:11px;line-height:1.45;margin-top:2px}

.candgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%}
.cand video{width:100%;border-radius:10px;background:#000;display:block}
.cand-pick{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:8px}

.controw{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.controw:last-child{border-bottom:none}
.controw-id{font-size:12.5px;font-weight:600;flex:0 0 70px}
.controw-frames{display:flex;align-items:center;gap:12px;flex:1 1 auto}
.controw-frames img{width:120px;height:68px;object-fit:cover;border-radius:8px;background:#000}
.controw-arrow{color:var(--hint)}
.noimg{width:120px;height:68px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:10px;text-align:center;padding:4px}

.disc-rows{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.disc-row{display:flex;justify-content:space-between;gap:16px;font-size:13.5px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.disc-row:last-child{border-bottom:none;padding-bottom:0}
.disc-k{color:var(--muted)}
.disc-v{color:var(--ink);font-weight:600;text-align:right}

@media (max-width:920px){
  .workspace{grid-template-columns:1fr}
  .wcol-contents{position:static;max-height:none;order:3}
  .wcol-artefact{order:1}
  .wcol-decision{position:static;order:2}
}
.pmedia{width:100%;max-height:520px;border-radius:12px;background:#000;display:block;margin:0 auto}
.pmedia.img{object-fit:contain}
/* ══ THE SHOT RUNNER (2026-07-23, Julian: "a hybrid of the old pipeline as they was easier
   to work with" + "the UX UI to be premium") — one vertical production board per shot.
   Extends the existing dark-neutral token system: layered surface tones + hairline borders
   for depth (no heavy shadows), a real type scale (Display Slab for the shot ID, uppercase
   letter-spaced micro-labels, tabular figures for every cost/duration), a subway-map
   status spine down the left edge, restrained 150-200ms motion behind a reduced-motion
   guard. */
.runner{max-width:980px}
.runhead{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 82%,transparent);padding:6px 2px 14px;margin-bottom:6px}
.runhead-row{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.runhead-id{font-family:'Display Slab',Georgia,serif;font-size:38px;line-height:1;letter-spacing:-.5px;color:var(--ink)}
.runhead-purpose{flex:1;min-width:200px;font-size:12.5px;color:var(--muted);padding-bottom:4px;max-width:460px}
.runhead-nav{display:flex;gap:8px;align-items:center;padding-bottom:2px}
.runhead-nav .btn,.runhead-nav .btn.ghost{margin:0;padding:6px 13px;font-size:12px}
/* THE STATUS SPINE (2026-07-26) — the same component, in better clothes. Built by mapping
   the rows through panelSection(), so the numbers and names are always the engine's own. */
.runmeter{display:flex;gap:var(--s1);margin-top:var(--s3);align-items:stretch}
.runmeter button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:transparent;border:none;border-bottom:3px solid var(--line);border-radius:6px 6px 0 0;
  padding:5px 2px 5px;font:inherit;color:var(--hint);cursor:pointer;
  transition:border-color .2s ease,color .2s ease,background .2s ease}
.runmeter button:hover{background:var(--surface2);color:var(--muted)}
.runmeter .msnum{font-size:10.5px;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums;line-height:1}
.runmeter .msglyph{font-size:10px;line-height:1}
.runmeter .msname{display:none;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  line-height:1.2;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.runmeter button.cur .msname{display:block}
@media (min-width:1100px){.runmeter .msname{display:block}}
.runmeter button.done{border-bottom-color:var(--ok);color:var(--ok)}
.runmeter button.ready{border-bottom-color:var(--honey);color:var(--honey)}
.runmeter button.blocked{border-bottom-color:var(--deep);color:var(--deep)}
.runmeter button.generating{border-bottom-color:var(--info);color:var(--info);animation:runpulse 1.4s ease-in-out infinite}
.runmeter button.cur{background:var(--surface2)}
.rendercard{margin-top:12px;border:1px solid var(--info);border-radius:12px;background:var(--infobg);padding:14px 16px}
.rendercard-top{display:flex;align-items:center;gap:10px}
.rendercard-title{font-size:13.5px;font-weight:700;color:var(--info)}
.rendercard-timer{margin-left:auto;font-family:'Display Slab',Georgia,serif;font-size:24px;color:var(--info)}
.fcard-rendering{display:inline-flex;align-items:center;gap:6px;justify-content:center;width:100%;color:var(--info);background:var(--infobg);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700}
.fcard-dots i.rendering{background:var(--info);border-color:var(--info);animation:runpulse 1.4s ease-in-out infinite}
.runrow.arrived{animation:arrive 1.8s ease}
@keyframes arrive{0%{border-color:var(--ok);box-shadow:0 0 0 6px var(--okbg)}100%{border-color:var(--line);box-shadow:none}}
.runnow{margin-top:9px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runnow span{font-weight:800;font-size:10.5px;letter-spacing:.12em}
.runspend{margin-top:7px;font-size:11px;color:var(--hint);display:flex;gap:16px;flex-wrap:wrap}
.runspend b{color:var(--muted);font-weight:600}
/* SPENT is a fact, not a warning (2026-07-26). Julian's own ruling stands — "if I press
   render it renders" — so this is never coloured like an alarm and never gates anything.
   It reads at the same weight as the forward estimate beside it. */
.runspend .spent b{color:var(--ink)}
.runspend .spent-sub{color:var(--hint)}
/* ══ THE PACKAGE'S OWN QC FINDINGS (2026-07-26) ═════════════════════════════════════════
   cb_engine writes `validation.issues` into every production package — severity, code,
   message and the exact field path. They had never been rendered. Shown where they are
   actionable: on the shot the path names, and on the scene band for the rest. */
.qcband{margin-top:var(--s3);border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.qcband>summary{cursor:pointer;list-style:none;padding:9px 13px;font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px}
.qcband>summary::-webkit-details-marker{display:none}
.qcband>summary::before{content:"▸";color:var(--hint);font-size:10px}
.qcband[open]>summary::before{content:"▾"}
.qcband.has-block{border-color:var(--danger)}
.qcband-n{font-weight:800;font-variant-numeric:tabular-nums}
.qcrows{padding:0 13px 11px}
.qcrow{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.qcfield{font-size:10.5px;color:var(--hint);font-family:var(--mono);white-space:nowrap}
.qcmsg{font-size:12px;line-height:1.5;color:var(--ink);min-width:0;overflow-wrap:anywhere}
.qccode{display:inline-block;margin-left:7px;font-size:9.5px;letter-spacing:.06em;color:var(--hint);font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
.runrail{position:relative;padding-left:34px}
.runrail::before{content:"";position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:var(--line);border-radius:1px}
.runrow{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}
/* ── THE FIVE STATE FORMS (2026-07-26) ─────────────────────────────────────────────────
   Status by colour alone is status you cannot point at on a printout. Each state gets its
   own SHAPE as well as its own token: settled = filled disc, your move = ring, rendering =
   filled + pulse, held = a flat-lined bar, waiting = hollow ring.
   `.runrow.ready .runrow-dot` is deliberately gone: it painted honey on every ready row, so
   three or four glowed at once and the cursor ring stopped meaning anything. There is now
   exactly ONE honey element on screen — the current row, its dot, and the NOW line. */
.runrow-dot{position:absolute;left:-27px;top:16px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--bg);z-index:1;opacity:.6;transition:border-color .2s ease,background .2s ease}
.runrow.done .runrow-dot{border-color:var(--ok);background:var(--ok);opacity:1}
.runrow.blocked .runrow-dot{border-radius:2px;height:5px;top:21px;border:none;background:var(--deep);opacity:1}
.runrow.current{background:var(--surface2);border-color:var(--honey);box-shadow:0 0 0 3px var(--honeybg)}
.runrow.current .runrow-dot{border-color:var(--honey);background:var(--bg);opacity:1;box-shadow:0 0 0 3px var(--honeybg)}
.runrow.generating .runrow-dot{border-radius:50%;height:16px;top:16px;border:2px solid var(--info);background:var(--info);opacity:1;animation:runpulse 1.4s ease-in-out infinite}
.runrow.tier-later{opacity:.62}
.runrow.tier-later:hover,.runrow.tier-later:focus-within{opacity:1}
@keyframes runpulse{0%,100%{box-shadow:0 0 0 0 var(--infobg)}50%{box-shadow:0 0 0 6px var(--infobg)}}
/* THE HEAD IS A GRID, so the columns stop jittering row to row. num | title | summary |
   state | caret. The dot is NOT in here — it is absolutely positioned on .runrow, in the
   34px gutter .runrail reserves. */
.runrow-head{display:grid;grid-template-columns:26px var(--rowtitle-w) minmax(0,1fr) auto 14px;
  align-items:center;gap:var(--s3);min-height:44px;padding:0 var(--s4);cursor:pointer;user-select:none}
.runrow-num{font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.runrow-title{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runrow.done .runrow-title{color:var(--muted)}
.runrow-sum{min-width:0;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runrow-state{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.runrow-caret{color:var(--hint);font-size:12px;transition:transform .18s ease;justify-self:end}
.runrow.open .runrow-caret{transform:rotate(90deg)}
.runrow-body{padding:2px var(--s4) var(--s4);border-top:1px solid var(--line);min-width:0;animation:runreveal .18s ease}
@keyframes runreveal{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
/* THE DECISION zone. Exactly one primary per row; everything else is quiet. A row that is
   not the cursor renders its controls quiet AND closed — a ghost button on a row you are
   not working on is still a decision the eye has to make. */
.runrow-actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line)}
.runrow-actions .btn,.runrow-actions .btn.ghost{margin:0;padding:8px 15px;font-size:12.5px}
.runrow-actions.quiet .btn:not([disabled]){background:transparent;color:var(--muted);border:1px solid var(--line);box-shadow:none;font-weight:600}
.runrow-actions.quiet .btn:not([disabled]):hover{border-color:var(--brand);color:var(--ink)}
.runmedia{margin-top:12px;max-width:520px}
.runmedia img,.runmedia video{width:100%;border-radius:10px;display:block;background:#000;border:1px solid var(--line)}
.runrefs{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.runref{width:170px}
.runref img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000;display:block}
.runref .rl{font-size:10.5px;color:var(--hint);margin-top:4px;line-height:1.35}
.runempty{padding:14px;border:1px dashed var(--line);border-radius:10px;color:var(--hint);font-size:12px;margin-top:12px}
/* THE BOX SAYS IT IS WORKING (2026-07-27). Replaces the "not made yet" empty box for as long
   as a real job for THIS artifact on THIS shot is running — because during that window the
   empty box was stating something false. */
.runworking{padding:14px;border:1px solid var(--honey,#E8A33D);border-radius:10px;margin-top:12px;
  background:color-mix(in srgb,var(--honey,#E8A33D) 8%,transparent)}
.runworking-bar{height:3px;border-radius:2px;background:color-mix(in srgb,var(--honey,#E8A33D) 22%,transparent);
  overflow:hidden}
.runworking-bar i{display:block;height:100%;width:34%;border-radius:2px;background:var(--honey,#E8A33D);
  animation:runslide 1.5s ease-in-out infinite}
@keyframes runslide{0%{transform:translateX(-100%)}100%{transform:translateX(330%)}}
.runworking-txt{margin-top:10px;font-size:13px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.runworking-el{margin-left:auto;font-weight:500;opacity:.75}
.runworking-sub{margin-top:3px;font-size:11.5px;color:var(--hint)}
@media (prefers-reduced-motion:reduce){.runworking-bar i{animation:none;width:100%;opacity:.5}}
.runseg{display:flex;gap:10px;margin-top:12px}
.runseg-card{flex:1;max-width:220px;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;cursor:pointer;background:var(--surface);transition:border-color .18s ease,background .18s ease,transform .15s ease}
.runseg-card:hover{transform:translateY(-1px)}
.runseg-card.active{border-color:var(--brand);background:var(--brandbg)}
.runseg-tier{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.runseg-card.active .runseg-tier{color:var(--brandink)}
.runseg-cost{font-family:'Display Slab',Georgia,serif;font-size:21px;margin-top:3px;font-variant-numeric:tabular-nums}
.runseg-note{font-size:10.5px;color:var(--hint);margin-top:2px}
.runfirebtn{font-size:14.5px !important;padding:13px 26px !important;letter-spacing:.03em;box-shadow:0 0 0 3px var(--brandbg)}
.rundisc{margin-top:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.rundisc-head{padding:9px 14px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface2)}
.rundisc-kv{display:flex;gap:18px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--muted)}
.rundisc-kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.rundisc-chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.rundisc-chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.rundisc-chip img{width:30px;height:18px;object-fit:cover;border-radius:3px}
/* This is directorial PROSE, not code — it only ever inherited monospace from the <pre>
   that was chosen to preserve paragraph breaks. (2026-07-26) */
.rundisc pre{margin:0;padding:var(--s3) 14px;font-size:12.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;border-top:1px solid var(--line);max-height:300px;overflow:auto;font-family:inherit;max-width:62ch}
.runmsg{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:12.5px;border:1px solid var(--line)}
.runmsg.err{border-color:var(--danger);background:var(--dangerbg);color:var(--danger)}
.runmsg.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
/* THE SCENE PIPELINE — one horizontal pipe + the shot filmstrip (2026-07-23) */
.ppipe{display:flex;align-items:center;gap:0;margin:4px 0 16px;overflow-x:auto;padding:2px}
.ppnode{display:flex;flex-direction:column;gap:2px;min-width:150px;flex:1;text-align:center;padding:12px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease}
.ppnode:hover{border-color:var(--honey)}
.ppnode.active{border-color:var(--honey);box-shadow:0 0 0 3px var(--honeybg);background:var(--surface2)}
.ppnode.approved{border-color:var(--ok)}
.ppnode.locked{opacity:.5}
.ppglyph{font-size:15px;font-weight:800}
.pplabel{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.ppstate{font-size:10.5px;font-weight:600;letter-spacing:.05em}
.ppconn{flex:0 0 26px;height:2px;background:var(--line)}
.ppconn.fill{background:var(--ok)}
.fstrip{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:16px;border-bottom:1px solid var(--line)}
/* BEAT GROUPING IN THE STRIP (2026-07-26). Each beat is one column of the same horizontal
   strip: its header above, its own shots' cards below. No new layout system and no new
   dependency — the strip stays the same flex row it always was, so horizontal scrolling,
   card sizing and the selected-card ring are all untouched. */
.fstrip-beats{gap:0;align-items:stretch}
.fbeat{flex:0 0 auto;display:flex;flex-direction:column;gap:9px;padding:2px 16px 0 0;margin-right:16px;border-right:1px dashed var(--line)}
.fbeat:last-child{border-right:none;margin-right:0;padding-right:2px}
/* width:0 + min-width:100% — the header contributes NOTHING to the column's intrinsic width,
   so the beat's own cards decide how wide the column is and the header then fills it. Without
   this a long whatChanges line would stretch a one-shot beat's column to twice its cards. */
.fbeat-head{width:0;min-width:100%;overflow:hidden}
.fbeat-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.fbeat-id{font-family:'Display Slab',Georgia,serif;font-size:15px;letter-spacing:-.2px;color:var(--ink)}
.fbeat-pos{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--hint)}
.fbeat-what{font-size:11.5px;line-height:1.45;color:var(--muted);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fbeat-cards{display:flex;gap:12px;align-items:flex-start}
.fbeat-slot{display:flex;flex-direction:column}
.fbeat-also{font-size:10px;color:var(--hint);margin-top:4px;text-align:center}
.fbeat-empty{flex:0 0 200px;display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:120px;border:1px dashed var(--line);border-radius:12px;color:var(--hint);font-size:11.5px;padding:10px}
.fbeat.cur .fbeat-id{color:var(--honey)}
.fbeat.cur .fbeat-pos{color:var(--honey)}
.fcard{flex:0 0 200px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:border-color .18s ease,box-shadow .18s ease,transform .15s ease}
.fcard:hover{transform:translateY(-1px);border-color:var(--honey)}
.fcard.sel{border-color:var(--honey);box-shadow:0 0 0 3px var(--honeybg);background:var(--surface2)}
.fcard.draft{border-style:dashed;opacity:.9}
/* A CARD IS A CARD, NOT A BILLBOARD (2026-07-27, Julian: "now its gone mental and big").
   The 16/9 ratio alone lets a thumb grow to whatever width its container happens to give it —
   on a single-card strip that is the full page, and a ~700px-tall "thumbnail" pushes the shot
   panel and every one of its decisions below the fold. The cap is on HEIGHT so the ratio and
   the crop are untouched; nothing about how the image is composed changes, only how much of
   the screen it is allowed to take. */
.fcard-thumb{aspect-ratio:16/9;max-height:min(42vh,340px);border-radius:8px;overflow:hidden;background:#000;border:1px solid var(--line);margin-inline:auto}
.fcard-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.fcard-slate{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;background:var(--surface2)}
.fcard-id{font-family:'Display Slab',Georgia,serif;font-size:16px;margin-top:7px;letter-spacing:-.2px}
.fcard-dots{display:flex;gap:4px;margin-top:5px}
.fcard-dots i{width:7px;height:7px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.fcard-dots i.done{background:var(--ok);border-color:var(--ok)}
.fcard-dots i.ready{background:var(--honey);border-color:var(--honey)}
.fcard-status{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard-ctarow{margin-top:8px;min-height:30px}
.fcard-cta{margin:0 !important;padding:6px 10px !important;font-size:11.5px !important;width:100%}
.fcard-done{display:inline-flex;align-items:center;gap:5px;color:var(--ok);background:var(--okbg);border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700;width:100%;justify-content:center}
.rundecide{margin-top:12px;border:1px solid var(--honey);border-radius:10px;background:var(--surface);overflow:hidden}
.rundecide-head{padding:8px 13px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--honey);background:var(--honeybg)}
/* NO SCROLL BOX (2026-07-26). A scrollbar inside a scrolling page, holding the exact text
   you are being asked to approve, hides content, breaks find-in-page, and makes the document
   feel like an attachment rather than the thing you are here to judge. The document sets its
   own length; the page scrolls. */
.rundecide-text{padding:11px 14px;font-size:12.5px;line-height:1.6;color:var(--ink);min-width:0}
.rundecide-text pre{margin:0;white-space:pre-wrap;font:inherit;overflow-wrap:anywhere}
.refstrip-head{margin-top:12px;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.refstrip{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.refcard{width:152px}
.refcard img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000;display:block}
.refcard-miss{width:100%;aspect-ratio:16/9;border:1.5px dashed var(--danger);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--danger);font-size:9.5px;font-weight:800;letter-spacing:.08em;gap:3px;text-align:center;padding:4px;background:var(--dangerbg)}
.refcard-miss span{font-weight:400;color:var(--hint);letter-spacing:0;line-height:1.3}
.refcard-slot{font-size:11px;font-weight:700;margin-top:5px}
.refcard-role{font-size:10px;color:var(--hint);line-height:1.35}
.refaudio{margin-top:10px;max-width:430px}
.fcard-thumb{position:relative}
.fcard-inh{position:absolute;top:5px;left:5px;background:var(--surface2);color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:2px 6px;border:1px solid var(--line)}
/* ══ THE DIRECTION DOCUMENT (2026-07-26) ════════════════════════════════════════════════
   THE VISIBLE CRIME, and where it came from. `asText` returned `<pre>${prompt}</pre>`. The
   PENDING path wrapped it in .rundecide-text, which carries `pre{white-space:pre-wrap;
   font:inherit}` — legible. The APPROVED path wrapped it in .rowmore, which has no `pre`
   rule at all — so it inherited the UA's monospace + `white-space:pre` inside .runrow-body,
   which had no min-width:0, no max-width and no overflow. That is the exact horizontal
   overflow off the right edge of Julian's screenshot. The fix is not to patch the losing
   branch: it is to delete the split. Both states now render the SAME component.

   Containment is structural, in three layers, with no `overflow` declaration anywhere:
     .dirdoc      max-width:62ch  — 62ch at 15px ≈ 500px inside 914px of usable body width
     .dirdoc-p    overflow-wrap:anywhere — belt-and-braces for a pathological long token
     .runrow-body min-width:0     — so the grid/flex parent can actually shrink
   Horizontal overflow becomes impossible rather than merely unlikely. */
/* THE MEASURE BELONGS TO THE PROSE, NOT TO PROSE PLUS FURNITURE (2026-07-27, Julian:
   "we have another paging issue"). max-width:62ch was set as a reading measure — but the
   132px label rail and its 20px gap live INSIDE that cap, so the actual text column was
   ~36ch, far under the 45-75ch a person reads comfortably, and it squeezed further on any
   narrow container. The cap now adds the rail's own width back, so 62ch is what the prose
   actually gets. Nothing else about the layout changes. */
/* THE READING (2026-07-27) — the plain-English version of the brief, sitting ABOVE it.
   Deliberately typeset as prose to be READ, not as a warning to be dismissed: the neutral
   state carries no colour at all, and even the clash state uses the warn hue only on its
   own count line, never as a filled panel. A director who is told "this blocks nothing"
   must not be looking at something that reads like a blocker. */
.readback{margin-top:var(--s3);border:1px solid var(--line);border-radius:12px;
  padding:16px 18px;background:var(--surface2);max-width:62ch}
.readback.has-clash{border-color:var(--danger)}
.readback.has-part{border-color:var(--warn)}
/* The verdict is the one thing on this card he is meant to act on, so it is the one thing
   that carries weight. The glyph does the work colour alone cannot. */
.rb-verdict{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.rb-verdict p{margin:4px 0 0;font-size:14.5px;line-height:1.55;color:var(--text)}
.rb-vlabel{font-size:16px;font-weight:700;letter-spacing:-.01em}
.rb-glyph{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;font-weight:700;color:#fff}
.rb-verdict.is-go   .rb-glyph{background:var(--ok)}
.rb-verdict.is-go   .rb-vlabel{color:var(--ok)}
.rb-verdict.is-part .rb-glyph{background:var(--warn)}
.rb-verdict.is-part .rb-vlabel{color:var(--warn)}
.rb-verdict.is-stop .rb-glyph{background:var(--danger)}
.rb-verdict.is-stop .rb-vlabel{color:var(--danger)}
.rb-notes{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.rb-head{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--hint);
  font-weight:700;margin-bottom:6px}
.rb-says{font-size:15.5px;line-height:1.55;color:var(--text)}
.rb-clear{margin-top:10px;font-size:13px;color:var(--ok)}
.rb-count{margin-top:12px;font-size:12.5px;font-weight:600;color:var(--warn)}
.rb-clash{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rb-pair{font-size:13.5px;line-height:1.5;color:var(--text)}
.rb-pair em{display:block;font-style:normal;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--hint);margin:2px 0}
.rb-why{margin-top:6px;font-size:13.5px;line-height:1.55;color:var(--muted)}
.rb-line{margin-top:4px;font-size:13px;line-height:1.5;color:var(--muted)}
.rb-line b{color:var(--text);font-weight:600}
.dirdoc{margin-top:var(--s3);background:var(--surface2);border:1px solid var(--line);
  border-radius:12px;padding:20px 22px;min-width:0;max-width:calc(62ch + 196px);
  container-type:inline-size;
  /* THE DOCUMENT STAYS INSIDE ITS OWN BOX (2026-07-27, Julian: "keep it inside its container
     and i can scroll within"). A 642-word direction pushed every control below the fold and
     made the row unreadable at a glance.

     This deliberately restores a scroll box that was DELETED earlier tonight, and the reason
     it was deleted no longer holds. It went on the principle "you sign at the end of what you
     read" — correct at the time, because Approve lived ONLY at the document's foot, so
     clipping the document hid the one control that mattered. Approve and Reject now sit in
     the row's own button strip, so the document can be a document: read as much as you want,
     sign from where you are standing. The signature at the foot stays too — both sign the
     same one decision. */
  max-height:min(58vh,620px); overflow-y:auto; overscroll-behavior:contain}
/* NO FADE MASK HERE, DELIBERATELY. A bottom gradient reads as "more below" — but the
   signature line lives at the foot of this document, and a faded Approve button reads as a
   DISABLED Approve button. Scroll position is the honest signal; a legible control beats a
   decorative edge. */
/* When the container genuinely cannot hold a rail AND a readable column, the rail stops
   being a column and becomes a heading. Stacking beats squeezing — a 150px-wide paragraph
   is not a document, it is a stack of syllables. */
@container (max-width: 520px){
  .dirdoc-block{grid-template-columns:minmax(0,1fr);gap:var(--s2)}
  .dirdoc-label{margin-top:0}
}
.dirdoc *{min-width:0}
.dirdoc.is-pending{border-color:var(--honey)}
.dirdoc.is-stale{opacity:.55}
.dirdoc-deck{border-left:2px solid var(--brand);padding-left:14px;margin-bottom:var(--s5)}
.dirdoc-deck p{font-size:16px;line-height:1.55;font-weight:500;color:var(--ink);max-width:58ch;margin:0;overflow-wrap:anywhere}
.dirdoc-micro{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
/* Repeated standing boilerplate becomes a masthead. DEMOTED — never hidden behind a click;
   hidden approved content is the bug this whole pass exists to fix. */
.dirdoc-terms{font-size:12.5px;line-height:1.6;color:var(--hint);border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:var(--s5)}
.dirdoc-terms p{margin:0;overflow-wrap:anywhere}
.dirdoc-terms p+p{margin-top:var(--s2)}
.dirdoc-block{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px;padding:var(--s4) 0;border-top:1px solid var(--line)}
.dirdoc-block:first-of-type{border-top:none}
.dirdoc-block.is-cont{display:block;border-top:none;padding:0 0 var(--s4)}
.dirdoc-label{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.3em}
.dirdoc-num{font-variant-numeric:tabular-nums;color:var(--hint)}
.dirdoc-qual{display:block;margin-top:5px;font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--hint);line-height:1.4}
.dirdoc-p{font-size:15px;line-height:1.62;color:var(--ink);margin:0;overflow-wrap:anywhere;word-break:normal;text-wrap:pretty}
.dirdoc-p+.dirdoc-p{margin-top:var(--s3)}
.dirdoc-read{border-top:1px solid var(--line);padding-top:18px;margin-top:var(--s2)}
.dirdoc-read .dirdoc-label{color:var(--brandink)}
.dirdoc-read .dirdoc-p{font-size:16px;line-height:1.55}
.dirdoc-colophon{margin-top:var(--s5);padding-top:14px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums}
.dirdoc-sign{margin-left:auto;display:flex;gap:var(--s2);flex-wrap:wrap}
.dirdoc-sign .btn{margin:0;padding:8px 15px;font-size:12.5px}
/* THE EVIDENCE LINE. worker · model · prepared · reviewed by · signature — all real, all
   invisible until now. The five department_readiness flags are five 6px dots; all five true
   collapse to one ✓ current chip, any false expands into the ENGINE'S OWN named reason,
   inline. Never a tooltip, and readyForDisclosure is never re-derived here. */
.dirmeta{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:11px;line-height:1.45;
  font-weight:600;color:var(--hint);font-variant-numeric:tabular-nums;margin-top:var(--s3)}
.dirmeta .sep{opacity:.5}
.dirmeta code{font-family:var(--mono);font-size:10.5px}
.dirmeta-flags{display:inline-flex;align-items:center;gap:4px;margin-left:auto}
.dirmeta-flags i{width:6px;height:6px;border-radius:50%;display:inline-block;background:var(--ok)}
.dirmeta-flags i.off{background:transparent;border:1px solid var(--deep)}
.dirmeta-cur{color:var(--ok);background:var(--okbg);border-radius:6px;padding:2px 7px;font-size:10.5px;font-weight:700;letter-spacing:.06em}
.dirmeta-why{color:var(--deep);font-weight:600}
/* 04 · VOICE — A DIFF, NOT A READ. Today only performedText renders, so the reviewer
   literally cannot see what changed. Locked left in --muted, performed right in --ink. */
.vodiff{display:grid;grid-template-columns:88px minmax(0,1fr) minmax(0,1fr);gap:var(--s3) 20px;align-items:start}
.vodiff-spk{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:.25em}
.vodiff-locked{font-size:13px;line-height:1.55;color:var(--muted);overflow-wrap:anywhere}
.vodiff-perf{font-size:15px;line-height:1.55;color:var(--ink);overflow-wrap:anywhere}
.vodiff-tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11.5px;color:var(--brandink);background:var(--brandbg)}
.vodiff-h{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hint)}
@media (max-width:720px){
  .dirdoc{padding:16px}
  .dirdoc-block{grid-template-columns:1fr;gap:var(--s2)}
  .dirdoc-label{margin-top:0}
  .vodiff{grid-template-columns:1fr}
  .runrow-head{grid-template-columns:26px minmax(0,1fr) auto;gap:var(--s2)}
  .runrow-sum{display:none}
  .runrow-caret{display:none}
}
/* ══ STATE AS FORM, AND THE REFUSAL AS INTERFACE ═══════════════════════════════════════ */
.st-chip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:2.5px 8px;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.st-chip[data-st="approved"]  {color:var(--ok);      background:var(--okbg)}
.st-chip[data-st="awaiting"]  {color:var(--honey);   background:var(--honeybg)}
.st-chip[data-st="ready"]     {color:var(--brandink);background:var(--brandbg)}
.st-chip[data-st="generating"]{color:var(--info);    background:var(--infobg)}
.st-chip[data-st="blocked"]   {color:var(--deep);    background:var(--deepbg)}
.st-chip[data-st="rejected"]  {color:var(--danger);  background:var(--dangerbg)}
.st-chip[data-st="stale"]     {color:var(--warn);    background:var(--warnbg)}
.st-chip[data-st="locked"],
.st-chip[data-st="pending"]   {color:var(--hint);    background:transparent}
/* Eight filled chips are eight competing chips: a settled or a not-yet row states its word
   with no fill at all. */
.runrow.tier-done .st-chip,.runrow.tier-later .st-chip{background:transparent}
/* THE DISABLED BUTTON LOOKS DISABLED. This one rule also fixes the Story-Intake button that
   renders fully enabled-looking while disabled, for free. NOTHING HERE WEAKENS A GATE — the
   button stays disabled, the backend refusal stays the protection. */
.btn[disabled]{background:var(--surface2);color:var(--hint);border:1px solid var(--line);
  cursor:not-allowed;box-shadow:none;opacity:1}
/* A tooltip is not an explanation: invisible on touch, invisible to the keyboard, invisible
   to anyone who does not hover. The engine's own reason renders on the page. */
.gatewrap{display:flex;flex-direction:column;gap:var(--s2);flex-basis:100%;min-width:0}
.gatewhy{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;font-size:11.5px;font-weight:600;
  color:var(--deep);background:var(--deepbg);border-radius:8px;padding:var(--s2) var(--s3);max-width:62ch}
.gatewhy .bar{flex:none;width:10px;height:3px;border-radius:2px;background:var(--deep)}
.gatewhy .jump{color:var(--brandink);text-decoration:underline;cursor:pointer;background:none;border:none;font:inherit;font-weight:700;padding:0;margin-left:auto;white-space:nowrap}
/* COST MUST BE LEGIBLE. Prepare is free; fire spends — and both rendered as identical teal
   buttons. Exactly one primary per row, ever; everything else ghost. */
.btn.spend{background:transparent;border:1px solid var(--honey);color:var(--honey)}
.btn.spend:hover:not([disabled]){background:var(--honeybg)}
/* FOCUS, WHICH DID NOT EXIST: zero :focus/:focus-visible/outline rules across 5,722 lines.
   This is the house 0 0 0 3px <tint> ring idiom, already used eight times. */
:where(.btn,.rowmore>summary,.runmore>summary,.techdetails>summary,.runrow-head,.runmeter button,.gatewhy .jump,input,textarea,select,.filterchip):focus-visible{
  outline:none;box-shadow:0 0 0 3px var(--brandbg),0 0 0 1px var(--brand);border-radius:8px}
.rowmore{margin-top:var(--s3)}
.rowmore>summary{cursor:pointer;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);list-style:none;padding:9px 8px;margin:0 -8px;border-radius:8px;display:block}
.rowmore>summary:hover{background:var(--surface2);color:var(--muted)}
.rowmore>summary::-webkit-details-marker{display:none}
.rowmore>summary::before{content:"▸ "}
.rowmore[open]>summary::before{content:"▾ "}
.runmore{margin-top:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px 14px}
.runmore>summary{cursor:pointer;padding:12px 0;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);list-style:none}
.runmore>summary::-webkit-details-marker{display:none}
.runmore>summary::before{content:"▸ ";color:var(--hint)}
.runmore[open]>summary::before{content:"▾ "}
.scenecard-dots{display:flex;gap:4px;margin:7px 0 2px}
.scenecard-dots i{width:7px;height:7px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.scenecard-tick{position:absolute;top:8px;left:8px;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px}

  .runrow-body{animation:none}

  .runseg-card:hover{transform:none}
}
.pqueue{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;margin-top:16px}
.pqitem{flex:0 0 auto;width:52px;height:38px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--hint);background:var(--surface2);overflow:hidden;position:relative}
.pqitem img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:.6}
.pqitem span{position:relative;z-index:1;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:4px}
.pqitem.cur{border-color:var(--honey);box-shadow:0 0 0 2px var(--honeybg)}
.pqitem.ok{border-color:var(--ok)}
.pdecision{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pfeedback{width:100%;min-height:54px;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;resize:vertical}

.pscard{background:var(--surface2);border-radius:10px;padding:11px 13px}
.pscard .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint)}
.pscard .v{font-size:14px;font-weight:600;margin-top:3px}

<body>
<div class="top">

  <div class="toplinks" id="toplinks"></div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--hint)">

<script>
// FOLLOW THE PAGE'S OWN ORIGIN (2026-07-25). This was hardcoded to localhost while the
// studio was being browsed at 127.0.0.1 — same server, different origin, so every
// fetch tripped CORS and the UI reported "Can't reach the studio server" over a page
// whose data had loaded perfectly. Same-origin by construction now.
const BASE=(location.protocol==="http:"||location.protocol==="https:")?location.origin
                                                                       :"http://localhost:8765";
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const v=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
let EPISODES=[],MEDIA=[],CUR=null,SHOTS=[],PREFIX="",page="episodes",MEDIA_V=0,CHARCFG={},SCENELIB=null,RETAKES_DRAFT=[],RT_SN=null;

// ── ONE PIPE (scene-spine). Script in → the Pipeline runs each scene Storyboard→Keyframes→Animation→Post, locked
//    until the prior stage is signed, scenes unlocking in order. Cascade + the standalone boards are gone (one door per action).
const NAV=[["sceneboard","Production","◈"]];

var CURRENT_PROJECT=null, PROJECTS=[], WIZ=null;

// ── NAVIGATION CONTEXT, IN THE URL/HASH — NEVER A SECOND PRODUCTION-STATE STORE (2026-07-17
// state-integrity checkpoint): the hash records WHERE the user is (project/episode/scene/
// stage) so a literal refresh returns them to the same place — it never carries any
// production DATA (approval, lineage, ledger fields), which is always re-fetched fresh from
// the server on every render, exactly as before this was added. This is the ONLY place the
// hash is read or written; everything else keeps working from the same live globals it
// always has (CURRENT_PROJECT/page/SH_EP/SH_SC/PSTAGE) — the hash just mirrors them.
function _navHash(){
  const p=new URLSearchParams();
  if(CURRENT_PROJECT) p.set('p',CURRENT_PROJECT.id);
  if(page) p.set('pg',page);
  if((page=="sceneboard"||page=="pipeline")&&SH_EP) p.set('ep',SH_EP.replace(/^Ep/,''));
  if(page=="pipeline"){
    if(SH_SC) p.set('sc',SH_SC);
    if(PSTAGE) p.set('st',PSTAGE);
    // 2026-07-19 addition: WHICH SHOT within the scene — by shotId, never the raw array
    // index, so a beat/shot added or removed before the next visit can't silently point
    // "your place" at the wrong shot. Falls back cleanly (index clamped to 0) if the
    // remembered shotId no longer exists.
    const shots=(SH_PKG&&SH_PKG.shots)||[];
    if(shots[PSHOT_I]) p.set('shot',shots[PSHOT_I].shotId);
    // THE PIPE NODE (2026-07-26, with the history below): PPIPE is what the scene screen is
    // actually showing — storyboard / scenelook / shots / assembly. It was the one piece of
    // in-scene position the hash never carried, so clicking along the pipe changed the screen
    // and left the URL identical: nothing to refresh back to, and — once Back works — nothing
    // for Back to return to. PSTAGE alone can't stand in for it: pFocusPipe sets PPIPE without
    // touching PSTAGE, and PIPE_OF_STAGE is many-to-one.
    if(PPIPE) p.set('pipe',PPIPE);
  }
  return p.toString();
}
// ── REAL HISTORY (2026-07-26, Julian: "I CAN'T GO BACK") ────────────────────────────────
// Measured before this change: pushState × 0, popstate × 0, replaceState × 1. Every screen in
// the Studio replaced the same single history entry, so the browser Back button, Cmd-[ and the
// trackpad back-swipe all did the only thing left to them — LEAVE the Studio entirely. The
// context was already in the URL and already restorable (_restoreFromHash has existed since
// 2026-07-17); nothing was pushing it, so the restorer had nothing to be asked to restore.
// Now: one history entry per navigation that genuinely CHANGES where you are, and a popstate
// handler that walks it back through the same restorer a refresh already uses. Still navigation
// context only — never production data, which is re-fetched fresh on every render.
let _NAV_HASH_LAST=(location.hash||"").replace(/^#/,"");
let _NAV_RESTORING=false;    // set while _restoreFromHash rebuilds — its own renders must not push
let _NAV_SEQ=0;              // guards against interleaved restores from rapid Back presses
function _syncHash(){
  try{
    const h=_navHash();
    const url=h?('#'+h):(location.pathname+location.search);
    // PUSH only for a REAL move. A re-render at the same place (a poll tick, a lazy department
    // record landing, a job-status refresh) must never grow the history — otherwise Back stops
    // meaning "the previous screen" and starts meaning "one of the last forty repaints".
    if(h!==_NAV_HASH_LAST && !_NAV_RESTORING) history.pushState({navHash:h},'',url);
    else history.replaceState({navHash:h},'',url);
    _NAV_HASH_LAST=h;
    // "REMEMBER YOUR PLACE" (2026-07-19, Julian's directive): the hash alone only survives
    // a same-tab refresh — closing the tab, restarting the browser, or opening the bare
    // URL/a bookmark loses it, dropping back to Projects every time. Mirroring it into
    // localStorage means the LAST place synced is recoverable even with no hash in the URL
    // at all. Same "navigation context only, never production data" boundary as the hash
    // itself — this is just where you were, always re-fetched fresh from the server.
    localStorage.setItem("cb_last_place",h);
  }catch(e){}
}
// _restoreFromHash(raw) — restores from an explicit hash string when given (the localStorage
// fallback below and the popstate handler both pass their value here), else from the real
// location.hash.
async function _restoreFromHash(raw){
  if(raw==null) raw=(location.hash||"").replace(/^#/,"");
  if(!raw) return false;
  const params=new URLSearchParams(raw);
  const pid=params.get('p');
  if(!pid) return false;
  const mySeq=++_NAV_SEQ;
  _NAV_RESTORING=true;
  try{
    try{PROJECTS=(((await fetch(BASE+"/api/projects",{cache:"no-store"}).then(r=>r.json()))||{}).projects)||[];}catch(e){PROJECTS=[];}
    if(mySeq!==_NAV_SEQ) return true;      // a later Back press has taken over
    const proj=PROJECTS.find(x=>x.id===pid);
    if(!proj) return false;
    CURRENT_PROJECT=proj; CUR=null; SHOTS=[]; page="episodes";
    await boot();
    const pg=params.get('pg')||'episodes', epNum=params.get('ep');
    if(pg=='episodes'||!epNum) return true;   // boot() already rendered + synced the hash
    if(mySeq!==_NAV_SEQ) return true;
    await openEpisode(epNum);
    const scId=params.get('sc');
    if(pg=='sceneboard'||!scId) return true;
    if(mySeq!==_NAV_SEQ) return true;
    openScene(scId);
    await pLoadAll();
    if(mySeq!==_NAV_SEQ) return true;
    const shotId=params.get('shot');
    if(shotId){
      const i=pShots().findIndex(s=>s.shotId==shotId);
      if(i>=0) PSHOT_I=i;
    }
    const st=params.get('st');
    if(st){ PSTAGE=null; pFocusStage(st); }
    // AFTER pFocusStage, never before: pFocusStage derives PPIPE from PIPE_OF_STAGE, so
    // setting the remembered pipe first would be silently overwritten.
    const pipe=params.get('pipe');
    if(pipe) PPIPE=pipe;
    renderControl();
    return true;
  } finally {
    if(mySeq===_NAV_SEQ) _NAV_RESTORING=false;
  }
}
// THE BACK BUTTON, WIRED TO THE APP INSTEAD OF THE DOOR. Back/forward now replay the same
// restore a refresh performs. An entry with no project in it (the bare URL the first push
// came from) correctly lands on Projects rather than doing nothing.
window.addEventListener("popstate",function(){
  const h=(location.hash||"").replace(/^#/,"");
  if(h===_NAV_HASH_LAST) return;
  _NAV_HASH_LAST=h;
  if(!h||!new URLSearchParams(h).get('p')){
    // RESTORING, not navigating. bootProjects() renders, every render calls _syncHash, and
    // _syncHash PUSHES whenever the hash changed — so walking Back onto the bare URL used to
    // push "pg=projects" straight back on, landing you exactly where you just left. Back on
    // the Studio's own front door did nothing, forever. The flag makes that render REPLACE.
    _NAV_SEQ++; _NAV_RESTORING=true;
    CURRENT_PROJECT=null; CUR=null; SHOTS=[]; page="projects";
    _bootProjectsRestoring();
    return;
  }
  _restoreFromHash(h).then(function(ok){ if(!ok) _bootProjectsRestoring(); });
});

// at all"): a persisted name sent with every sign-off, so who-approved-what is recorded before a second
// reviewer ever joins. Not a real auth system — just an identity string on the lock.

  {v:"3D CGI (Pixar/Bluey)",d:"Rendered 3D — soft lighting, depth, fur/texture."},

async function bootProjects(){
  try{PROJECTS=(((await fetch(BASE+"/api/projects",{cache:"no-store"}).then(r=>r.json()))||{}).projects)||[];}catch(e){PROJECTS=[];}
  CURRENT_PROJECT=null; CUR=null; SHOTS=[]; page="projects"; renderTop(); renderNav(); renderProjects();

// bootProjects, but as a RESTORE — used only by the popstate handler. Holds _NAV_RESTORING
// across the whole async boot (bootProjects awaits a fetch before it renders, so setting the
// flag and returning immediately would clear it before the render that needs it), then
// releases it. Only the latest Back press releases: a rapid second press bumps _NAV_SEQ, and
// the older boot must not clear the newer one's flag out from under it.
function _bootProjectsRestoring(){

}

          <div class="projcard-progress">

            <div class="projcard-bar"><i style="width:${s.completion}%"></i></div>

async function addCharacter(){
  const name=_cval("ch_name"); if(!name){alert("Name is required");return;}
  const body={name,voiceId:_cval("ch_voice"),size:_cval("ch_size"),sizeRef:_cval("ch_sizeref"),tier:_cval("ch_tier"),crystal:_cval("ch_crystal"),key_features:_cval("ch_feat")};
  const msg=document.getElementById("ch_msg"); msg.textContent="Saving…";
  const send=async()=>{try{const r=await fetch(BASE+"/api/character",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!j.ok){alert("Error: "+(j.error||"failed"));msg.textContent="";return;}msg.textContent="✓ "+name+" added";setTimeout(renderCharacters,700);}catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");msg.textContent="";}};
  const readF=(id)=>new Promise(res=>{const el=document.getElementById(id),f=el&&el.files[0];if(!f)return res(null);const rd=new FileReader();rd.onload=()=>res({data:rd.result,name:f.name});rd.readAsDataURL(f);});
  const [anc,turn]=await Promise.all([readF("ch_img"),readF("ch_turn")]);
  if(anc){body.anchorData=anc.data;body.anchorName=anc.name;}
  if(turn){body.turnData=turn.data;body.turnName=turn.name;}
  send();
}

async function addScene(){
  const name=(document.getElementById("sc_name").value||"").trim(); if(!name){alert("Scene name is required");return;}
  const f=document.getElementById("sc_img").files[0]; if(!f){alert("Pick a scene image");return;}
  const msg=document.getElementById("sc_msg"); msg.textContent="Saving…";
  const rd=new FileReader();
  rd.onload=async()=>{try{const r=await fetch(BASE+"/api/scene-ref",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,imageData:rd.result})});const j=await r.json();if(!j.ok){alert("Error: "+(j.error||"failed"));msg.textContent="";return;}msg.textContent="✓ "+name+" added";setTimeout(renderScenes,700);}catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");msg.textContent="";}};
  rd.readAsDataURL(f);
}
