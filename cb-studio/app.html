:root{
  --bg:#f4f2ef;--surface:#fffdfb;--surface2:#ece8e5;--ink:#242126;--muted:#625d63;--hint:#7b747b;--line:#d8d2ce;
  --brand:#745477;--brandbg:#e9e4e9;--brandink:#543c56;
  --spark:#a96f00;--sparkbg:#fff0c9;--deep:#bd4c39;--deepbg:#ffe4de;--heart:#ad3c73;--heartbg:#f9e1ed;
  --conn:#6751b4;--connbg:#ebe6fb;--rip:#167c8c;--ripbg:#dff1f3;--ok:#167646;--okbg:#dff1e6;--info:#2d68ac;--infobg:#e1ecf9;
  --danger:#b23c31;--dangerbg:#f9e3e0;
  --warn:#946000;--warnbg:#fff0cb;
}
*{box-sizing:border-box}
input,textarea,select{background:var(--surface2);color:var(--ink);accent-color:var(--brand)}
body{margin:0;font-family:'Body Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Label Sans',sans-serif;background:transparent;color:var(--ink);border:0;padding:0}
.logo{width:28px;height:28px;border-radius:8px;background:var(--brandbg);color:var(--brand);display:flex;align-items:center;justify-content:center}
.toplinks{display:flex;gap:8px;align-items:center}
.tl{font:inherit;font-size:13px;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;background:transparent;border:0}
.tl:hover{background:var(--brandbg);color:var(--brandink)}
.tl.on{background:var(--brandbg);color:var(--brandink);font-weight:600}
.epchip{font-size:12px;color:var(--brandink);background:var(--brandbg);border-radius:8px;padding:5px 12px}
.gates{display:flex;gap:8px;align-items:center;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--hint);flex-wrap:wrap}
.gates .on{color:var(--brandink);font-weight:600}.gates .done{color:var(--ok)}
.shell{display:flex;min-height:calc(100vh - 98px)}
.nav{width:172px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:10px}
.nav a,.nav button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;margin-bottom:2px;background:transparent;border:0;font:inherit;text-align:left}
.nav a.active,.nav button.active{background:var(--brandbg);color:var(--brandink);font-weight:600}.nav a:hover:not(.active),.nav button:hover:not(.active){background:var(--surface2)}
.nav .sep{border-top:1px solid var(--line);margin:8px 6px}
.main{flex:1;padding:22px 26px;min-width:0}
.h1{font-size:21px;font-weight:900;margin:0 0 2px;font-family:'Display Slab',Georgia,serif}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.epcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .12s;display:flex;flex-direction:column}
.epcard:hover{border-color:var(--brand)}
.epthumb{height:96px;background:#1a2b24;display:flex;align-items:center;justify-content:center;color:#7fd4c1;font-size:13px}
.epbody{padding:12px 14px;display:flex;flex-direction:column;flex:1}
.epbody .n{font-size:11px;color:var(--hint);font-weight:600}
.epbody .t{font-size:15px;font-weight:900;margin:2px 0 6px;font-family:'Display Slab',Georgia,serif}
.epbody .l{font-size:12px;color:var(--muted);line-height:1.4;height:50px;overflow:hidden}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:10px;border-radius:6px;padding:3px 8px;margin-top:8px}
.epactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.epactions .btn{margin:0;padding:8px 12px;font-size:12px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font:inherit}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.addcard{border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--brand);cursor:pointer;min-height:170px;font:inherit;font-weight:500;background:transparent}
.addcard:hover{border-color:var(--brand);background:var(--brandbg)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:640px}
.form label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 4px}
.form input,.form textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font:inherit;background:var(--surface2);color:var(--ink)}
.form textarea{min-height:220px;resize:vertical;font-size:13px;line-height:1.5}
.btn{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.42;cursor:not-allowed;filter:saturate(.35)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);margin-left:8px}
.scene{margin-bottom:24px}
.scenehd{display:flex;align-items:center;gap:10px;margin:0 0 10px}.scenehd b{font-size:14px}.scenehd .ct{font-size:12px;color:var(--hint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .12s}.card:hover{border-color:var(--brand)}
.thumb{height:108px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}.thumb .ph{font-size:24px;opacity:.55}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;background:rgba(16,26,21,.88);color:var(--ink);border-radius:6px;padding:2px 7px}
.wb{position:absolute;top:8px;right:8px;font-size:9px;font-weight:600;border-radius:6px;padding:2px 6px}
.play{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(16,26,21,.85);color:#fff;display:flex;align-items:center;justify-content:center}
.cbody{padding:9px 11px}.crow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.pill{font-size:10px;border-radius:6px;padding:2px 7px}.act{font-size:12.5px;line-height:1.4;margin-bottom:4px}.meta{font-size:11px;color:var(--hint);margin-bottom:6px}
.dlg{font-size:11px;color:var(--muted);font-style:italic;border-left:2px solid var(--line);padding-left:7px;margin-bottom:7px}
.st{display:inline-flex;align-items:center;gap:4px;font-size:10px;border-radius:6px;padding:2px 7px}
.srow{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--surface)}
.srow:hover{border-color:var(--brand)}.srow .num{font-size:11px;font-weight:600;color:var(--brandink);min-width:46px}
.mcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px}.mc[onclick]{cursor:pointer;transition:border-color .12s,box-shadow .12s,transform .12s}.mc[onclick]:hover{border-color:var(--brand);box-shadow:0 3px 14px rgba(108,92,231,.16);transform:translateY(-1px)}.mc .lab{font-size:12px;color:var(--muted)}.mc .num{font-size:24px;font-weight:600;margin-top:3px}
.bar{height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:8px}.bar>i{display:block;height:100%;background:var(--brand)}
.scriptbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px 18px;white-space:pre-wrap;font-size:13px;line-height:1.6;max-height:520px;overflow:auto}
.bible{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 26px;max-width:820px}
.bible h1{font-size:20px}.bible h2{font-size:17px;border-top:1px solid var(--line);padding-top:14px}.bible h3{font-size:15px}
.bible table{border-collapse:collapse;width:100%;font-size:12.5px;margin:8px 0}.bible th,.bible td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.modal{position:fixed;inset:0;background:rgba(28,24,48,.5);display:none;align-items:center;justify-content:center;padding:24px;z-index:100}.modal.show{display:flex}
.sheet{background:var(--surface);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px 22px}
.media{width:100%;border-radius:10px;background:var(--surface2);margin:12px 0;max-height:380px;object-fit:contain}
.kv{font-size:12px;color:var(--muted);margin:10px 0 3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.prompt{font-size:12.5px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:var(--ink)}
.x{float:right;cursor:pointer;color:var(--muted);font-size:20px;border:none;background:none}
.coming{color:var(--hint);font-size:13px;padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
.live{display:flex;align-items:center;gap:9px;margin:8px 2px;padding:9px 13px;background:var(--infobg);color:var(--info);border-radius:9px;font-weight:600;font-size:13px}
/* ── Gate-flow spine: the 4-gate rail + active panel ── */
.grail{display:flex;align-items:stretch;gap:0;margin:14px 0 4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.gnode{flex:1;min-width:118px;text-align:center;padding:11px 8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:box-shadow .25s,border-color .25s,transform .2s;position:relative}
.gnode:hover{border-color:var(--brand)}
.gnode.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.gnode.locked{opacity:.55;cursor:default}
.gnode.locked:hover{border-color:var(--line)}
.gnode .gglyph{font-size:18px;line-height:1;margin-bottom:5px;font-weight:700}
.gnode .gnum{font-size:9px;letter-spacing:.08em;color:var(--hint)}
.gnode .gname{font-size:12.5px;font-weight:600;margin:1px 0 1px}
.gnode .gph{font-size:10px;font-weight:600}
.gconn{align-self:center;flex:0 0 26px;height:3px;background:var(--line);transition:background .4s}
.gconn.fill{background:var(--ok)}
.justUnlocked{animation:justUnlocked 1.3s ease-out 1}
@keyframes justUnlocked{0%{box-shadow:0 0 0 0 var(--brand)}40%{box-shadow:0 0 0 6px var(--brandbg)}100%{box-shadow:0 0 0 3px var(--brandbg)}}
.sstrip{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 2px}
.schip{padding:5px 13px;border:1px solid var(--line);border-radius:20px;background:var(--surface);cursor:pointer;font-size:12.5px;font-weight:600;transition:border-color .2s}
.schip:hover{border-color:var(--brand)}
.schip.on{border-color:var(--brand);background:var(--brandbg);color:var(--brandink)}
.apanel{border:1.5px solid var(--brand);border-radius:14px;padding:16px 17px;margin-top:10px;background:var(--surface)}
.bigfire{font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:10px;background:var(--brand);color:#fff;border:none;cursor:pointer}
.bigfire:hover{background:var(--brandink)}
.bigsign{font-size:14.5px;font-weight:700;padding:12px 22px;border-radius:10px;background:var(--ok);color:var(--bg);border:none;cursor:pointer}
.bigsign:hover{filter:brightness(1.08)}
.minds{font-size:11px;color:var(--brandink);letter-spacing:.02em}
/* ── Linear Gated Cascade (Ticket 4): stage rail + per-beat timeline + panel ── */
.crail{display:flex;align-items:stretch;gap:0;margin:14px 0 6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.cstage{flex:1;min-width:104px;text-align:center;padding:10px 8px 9px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:box-shadow .25s,border-color .25s,opacity .25s;position:relative}
.cstage:hover:not(.locked){border-color:var(--brand)}
.cstage.active{border-color:var(--brand);box-shadow:0 0 0 3px var(--brandbg)}
.cstage.locked{opacity:.5;cursor:not-allowed}
.cstage.done{border-color:var(--ok)}
.cstage .cglyph{font-size:17px;line-height:1;margin-bottom:4px;font-weight:700}
.cstage .cnum{font-size:9px;letter-spacing:.08em;color:var(--hint)}
.cstage .cname{font-size:12.5px;font-weight:600;margin:1px 0 1px}
.cstage .cph{font-size:10px;font-weight:600}
.cconn{align-self:center;flex:0 0 22px;height:3px;background:var(--line);transition:background .4s}
.cconn.fill{background:var(--ok)}
.ctl{display:flex;flex-direction:column;gap:6px;margin:10px 0 0}
.cbeat{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.cbeat:hover{border-color:var(--brand)}
.cbeat.current{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandbg)}
.cbeat.locked{opacity:.55;cursor:not-allowed}
.cbeat .cbdot{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.cbeat .cbcode{font-weight:700;font-size:12.5px;min-width:52px}
.cbeat .cbact{flex:1;min-width:0;font-size:12.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbeat .cbst{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.cpanel{border:1.5px solid var(--brand);border-radius:14px;padding:16px 17px;margin-top:14px;background:var(--surface)}
.cjson{width:100%;min-height:240px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.45;padding:11px;border:1px solid var(--line);border-radius:8px;box-sizing:border-box;resize:vertical;background:var(--bg);color:var(--ink)}
.cgate-note{font-size:11.5px;color:var(--spark);background:var(--sparkbg);border-radius:7px;padding:8px 11px;margin:8px 0}
/* ── click-to-enlarge lightbox (keyframes + scene plate) ── */
img.zoom{cursor:zoom-in;transition:filter .12s ease}
img.zoom:hover{filter:brightness(1.08)}
.thumb img.zoom:hover{filter:brightness(1.08)}
#lightbox{position:fixed;inset:0;z-index:9999;background:rgba(10,16,13,.90);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;flex-direction:column;padding:26px;box-sizing:border-box}
#lightbox.open{display:flex}
#lbimg{max-width:94vw;max-height:84vh;object-fit:contain;border-radius:10px;box-shadow:0 12px 60px rgba(0,0,0,.55);background:var(--bg);cursor:zoom-in;transition:transform .15s ease;transform-origin:center}
#lbimg.zoomed{cursor:zoom-out}
#lbcap{color:var(--ink);font-size:12.5px;margin-top:13px;display:flex;gap:16px;align-items:center;max-width:94vw}
#lbcap a{color:var(--brandink);text-decoration:none}#lbcap a:hover{text-decoration:underline}
#lbclose{position:absolute;top:14px;right:22px;color:#fff;background:none;border:0;padding:0;font:inherit;font-size:28px;line-height:1;cursor:pointer;opacity:.8}
#lbclose:hover{opacity:1}
/* THE PRODUCTION CONTROL ROOM (2026-07-17 UX replacement) — one sequential pipeline: */
:root{--honey:#d9a441;--honeybg:#2e2416}
:root{--deep:#e8825f;--deepbg:#2c2119}

/* ── THE PRODUCTION OPERATING SYSTEM — Scene Board + Scene Workspace ── */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filterchip{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .12s,color .12s}
.filterchip:hover{border-color:var(--brand);color:var(--ink)}
.filterchip.active{background:var(--surface2);border-color:var(--brand);color:var(--ink);font-weight:600}
.filterchip .fc{opacity:.6;margin-left:3px}

.sceneboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.scenecard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s}
.scenecard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.scenecard-thumb{position:relative;aspect-ratio:16/9;background:var(--surface2);overflow:hidden}
.scenecard-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.scenecard-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:12.5px}
.scenecard-dot{position:absolute;top:12px;right:12px;width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 3px rgba(0,0,0,.35)}
.scenecard-body{padding:16px 18px 18px}
.scenecard-title{font-family:'Display Slab',Georgia,serif;font-size:14.5px;font-weight:700;letter-spacing:.01em;margin-bottom:12px;line-height:1.3}
.scenecard-stages{display:flex;flex-direction:column;gap:7px}
.board-triage{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
.board-triage-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--muted);font:inherit;text-align:left;cursor:pointer}
.board-triage-item:hover,.board-triage-item:focus-visible{border-color:var(--brand);outline:none}
.board-triage-item.active{border-color:var(--brand);background:var(--brandbg)}
.board-triage-label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:var(--hint)}
.board-triage-value{font-size:21px;font-weight:800;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.scenecard-media-label{position:absolute;left:10px;top:10px;padding:4px 7px;border:1px solid rgba(255,255,255,.14);border-radius:4px;background:rgba(9,10,15,.82);color:#fff;font-size:9px;font-weight:850;text-transform:uppercase}
.scenecard-decision{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.scenecard-decision-copy{min-width:0}.scenecard-decision-kicker{display:block;margin-bottom:3px;color:var(--hint);font-size:9px;font-weight:850;text-transform:uppercase}
.scenecard-decision-title{display:block;color:var(--ink);font-size:12.5px;font-weight:750;line-height:1.35}
.scene-progress{height:4px;margin:0 0 12px;overflow:hidden;border-radius:4px;background:var(--surface2)}
.scene-progress>span{display:block;height:100%;background:var(--ok);transition:width .25s ease}
.scene-corridor{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:13px}
.scene-corridor-step{min-width:0;padding:7px 5px;border:1px solid var(--line);border-radius:5px;background:var(--surface2);text-align:center}
.scene-corridor-step b{display:block;overflow:hidden;color:var(--muted);font-size:9px;text-transform:uppercase;text-overflow:ellipsis}
.scene-corridor-step span{display:block;margin-top:3px;color:var(--hint);font-size:9px;white-space:nowrap}
.scene-corridor-step.current{border-color:var(--brand);background:var(--brandbg)}.scene-corridor-step.current b{color:var(--ink)}
.scene-corridor-step.complete{border-color:color-mix(in srgb,var(--ok) 44%,var(--line))}.scene-corridor-step.complete span{color:var(--ok)}
.scene-corridor-step.attention{border-color:var(--warn);background:var(--warnbg)}.scene-corridor-step.attention span{color:var(--warn)}
.scenecard-actions{display:grid;grid-template-columns:minmax(0,1fr);gap:7px}.scenecard-actions.has-upload{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.scenecard-actions .btn{width:100%;min-width:0;margin:0}.scenecard-actions .btn.ghost{color:var(--ink);border-color:var(--brand)}
.stagerow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px}
.stagerow-name{color:var(--muted);flex:0 0 auto}
.canonissue{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,360px);gap:16px;align-items:start;padding:5px 0;font-size:12px;line-height:1.45}
.canonissue-msg{color:var(--danger);min-width:0;overflow-wrap:anywhere}
.canonissue-action{color:var(--muted);min-width:0;overflow-wrap:anywhere}

.stbadge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2.5px 8px;white-space:nowrap}
.badgesub{display:block;font-size:10.5px;color:var(--hint);margin-top:2px;text-align:right}

/* ── Scene Workspace ── */
.wtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.backlink{color:var(--honey);background:none;border:0;padding:0;cursor:pointer;font:inherit;font-size:13px;flex:0 0 auto}
.wtop-crumb{color:var(--muted);font-size:13px;flex:1 1 auto}
.sceneselect{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;font-size:13px;max-width:340px}

.pstate{font-size:10.5px;font-weight:600;margin-top:3px}
.jobbanner{background:var(--infobg);border:1px solid var(--info);border-radius:10px;padding:10px 15px;font-size:13px;color:var(--info);margin-bottom:18px}

/* ── PROJECTS SCREEN — the entry point; calm, visual, one obvious next action ── */
.projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.projcard{border-radius:14px;overflow:hidden;cursor:pointer;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.projcard:hover{border-color:var(--brand);transform:translateY(-1px)}
.projcard-art{aspect-ratio:16/9;background:var(--surface2);position:relative;overflow:hidden}
.projcard-art img{width:100%;height:100%;object-fit:cover;display:block}
.projcard-art .initial{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:44px;color:var(--line);font-weight:700}
.projcard-art .archtag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;background:rgba(0,0,0,.55);color:var(--muted);padding:3px 9px;border-radius:20px}
.projcard-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.projcard-name{font-weight:700;font-size:16px;display:flex;align-items:baseline;gap:7px}
.projcard-type{font-size:11px;color:var(--brandink);font-weight:600}
.projcard-premise{font-size:12px;color:var(--hint);line-height:1.5}
.projcard-meta{font-size:11px;color:var(--hint)}
.projcard-progress{margin-top:2px}
.projcard-progress-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:4px}
.projcard-bar{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden}
.projcard-bar>i{display:block;height:100%;background:var(--brand);border-radius:3px}
.projcard-decisions{font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.projcard-activity{font-size:11px;color:var(--hint)}
.projcard-cta{margin-top:auto;padding-top:10px}
.projcard-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.projcard-actions .btn{margin:0;padding:8px 12px;font-size:12px}
.outcome{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 14px;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;background:var(--surface);margin:0 0 16px}
.outcome-copy{min-width:0}
.outcome-kicker{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);font-weight:700}
.outcome-title{font-size:14px;font-weight:700;margin-top:2px;color:var(--ink)}
.outcome-body{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45}
.outcome-actions{display:flex;gap:8px;align-items:center;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end}
.outcome-actions .btn{margin:0;padding:8px 12px;font-size:12px;white-space:nowrap}
.outcome.review{border-left-color:var(--honey)}
.outcome.blocked{border-left-color:var(--warn)}
.outcome.done{border-left-color:var(--ok)}
.outcome.working{border-left-color:var(--info)}

.workspace{display:grid;grid-template-columns:220px 1fr 300px;gap:24px;align-items:start}
.wcol{min-width:0}
.wcol-full{grid-column:1/-1}
.wcol-head{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--hint);font-weight:700;margin-bottom:12px}
.wcol-contents{background:var(--surface);border-radius:14px;padding:16px;position:sticky;top:16px;max-height:calc(100vh - 140px);overflow:auto}
.wcol-artefact{background:var(--surface);border-radius:14px;padding:22px;min-height:340px}
.wcol-decision{background:var(--surface);border-radius:14px;padding:20px;position:sticky;top:16px}
.locked-msg{color:var(--hint);text-align:center;padding:60px 20px;font-size:14px}

.wtree-empty{color:var(--hint);font-size:12.5px}
.wtree-beat{margin-bottom:12px}
.wtree-beat-id{font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}

.pmedia.img{object-fit:contain}
.pshotnav{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.pshotnav .cnt{font-size:13px;color:var(--muted);font-weight:600}
.pqueue{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;margin-top:16px}
.pqitem{flex:0 0 auto;width:52px;height:38px;border-radius:8px;border:1.5px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--hint);background:var(--surface2);overflow:hidden;position:relative}
.pqitem img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:.6}
.pqitem span{position:relative;z-index:1;background:rgba(0,0,0,.55);padding:1px 4px;border-radius:4px}
.pqitem.cur{border-color:var(--honey);box-shadow:0 0 0 2px var(--honeybg)}
.pqitem.ok{border-color:var(--ok)}
.pdecision{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.pfeedback{width:100%;min-height:54px;margin-top:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);color:var(--ink);font:inherit;font-size:13px;resize:vertical}
.psummary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.pscard{background:var(--surface2);border-radius:10px;padding:11px 13px}
.pscard .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--hint)}
.pscard .v{font-size:14px;font-weight:600;margin-top:3px}
.agentpanel{border:1px solid var(--brand);background:var(--surface);border-radius:8px;margin:0 0 12px;overflow:hidden}
.agenthead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--brandbg)}
.agentmark{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none;border-radius:6px;background:var(--brandink);color:var(--bg);font-size:11px;font-weight:800}
.agentidentity{min-width:0;flex:1}
.agentname{font-size:13px;font-weight:700;color:var(--ink)}
.agentmeta{font-size:11px;color:var(--hint);margin-top:1px;overflow-wrap:anywhere}
.agenttags{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.agenttag{border:1px solid var(--line);border-radius:4px;padding:2px 6px;font-size:10px;font-weight:700;color:var(--muted);background:var(--surface)}
.agentmode{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.agentmode button{border:0;border-left:1px solid var(--line);border-radius:0;background:transparent;color:var(--muted);font:inherit;font-size:10px;font-weight:700;padding:5px 8px;cursor:pointer}
.agentmode button:first-child{border-left:0}
.agentmode button.active{background:var(--brandink);color:var(--bg)}
.agentbody{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px}
.agentheadline{font-size:15px;font-weight:700;color:var(--ink);line-height:1.35}
.agentreason{font-size:12px;color:var(--muted);line-height:1.5;margin-top:4px}
.agentnext{font-size:12px;line-height:1.5;margin-top:9px;padding:7px 9px;border-left:3px solid var(--brand);background:var(--brandbg)}
.agentdetails{border-top:1px solid var(--line);padding:8px 12px 10px}
.agentdetails summary{cursor:pointer;color:var(--brandink);font-size:11px;font-weight:700}
.agentcontrols{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
.agentfacts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:10px}
.agentfact-title{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase}
.agentfact-row{font-size:11px;color:var(--muted);line-height:1.4;margin-top:5px}
.agentdecision{font-size:11px;line-height:1.45;padding:7px 0;border-top:1px solid var(--line)}
.agentdecision:first-child{border-top:0}
.qualitystrip{display:flex;overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.qualityitem{min-width:138px;flex:1;padding:8px 10px;border-left:1px solid var(--line)}
.qualityitem:first-child{border-left:0}
.qualitylabel{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink)}
.qualitydot{width:7px;height:7px;border-radius:50%;background:var(--hint);flex:none}
.qualitydot.clear{background:var(--ok)}
.qualitydot.attention{background:var(--warn)}
.qualitydot.unassessed{background:var(--info)}
.qualitysummary{font-size:10px;line-height:1.35;color:var(--hint);margin-top:3px}
.agentplan{border-top:1px solid var(--line);padding:10px 12px;background:var(--surface2)}
.agentplan-objective{font-size:12px;font-weight:700;line-height:1.45;color:var(--ink)}
.agentplan-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:9px}
.agentplan-row{font-size:11px;color:var(--muted);line-height:1.4;margin-top:4px}
@media(max-width:760px){.agentbody{grid-template-columns:1fr}.agentbody .btn{width:100%}.agentfacts,.agentplan-grid{grid-template-columns:1fr}.agenttags{justify-content:flex-start}.agenthead{flex-wrap:wrap}.agentmode{order:3}}

/* PREMIUM STUDIO SYSTEM — neutral editorial canvas, cinematic shell, canonical art first. */
:root{
  --honey:#9a6400;--honeybg:#fff0cb;
  --shadow-sm:0 1px 2px rgba(36,33,38,.08),0 8px 24px rgba(36,33,38,.04);
  --shadow-md:0 2px 4px rgba(36,33,38,.08),0 18px 44px rgba(36,33,38,.10);
}
html{color-scheme:light;background:var(--bg)}
html *{letter-spacing:0!important}
body{min-height:100vh;background:var(--bg);color:var(--ink);font-size:14px}
button,input,textarea,select{font-family:inherit}
img,video{max-width:100%}

.top{position:sticky;top:0;z-index:40;min-height:64px;padding:0 24px;gap:22px;background:#211f23;border-bottom:1px solid #39353b;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.brand{color:#f7f6f2;gap:11px;min-width:max-content}
.brand-lockup{display:flex;align-items:baseline;gap:5px;line-height:1}
.brand-name{font-family:'Label Sans','Body Sans',sans-serif;font-size:16px;font-weight:700}
.brand-studio{font-size:10px;font-weight:700;text-transform:uppercase;color:#d9c2da}
.logo{width:32px;height:32px;border-radius:7px;background:var(--brand);color:#fff;border:1px solid #a989aa;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.toplinks{align-self:stretch;gap:2px;min-width:0;overflow-x:auto}
.tl{height:100%;padding:0 12px;border-radius:0;color:#aeb5b8;border-bottom:2px solid transparent;white-space:nowrap}
.tl:hover{background:#2d2930;color:#f7f6f2}
.tl.on{background:transparent;color:#fff;border-bottom-color:#c8aaca;font-weight:700}
.epchip{align-self:center;border-radius:4px;padding:5px 9px;background:#342d36;color:#e2cde3;font-weight:700;white-space:nowrap}
.topreviewer{margin-left:auto;display:flex;align-items:center;gap:8px;color:#8f979a;font-size:11px;white-space:nowrap}
.topreviewer input{width:92px;padding:5px 8px;border:1px solid #454047;border-radius:5px;background:#2b282d;color:#fff;font:inherit;font-size:12px}
.mobile-menu-toggle{display:none;width:44px;height:44px;margin:0;padding:0;align-items:center;justify-content:center;border:1px solid #454047;border-radius:6px;background:#2b282d;color:#f7f4f0;font:inherit;font-size:21px;line-height:1;cursor:pointer}
.mobile-menu-toggle:hover{background:#342f36}

.gates{padding:9px 24px;background:var(--surface);border-bottom:1px solid var(--line);color:var(--hint);box-shadow:0 1px 0 rgba(36,33,38,.03)}
.shell{min-height:calc(100vh - 64px);background:var(--bg)}
.nav{width:184px;padding:18px 10px;background:#272429;border-right:1px solid #3b373d}
.nav a,.nav button{border-radius:5px;color:#a9b0b3;padding:10px 12px}
.nav a.active,.nav button.active{background:#373139;color:#e1cbe2;box-shadow:inset 2px 0 0 #a989aa}
.nav a:hover:not(.active),.nav button:hover:not(.active){background:#302c32;color:#f7f6f2}
.nav .sep{border-color:#403b42}
.main{width:100%;padding:34px 38px 64px;background:var(--bg)}
.screenhead{margin:0 0 22px}
.screenhead--art{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,320px);gap:24px;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.screenhead-copy{min-width:0}
.screenhead-art{height:104px;overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#29262b}
.screenhead-art img{display:block;width:100%;height:100%;object-fit:cover}
.screen-eyebrow{font-size:10px;line-height:1.2;text-transform:uppercase;color:var(--brandink);font-weight:800;margin-bottom:7px}
.h1{font-size:30px;line-height:1.15;margin:0 0 6px;color:var(--ink)}
.sub{max-width:760px;font-size:13.5px;line-height:1.5;color:var(--muted);margin:0}

.btn{margin-top:14px;padding:9px 15px;border-radius:6px;background:var(--brand);color:#fff;box-shadow:0 1px 1px rgba(36,33,38,.12);transition:background .16s ease,box-shadow .16s ease,transform .16s ease}
.btn:hover:not(:disabled){background:var(--brandink);box-shadow:0 4px 12px rgba(55,45,57,.18);transform:translateY(-1px)}
.btn.ghost{background:var(--surface);color:#49434a;border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){background:var(--surface2);color:var(--ink);border-color:#b9b0ab}
.iconbtn{border-radius:5px}
.iconbtn:hover{background:var(--surface2)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

.outcome{min-height:76px;margin:0 0 20px;padding:16px 18px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-sm)}
.outcome-kicker{font-size:10px;color:var(--brandink);font-weight:800;text-transform:uppercase}
.outcome-title{font-size:16px;line-height:1.3;margin-top:3px}
.outcome-body{font-size:12.5px;color:var(--muted);margin-top:3px}
.outcome.review{border-left-color:var(--honey)}
.outcome.blocked{border-left-color:var(--warn)}
.outcome.done{border-left-color:var(--ok)}
.outcome.working{border-left-color:var(--info)}

.projgrid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);grid-auto-flow:row;gap:18px;align-items:stretch}
.projcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:default;box-shadow:var(--shadow-sm);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.projcard:hover{border-color:#b8aeaa;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.projcard[data-primary="true"]{grid-row:span 2}
.projcard-art{position:relative;isolation:isolate;aspect-ratio:16/9;background:#29262b}
.projcard-artmedia{position:absolute;inset:0}
.projcard-artmedia img{width:100%;height:100%;object-fit:cover;display:block}
.projcard-art .initial{color:#757d80}
.projcard-artmeta{position:absolute;z-index:2;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
.projcard-artmeta span{display:inline-flex;align-items:center;min-height:24px;padding:4px 8px;border-radius:4px;background:rgba(15,18,19,.78);color:#f7f6f2;font-size:9.5px;font-weight:800;text-transform:uppercase}
.projcard[data-archived="true"] .projcard-artmedia{filter:saturate(.35) contrast(.9);opacity:.78}
.projcard-body{padding:19px 21px 21px;gap:8px}
.projcard[data-primary="true"] .projcard-body{padding:23px 25px 25px}
.projcard-name{align-items:center;justify-content:space-between;gap:14px;font-size:19px;line-height:1.2;color:var(--ink)}
.projcard[data-primary="true"] .projcard-name{font-family:'Display Slab',Georgia,serif;font-size:28px;font-weight:900}
.project-role{flex:none;padding:3px 7px;border-radius:4px;background:var(--brandbg);color:var(--brandink);font-family:'Body Sans',sans-serif;font-size:9.5px;font-weight:800;text-transform:uppercase}
.projcard-type{font-size:11px;color:var(--brandink);font-weight:800}
.projcard-premise{max-width:760px;color:var(--muted);font-size:12.5px;line-height:1.55}
.projcard-meta,.projcard-activity{color:var(--hint);font-size:11.5px}
.projcard-progress-row{color:var(--muted)}
.projcard-bar{height:6px;border-radius:3px;background:#e4e7e5}
.projcard-bar>i{border-radius:3px;background:var(--brand)}
.projcard-decisions{font-size:12.5px}
.projcard-actions{padding-top:12px}
.projcard-actions .btn{padding:9px 13px}
.addcard{grid-column:2;min-height:132px;border:1px dashed #b9b0ab;border-radius:8px;background:rgba(255,253,251,.62);color:var(--brandink);transition:background .16s ease,border-color .16s ease,transform .16s ease}
.addcard:hover{background:var(--surface);border-color:var(--brand);transform:translateY(-1px)}
.wizard-art-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,220px);gap:14px;align-items:stretch;margin-top:14px}
.wizard-art-controls{display:grid;gap:10px;align-content:start}
.wizard-art-preview{min-height:112px;overflow:hidden;border:1px dashed var(--line);border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--hint);font-size:11px;text-align:center}
.wizard-art-preview img{display:block;width:100%;height:100%;min-height:112px;object-fit:cover}
.wizard-colour{display:flex;align-items:center;gap:9px;min-height:38px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.wizard-colour input{width:32px;height:26px;padding:0;border:0;background:transparent;cursor:pointer}
.wizard-colour code{font-size:11px;color:var(--muted)}

.epgrid{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.epcard{border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-sm);transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.epcard:hover{border-color:#b8aeaa;box-shadow:var(--shadow-md);transform:translateY(-2px)}
.epthumb{position:relative;height:auto;aspect-ratio:16/8.5;overflow:hidden;background:#29262b;color:#fff}
.epthumb img{width:100%;height:100%;object-fit:cover;display:block}
.epthumb-label{position:absolute;top:13px;left:13px;padding:4px 8px;border-radius:4px;background:rgba(15,18,19,.78);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase}
.epbody{padding:17px 18px 19px}
.epbody .n{font-size:10px;color:var(--brandink);font-weight:800}
.epbody .t{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;font-size:20px;line-height:1.25;margin:5px 0 8px}
.epbody .l{height:auto;min-height:42px;color:var(--muted);font-size:12.5px}
.stat,.stbadge,.pill,.st{border-radius:4px}
.epactions{padding-top:14px}

.filterbar{gap:6px;margin-bottom:18px}
.filterchip{border-radius:5px;padding:7px 12px;background:var(--surface)}
.filterchip.active{background:#29262b;border-color:#29262b;color:#fff}
.sceneboard{grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.scenecard{border:1px solid var(--line);border-radius:8px;background:var(--surface);box-shadow:var(--shadow-sm)}
.scenecard:hover{border-color:#b8aeaa;box-shadow:var(--shadow-md)}
.scenecard-body{padding:17px 18px 18px}
.scenecard-title{font-size:16px;margin-bottom:13px}
.stagerow{padding:5px 0;border-top:1px solid #eceeec}
.stagerow:first-child{border-top:0}
.scenecard-dot{box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.storyboard-progress-fill{height:100%;background:var(--brand);transition:width .35s ease}
.storyboard-progress-fill.running{min-width:8%;animation:storyboard-working 1.1s ease-in-out infinite alternate}
@keyframes storyboard-working{from{opacity:.42}to{opacity:1}}

.form,.bible,.sheet,.card,.mc,.apanel,.cpanel,.ppanel,.agentpanel,.wcol-contents,.wcol-artefact,.wcol-decision,.coming{border-radius:8px}
.card,.mc,.form,.bible,.ppanel,.agentpanel{box-shadow:var(--shadow-sm)}
.modal{background:rgba(15,18,19,.68)}
.sheet{box-shadow:0 24px 70px rgba(0,0,0,.22)}
.workspace{grid-template-columns:220px minmax(0,1fr) 310px;gap:18px}
.wcol-contents,.wcol-artefact,.wcol-decision{background:var(--surface);border:1px solid var(--line)}
.wcol-contents{padding:15px}
.wcol-artefact{padding:20px}
.wcol-decision{padding:18px}
.pstage,.gnode,.cstage{border-radius:7px;background:var(--surface)}
.pstage.locked,.cstage.locked{background:#e5e7e5}
.ppanel{border-color:var(--line);background:var(--surface)}
.pscard,.beatcard,.deptoutput,.techpre,.agentplan{border-radius:6px}
.agentpanel{border-color:#beaabf;background:var(--surface)}
.agenthead{background:var(--brandbg)}
.agentmark{border-radius:5px}
.agentmode{border-radius:5px}
.agenttag{border-radius:4px}
.qualitystrip{background:#fafbf9}
.bigfire,.bigsign{border-radius:7px}
.scriptbox,.prompt,.cjson,.ccta,.reject-cat,.pfeedback{border-radius:6px}

/* Responsive primitives used by generated production views. */
.mobile-grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mobile-split{display:flex;gap:10px}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.library-grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.character-card{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:start}
.character-card-media{width:110px;min-width:0}
.character-card-copy{min-width:0;overflow-wrap:anywhere}
.character-detail-lead{display:grid;grid-template-columns:170px minmax(0,1fr);gap:18px;align-items:start}
.character-detail-media{width:170px;min-width:0}
.character-detail-copy{min-width:0}
.character-detail-row{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.character-detail-label{font-size:12px;color:var(--hint);font-weight:600}
.asset-card{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:start}
.asset-card-media{width:170px;min-width:0}
.asset-card-copy{min-width:0;overflow-wrap:anywhere}
.asset-panes{display:flex;gap:16px;flex-wrap:wrap}
.asset-pane{flex:1;min-width:min(230px,100%)}
.wizard-character-add,.mobile-upload{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.table-scroll{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}

/* Outcome-first production view. The system remains inspectable without asking the
   director to carry its internal state before making the current creative decision. */
.production-context{margin:16px auto 0;max-width:780px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.production-context>summary{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:10px;padding:12px 2px;list-style:none;cursor:pointer;color:var(--muted);font-size:11.5px;font-weight:700}
.production-context>summary::-webkit-details-marker{display:none}
.production-context-state{color:var(--hint);font-weight:500;text-align:right}
.production-context-chevron{transition:transform .15s}
.production-context[open] .production-context-chevron{transform:rotate(180deg)}
.production-context-body{padding:4px 0 14px}
.production-context-actions{display:flex;justify-content:flex-end;margin-bottom:8px}
.production-context .praildetails{margin:0 0 10px}
.production-context .agentpanel{margin-bottom:10px}
.focus-workspace{display:flex;flex-direction:column;align-items:stretch;gap:14px;max-width:780px;margin:0 auto}
.focus-workspace>.wcol,.focus-workspace>.focus-context{width:100%;box-sizing:border-box}
.focus-workspace .wcol-decision{order:1;padding:24px}
.focus-workspace .wcol-artefact{order:2;padding:18px;min-height:0}
.focus-workspace .artefact-center{align-items:stretch;justify-content:flex-start}
.focus-workspace .pshotnav{justify-content:space-between}
.focus-workspace.result-first .wcol-artefact{order:1}
.focus-workspace.result-first .wcol-decision{order:2}
.focus-workspace .dec-title{font-size:22px;line-height:1.2;margin-top:3px}
.focus-workspace .dec-version{margin-top:5px}
.focus-workspace .dec-actions{margin-top:18px}
.focus-brief{max-width:650px;margin-bottom:16px;color:var(--muted);font-size:14px;line-height:1.55}
.focus-context,.focus-evidence{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.focus-context{order:3;background:transparent}
.focus-context>summary,.focus-evidence>summary,.ofc-alternatives>summary{padding:12px 2px;cursor:pointer;list-style:none;color:var(--muted);font-size:11.5px;font-weight:700}
.focus-context>summary::-webkit-details-marker,.focus-evidence>summary::-webkit-details-marker,.ofc-alternatives>summary::-webkit-details-marker{display:none}
.focus-context>summary::after,.focus-evidence>summary::after,.ofc-alternatives>summary::after{content:"+";float:right;color:var(--hint)}
.focus-context[open]>summary::after,.focus-evidence[open]>summary::after,.ofc-alternatives[open]>summary::after{content:"\2212"}
.focus-context-body{padding:0 0 14px}
.focus-scene-contents{padding:14px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.focus-evidence{margin-top:14px}
.focus-evidence-body{padding:0 0 2px}

<script>
const BASE=window.location.origin;
const PILL={Spark:["--spark","--sparkbg"],Deepening:["--deep","--deepbg"],Heart:["--heart","--heartbg"],Connection:["--conn","--connbg"],Ripple:["--rip","--ripbg"]};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const v=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
let EPISODES=[],MEDIA=[],CUR=null,SHOTS=[],PREFIX="",page="episodes",MEDIA_V=0,CHARCFG={},SCENELIB=null,RETAKES_DRAFT=[],RT_SN=null;

// ── ONE PIPE (scene-spine). Script in → the Pipeline runs each scene Storyboard→Keyframes→Animation→Post, locked
//    until the prior stage is signed, scenes unlocking in order. Cascade + the standalone boards are gone (one door per action).
const NAV=[["sceneboard","Production","◈"]];

function mediaFor(s){const codes=[s&&s.shotCode,s&&s.id].filter(x=>x!=null&&x!=="");const slug=s&&s.slug;
  // Show the keyframe/clip for the beat's CURRENT slug — NOT just the first .png matching the code. Multiple
  // generations can leave several files per code (old KF_v2, retired slugs); keying on the exact slug makes the
  // studio show the SAME file the backend writes (Ep1_{code}_{slug}.png), so a stale one can never shadow it.
  for(const c of codes){const pre=PREFIX+c+"_";const f=MEDIA.filter(m=>m.startsWith(pre));if(!f.length)continue;
    const exact=(ext)=>slug&&f.includes(pre+slug+ext)?pre+slug+ext:null;

// ── NAVIGATION CONTEXT, IN THE URL/HASH — NEVER A SECOND PRODUCTION-STATE STORE (2026-07-17
// state-integrity checkpoint): the hash records WHERE the user is (project/episode/scene/
// stage) so a literal refresh returns them to the same place — it never carries any
// production DATA (approval, lineage, ledger fields), which is always re-fetched fresh from
// the server on every render, exactly as before this was added. This is the ONLY place the
// hash is read or written; everything else keeps working from the same live globals it
// always has (CURRENT_PROJECT/page/SH_EP/SH_SC/PSTAGE) — the hash just mirrors them.
function _navHash(){
  const p=new URLSearchParams();
  if(CURRENT_PROJECT) p.set('p',CURRENT_PROJECT.id);
  if(page) p.set('pg',page);
  if((page=="sceneboard"||page=="pipeline")&&SH_EP) p.set('ep',SH_EP.replace(/^Ep/,''));
  if(page=="pipeline"){
    if(SH_SC) p.set('sc',SH_SC);
    if(PSTAGE) p.set('st',PSTAGE);
    // 2026-07-19 addition: WHICH SHOT within the scene — by shotId, never the raw array
    // index, so a beat/shot added or removed before the next visit can't silently point
    // "your place" at the wrong shot. Falls back cleanly (index clamped to 0) if the
    // remembered shotId no longer exists.
    const shots=(SH_PKG&&SH_PKG.shots)||[];
    if(shots[PSHOT_I]) p.set('shot',shots[PSHOT_I].shotId);
  }
  return p.toString();
}
function _syncHash(){
  try{
    const h=_navHash();
    history.replaceState(null,'',h?('#'+h):(location.pathname+location.search));
    // "REMEMBER YOUR PLACE" (2026-07-19, Julian's directive): the hash alone only survives
    // a same-tab refresh — closing the tab, restarting the browser, or opening the bare
    // URL/a bookmark loses it, dropping back to Projects every time. Mirroring it into
    // localStorage means the LAST place synced is recoverable even with no hash in the URL
    // at all. Same "navigation context only, never production data" boundary as the hash

async function _restoreFromHash(raw){

  const params=new URLSearchParams(raw);
  const pid=params.get('p');

  try{PROJECTS=(((await fetch(BASE+"/api/projects",{cache:"no-store"}).then(r=>r.json()))||{}).projects)||[];}catch(e){PROJECTS=[];}
  const proj=PROJECTS.find(x=>x.id===pid);
  if(!proj) return false;
  CURRENT_PROJECT=proj; CUR=null; SHOTS=[]; page="episodes";
  if(!(await boot())) return false;
  const pg=params.get('pg')||'episodes', epNum=params.get('ep');
  if(pg=='characters'){showCharacters();return true;}
  if(pg=='scenes'){showScenes();return true;}
  if(pg=='houses'){showHouses();return true;}
  if(pg=='assets'){showAssets();return true;}
  if(pg=='bible'){showBible();return true;}
  if(pg=='episodes'||!epNum) return true;   // boot() already rendered + synced the hash

  // That hidden render launches one state bundle per scene and competes with the exact scene
  // the director is waiting for. Initialise episode context only, then render the requested
  // scene once.
  const deferEpisodeRender=pg==='pipeline'&&!!scId;

  if(pg=='sceneboard'||!scId) return true;
  openScene(scId,true);

  if(st==="review")PSTAGE="review";

  await renderWorkspaceBody();
  return true;
}

async function boot(){
  applyProjectPresentation(CURRENT_PROJECT);
  const epf=(CURRENT_PROJECT&&CURRENT_PROJECT.episodesFile)||"cb-studio/data/episodes.json";
  try{
    const [episodes,media,characters]=await Promise.all([
      fetch(BASE+"/"+epf,{cache:"no-store"}).then(async r=>{
        const payload=await r.json();
        if(!r.ok||!Array.isArray(payload))throw new Error("episode index unavailable");
        return payload;
      }),
      fetch(BASE+"/cb-studio/data/media-index.json").then(r=>r.ok?r.json():[]).catch(()=>[]),
      fetch(BASE+"/"+projConfig()+"/characters.json",{cache:"no-store"}).then(r=>r.ok?r.json():({})).catch(()=>({})),
    ]);
    EPISODES=episodes;MEDIA=Array.isArray(media)?media:[];
    CHARCFG=characters&&typeof characters==="object"&&!Array.isArray(characters)?characters:{};
    MEDIA_V=Date.now();
  }catch(e){
    EPISODES=[];
    document.getElementById("view").innerHTML=outcomePanelHTML({tone:"blocked",title:"Episode state could not load",body:"The Studio did not return a valid episode index. Reconnect with the current launch link, then retry.",actions:[{label:"Retry",onclick:"boot()"},{label:"Productions",onclick:"bootProjects()",kind:"secondary"}]});
    return false;
  }
  renderTop();renderNav();render();
  return true;
}

async function _characterFile(id){
  const input=document.getElementById(id),file=input&&input.files&&input.files[0];
  if(!file)return null;
  return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({data:reader.result,name:file.name});reader.onerror=()=>reject(new Error("Could not read "+file.name));reader.readAsDataURL(file);});
}
async function _characterFiles(id){
  const input=document.getElementById(id),files=[...((input&&input.files)||[])];
  return Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({data:reader.result,name:file.name});reader.onerror=()=>reject(new Error("Could not read "+file.name));reader.readAsDataURL(file);})));
}
async function saveCharacterAssets(){
  const message=document.getElementById("character_assets_message");
  message.textContent="Saving…";
  try{
    const [anchor,turnaround,references]=await Promise.all([_characterFile("character_anchor"),_characterFile("character_turnaround"),_characterFiles("character_references")]);
    const body={name:CUR_CHAR,voiceId:_cval("character_voice_id"),cadence:_cval("character_cadence"),referenceData:references};
    if(anchor){body.anchorData=anchor.data;body.anchorName=anchor.name;}
    if(turnaround){body.turnData=turnaround.data;body.turnName=turnaround.name;}
    const response=await fetch(BASE+"/api/character",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const result=await response.json();
    if(!response.ok||!result.ok)throw new Error(result.error||"Character update failed");
    message.textContent="Saved. Review and re-lock canon before production.";
    setTimeout(renderCharacterDetail,650);
  }catch(error){message.textContent="";alert("Error: "+error.message);}
}

function onDoc(e){
  const file=e.target.files[0]; if(!file) return;
  const name=file.name, ext=(name.split(".").pop()||"").toLowerCase();
  const tag=document.getElementById("f-docname");
  tag.textContent="Loading "+name+"…";
  const reader=new FileReader();
  if(["txt","md","markdown","fountain","text"].includes(ext)){
    reader.onload=()=>{document.getElementById("f-script").value=reader.result; DOC=null;
      tag.textContent="✓ "+name+" loaded into the script box (editable below)";};
    reader.readAsText(file);
  }else{
    reader.onload=()=>{DOC={name,data:reader.result};
      tag.textContent="✓ "+name+" attached — text is extracted on save";};
    reader.readAsDataURL(file);
  }
}

// ─────────────────────────────────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════════════
// THE PRODUCTION OPERATING SYSTEM (2026-07-17): Projects → Episodes → Scene Board → Scene
// Workspace. Story order (script) and production order (whatever the user works on next)
// are separate — every scene carries its own signed internal pipeline, computed live from the same
// existing endpoints every gate action already uses (/api/loclib, /api/storyboard,
// /api/shot-package, /api/shot-run, /api/jobs, /api/rates — the last one read-only, exposing
// cb_costs.py's own RATES table so cost numbers never drift from the real ledger). No new
// persisted production state anywhere in this module.
// ─────────────────────────────────────────────────────────────────────────────────────────
// PSTAGES remain the internal state-machine contract. PPHASES is the only Director-facing journey.
// Grouping changes presentation only — every underlying approval, lineage, reference and spend
// check remains authoritative. Script is the only human approval before the package is inspected;
// package preparation and render QA remain automatic until Fire or the final dailies decision.
const PSTAGES=[
  {id:"script",name:"Script",glyph:"✎"},
  {id:"storyboard",name:"Story & Direction",glyph:"▤"},
  {id:"scenelook",name:"World Build",glyph:"◈"},
  {id:"keyframe",name:"Keyframe",glyph:"◧"},
  {id:"voice",name:"Voice & Timing",glyph:"♪"},
  {id:"animation",name:"Animation",glyph:"►"},
  {id:"continuity",name:"Director's Seat",glyph:"⇄"},
  {id:"final",name:"Final Master",glyph:"✓"}
];
const PPHASES=[
  {id:"direction",name:"Direction",glyph:"▤",members:["script","storyboard"]},
  {id:"see",name:"See",glyph:"◧",members:["scenelook","keyframe"]},
  {id:"hear",name:"Hear",glyph:"♪",members:["voice"]},
  {id:"watch",name:"Watch",glyph:"►",members:["animation","continuity","final"]}
];
const STATE_LABEL={ready:"Ready",generating:"Working",awaiting:"Ready for review",
                    approved:"Current",rejected:"Needs attention",blocked:"Needs attention",locked:"Waiting"};
const STATE_COLOR={ready:"--brandink",generating:"--info",awaiting:"--honey",approved:"--ok",
                    rejected:"--warn",blocked:"--warn",locked:"--hint"};
const STATE_BG   ={ready:"--brandbg",generating:"--infobg",awaiting:"--honeybg",approved:"--okbg",
                    rejected:"--warnbg",blocked:"--warnbg",locked:"--surface2"};
const STATE_GLYPH={ready:"○",generating:"●",awaiting:"◐",approved:"✓",rejected:"!",blocked:"!",locked:"–"};

function productionPhase(id){
  const legacy={script:"direction",package:"see",stage:"see",render:"watch",take:"watch",review:"watch",master:"watch"};
  id=legacy[id]||id;
  return PPHASES.find(phase=>phase.id===id||phase.members.includes(id));
}
function phaseState(phase,stages){
  phase=typeof phase==="string"?productionPhase(phase):phase;stages=stages||{};
  const states=(phase&&phase.members||[]).map(id=>(stages[id]||{}).state||"locked");
  if(states.includes("rejected"))return "rejected";
  if(states.includes("blocked"))return "blocked";
  if(states.includes("generating"))return "generating";
  if(states.includes("awaiting"))return "awaiting";
  if(states.length&&states.every(state=>state==="approved"))return "approved";
  if(states.includes("ready"))return "ready";
  return "locked";
}
function phaseTarget(phase,stages){
  phase=typeof phase==="string"?productionPhase(phase):phase;stages=stages||{};
  if(!phase)return "storyboard";
  const actionable=phase.members.find(id=>!["approved","locked"].includes((stages[id]||{}).state));
  if(actionable)return actionable;
  const open=phase.members.find(id=>(stages[id]||{}).state!=="locked");
  return open||phase.members[0];
}
function sceneMilestonePathHTML(active){
  const stages=currentStages(),activePhase=productionPhase(active);
  const steps=PPHASES;
  const rows=steps.map((step,index)=>{
    const state=phaseState(step,stages),complete=state==="approved",current=activePhase&&step.id===activePhase.id;
    const stateLabel=complete?"Complete":current?"Current":state==="ready"?"Ready":state==="awaiting"?"Review":(["blocked","rejected"].includes(state)?"Needs attention":"Waiting");
    return `<li><button type="button" class="scene-path-step ${complete?"complete":""} ${current?"current":""}" ${current?'aria-current="step"':""} onclick="openPhaseOutcome('${step.id}')">
      <span class="scene-path-number">${index+1}</span><span class="scene-path-label">${_esc(step.name)}</span><span class="scene-path-state">${_esc(stateLabel)}</span>
    </button></li>`;
  }).join("");
  return `<nav class="scene-path" aria-label="Scene creation path"><div class="scene-path-title">Scene path</div><ol class="scene-path-list">${rows}</ol></nav>`;
}

let RATES=null;
async function fetchRates(){if(RATES)return RATES;try{RATES=(await (await fetch(BASE+"/api/rates")).json()).rates||{};}catch(e){RATES={};}return RATES;}
function estCost(op,opts){
  opts=opts||{}; const r=(RATES||{})[op]; if(!r)return null;
  // 2026-07-17 correction: r.usd for seedream5pro_image (0.144) is ALREADY the flat, ref-inclusive
  // rate cb_costs.py's own RATES comment documents ("0.144 assumes the common 3-ref case... as a
  // flat estimate") — the real backend cost function, cb_costs.estimate_image_cost(), returns this
  // rate UNCONDITIONALLY, with no ref-count adjustment at all. This used to add a SECOND
  // (refs-1)*0.0045 surcharge on top, double-counting the 2-extra-ref cost 0.144 already includes
  // (showing ~$0.153 for the standard 3-ref case instead of the real, correct $0.144) — removed so
  // the disclosure modal always matches what actually gets logged.
  if(r.unit=="1000 chars")return (opts.chars||0)/1000*r.usd;
  return r.usd;
}

let PJOBS={};
async function fetchJobsNow(){try{PJOBS=(await (await fetch(BASE+"/api/jobs")).json()).jobs||{};}catch(e){PJOBS={};}return PJOBS;}

// ── relative-time + per-project production stats, for the Projects screen cards ──
function relTime(ts){
  if(!ts)return null;
  const s=Math.max(0,Math.floor((Date.now()-ts*1000)/1000));
  if(s<60)return "just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function _jobGateLabel(gate){
  gate=String(gate||"");
  if(gate=="write")return "Script";
  if(gate=="storyintake")return "Story & Direction";
  if(gate.startsWith("creative"))return "Storyboard";
  if(gate.startsWith("shot"))return "Production";
  return gate||"Activity";
}
// ONE project (the primary, live production) actually runs through the Scene Board's own
// story-order roster + per-scene bundles — reusing sceneRoster/fetchSceneBundle/deriveSceneState
// exactly as the Scene Board does, never a second parallel computation. Any other project (an
// archived reference, or a future non-primary one) has no live pipeline data to honestly show —
// its card says so plainly rather than rendering a fabricated 0%.
async function projectStats(p){
  if(p.archived)return {archived:true};
  if(!p.primary)return {unsupported:true};
  try{
    let episode="Ep1";
    try{
      const episodeIndex=await fetch(BASE+"/"+(p.episodesFile||"cb-studio/data/episodes.json"),{cache:"no-store"}).then(r=>r.json());
      const active=(Array.isArray(episodeIndex)?episodeIndex:[]).filter(e=>e&&e.script).sort((a,b)=>Number(b.number)-Number(a.number))[0];
      if(active)episode="Ep"+Number(active.number);
    }catch(e){}
    const roster=await sceneRoster(episode);
    if(!roster.length){
      const [intake,state]=await Promise.all([
        fetch(BASE+"/api/story-intake-status?episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
        fetch(BASE+"/api/production-state?scene=1&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
        fetchJobsNow(),
      ]);
      const candidate=intake&&intake.candidate||{};
      const running=jobFor("storyintake","-",episode);
      const latest=latestJobFor("storyintake","-",episode);
      if(running){
        return {completion:0,decisions:0,outcome:"working",artwork:null,
                activity:running.step||"Story & Direction is working",
                scenes:(candidate.scenes||[]).length};
      }
      const canonDecisions=state&&state.canonLock&&Array.isArray(state.canonLock.blockers)
        ? state.canonLock.blockers.length : 0;
      if(canonDecisions){
        return {completion:0,decisions:canonDecisions,outcome:"review",artwork:null,
                activity:canonDecisions+" Story & Direction decision"+(canonDecisions==1?"":"s")+" waiting",
                scenes:(candidate.scenes||[]).length};
      }
      if(intake&&intake.hasCandidate&&intake.candidateCurrent&&!intake.canonicalCurrent){
        return {completion:0,decisions:1,outcome:"review",artwork:null,
                activity:"Story & Direction review waiting",
                scenes:(candidate.scenes||[]).length};
      }
      if(intake&&intake.hasScript){
        const needsAttention=latest&&["failed","stopped","interrupted"].includes(latest.status);
        return {completion:0,decisions:0,outcome:"ready",artwork:null,
                activity:needsAttention?(latest.step||"The previous run needs attention"):
                  "Story & Direction is ready to run",
                scenes:(candidate.scenes||[]).length};
      }
      return {empty:true};
    }
    const bundles=await Promise.all(roster.map(r=>fetchSceneBundle(r.scene,episode)));
    await fetchJobsNow();
    let doneStages=0,totalStages=0,decisions=0,artwork=null;
    roster.forEach((r,i)=>{
      const stages=deriveSceneState(bundles[i],true,r.scene);
      const st=sceneCardStatus(stages);
      if(st=="needs-decision"||st=="rejected"||st=="blocked")decisions++;
      // whitelisted to the real stage ids only — deriveSceneState also stashes an internal
      // "_per" array (the shared per-shot computation keyframe/animation/continuity reuse),
      // which Object.values(stages) would otherwise miscount as an extra, always-incomplete
      // "stage" and skew this percentage low.
      PSTAGES.map(p=>p.id).forEach(id=>{const x=stages[id];if(!x)return;totalStages++;if(x.state=="approved")doneStages++;});
      if(!artwork&&r.plate)artwork="/engine/media/"+r.plate;
    });
    const jobs=Object.values(PJOBS).filter(j=>(j.ended||j.started)&&(!Array.isArray(j.args)||j.args.includes(episode))).sort((a,b)=>(b.ended||b.started)-(a.ended||a.started));
    const latest=jobs[0];
    const activity=latest
      ? relTime(latest.ended||latest.started)+" · "+_jobGateLabel(latest.gate)+(latest.scene&&latest.scene!="—"?" · Scene "+latest.scene:"")
      : "No activity yet";
    const completion=totalStages?Math.round(100*doneStages/totalStages):0;
    const outcome=completion===100?"complete":decisions?"review":latest&&latest.status==="running"?"working":"ready";
    return {completion, decisions, outcome, artwork, activity, scenes:roster.length,episode};
  }catch(e){ return {error:true}; }
}
function _jobMatches(j,kind,scene,episode){
  const gateMatch=kind=="write"?String(j.gate)=="write":
    kind=="storyintake"?String(j.gate)=="storyintake":
    kind=="creative"?String(j.gate).startsWith("creative:"):
    String(j.gate).startsWith("shot:");
  const sceneMatch=kind=="write"||kind=="storyintake"||String(j.scene)==String(scene);
  const episodeMatch=!episode||!Array.isArray(j.args)||j.args.includes(String(episode));
  return gateMatch&&sceneMatch&&episodeMatch;
}
function latestJobFor(kind,scene,episode){
  return Object.values(PJOBS).filter(j=>_jobMatches(j,kind,scene,episode))
    .sort((a,b)=>(a.ended||a.started||0)-(b.ended||b.started||0)).pop()||null;
}
function jobFor(kind,scene,episode){
  return Object.values(PJOBS).filter(j=>j.status=="running"&&
    _jobMatches(j,kind,scene,episode))
    .sort((a,b)=>(a.started||0)-(b.started||0)).pop()||null;
}

// ── the scene roster (story order) — reused by the Scene Board and every scene selector ──
// SOURCE OF TRUTH (2026-07-19): the approved beat package (/api/scene-roster), NOT the
// reusable location-asset manifest. /api/loclib stays exactly what it always was — a
// persistent, cross-episode library of signed-off location plates, entirely separate from
// "which scenes exist in this episode." A scene here NEVER carries a plate automatically
// just because a loclib entry happens to share its name — that stays a deliberate, later,
// human selection (never wired here).
let SCENE_ROSTER=null;
async function sceneRoster(episode){
  try{
    const ep=episode||SH_EP||((CUR&&CUR.number)?("Ep"+CUR.number):"Ep1");
    const j=await (await fetch(BASE+"/api/scene-roster?episode="+encodeURIComponent(ep),{cache:"no-store"})).json();
    return (j.scenes||[]).map(s=>({scene:String(s.sceneNumber),
                                     name:s.location?(s.location+(s.time?" — "+s.time:"")):("Scene "+s.sceneNumber),
                                     location:s.location||"",plate:null,beatCount:s.beatCount||0}))
      .sort((a,b)=>(parseInt(a.scene)||0)-(parseInt(b.scene)||0));
  }catch(e){return [];}
}
async function ensureRoster(){if(!SCENE_ROSTER)SCENE_ROSTER=await sceneRoster();return SCENE_ROSTER;}

// ── one scene's full state: storyboard + production package + media, 404-tolerant ──
async function fetchSceneBundle(scene,episode){
  const [sb,pkgR,sl,pf,ps]=await Promise.all([
    fetch(BASE+"/api/storyboard?episode="+encodeURIComponent(episode)+"&scene="+encodeURIComponent(scene),{cache:"no-store"}).then(r=>r.json()).catch(()=>({error:"unreachable"})),
    fetch(BASE+"/api/shot-package?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>({error:"unreachable"})),
    fetch(BASE+"/api/scenelook?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>({status:"none"})),
    fetch(BASE+"/api/production-preflight?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
    fetch(BASE+"/api/production-state?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>null)
  ]);
  return {
    storyboard: sb&&!sb.error?sb:null, storyboardError: (sb&&sb.error)||null,
    pkg: pkgR&&!pkgR.error?pkgR.package:null, media: pkgR&&!pkgR.error?pkgR.media:null,
    pkgFile: pkgR&&!pkgR.error?pkgR.file:null, pkgError: (pkgR&&pkgR.error)||null,
    scenelook: sl||{status:"none"}, preflight:pf,
    productionState: ps&&!ps.error?ps:(pkgR&&!pkgR.error?pkgR.productionState:null),
  };
}

// ── pure status derivation — the ONE place the 7-state vocabulary is computed, reused by
// both the Scene Board (many scenes at once) and the Scene Workspace (the open scene) ──
// ── PER-SHOT PIPELINE STATE (2026-07-18 correction — "the user must never decide manually
// which shots require keyframes"): the ONE place a shot's own Keyframe/Voice/Animation/
// Continuity readiness is computed. Never a scene-wide lock — each shot's own dependency is
// its own IMMEDIATELY PRECEDING shot in shot order (never sourceShotId, which is null for an
// opener; continuityIn is always authored as "what carries in from the shot immediately
// before this one," matching cb_creative.py's own doctrine). sourceType (already mechanically
// derived upstream from transitionType — cb_creative.py's requiresNewKeyframe = is_opener or
// transitionType=="PLANNED_CUT", mapped 1:1 by cb_handover.py) is trusted as the authoritative
// keyframe-need signal; this function never re-reads transitionType or any prose field to

function shotPipelineStateLegacy(shots,i,ledgerFor,media,lineageOk,sceneLookOk,reassessFor,packageRevision){

  const prev=i>0?shots[i-1]:null;
  const prevLed=prev?ledgerFor(prev.shotId):null;
  const prevApproved=!prev||(prevLed&&prevLed.status=="approved");
  const needsKeyframe=(s.sourceType=="opener");
  let kf;   // "ready" | "waitingPrev" | "awaiting" | "approved" | "rejected" | "staleInputs" | "inherited"
  if(needsKeyframe){
    if(led.keyframeApproval&&led.keyframeApproval.approved&&isCurrent(led.keyframeApproval)) kf="approved";
    else if(led.keyframeCandidate&&isCurrent(led.keyframeCandidate)) kf="awaiting";
    else if(led.keyframeRejected) kf="rejected";
    else if(!prevApproved) kf="waitingPrev";
    else kf="ready";
  } else {
    kf = prevApproved ? "inherited" : "waitingPrev";
  }
  // DIRECT-INPUT LINEAGE (2026-07-18 production-safety directive, items 3/4/6): an existing
  // approved/awaiting keyframe is checked against its OWN recorded input signature — its own
  // card hash, the approved Scene Look hash, its own reference hashes, the compiled brief,
  // model/settings — never the whole storyboard/package md5. An unrelated shot's edit (e.g.
  // S1.SH6) never reaches here at all, because reassessFor only ever reports THIS shot's own
  // comparison. reassessFor is optional (defaults to reporting nothing) so callers that
  // haven't fetched reassessment data (the Scene Board's cross-scene aggregate, today) simply
  // fall back to the ledger-only kf value above, never a crash.
  const reassess = (reassessFor ? reassessFor(s.shotId) : null) || null;
  if((kf=="approved"||kf=="awaiting") && reassess && reassess.verdict=="regenerate"){
    kf = "staleInputs";
  }
  // SCENE LOOK GATE (2026-07-18, Julian's directive): checked BEFORE anything else — Scene
  // Look sits upstream of the whole Shot Production stage in the pipeline order (Storyboard
  // -> Scene Look -> Shot Production), so a not-current-approved plate holds EVERY shot here,
  // including one whose OWN keyframe was already approved before this gate existed (S1.SH1) —
  // the underlying approval fact is never erased, only its downstream readiness is held.
  const sceneLookGated = sceneLookOk===false;
  const keyframeSatisfied = needsKeyframe ? kf=="approved" : kf=="inherited";
  // A script line can be a non-verbal performance event (snore, sneeze, laugh, etc.).
  // Only routed spoken dialogue requires an ElevenLabs approval before WATCH.
  const talky=routeShotAudio(s).spokenDialogue.length>0;
  // 2026-07-19: voiceOk means APPROVED, not merely generated — matching keyframe's own
  // "a generated-but-unapproved candidate is never a valid anchor" rule (the voice approval
  // step, cb_render.approve_voice/reject_voice).
  const voiceOk=!talky||!!(led.voiceApproval&&led.voiceApproval.approved&&isCurrent(led.voiceApproval));
  const animationCurrent=led.status=="approved"&&isCurrent(led.approval);
  const batchCurrent=led.status=="candidates-pending"&&isCurrent((led.batch||{}).disclosure||led.disclosure);
  const animState=animationCurrent?"approved":(batchCurrent?"candidates-pending":(led.status=="model-limited"?"model-limited":"designed"));
  // (2026-07-18 correction): lineageOk (whole-package/storyboard md5 match) is PROVENANCE
  // EVIDENCE ONLY now, surfaced in Technical Details — it no longer gates readiness at all.
  // A package rebuild triggered by an unrelated shot's edit must never block THIS shot's own
  // already-valid, already-approved keyframe from proceeding to animation.
  const readyToAnimate=keyframeSatisfied&&voiceOk&&!sceneLookGated;
  let label,sub=null,badgeState="ready";
  if(kf=="staleInputs"){
    label="Direct inputs changed — regenerate";
    sub=(reassess.changed||[]).length?`changed: ${reassess.changed.join(", ")}`:"this shot's own inputs no longer match its existing candidate";
    badgeState="blocked";
  } else if(sceneLookGated){
    label="Waiting for the scene world";
    sub=(led.keyframeApproval&&led.keyframeApproval.approved)
        ?"this shot's own keyframe predates the current scene world and is held until that world is rebuilt"
        :"the environment, palette and lighting anchor must be built first";
    badgeState="locked";
  } else if(kf=="waitingPrev"){
    // (2026-07-18) label names the specific predecessor shot by ID, per Julian's own
    // "make the opening-frame source unmistakable" instruction — never a generic "previous".
    label=prev?`Waiting for ${prev.shotId} final frame`:"Waiting for previous final frame";
    sub=prev?`waiting on ${prev.shotId}'s animation to be approved`:null; badgeState="locked";
  } else if(needsKeyframe&&(kf=="ready"||kf=="rejected")){
    // (2026-07-18) cost read live from the fetched RATES table (never hardcoded) so this
    // label can never silently drift from cb_costs.py's own real, authoritative rate.
    { const kr=(RATES||{})["seedream5pro_image"];
      label="New keyframe required"+(kr?` — estimated cost $${kr.usd}`:""); }
    if(kf=="rejected") sub="rejected — ready to regenerate"; badgeState="ready";
  } else if(needsKeyframe&&kf=="awaiting"){
    label="Keyframe awaiting your decision"; badgeState="awaiting";
  } else if(!keyframeSatisfied){
    // kf=="inherited" or "approved" already covers keyframeSatisfied==true, so this branch
    // is unreachable in practice — kept as an explicit, honest fallback, never a silent guess.
    label=needsKeyframe?"Keyframe awaiting your decision":(prev?`Waiting for ${prev.shotId} final frame`:"Waiting for previous final frame"); badgeState="locked";
  } else if(!voiceOk){
    label=needsKeyframe?"Keyframe approved":"Opening frame inherited — no generation and no cost"; sub="awaiting this shot's voice"; badgeState="ready";
  } else if(animState=="designed"){
    label="Ready to animate"; badgeState="ready";
  } else if(animState=="candidates-pending"){
    label="Animation awaiting your decision"; badgeState="awaiting";
  } else if(animState=="model-limited"){
    label="Animation blocked"; sub="needs human redesign"; badgeState="blocked";
  } else {   // animState=="approved"
    // CONTINUITY (2026-07-18, honestly scoped): mechanically inferred from Animation approval
    // — there is no separate persisted human continuity sign-off in this pipeline today (the
    // existing Continuity screen is a report, not a decision). "Complete" is shown once this
    // shot's own Animation is approved, since that is the one real, persisted fact available;
    // a genuine per-join human check-off (using that same outgoing/incoming frame comparison)
    // would be a small, separate follow-on feature, not invented here.
    label="Complete"; badgeState="approved";

}
function deriveSceneStateLegacy(bundle,scriptApproved,scene){
  const running=kind=>jobFor(kind,scene);
  const out={};
  out.script = running("write") ? {state:"generating"} : {state: scriptApproved?"approved":"ready"};
  if(out.script.state!="approved"){ out.storyboard={state:"locked"}; }
  else if(running("creative")){ out.storyboard={state:"generating"}; }
  else if(!bundle.storyboard){
    const latest=latestJobFor("creative",scene,SH_EP);
    out.storyboard=latest&&["failed","stopped","interrupted"].includes(latest.status)
      ?{state:"blocked",sub:latest.step||"Scene direction stopped on a production protection"}
      :{state:"ready",sub:"direct the scene from the current script"};

    const st=bundle.storyboard.approvalState||"";

  const ledgerFor=id=>ledger.find(e=>e.shotId==id)||{};

  // Production. Establishes environment/location identity, world scale, palette, materials/

  // composition, camera position, character pose or movement (those stay owned by each
  // approved storyboard shot). Never inferred from the plate file's mere existence — a real
  // human decision (approve or reject) is what the "awaiting"->"approved"/"rejected"
  // transition actually records.
  if(out.storyboard.state!="approved"){ out.scenelook={state:"locked"}; }
  else if(running("shot")){ out.scenelook={state:"generating"}; }
  else{
    const sl=bundle.scenelook||{status:"none"};
    if(sl.status=="none") out.scenelook={state:"ready", sub:"no plate yet"};
    else if(sl.status=="awaiting") out.scenelook={state:"awaiting", sub:"a plate is awaiting your decision"};
    else if(sl.status=="approved") out.scenelook={state:"approved", sub:"approved · current"};
    else if(sl.status=="stale") out.scenelook={state:"awaiting", sub:"approved once, but the storyboard has changed since — re-approve or regenerate"};
    else if(sl.status=="rejected") out.scenelook={state:"rejected", sub:sl.rejectedNote||"rejected — ready to regenerate"};
