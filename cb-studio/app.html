  const sceneLookOk = out.scenelook.state=="approved";
  // KEYFRAME — THE STATE-INTEGRITY CHECKPOINT (2026-07-17), CORRECTED 2026-07-18 (direct-
  // input lineage): derived from the ledger's own keyframeCandidate/keyframeApproval/
  // keyframeRejected fields (never from whether a file happens to exist at a shot's
  // conventional media path) PLUS, for the currently-open scene, each shot's own direct-
  // input reassessment. Package/storyboard lineage (whole-md5 match) is NO LONGER a
  // blocking gate here — an edit to ONE shot (S1.SH6) used to read as "Production package
  // belongs to a superseded storyboard version" and block EVERY shot in the scene,
  // including ones whose own inputs never changed (S1.SH1). Lineage is still surfaced as
  // provenance in Technical Details, never as a reason nothing can proceed.
  if(out.storyboard.state!="approved"){ out.keyframe={state:"locked"}; }
  else if(running("shot")){ out.keyframe={state:"generating"}; }
  else if(!bundle.pkg){ out.keyframe={state:"blocked", sub:"Approve the storyboard to hand it to production"}; }
  else{
    // PER-SHOT GATING (2026-07-18 correction): "Keyframes"/"Voice"/"Animation"/"Continuity"
    // are now PRODUCTION SUMMARIES, never scene-wide locks — the whole stage stays reachable
    // the instant the storyboard is approved; each shot's own generate/approve action is
    // gated by shotPipelineState alone (see renderShotStage), never by every other shot in
    // the scene. A shot never needs to wait for every OTHER shot in the scene — only its own

    const lineageOk=!!(bundle.media&&bundle.media.lineage&&bundle.media.lineage.current);
    // reassessFor is only meaningful for the scene currently open in the Shot Production

    // roster/Scene-Board pass simply reports nothing to reassess yet (falls back to plain
    // ledger state), never a false "blocked".
    const reassessFor = (scene==SH_SC) ? shReassess : (()=>null);
    const per=shots.map((s,i)=>shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,reassessFor,bundle.pkg&&bundle.pkg.revision));
    const openerN=per.filter(p=>p.needsKeyframe).length;
    const kfApprovedN=per.filter(p=>p.needsKeyframe&&p.kf=="approved").length;
    const kfAwaitingN=per.filter(p=>p.needsKeyframe&&p.kf=="awaiting").length;
    const kfStaleN=per.filter(p=>p.needsKeyframe&&p.kf=="staleInputs").length;
    const kfWaitingN=openerN-kfApprovedN-kfAwaitingN-kfStaleN;
    if(!openerN) out.keyframe={state: shots.length?"approved":"ready", sub:"no shot in this scene needs its own keyframe"};
    else if(kfStaleN>0) out.keyframe={state:"awaiting", sub:kfApprovedN+" approved · "+kfStaleN+" need regeneration (direct inputs changed)"};
    else if(kfApprovedN==openerN) out.keyframe={state:"approved", sub:kfApprovedN+" of "+openerN+" approved"};
    else if(kfAwaitingN>0) out.keyframe={state:"awaiting", sub:kfApprovedN+" approved · "+kfAwaitingN+" awaiting your decision"};
    else out.keyframe={state:"ready", sub:kfApprovedN+" approved · "+kfWaitingN+" waiting"};
    out._per=per;   // shared per-shot computation, reused below for voice/animation/continuity
  }
  // VOICE — reachable as soon as the storyboard is approved; NEVER gated on every keyframe
  // being approved first (the prior bug this correction closes). Summary counts talky shots.
  // CORRECTED 2026-07-18: "done" used to mean "a voice file happens to exist"
  // ((media[s.shotId]||{}).vo) — the same file-existence-vs-approval conflation already
  // fixed in shotPipelineState's voiceOk. A generated-but-unapproved take was silently
  // counted as "approved" in this very card. Now mirrors the keyframe/animation summaries
  // just above/below: counts only shots whose ledger actually carries voiceApproval.approved.
  if(out.storyboard.state!="approved"){ out.voice={state:"locked"}; }
  else if(running("shot")){ out.voice={state:"generating"}; }
  else{
    const talky=shots.filter(s=>(s.dialogueLines||[]).length);
    const done=talky.filter(s=>{const led=ledgerFor(s.shotId); return !!(led.voiceApproval&&led.voiceApproval.approved&&led.voiceApproval.packageRevision===(bundle.pkg&&bundle.pkg.revision));}).length;
    const generatedN=talky.filter(s=>(media[s.shotId]||{}).vo).length;
    const timingCurrent=!!(bundle.media&&bundle.media.timingSlateCurrent);
    const timingApproved=!!(bundle.media&&bundle.media.timingSlateApproved);
    if(!talky.length) out.voice=timingApproved
      ?{state:"approved", sub:"Silent timing slate rhythm approved"}
      :{state:"ready", sub:"Build the silent scene timing slate"};
    else if(done==talky.length&&timingApproved) out.voice={state:"approved", sub:done+" of "+talky.length+" approved · rhythm approved"};
    else if(done==talky.length) out.voice={state:"ready", sub:"Performances approved · build or refresh timing slate"};
    else if(generatedN>0) out.voice={state:"ready", sub:done+" of "+talky.length+" approved · "+generatedN+" awaiting your decision"};
    else out.voice={state:"ready", sub:"0 of "+talky.length+" generated"};
  }
  // ANIMATION — reachable as soon as the storyboard is approved; unlocks INDEPENDENTLY per
  // shot the moment THAT shot has an approved keyframe/inherited frame + its own voice (if
  // any) + current lineage — never gated on every other shot's keyframe or voice first.
  if(out.storyboard.state!="approved"){ out.animation={state:"locked"}; }
  else if(running("shot")){ out.animation={state:"generating"}; }
  else if(!ledger.length){ out.animation={state:"ready"}; }
  else{
    const lineageOk=!!((bundle.media&&bundle.media.lineage&&bundle.media.lineage.current));
    const per=out._per||shots.map((s,i)=>shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,null,bundle.pkg&&bundle.pkg.revision));
    const total=ledger.length;
    const approvedN=ledger.filter(e=>e.status=="approved"&&e.approval&&e.approval.packageRevision===(bundle.pkg&&bundle.pkg.revision)).length;
    const blockedN=ledger.filter(e=>e.status=="model-limited").length;
    const pendingN=ledger.filter(e=>e.status=="candidates-pending"&&(((e.batch||{}).disclosure||e.disclosure||{}).packageRevision)===(bundle.pkg&&bundle.pkg.revision)).length;
    const readyN=per.filter(p=>p.readyToAnimate&&p.animState=="designed").length;
    if(blockedN>0) out.animation={state:"blocked", sub:blockedN+" shot"+(blockedN>1?"s":"")+" need human redesign"};
    else if(pendingN>0) out.animation={state:"awaiting", sub:approvedN+" of "+total+" approved · "+pendingN+" awaiting your decision"};
    else if(approvedN==total) out.animation={state:"approved", sub:total+" of "+total+" approved"};
    // NEVER "locked" here — that value disables navigation entirely (pFocusStage/
    // renderWorkspaceBody both hard-stop on it). "0 ready" is an honest SUMMARY, not a gate;
    // the per-shot screen (shotPipelineState) is what actually tells each shot why it's
    // waiting, and remains reachable regardless of what this aggregate says.
    else out.animation={state:"ready", sub:approvedN+" approved · "+readyN+" ready · "+(total-approvedN-readyN)+" waiting"};
  }
  // CONTINUITY — a real review screen exists (outgoing frame vs next incoming frame); per-shot
  // "complete" is mechanically inferred from that shot's own Animation approval (see
  // shotPipelineState's own comment — no separate persisted continuity sign-off exists today).
  {
    const lineageOk=!!((bundle.media&&bundle.media.lineage&&bundle.media.lineage.current));
    const per=out._per||shots.map((s,i)=>shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,null,bundle.pkg&&bundle.pkg.revision));
    const total=shots.length;
    const completeN=per.filter(p=>p.label=="Complete").length;
    if(out.storyboard.state!="approved") out.continuity={state:"locked"};
    else if(!total) out.continuity={state:"ready", sub:"0 complete"};
    else out.continuity={state: completeN==total?"approved":"ready", sub:completeN+" of "+total+" complete"};

  else if(running("shot")){ out.final={state:"generating"}; }
  else if(bundle.media&&bundle.media.picture){ out.final={state:"approved"}; }
  else{ out.final={state:"ready"}; }
  return out;
}
function shotPipelineState(shots,i){
  const sid=((shots||[])[i]||{}).shotId;
  const state=(currentBundle().productionState||{}).shots||[];
  return state.find(row=>row.shotId===sid)||{
    shotId:sid,needsKeyframe:false,kf:"ready",keyframeSatisfied:false,talky:false,
    voiceOk:false,animState:"designed",readyToAnimate:false,
    label:"Production state unavailable",sub:"Refresh the scene state",badgeState:"blocked",
    sceneLookGated:true,current:{},pending:{},allowedActions:{}
  };
}
function deriveSceneState(bundle,scriptApproved,scene){
  const policy=bundle&&bundle.productionState;
  if(!policy||!policy.stages){
    // The signed storyboard and approval ledger remain enough to display the current
    // human decision when the read-only state summary is temporarily unavailable.
    // Every mutation still goes through the protected backend approval endpoints.
    return deriveSceneStateLegacy(bundle,scriptApproved,scene);
  }
  const out={};
  PSTAGES.forEach(stage=>{out[stage.id]=Object.assign({},policy.stages[stage.id]||{
    state:"blocked",sub:"No authoritative state returned for this stage"});});
  out._per=(policy.shots||[]).map(row=>Object.assign({},row));

  const writeJob=jobFor("write",scene), creativeJob=jobFor("creative",scene);
  if(writeJob)out.script={state:"generating"};
  if(creativeJob)out.storyboard={state:"generating",sub:sceneDirectionJobStep(creativeJob)};
  else if(!(bundle&&bundle.storyboard)){
    const latestCreative=latestJobFor("creative",scene,SH_EP);
    if(latestCreative&&["failed","stopped","interrupted"].includes(latestCreative.status)){
      out.storyboard={state:"blocked",sub:sceneDirectionJobStep(latestCreative)};
    }
  }
  const shotJob=jobFor("shot",scene);
  if(shotJob){
    const cmd=String(shotJob.gate||"").split(":")[1]||"";
    const target=(
      ["scenelook","approve-scenelook","reject-scenelook",
       "select-scenelook-upload","select-scenelook-library"].includes(cmd)?"scenelook":
      ["voice","voice-shot","regen-voice","approve-voice","reject-voice","animatic"].includes(cmd)?"voice":
      ["keyframe","approve-keyframe","rescreen-keyframe","reject-keyframe",
       "select-upload","select-library","select-previous"].includes(cmd)?"keyframe":
      cmd=="stitch"?"final":"animation"
    );
    out[target]={state:"generating",sub:out[target]&&out[target].sub};
  }
  return out;
}
function nextReadyStage(stages){
  for(const s of PSTAGES) if(stages[s.id].state!="locked"&&stages[s.id].state!="approved") return s.id;
  return "final";
}
function sceneCardStatus(stages){
  const vals=Object.values(stages).map(s=>s.state);
  if(vals.some(v=>v=="blocked")) return "blocked";
  if(vals.some(v=>v=="generating")) return "generating";
  if(vals.some(v=>v=="rejected")) return "rejected";
  if(stages.final.state=="approved") return "complete";
  if(vals.some(v=>v=="awaiting")) return "needs-decision";
  return "ready";
}
function badge(state,sub){
  return `<span class="stbadge" style="color:var(${STATE_COLOR[state]});background:var(${STATE_BG[state]})">${STATE_GLYPH[state]} ${_esc(STATE_LABEL[state])}</span>`+(sub?`<span class="badgesub">${_esc(sub)}</span>`:"");
}

// ═══════════════════════════════════════════════════════════════════════════════════════
// THE SCENE BOARD — the episode's production command centre. Scenes in script order;
// every scene keeps its own pipeline state; one scene never blocks another.
// ═══════════════════════════════════════════════════════════════════════════════════════
let BOARD_SCENES=null, BOARD_FILTER="all", BOARD_LOADING=false, SB_BOARD_POLL=null;
async function renderSceneBoard(){
  const view=document.getElementById("view");
  view.innerHTML=`${projectScreenHeaderHTML({eyebrow:`${(CURRENT_PROJECT&&CURRENT_PROJECT.name)||"Production"} · Episode ${(CUR&&CUR.number)||""}`,title:(CUR&&CUR.title)||("Episode "+(CUR&&CUR.number)),subtitle:"Scene production in script order.",art:(CUR&&CUR.coverImage)||(CURRENT_PROJECT&&(CURRENT_PROJECT.episodeCoverImage||CURRENT_PROJECT.coverImage))})}
    <div id="boardbody" class="coming">Loading scenes…</div>`;

}
async function loadBoard(){
  if(BOARD_LOADING)return; BOARD_LOADING=true;
  try{
    const roster=await sceneRoster(); SCENE_ROSTER=roster;
    const scriptApproved=!!(CUR&&CUR.script);
    await fetchJobsNow();
    if(jobFor("storyintake","-",SH_EP||((CUR&&CUR.number)?("Ep"+CUR.number):"Ep1")))_sbStoryPollStart();
    const bundles=await Promise.all(roster.map(r=>fetchSceneBundle(r.scene,SH_EP)));
    BOARD_SCENES=roster.map((r,i)=>{
      const bundle=bundles[i];
      const stages=deriveSceneState(bundle,scriptApproved,r.scene);
      const media=(bundle.media&&bundle.media.shots)||{};
      const shots=(bundle.pkg&&bundle.pkg.shots)||[];
      let latestFrame=null;
      for(const s of shots){ const m=media[s.shotId]; if(m&&(m.finalFrame||m.keyframe)) latestFrame=m.finalFrame||m.keyframe; }
      if(!latestFrame&&r.plate) latestFrame="/engine/media/"+r.plate;
      return Object.assign({},r,{bundle,stages,latestFrame,status:sceneCardStatus(stages)});
    });
  }finally{ BOARD_LOADING=false; }
}

function sceneDirectionJobStep(job){

  if(low.includes("insufficient_quota")||low.includes("no credits remaining"))return "Director paused — OpenAI text credits required";
  if(low.includes("canon envelope"))return "Checking canon and scene continuity…";
  if(low.includes("heart contract"))return "Story Director — shaping emotional purpose…";
  if(low.includes("gate 1"))return "Director and Cinematographer — exploring treatments…";
  if(low.includes("gate 2"))return "Showrunner — selecting the strongest treatment…";
  if(low.includes("gate 4")||low.includes("packing production units"))return "Cinematic Shot Director — packing production units…";
  if(low.includes("gate 6"))return "Showrunner — challenging the complete scene direction…";

function storyReferenceCheckHTML(state,intake){

async function loadStoryReferenceCheck(force,requestedShot){
  if(STORY_REF_LOADING)return;
  const previous=STORY_REF_CHECK||{};
  if(!force&&previous.references)return;
  const seq=++STORY_REF_SEQ;
  const episode=SH_EP||((CUR&&CUR.number)?("Ep"+CUR.number):"Ep1");
  STORY_REF_LOADING=true;
  STORY_REF_CHECK=Object.assign({},previous,{loading:true,error:null});
  if(page==="sceneboard"&&(!BOARD_SCENES||!BOARD_SCENES.length))renderBoardBody();
  try{
    let shotIds=Array.isArray(previous.shotIds)?previous.shotIds.slice():[];
    if(!shotIds.length){
      const packageResponse=await fetch(BASE+"/api/shot-package?scene=1&episode="+encodeURIComponent(episode),{cache:"no-store"});
      const packageData=await packageResponse.json();
      if(!packageResponse.ok)throw new Error(packageData.error||"The carried Scene 1 package is unavailable.");
      shotIds=((packageData.package||{}).shots||[]).map(shot=>String(shot.shotId||"")).filter(Boolean);
    }
    if(!shotIds.length)throw new Error("The carried Scene 1 package has no shots to inspect.");
    const shotId=shotIds.includes(requestedShot)?requestedShot:(shotIds.includes(previous.shotId)?previous.shotId:shotIds[0]);
    const referenceResponse=await fetch(BASE+"/api/shot-references?scene=1&shotId="+encodeURIComponent(shotId)+"&episode="+encodeURIComponent(episode),{cache:"no-store"});
    const references=await referenceResponse.json();
    if(!referenceResponse.ok)throw new Error(references.error||"References are unavailable.");
    if(seq!==STORY_REF_SEQ)return;
    STORY_REF_CHECK={loading:false,episode,scene:"1",shotIds,shotId,references};
  }catch(error){
    if(seq!==STORY_REF_SEQ)return;
    STORY_REF_CHECK=Object.assign({},previous,{loading:false,error:error.message||"References are unavailable."});
  }finally{
    if(seq===STORY_REF_SEQ)STORY_REF_LOADING=false;
  }
  if(seq===STORY_REF_SEQ&&page==="sceneboard"&&(!BOARD_SCENES||!BOARD_SCENES.length))renderBoardBody();
}

function boardKeyframeUploadTarget(scene){
  const bundle=scene&&scene.bundle||{},pkg=bundle.pkg||{};
  const ledgers=new Map((pkg.continuityLedger||[]).map(row=>[row.shotId,row]));
  return (pkg.shots||[]).find(shot=>{
    const ledger=ledgers.get(shot.shotId)||{};
    return shot.sourceType==="opener"&&!ledger.keyframeCandidate&&
      !(ledger.keyframeApproval&&ledger.keyframeApproval.approved);
  })||null;
}

function prerequisiteStage(id){
  const idx=PSTAGES.findIndex(s=>s.id===id);
  for(let i=idx-1;i>=0;i--){const st=pStatus(PSTAGES[i].id);if(st!=="approved"&&st!=="locked")return PSTAGES[i].id;}
  return idx>1?PSTAGES[idx-1].id:"storyboard";
}
function defaultDecisionAction(){
  const current=pFocusedStage(), state=pStatus(current), idx=PSTAGES.findIndex(s=>s.id===current);
  if(current==="final"&&state==="approved")return {label:"Back to all scenes",onclick:"backToBoard()",kind:"secondary"};
  if(state==="blocked"||state==="rejected"){
    const target=prerequisiteStage(current), name=(PSTAGES.find(s=>s.id===target)||{}).name||"required step";
    if(target===current)return {label:"Open episode outcome",onclick:"backToBoard()"};
    return {label:"Resolve in "+name,onclick:`openStageOutcome('${target}')`};
  }
  for(let i=idx+1;i<PSTAGES.length;i++){
    const target=PSTAGES[i];if(pStatus(target.id)!=="locked")return {label:"Continue to "+target.name,onclick:`openStageOutcome('${target.id}')`};
  }
  const active=pActiveStage(), name=(PSTAGES.find(s=>s.id===active)||{}).name||"production";
  if(active===current)return {label:"Back to all scenes",onclick:"backToBoard()",kind:"secondary"};
  return {label:"Open "+name,onclick:`openStageOutcome('${active}')`};
}

async function continueToNextProductionShot(){
  const shots=pShots(),nextIndex=PSHOT_I+1;
  if(nextIndex>=shots.length){openStageOutcome("continuity");return;}
  const next=shots[nextIndex],policy=shotPipelineState(shots,nextIndex);
  const current=policy.current||{};
  if(policy.needsKeyframe&&!current.keyframe){
    // The next shot's SEE brief must be current before its opening candidate is installed.
    // Keep this as one reviewer action: quietly prepare Cinematography, inherit the
    // preceding approved landing frame when needed, then stop on SEE for approval.
    await prepareDirectionThen("cinematography",next.shotId,async()=>{
      const refreshed=shLedger(next.shotId);
      const candidate=refreshed.keyframeCandidate;
      if(candidate){
        if(!candidate.inputSignature||!candidate.contentHash){
          shRun("rescreen-keyframe",next.shotId,{afterJob:job=>{
            if(job&&job.status==="done")openShotOutcome("keyframe",nextIndex);
          }});
        }else openShotOutcome("keyframe",nextIndex);
        return;
      }
      shRun("select-previous",next.shotId,{afterJob:job=>{
        if(job&&job.status==="done")openShotOutcome("keyframe",nextIndex);
      }});
    });
    return;
  }
  if(policy.talky&&!current.voice){openShotOutcome("voice",nextIndex);return;}
  openShotOutcome("animation",nextIndex);
}

function shotResolutionAction(pst,tok){
  const current=(pst&&pst.current)||{};
  if(!pst||pst.label==="Production state unavailable")return {label:"Refresh scene state",onclick:"renderControl()"};
  if(pst.sceneLookGated)return {label:"Open Look Development",onclick:"openStageOutcome('scenelook')"};
  if(pst.kf==="waitingPrev")return {label:"Resolve the previous shot",onclick:"openPreviousShotOutcome('animation')"};
  if(pst.kf==="stageBlocked")return {label:"Return to See and correct the keyframe",onclick:"openShotOutcome('keyframe',PSHOT_I)"};
  if(pst.needsKeyframe&&!current.keyframe)return {label:"Open Cinematography",onclick:"openStageOutcome('keyframe')"};
  if(pst.talky&&!current.voice)return {label:"Open Voice & Timing",onclick:"openStageOutcome('voice')"};
  if(!current.animationDirection){
    return {label:"Fire animation",onclick:`shRender('${tok}')`};
  }
  if(["model-limited","stale","stale-batch"].includes(pst.animState)){
    return {label:"Prepare replacement Animation direction",onclick:`deptRun('animation','${tok}')`};
  }
  return {label:"Refresh this shot",onclick:"renderControl()"};
}

function needsEpisodeStoryDirection(){
  const codes=((SH_STATE&&SH_STATE.lineage&&SH_STATE.lineage.reasonCodes)||[]).map(String);
  const blockers=(SH_STATE&&SH_STATE.blockers)||[];
  return codes.includes("story-intake-not-approved")||
    blockers.some(x=>x&&x.code==="STORY_INTAKE_APPROVAL_REQUIRED");
}

function corridorPhaseState(phase,stages){
  const aggregate=phaseState(phase,stages);
  if(phase.id==="direction")return aggregate;
  const shot=(pShots()[PSHOT_I]||{}),policy=((SH_STATE&&SH_STATE.shots)||[]).find(row=>row.shotId===shot.shotId);
  if(!policy)return aggregate;
  const current=policy.current||{},pending=policy.pending||{};
  if(phase.id==="see"){
    if(current.keyframe&&SH_STATE&&SH_STATE.sceneLook&&SH_STATE.sceneLook.current)return "approved";
    if(pending.keyframe)return "awaiting";
  }
  if(phase.id==="hear"){
    if(!policy.talky||current.voice)return "approved";
    if(pending.voice)return "awaiting";
  }
  if(phase.id==="watch"){
    if(current.animation)return "approved";
    if(pending.animation||policy.animState==="candidates-pending")return "awaiting";
    if(activeWatchJob(shot.shotId)||durableWatchJob(shLedger(shot.shotId)))return "generating";
  }
  return aggregate;
}

function renderStageRail(){
  const stages=currentStages();
  const focused=pFocusedStage();
  const focusedPhase=productionPhase(focused);
  const parts=[];
  PPHASES.forEach((phase,i)=>{
    // Downstream phases are waiting, not failing, while the shared script is unapproved.
    // Showing four warning states makes a clean production dependency look like four errors.
    const st=phase.id!=="direction"&&pStatus("script")!=="approved"?"locked":corridorPhaseState(phase,stages);
    const cls=[st=="locked"?"locked":"", st=="approved"?"done":"", (st=="rejected"||st=="blocked")?"rejected":"",
               focusedPhase&&focusedPhase.id===phase.id?"active":""].filter(Boolean).join(" ");
    parts.push(`<button type="button" class="pstage ${cls}" onclick="openPhaseOutcome('${phase.id}')" title="${_esc(STATE_LABEL[st])}">
      <div class="pglyph">${STATE_GLYPH[st]}</div><div class="pname">${_esc(phase.name)}</div>
      <div class="pstate" style="color:var(${STATE_COLOR[st]})">${_esc(STATE_LABEL[st])}</div>
    </button>`);
    if(i<PPHASES.length-1){ parts.push(`<div class="pconn ${st=="approved"?'fill':''}"></div>`); }
  });
  const completed=PPHASES.filter(phase=>phase.id!=="direction"&&pStatus("script")!=="approved"?false:corridorPhaseState(phase,stages)==="approved").length;
  const currentName=(focusedPhase||{}).name||((PSTAGES.find(stage=>stage.id===focused)||{}).name||"Production");
  const progress=Math.round((completed/Math.max(1,PPHASES.length))*100);
  return `<details class="praildetails" open><summary aria-label="Production workflow">
      <span class="prailsummary-label">Production progress</span>
      <span class="prailsummary-state">Current: ${_esc(currentName)} · ${completed}/${PPHASES.length} complete</span>
      <span class="prailchevron" aria-hidden="true">⌄</span>
      <span class="prailbar" aria-hidden="true"><i style="width:${progress}%"></i></span>
    </summary><div class="prail">${parts.join("")}</div></details>`;
}

function renderPreflightBanner(){
  const el=document.getElementById("readiness");if(!el)return;
  if(SH_AGENT&&!SH_AGENT.error){el.innerHTML="";return;}
  const p=SH_PREFLIGHT;if(!p||p.error){el.innerHTML="";return;}
  if(p.ok){el.innerHTML=`<div style="border:1px solid var(--ok);background:var(--okbg);border-radius:8px;padding:10px 12px;margin-bottom:12px;color:var(--ok)">✓ Production preflight passed — all known inputs are current. ${_esc(p.nextAction||"")}</div>`;return;}
  const blockers=p.blockers||[], first=blockers[0]||{};
  const target=first.stage||pActiveStage(),configuration=target==="configuration";
  const expected=new Set(["LOOK_DIRECTION_NOT_CURRENT","SCENE_LOOK_NOT_CURRENT","CINEMATOGRAPHY_NOT_CURRENT","KEYFRAME_NOT_CURRENT","VOICE_DIRECTION_NOT_CURRENT","VOICE_TAKE_NOT_CURRENT","ANIMATION_DIRECTION_NOT_CURRENT","ANIMATION_TAKE_NOT_CURRENT"]);

  // PSHOT_I mutations generally) — the same "one shared call site" convention renderTop()
  // already uses for project/episode/scene and pFocusStage() uses for the stage tab. Called
  // early, unconditionally, so it still fires even on this function's own early returns below.

  if(pStatus(stage)=="locked"){
    const action=defaultDecisionAction();
    el.innerHTML=`<div class="wcol wcol-full">${outcomePanelHTML({tone:"blocked",title:"A previous decision is required",body:"This stage remains protected until its prerequisite has an explicit outcome.",actions:[action,{label:"All scenes",onclick:"backToBoard()",kind:"secondary"}]})}</div>`;

  }

    el.innerHTML=SH_AGENT&&!SH_AGENT.error&&!SH_AGENT.loading?"":`<div class="wcol wcol-full">${storyboardStartOutcomeHTML()}</div>`;

let DIRECTOR_CHAT_OPEN_KEY=null,DIRECTOR_CHAT_OPEN_SCOPE=null,DIRECTOR_CHAT_CACHE={},DIRECTOR_CHAT_DRAFTS={};
function directorChatScope(stageOverride,shotOverride){
  if(stageOverride===undefined&&shotOverride===undefined&&DIRECTOR_CHAT_OPEN_SCOPE)return DIRECTOR_CHAT_OPEN_SCOPE;
  const stage=stageOverride||pFocusedStage()||"storyboard";
  const shot=(pShots()[PSHOT_I]||{}).shotId||null;
  return {episode:SH_EP,scene:String(SH_SC),shotId:shotOverride===undefined?shot:shotOverride,stage};
}
function directorChatKey(scope){return [scope.episode,scope.scene,scope.shotId||"scene",scope.stage].join("|");}
function directorChatHTML(){
  const scope=directorChatScope(),key=directorChatKey(scope),open=DIRECTOR_CHAT_OPEN_KEY===key;
  if(!open)return `<button type="button" class="btn director-chat-launch" onclick="openDirectorAgent()">✦ Ask Director</button>`;
  const data=DIRECTOR_CHAT_CACHE[key]||{loading:true,messages:[]};
  const messages=(data.messages||[]).map(item=>`<div class="director-message ${item.role==="user"?"user":"director"}">${_esc(item.text||"")}</div>`).join("");
  const latest=[...(data.messages||[])].reverse().find(item=>item.role==="director"&&item.readyToApply&&item.correction);
  const applying=!!data.applying;
  const applyLabel=applying?"Applying correction…":scope.stage==="animation-edit"?"Prepare targeted edit · review cost":scope.stage==="animation-refire"?"Prepare full-take refire · no render":scope.stage==="animation"?"Apply to working prompt · no render":scope.stage==="keyframe"?"Apply to next keyframe revision":"Apply to next revision and return";
  return `<div class="director-chat-backdrop" onclick="closeDirectorAgent()" aria-hidden="true"></div><section class="director-chat" role="dialog" aria-modal="true" aria-label="Director conversation">
    <div class="director-chat-head"><div><div class="director-chat-title">Director</div><div class="director-chat-meta">${_esc(data.model||"small-context OpenAI")} · ${_esc(scope.shotId||"scene")}</div></div><button type="button" class="media-expand" aria-label="Close Director" title="Close Director" onclick="closeDirectorAgent()">×</button></div>
    <div class="director-chat-log">${messages||(!data.loading?`<div class="director-message director">What is not landing?</div>`:"")}${data.loading?`<div class="director-thinking"><span class="stage-spinner" aria-hidden="true"></span>${messages?"Director is thinking…":"Opening the conversation…"}</div>`:""}</div>
    ${latest?`<div class="director-correction">${latest.changeSummary?`<b>What will visibly change</b><br>${_esc(latest.changeSummary)}<br><br>`:""}${scope.stage==="animation-edit"&&latest.editStartSec!=null?`<b>Edit window</b><br>${_esc(Number(latest.editStartSec).toFixed(2))}-${_esc(Number(latest.editEndSec).toFixed(2))} seconds<br><br>`:""}<b>Iteration instruction</b><br>${_esc(latest.correction)}${(latest.protectedElements||[]).length?`<div style="margin-top:9px;color:var(--muted)"><b style="color:var(--text)">Keep locked</b><br>${latest.protectedElements.map(_esc).join(" · ")}</div>`:""}<button class="btn" ${applying?"disabled":""} onclick="directorApplyCorrection()">${_esc(applyLabel)}</button><small style="display:block;margin-top:8px;color:var(--muted)">${applying?"Archiving the rejected takes and updating this shot's working prompt. The current shot remains visible.":"This prepares production instructions only. Generate and Fire remain separate decisions."}</small></div>`:""}
    <textarea id="directorChatInput" placeholder="Tell the Director what feels wrong…" oninput="DIRECTOR_CHAT_DRAFTS['${_attr(key)}']=this.value">${_esc(DIRECTOR_CHAT_DRAFTS[key]||"")}</textarea>
    <div class="director-chat-actions"><button class="btn ghost" onclick="closeDirectorAgent()">Keep reviewing</button><button class="btn" ${data.loading?"disabled":""} onclick="sendDirectorMessage()">Send to Director</button></div>
  </section>`;

function renderDirectorChatHost(){const host=document.getElementById("director-chat-host");if(!host)return;host.innerHTML=directorChatHTML();requestAnimationFrame(()=>{const log=host.querySelector(".director-chat-log");if(log)log.scrollTop=log.scrollHeight;});}
async function openDirectorAgent(options){
  const opts=options||{},scope=directorChatScope(opts.stage,opts.shotId),key=directorChatKey(scope);
  DIRECTOR_CHAT_OPEN_KEY=key;DIRECTOR_CHAT_OPEN_SCOPE=scope;
  if(opts.seed&&!DIRECTOR_CHAT_DRAFTS[key])DIRECTOR_CHAT_DRAFTS[key]=opts.seed;
  if(!DIRECTOR_CHAT_CACHE[key]){
    DIRECTOR_CHAT_CACHE[key]={loading:true,messages:[]};renderDirectorChatHost();
    const q=new URLSearchParams({episode:scope.episode,scene:scope.scene,stage:scope.stage});if(scope.shotId)q.set("shotId",scope.shotId);
    try{const r=await fetch(BASE+"/api/director-chat?"+q,{cache:"no-store"}),j=await r.json();DIRECTOR_CHAT_CACHE[key]=r.ok?j:{error:j.error,messages:[]};}
    catch(e){DIRECTOR_CHAT_CACHE[key]={error:"Director unavailable",messages:[]};}
  }
  renderDirectorChatHost();
}
function closeDirectorAgent(){DIRECTOR_CHAT_OPEN_KEY=null;DIRECTOR_CHAT_OPEN_SCOPE=null;renderDirectorChatHost();}
async function sendDirectorMessage(){
  const scope=directorChatScope(),key=directorChatKey(scope),input=document.getElementById("directorChatInput"),message=String((input&&input.value)||"").trim();if(!message)return;
  const issue=((document.querySelector(".review-warning")||{}).innerText||"").trim();
  DIRECTOR_CHAT_DRAFTS[key]="";DIRECTOR_CHAT_CACHE[key]={...(DIRECTOR_CHAT_CACHE[key]||{}),loading:true};renderDirectorChatHost();
  try{const r=await fetch(BASE+"/api/director-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...scope,message,issue,by:REVIEWER})}),j=await r.json();
    DIRECTOR_CHAT_CACHE[key]=r.ok?j:{error:j.error,messages:(DIRECTOR_CHAT_CACHE[key].messages||[])};
  }catch(e){DIRECTOR_CHAT_CACHE[key]={error:"Director unavailable",messages:(DIRECTOR_CHAT_CACHE[key].messages||[])};}
  renderDirectorChatHost();
}
function directorStartRejection(stage,shotId,reason){

function directorProductionInstruction(latest){
  const correction=String((latest&&latest.correction)||"").trim();
  const visible=String((latest&&latest.changeSummary)||"").trim();
  const locked=((latest&&latest.protectedElements)||[]).map(item=>String(item||"").trim()).filter(Boolean);
  return [correction,visible?"Visible result required: "+visible:"",locked.length?"Keep locked: "+locked.join("; "):""].filter(Boolean).join("\n");

async function directorApplyCorrection(){

  if(scope.stage==="animation-edit"){
    if(latest.editStartSec==null||latest.editEndSec==null){alert("Tell the Director the exact seconds that need editing first.");return;}
    closeDirectorAgent();

      else{clearInlineSourceProgress();renderWorkspaceBody();}
    }catch(e){clearInlineSourceProgress();alert("Can't reach the studio server. Reload and try again.");}

  }
  if(scope.stage==="animation"){
    let status=SH_SEEDANCE_CACHE[tok];

      return shRun("reject",tok,{correction,category,preserveView:true,progressLabel:"Archiving rejected takes",onStartError:error=>directorApplyFailed(key,error),afterJob:async job=>{
        if(job&&job.status==="done")await finishAnimationDirectorCorrection(tok,key);
        else directorApplyFailed(key,(job&&job.error)||"The rejected takes were not archived.");
      }});
    }
    return saveAnimationDirectorCorrection(tok,key,revised);
  }
  DIRECTOR_CHAT_OPEN_KEY=null;

  if(scope.stage==="voice")return shRun("reject-voice",tok,{correction});

  if(scope.stage==="scenelook")return shRun("reject-scenelook",null,{correction});
  const note=document.getElementById("pSbNote");if(scope.stage==="storyboard"&&note){note.value=correction;return pStoryboardDecide("rejected");}
}

  // THE STALE-TAKE WARNING (2026-07-19 — "I don't feel the acting from the direction changed
  // anything"): editing and saving a working version deliberately never regenerates audio —
  // but nothing told the user the take they were hearing was built BEFORE their edit existed.
  // takeMatchesCurrent is server-computed (voGeneratedFrom vs the current text) — false means
  // a real mismatch, not a guess from timestamps.

  // difference, then get rid of one or the other"): a regeneration now archives whatever it
  // replaces (voice_shot's own pre-overwrite move) instead of silently overwriting it, so

  const takeLabel = vw.hasTake ? `<div class="dec-caption" style="margin:8px 0 2px">

    ${[["miss","Miss"],["partial","Almost"],["lands","Lands"]].map(([score,label])=>`<button type="button" data-pl-overall="${score}" aria-pressed="${value===score}" class="${value===score?"active":""}" onclick="plSetOverall('${_esc(tok)}','${_esc(type)}','${score}')">${label}</button>`).join("")}
  </div>`;
}
function plTraceExcerpt(text){
  const value=String(text||"").trim();
  if(!value)return `<div class="pltrace-empty">Not recorded.</div>`;
  if(value.length<=260)return `<div class="pltrace-text">${_esc(value)}</div>`;
  const preview=value.slice(0,220).replace(/\s+\S*$/,"").trim();
  return `<details class="pltrace-more"><summary>${_esc(preview)}...</summary><div class="pltrace-text">${_esc(value)}</div></details>`;
}
function plTraceBadge(status){
  const map={lands:["Lands","--ok"],partial:["Partial","--warn"],miss:["Miss","--danger"],commented:["Comment recorded","--warn"],"not-rated":["Not rated","--hint"]};
  const item=map[status]||[String(status||"Not recorded").replaceAll("-"," "),"--hint"];
  return `<span class="stbadge" style="color:var(${item[1]});background:var(--surface2)">${_esc(item[0])}</span>`;
}
function plAuditTraceHTML(data){
  const correlation=data.correlation||{},scope=correlation.scope||{},approval=correlation.approval||{};
  const promptLabels={"sealed-batch-prompt":"Sealed batch prompt","recorded-prompt":"Recorded prompt","current-direction-only":"Current direction only"};
  const assetLabels={"generation-hash":"Generation media hash locked","surviving-media-only":"Legacy media · no generation hash","no-media":"No rendered media"};
  const outcomeLabels={rated:"Human rating recorded",commented:"Written outcome recorded","approved-unrated":"Approved · detailed outcome not rated","not-recorded":"No outcome recorded","no-render":"No render to review"};
  const rows=(correlation.rows||[]).map(row=>{
    const wish=row.directorWish||{},instruction=row.promptInstruction||{},result=row.observedResult||{};
    const wishHTML=(wish.sources||[]).map(source=>`<div class="pltrace-meta">${_esc(source.label||source.field||"Director source")}</div>${plTraceExcerpt(source.text)}`).join("")||`<div class="pltrace-empty">No signed directing wish is recorded for this axis.</div>`;
    const promptHTML=(instruction.clauses||[]).map(clause=>`${plTraceExcerpt(clause.text)}<div class="pltrace-meta">Prompt clause ${_esc(clause.index)}${(clause.matchedTags||[]).length?` · ${_esc(clause.matchedTags.join(" · "))}`:""}</div>`).join("")||`<div class="pltrace-empty">${instruction.status==="direction-only"?"The visible prompt is current direction, not proven as this render's generation prompt.":"No matching instruction was located in this prompt."}</div>`;
    let outcomeHTML=`${plTraceBadge(result.status)}`;
    if(Number.isInteger(result.score))outcomeHTML+=`<div class="pltrace-meta">${_esc(result.score)}/2 · ${_esc(result.reviewer||"")} · ${_esc((result.createdAt||"").slice(0,16).replace("T"," "))}</div>`;
    if(result.ratingNote)outcomeHTML+=plTraceExcerpt(result.ratingNote);
    (result.comments||[]).forEach(comment=>{outcomeHTML+=`<div class="pltrace-comment">${_esc(comment.note||"")}<div class="pltrace-meta">${_esc(comment.sourceLabel||"Render comment")} · ${_esc(comment.reviewer||"")}</div></div>`;});
    if(!Number.isInteger(result.score)&&!(result.comments||[]).length)outcomeHTML+=`<div class="pltrace-empty">No visible result has been recorded for this selected take and axis.</div>`;
    return `<section class="pltrace-row"><div class="pltrace-axis">${_esc(row.label)}</div><div class="pltrace-grid">
      <div class="pltrace-cell"><div class="pltrace-label">Director wanted</div>${wishHTML}</div>
      <div class="pltrace-cell"><div class="pltrace-label">Prompt instruction</div>${promptHTML}</div>
      <div class="pltrace-cell"><div class="pltrace-label">Observed result</div><div style="margin-top:7px">${outcomeHTML}</div></div>
    </div></section>`;
  }).join("");
  return `<div class="pltrace">
    <div class="pltrace-scope">
      <div class="plscope"><div class="plscope-label">Prompt lineage</div><div class="plscope-value">${_esc(promptLabels[scope.promptBinding]||scope.promptBinding||"Unknown")}</div><div class="pltrace-meta">${_esc(scope.batchId||"No batch ID")}</div></div>
      <div class="plscope"><div class="plscope-label">Media lineage</div><div class="plscope-value">${_esc(assetLabels[scope.assetBinding]||scope.assetBinding||"Unknown")}</div><div class="pltrace-meta">${_esc(scope.candidateId||"No take selected")}</div></div>
      <div class="plscope"><div class="plscope-label">Outcome evidence</div><div class="plscope-value">${_esc(outcomeLabels[scope.outcomeBinding]||scope.outcomeBinding||"Unknown")}</div>${approval.approved?`<div class="pltrace-meta">${_esc(approval.reviewer||"Approved")}${approval.createdAt?` · ${_esc(approval.createdAt.slice(0,16).replace("T"," "))}`:""}</div>`:""}</div>
    </div>
    <div class="pltrace-summary">${_esc(correlation.summary||"")}</div>
    ${rows||`<div class="pltrace-empty">No directing trace is available.</div>`}
  </div>`;
}
function plNextActionHTML(tok,type,data){
  const selected=data.selectedCandidateId;
  const asset=(data.assets||[]).find(item=>item.candidateId===selected)||{};
  const draft=plDraft(data),latest=(((data.correlation||{}).creativeLoop||{}).whatHappened||{}).latestRating||{};
  const result=draft.overallRead||latest.overallRead||null;
  const needsWork=result==="miss"||result==="partial";
  const directionStage=type==="keyframe"?"keyframe":"animation";
  const directionLabel=type==="keyframe"?"Iterate keyframe":"Iterate animation";
  const prepareLabel=type==="keyframe"?"Prepare keyframe":"Prepare animation";
  const continueStage=type==="keyframe"?"animation":"continuity";
  const continueLabel="Accept and continue";
  if(asset.state==="awaiting"){
    if(type==="keyframe")return `<div class="plflow-actions"><button class="btn" onclick="shRun('approve-keyframe','${_esc(tok)}')">Accept keyframe</button><button class="btn ghost" onclick="shRun('reject-keyframe','${_esc(tok)}')">Iterate</button></div>`;
    const candidate=Number(String(selected||"").replace(/^C/,""))||1;
    return `<div class="plflow-actions"><button class="btn" onclick="shRun('approve','${_esc(tok)}',{candidate:${candidate}})">Accept take</button><button class="btn ghost" onclick="shRun('reject','${_esc(tok)}',{category:'other'})">Iterate</button></div>`;
  }
  if(asset.state==="screening"){
    return `<div class="plflow-actions"><button class="btn" onclick="shRun('rescreen-keyframe','${_esc(tok)}')">Retry identity check</button><button class="btn ghost" onclick="shRun('reject-keyframe','${_esc(tok)}')">Iterate</button></div>`;
  }
  if(asset.state==="rejected"){
    const replacementLabel=type==="keyframe"?"Build replacement keyframe":"Prepare replacement animation";
    return `<div class="plflow-actions"><button class="btn" onclick="openStageOutcome('${directionStage}')">${replacementLabel}</button></div>`;
  }
  if(!selected)return `<div class="plflow-actions"><button class="btn" onclick="openStageOutcome('${directionStage}')">${prepareLabel}</button></div>`;
  return `<div class="plflow-actions">
    ${needsWork?`<button class="btn" onclick="openStageOutcome('${directionStage}')">Iterate</button><button class="btn ghost" onclick="openStageOutcome('${continueStage}')">Accept anyway</button>`
      :`<button class="btn" onclick="openStageOutcome('${continueStage}')">${continueLabel}</button><button class="btn ghost" onclick="openStageOutcome('${directionStage}')">${directionLabel}</button>`}
  </div>`;
}
function plSeedanceContractSummaryHTML(data){
  const r=data.seedancePromptContract;if(!r)return "";
  const ready=r.status==="ready",remaining=Math.max(0,(r.maximum||0)-(r.score||0));
  const groups=r.authorityScores||{},guide=groups["official-guide"]||{},studio=groups["studio-policy"]||{};
  const split=(guide.maximum||studio.maximum)?`<div class="plflow-sub" style="margin-top:4px">Official guide ${_esc(guide.score||0)}/${_esc(guide.maximum||0)} · Studio production policy ${_esc(studio.score||0)}/${_esc(studio.maximum||0)}</div>`:"";
  return `<div class="plcontract"><div class="plcontract-head"><b>Seedance prompt structure</b><span class="plcontract-score">${_esc(r.score)}/${_esc(r.maximum)}</span></div>
    <div class="plflow-sub">${ready?"Ready against the official guide and Studio production policy.":`${_esc(remaining)} precise repair${remaining===1?"":"s"} before the next prompt approval.`} Existing approvals are unchanged.</div>${split}</div>`;
}
function plSeedanceContractAuditHTML(data){
  const r=data.seedancePromptContract;if(!r)return "";
  const model=((data.promptContract||{}).providerModelId)||"checked at fire preflight";
  const renderChecks=(authority)=>(r.checks||[]).filter(check=>(check.authority||"official-guide")===authority).map(check=>{const optional=check.required===false,state=check.status==="pass"?"Ready":optional?"Optional":"Needs work",stateClass=check.status==="pass"?"":optional?"optional":"needs-work";return `<div class="plcontract-check"><div class="plcontract-state ${stateClass}">${state}</div><div><b>${_esc(check.label||check.code||"")}</b><div class="plflow-sub" style="margin-top:2px">${_esc(check.detail||"")}</div>${check.nextAction?`<div class="plcontract-action"><b>${optional?"Improve":"Next"}:</b> ${_esc(check.nextAction)}</div>`:""}</div></div>`}).join("");
  const guideChecks=renderChecks("official-guide"),studioChecks=renderChecks("studio-policy");
  const source=r.source||{},sourceUrl=String(source.url||"");
  const sourceLine=sourceUrl.startsWith("https://bytedance.larkoffice.com/")?`<a href="${_esc(sourceUrl)}" target="_blank" rel="noopener">${_esc(source.title||"Official Seedance 2.5 guide")}</a> · updated ${_esc(source.lastUpdated||"")}`:_esc(r.profile||"");
  return `<details class="techdetails"><summary>Seedance authoring contract · ${_esc(r.score)}/${_esc(r.maximum)}</summary>
    <div class="plmeta">${sourceLine} · ${_esc(r.taskMode||"")} · authoring analysis only</div>
    <div class="plmeta">${_esc(source.scope||"Dreamina product guidance only")}. Recorded render route: ${_esc(model)}. Provider access, executable limits and spend are checked separately.</div>
    ${guideChecks?`<div class="plflow-sub" style="margin:12px 0 4px"><b>Official guide</b></div>${guideChecks}`:""}
    ${studioChecks?`<div class="plflow-sub" style="margin:12px 0 4px"><b>Studio production policy</b></div>${studioChecks}`:""}</details>`;
}
function plHeadlineText(value,fallback,limit){
  const text=String(value||fallback||"").replace(/\s+/g," ").trim(),max=limit||88;
  return text.length>max?text.slice(0,max-3).trimEnd()+"...":text;
}
function plTraceHTML(tok,type,data,preview){
  const loop=((data.correlation||{}).creativeLoop)||{},director=loop.directorWants||{},plan=loop.promptBuiltToDeliver||{},happened=loop.whatHappened||{};
  const latest=happened.latestRating||{},draft=plDraft(data);
  const result=latest.overallRead||null;
  const resultLabel={lands:"Lands",partial:"Almost",miss:"Misses"}[result]||null;
  const comments=happened.comments||[];
  const selected=data.selectedCandidateId,asset=(data.assets||[]).find(item=>item.candidateId===selected)||{};
  const approval=((data.correlation||{}).approval)||{},needsWork=result==="miss"||result==="partial";
  const seedance=data.seedancePromptContract||{},repairs=Math.max(0,(seedance.maximum||0)-(seedance.score||0));
  const promptReady=type==="animation"?seedance.status==="ready":!!data.promptContract;
  const promptHeadline=type==="animation"
    ?(promptReady?"Ready":"Needs "+repairs+" fix"+(repairs===1?"":"es"))
    :(data.promptContract?"Locked":"Needs direction");
  const resultHeadline=asset.state==="rejected"?"Rejected":resultLabel||(approval.approved?"Accepted, not rated":selected?"Ready to review":"Not rendered");
  const nextHeadline=asset.state==="awaiting"?"Accept or iterate":asset.state==="rejected"?"Build replacement":!selected?(type==="keyframe"?"Build keyframe":"Prepare direction"):needsWork?"Iterate":"Accept and continue";
  const quick=data.selectedCandidateId&&data.canRate?`<div class="plquick">
    <div class="plflow-sub" style="margin:0 0 7px"><b>Your call</b></div>
    ${plOverallHTML(tok,type,draft.overallRead)}
    <textarea class="ccta" style="min-height:68px;margin-top:9px" maxlength="2000" placeholder="What landed, what missed, and what should change?" oninput="plNote('${_esc(tok)}','${_esc(type)}',this.value)">${_esc(draft.note)}</textarea>
    <div class="plflow-actions"><button id="plQuickSave_${plPanelId(tok,type)}" class="btn" ${draft.overallRead?"":"disabled"} onclick="plSaveRating('${_esc(tok)}','${_esc(type)}')">Save what happened</button></div>
    <div class="plflow-sub">${data.canTeachPrompt?"Prompt-linked evidence":"Quality review only"} · no generation or approval change</div>
  </div>`:"";
  const observed=result?`<div style="margin-top:8px">${plTraceBadge(result)} <span class="plflow-sub">${_esc(resultLabel)} · ${_esc(latest.reviewer||"")} · ${_esc((latest.createdAt||"").slice(0,16).replace("T"," "))}</span></div>${latest.note?plTraceExcerpt(latest.note):""}`
    :`<div class="plflow-sub">${_esc(happened.summary||"No result has been recorded yet.")}</div>`;
  const currentComment=comments.length?`<div class="plflow-sub"><b>Current comment:</b> ${_esc(comments[0].note||"")}</div>`:"";
  return `<div class="plheadline-grid" aria-label="Director headlines">
      <div class="plheadline"><div class="plheadline-label">Story</div><div class="plheadline-value">${_esc(plHeadlineText(director.text,"Story intent ready"))}</div></div>
      <div class="plheadline"><div class="plheadline-label">Prompt</div><div class="plheadline-value ${promptReady?"ready":"attention"}">${_esc(promptHeadline)}</div></div>
      <div class="plheadline"><div class="plheadline-label">Result</div><div class="plheadline-value">${_esc(resultHeadline)}</div></div>
      <div class="plheadline"><div class="plheadline-label">Next</div><div class="plheadline-value">${_esc(nextHeadline)}</div></div>
    </div>
    <div class="pldirector-action"><div class="pldecision-label">Decision controls</div><div class="plflow-sub">Use the fixed Your Decision panel beside the current media.</div></div>
    <details class="techdetails plreview-details" ${asset.state==="awaiting"?"open":""}><summary>Review result</summary>${preview||""}${observed}${currentComment}${quick}</details>`;
}
function plFeedbackRow(tok,type,item,selected){
  return `<div class="plfeedback"><div><div class="plfeedback-note">${_esc(item.note||"")}</div><div class="plfeedback-meta">${_esc(item.sourceLabel||"Review note")} · ${_esc((item.createdAt||"").slice(0,16).replace("T"," "))} · ${_esc(item.reviewer||"")}${item.batchId?` · ${_esc(item.batchId)}`:""}${(item.topics||[]).length?` · ${_esc(item.topics.join(" · "))}`:""}</div></div>${selected?`<button class="btn ghost" type="button" onclick="plUseFeedback('${_esc(tok)}','${_esc(type)}','${_esc(item.feedbackId)}')">Use in result</button>`:""}</div>`;
}
function promptLabPanelHTML(tok,type,data){
  const id=plPanelId(tok,type);
  const traceName=type==="keyframe"?"Keyframe":"Animation";
  if(!data||data.loading)return `<div id="${id}" class="promptlab"><div class="plhead"><div><div class="pltitle">${traceName}</div><div class="plmeta">Reading director intent, prompt evidence and observed results...</div></div></div></div>`;
  if(data.error)return `<div id="${id}" class="promptlab"><div class="plhead"><div><div class="pltitle">${traceName}</div><div class="plmeta" style="color:var(--danger)">${_esc(data.error)}</div></div>
    <button class="btn ghost" onclick="shLoadPromptLab('${_esc(tok)}','${_esc(type)}',null,true)">Try again</button></div></div>`;
  const contract=data.promptContract||{},analysis=data.analysis||{},ai=data.aiReview||{},ev=data.evidenceSummary||{};
  const selected=data.selectedCandidateId;
  const selectedAsset=(data.assets||[]).find(a=>a.candidateId===selected)||null;
  const selector=(data.assets||[]).length?`<select class="plselect" aria-label="Rendered take" onchange="shLoadPromptLab('${_esc(tok)}','${_esc(type)}',this.value,true)">
    ${(data.assets||[]).map(a=>`<option value="${_esc(a.candidateId)}" ${a.candidateId===selected?"selected":""}>${_esc(a.label)}${a.provenanceGrade==="exact"?" · exact evidence":" · quality review only"}</option>`).join("")}</select>`:"";
  const preview=selectedAsset&&selectedAsset.mediaUrl
    ?(type==="animation"?`<video class="plpreview" controls playsinline preload="metadata" src="${_esc(selectedAsset.mediaUrl)}"></video>`:`<img class="plpreview" alt="Selected keyframe render" src="${_esc(selectedAsset.mediaUrl)}">`)
    :(selectedAsset?`<div class="plwarn">This legacy render record survives, but its media is outside the canonical Studio library, so it is not exposed through the public preview.</div>`:"");
  const dims=data.ratingDimensions||[];

    const promptDim=(analysis.dimensions||{})[item.key]||{};
    const aiDim=(ai.dimensions||{})[item.key]||{};
    return `<div>${_esc(item.label)}</div><div class="plnum" style="color:var(${promptDim.score===2?"--ok":promptDim.score===1?"--warn":"--danger"})">${promptDim.score==null?"n/a":_esc(promptDim.score)+"/2"}</div><div class="plnum" style="color:var(${aiDim.score===2?"--ok":aiDim.score===1?"--warn":aiDim.score===0?"--danger":"--hint"})">${aiDim.score==null?"not run":_esc(aiDim.score)+"/2"}</div>`;
  }).join("");

  const clauses=(analysis.clauses||[]).map(c=>`<div class="ccrow"><b>${_esc(c.index)}.</b> ${_esc(c.text)}<div class="ccref">${_esc((c.tags||[]).join(" · ")||"unclassified")}</div></div>`).join("");

      ${dims.map(item=>`<div class="pldimension"><div class="pldimension-label">${_esc(item.label)}</div>${plSegHTML(tok,type,item.key,draft.scores[item.key])}</div>`).join("")}
      <div class="pldimension"><div class="pldimension-label"><b>Overall result</b></div>${plOverallHTML(tok,type,draft.overallRead)}</div>
      <div class="ccactions"><button id="plSave_${id}" class="btn" ${complete?"":"disabled"} onclick="plSaveRating('${_esc(tok)}','${_esc(type)}')">Save detailed result</button></div>
      <div class="plmeta">${data.canTeachPrompt?"Prompt-learning evidence":"Quality evidence only"} · approval unchanged · no media spend</div></div>`;
  }else if(selected){
    rating=`<div class="plrating"><div class="cchead">Review only</div><div class="plmeta" style="color:var(--warn)">${_esc(data.attributionWarning||"No exact prompt snapshot is available for this render.")}</div></div>`;

    <div class="plmeta">${_esc(ev.promptLearningCount||0)} exact prompt/render · ${_esc(ev.qualityOnlyCount||0)} quality-only</div>
    <div class="plmeta">${_esc(ev.learningClaim||"")}</div>
    ${weakest?`<div class="ccrow"><b>Weakest observed:</b> ${_esc(weakest.label)} · ${_esc(weakest.average)}/2 across ${_esc(weakest.count)}</div>`:""}
    ${comparison?`<div class="ccrow"><b>Current prompt vs prior:</b> ${comparison.delta>0?"+":""}${_esc(comparison.delta)} points <span class="ccref">association only</span></div>`:""}
  </div>`;
  const history=(data.ratings||[]).slice(0,8).map(r=>`<div class="plhistory"><b>${_esc(r.candidateId)}</b><span class="stbadge" style="color:var(${r.overallRead==="lands"?"--ok":r.overallRead==="partial"?"--warn":"--danger"});background:var(--surface2)">${_esc(r.overallRead)}</span><span>${_esc((r.createdAt||"").slice(0,16).replace("T"," "))} · ${_esc(r.reviewer||"")}${r.learningEligible?"":" · quality only"}</span>${r.note?`<div class="plhistory-note">${_esc(r.note)}</div>`:""}</div>`).join("");

    ${prior?`<details class="techdetails"><summary>Earlier attempt comments · ${_esc((correlation.priorAttempts||[]).length)}</summary>${prior}<div class="plmeta">Each comment remains tied to its original batch and is excluded from the selected take's result.</div></details>`:""}
    ${directionNotes?`<details class="techdetails"><summary>Direction decision notes</summary>${directionNotes}</details>`:""}
    <details class="techdetails"><summary>Cross-render learning · ${_esc(ev.ratingCount||0)} ratings</summary>${summary}</details>
    ${history?`<details class="techdetails"><summary>Rating history</summary>${history}</details>`:""}
    ${diagnostics}
    <details class="techdetails"><summary>Prompt clauses and structure</summary>${clauses}<pre class="techpre">${_esc(contract.prompt||"")}</pre></details>
  </details>`;
  return `<div id="${id}" class="promptlab"><div class="plhead"><div><div class="pltitle">${traceName}</div>
      <div class="plmeta">Story · Prompt · Result · Next</div></div>
      <button class="btn ghost" onclick="shLoadPromptLab('${_esc(tok)}','${_esc(type)}','${_esc(selected||"")}',true)">Refresh</button></div>
    ${selector}
    ${dailiesPanelHTML(data)}
    ${plTraceHTML(tok,type,data,preview)}
    ${audit}
  </div>`;
}
function plSetScore(tok,type,dimension,score){
  const data=SH_PROMPTLAB_CACHE[plCacheKey(tok,type)];if(!data||data.error)return;
  const draft=plDraft(data);draft.scores[dimension]=score;
  const panel=document.getElementById(plPanelId(tok,type));if(!panel)return;
  panel.querySelectorAll(`button[data-pl-dim="${dimension}"]`).forEach(btn=>{const active=Number(btn.dataset.plScore)===score;btn.classList.toggle("active",active);btn.setAttribute("aria-pressed",String(active));});
  plUpdateSave(tok,type);
}
function plUseFeedback(tok,type,feedbackId){
  const data=SH_PROMPTLAB_CACHE[plCacheKey(tok,type)];if(!data||data.error)return;
  const item=(data.existingFeedback||[]).find(x=>x.feedbackId===feedbackId);if(!item)return;
  const draft=plDraft(data),note=String(item.note||"").trim();
  if(note&&!draft.note.includes(note))draft.note=draft.note?draft.note+"\n\n"+note:note;
  plRenderOnly(tok,type);
}
function plSetOverall(tok,type,value){
  const data=SH_PROMPTLAB_CACHE[plCacheKey(tok,type)];if(!data||data.error)return;

function routeShotAudio(shot){
  const sound=/\b(?:z{3,}|a+h+c+h+o+o+|achoo+|snor(?:e|es|ing)|snort(?:s|ing)?|sneez(?:e|es|ing)|laugh(?:s|ing)?|giggl(?:e|es|ing)|o{2,}h{2,}m{2,})\b[!.…]*/ig;

    const matches=[...spokenSource.matchAll(sound)];
    if(!matches.length){spokenDialogue.push({...line,exactText:spokenSource});continue;}
    const spoken=spokenSource.replace(sound," ").replace(/\s+([,.!?…])/g,"$1").replace(/\s{2,}/g," ").replace(/^[\s,;:\-…]+|[\s,;:\-…]+$/g,"");

function currentProductionDirection(stage,shotId){
  const inputs=SH_PREFLIGHT&&SH_PREFLIGHT.productionInputs;

    if(stage==="look"&&inputs.look&&inputs.look.prompt)return inputs.look;
    const shot=inputs.shots&&inputs.shots[shotId];
    if(stage==="cinematography"&&shot&&shot.keyframePrompt)return shot;
    if(stage==="voice"&&shot&&Array.isArray(shot.voiceLines)&&shot.voiceLines.length)return shot;
    if(stage==="animation"&&shot&&shot.animationPrompt)return shot;
  }
  // The package is durable authority. A completed specialist job can be current before
  // the derived preflight cache refreshes; that cache lag must not start preparation again.
  const led=shotId?shLedger(shotId):null;
  const work=led&&led.departmentWork&&led.departmentWork[stage];
  const record=work&&(work.candidate||work.approved),output=record&&record.output;
  if(stage==="cinematography"&&output&&(output.providerPrompt||output.keyframePrompt))return output;
  if(stage==="voice"&&output&&Array.isArray(output.lines))return {...output,voiceLines:output.lines};
  if(stage==="animation"&&output&&output.providerPrompt)return {...output,animationPrompt:output.providerPrompt};
  return null;
}

async function prepareDirectionThen(stage,shotId,resume){
  if(currentProductionDirection(stage,shotId)){await resume();return;}
  if(SH_JOB){alert("The Studio is already working. Let that finish, then start this outcome again.");return;}
  const scene=String(SH_SC),episode=String(SH_EP),label=directionLabel(stage);
  document.getElementById("sheet").innerHTML=`<button class="x" onclick="closeM()">×</button>
    <h3>Preparing the ${_esc(label)}</h3>

    <div class="jobbanner" style="margin-top:16px"><span class="pulse">●</span> Preparing creative target…</div>`;
  document.getElementById("modal").classList.add("show");
  try{
    const r=await fetch(BASE+"/api/department-run",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({scene,episode,stage,shotId:shotId||null})});
    const j=await r.json();
    if(!r.ok||!j.ok){directionPrepFailure(stage,j.error||"The specialist could not start.");return;}

    if(j.existing&&j.department){

      // authoritative package so the production input becomes visible, then continue the
      // user's original action. Previously this branch stopped here, leaving WATCH saying
      // "ready — no media generated" after Fire and never opening the cost confirmation.
      await shFetchPkg();

      // prior package signature. The returned specialist record is the current brief for
      // this shot; do not send the reviewer back through a whole-scene rebuild.
      closeM();

      renderWorkspaceBody();
      await resume();
      return;
    }
    SH_JOB=j.jobId;shRememberJob(j.jobId);SH_LAST_JOB=null;SH_POLL_MISSES=0;
    SH_AFTER_JOB=async job=>{
      SH_DEPT_CACHE[key]=null;

      if(!job||job.status!=="done"){

      // recalculated from the new specialist record when the workspace refreshes.

function directorCutKey(){return `${SH_EP||"Ep1"}:${SH_SC||"1"}`;}
async function loadDirectorCut(force){

  SH_DIRECTOR_CUT_LOADING=true;SH_DIRECTOR_CUT_KEY=key;
  try{
    const r=await fetch(BASE+"/api/rough-cut-draft?episode="+encodeURIComponent(SH_EP)+"&scene="+encodeURIComponent(SH_SC),{cache:"no-store"});
    const j=await r.json();
    SH_DIRECTOR_CUT=r.ok?j:{error:j.error||"Director's Seat could not load"};
    SH_DIRECTOR_SELECTED=Math.max(0,Math.min(SH_DIRECTOR_SELECTED,(SH_DIRECTOR_CUT.sequence||[]).length-1));
  }catch(e){SH_DIRECTOR_CUT={error:"Can't reach the Studio server."};}
  finally{SH_DIRECTOR_CUT_LOADING=false;if(page==="pipeline"&&pFocusedStage()==="continuity")renderContinuityStage();}

function directorCutSequence(){return (SH_DIRECTOR_CUT&&SH_DIRECTOR_CUT.sequence)||[];}
function directorCutFrame(shotId){const m=shMedia(shotId);return m.finalFrame||m.keyframe||null;}
function directorCutPayload(){
  return directorCutSequence().map(entry=>({
    shotId:entry.shotId,inSec:Number(entry.inSec||0),outSec:Number(entry.outSec||entry.durationSec||0),
    manualTrim:!!entry.manualTrim,addedAt:entry.addedAt||null
  }));
}
async function saveDirectorCut(confirmCut,message){
  if(!directorCutSequence().length){alert("Add at least one approved take to the timeline first.");return false;}
  const action=confirmCut?"confirm-scene":"save-scene";
  try{
    const r=await fetch(BASE+"/api/rough-cut-draft",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({episode:SH_EP,scene:String(SH_SC),action,sequence:directorCutPayload()})});
    const j=await r.json();
    if(!r.ok){alert(j.error||"The scene cut could not be saved.");return false;}
    SH_DIRECTOR_CUT=j;SH_DIRECTOR_CUT_KEY=directorCutKey();

  }catch(e){alert("Can't reach the Studio server. Reload and try again.");return false;}
}
function directorCutChanged(message){

}
function directorCutSelect(index,play){

}
function directorCutStep(delta){directorCutSelect(SH_DIRECTOR_SELECTED+Number(delta||0),true);}
function directorCutRemove(index){
  const sequence=directorCutSequence(),removed=sequence.splice(Number(index),1)[0];
  SH_DIRECTOR_SELECTED=Math.max(0,Math.min(SH_DIRECTOR_SELECTED,sequence.length-1));
  directorCutChanged((removed&&removed.shotId||"Take")+" removed from the scene cut");
}
function directorCutAdd(shotId){
  const source=((SH_DIRECTOR_CUT&&SH_DIRECTOR_CUT.available)||[]).find(item=>item.shotId===shotId);
  if(!source||directorCutSequence().some(item=>item.shotId===shotId))return;
  directorCutSequence().push({...source,inSec:0,outSec:Number(source.durationSec||0),manualTrim:false,addedAt:new Date().toISOString(),current:true});

function directorCutDragStart(event,index){SH_DIRECTOR_DRAG={kind:"timeline",index:Number(index)};event.dataTransfer.effectAllowed="move";}

function directorCutDrop(event,index){
  event.preventDefault();if(!SH_DIRECTOR_DRAG)return;
  if(SH_DIRECTOR_DRAG.kind==="bin"){directorCutAdd(SH_DIRECTOR_DRAG.shotId);SH_DIRECTOR_DRAG=null;return;}
  const sequence=directorCutSequence(),from=SH_DIRECTOR_DRAG.index,to=Math.max(0,Math.min(Number(index),sequence.length-1));
  if(from!==to&&sequence[from]){const moved=sequence.splice(from,1)[0];sequence.splice(to,0,moved);SH_DIRECTOR_SELECTED=to;directorCutChanged("Scene cut order saved");}
  SH_DIRECTOR_DRAG=null;
}
function directorCutDropAtEnd(event){
  event.preventDefault();if(!SH_DIRECTOR_DRAG)return;
  if(SH_DIRECTOR_DRAG.kind==="bin")directorCutAdd(SH_DIRECTOR_DRAG.shotId);
  else{const sequence=directorCutSequence(),from=SH_DIRECTOR_DRAG.index;if(sequence[from]&&from!==sequence.length-1){sequence.push(sequence.splice(from,1)[0]);SH_DIRECTOR_SELECTED=sequence.length-1;directorCutChanged("Scene cut order saved");}}
  SH_DIRECTOR_DRAG=null;
}
function directorCutTrim(index,field,value){
  const entry=directorCutSequence()[Number(index)];if(!entry)return;
  const duration=Number(entry.durationSec||0),numeric=Math.round(Number(value)*1000)/1000;
  if(!Number.isFinite(numeric))return;
  if(field==="inSec")entry.inSec=Math.max(0,Math.min(numeric,Number(entry.outSec||duration)-.1));
  else entry.outSec=Math.min(duration,Math.max(numeric,Number(entry.inSec||0)+.1));
  entry.manualTrim=true;directorCutChanged(entry.shotId+" trim saved");
}
function directorCutResetTrim(index){const entry=directorCutSequence()[Number(index)];if(!entry)return;entry.inSec=0;entry.outSec=Number(entry.durationSec||0);entry.manualTrim=false;directorCutChanged(entry.shotId+" restored to automatic handles");}
function directorPreviewPlay(sequenceMode){
  const video=document.getElementById("directorPreview"),entry=directorCutSequence()[SH_DIRECTOR_SELECTED];if(!video||!entry)return;
  SH_DIRECTOR_AUTOPLAY=!!sequenceMode;
  const start=Number(entry.inSec||0),end=Number(entry.outSec||entry.durationSec||0);
  if(video.currentTime<start||video.currentTime>=end-.04)video.currentTime=start;
  video.play().catch(()=>{});
}
function directorPlayCut(){if(!directorCutSequence().length)return;SH_DIRECTOR_SELECTED=0;SH_DIRECTOR_AUTOPLAY=true;renderContinuityStage();requestAnimationFrame(()=>directorPreviewPlay(true));}
function directorPreviewTick(video){
  const entry=directorCutSequence()[SH_DIRECTOR_SELECTED];if(!entry)return;
  const end=Number(entry.outSec||entry.durationSec||0);if(video.currentTime<end-.04)return;
  video.pause();
  if(SH_DIRECTOR_AUTOPLAY&&SH_DIRECTOR_SELECTED<directorCutSequence().length-1){SH_DIRECTOR_SELECTED++;renderContinuityStage();requestAnimationFrame(()=>directorPreviewPlay(true));}

  // or status bar, you don't know what's happening, is it firing etc"): the pulsing "●"
  // banner (renderJobBanner/jobFor) already existed but reads from PJOBS, which nothing
  // kept in sync with THIS poll's own live data — so for a job's entire running duration
  // the banner sat on whatever PJOBS happened to hold at the last full page load (almost
  // always nothing, since the job didn't exist yet then), showing literally nothing after
  // the one-time "started" toast until the job finished. Root-caused, not a symptom patch:
  // sync the shared PJOBS from every tick so the banner's own existing data source is
  // actually current.
  PJOBS=jobs;

    // dict — most likely the server restarted mid-fire (JOBS is in-memory, wiped on
    // restart) — used to leave the poll spinning forever with zero feedback. Three
    // consecutive misses (~7.5s) before giving up, so one slow/racy fetch right after
    // the job was just created doesn't false-trigger this.

      SH_AFTER_JOB=null;clearInlineSourceProgress();
      if(typeof showToast=="function")showToast("Lost track of that job — the studio server may have restarted mid-run. Reload to check the real status.",false);
      await shFetchPkg();if(page=="pipeline")renderControl();
    }

  }
  SH_POLL_MISSES=0;
  if(j.status!="running"){
    const completedHere=shJobBelongsHere();
    clearInterval(SH_POLL);SH_POLL=null;SH_JOB=null;shForgetJob();
    // Stash the outcome so renderJobBanner() can show it — the running-only jobFor()
    // query would otherwise lose this the instant status flips (see SH_LAST_JOB above).
    SH_LAST_JOB=j;
    // A COMPLETED FIRE INVALIDATES THE WORKING-VERSION CACHES TOO (2026-07-19, found while
    // proving the progress-banner fix live): shFetchPkg() already refreshes SH_PKG/SH_MEDIA,
    // but SH_VOICE_CACHE/SH_SEEDANCE_CACHE/SH_STRUCTURE_CACHE are separate, lazily-loaded
    // caches (shLoadVoiceWork etc. only fetch when a shot's own entry is missing) — a real
    // voice regeneration just proved this stays silently stale: the "current take generated
    // at" / "previous take" comparison panel kept showing the PRE-fire take/timestamps
    // after the job finished, because nothing told it to re-fetch. Cleared unconditionally

    SH_VOICE_CACHE={};SH_SEEDANCE_CACHE={};SH_STRUCTURE_CACHE={};SH_READBACK_CACHE={};SH_REFERENCE_CACHE={};SH_PROMPTLAB_CACHE={};SH_PROMPTLAB_DRAFTS={};

    // Complete the authoritative refresh before resuming any deferred outcome. Starting
    // renderControl() without awaiting it lets its nested shFetchPkg() clear SH_PREFLIGHT
    // just before prepareDirectionThen() checks the newly-signed specialist direction,
    // falsely reporting a valid brief as stale. The deferred callback must only observe a
    // fully-loaded, internally consistent package/state/preflight snapshot.
    if(page=="pipeline"&&completedHere)await renderControl();
    if(preservedView&&completedHere&&page===preservedView.page&&String(SH_SC||"")===preservedView.scene){
      requestAnimationFrame(()=>window.scrollTo({top:preservedView.scrollY,left:0,behavior:"instant"}));
    }
    if(afterJob&&completedHere)await afterJob(j);
    return;
  }
  // STILL RUNNING — refresh the visible banner every tick so the pulsing indicator and
  // the job's own real step text (cb-studio/serve.py's _humanise(line), updated live as
  // the subprocess prints progress) actually change on screen instead of sitting frozen.
  if(page=="pipeline")renderJobBanner();
}
function updateWatchLiveStatus(job){
  if(page!=="pipeline"||PSTAGE!=="animation")return;
  const state=document.getElementById("watchResultState"),media=document.getElementById("watchResultMedia");
  if(!state||!media)return;
  state.textContent="Rendering";
  const existing=document.getElementById("watchLiveProgress");
  if(existing){existing.outerHTML=watchLiveProgressHTML(job,media.classList.contains("has-live-result"));return;}
  media.innerHTML=watchLiveProgressHTML(job,false);
}
async function _watchServerPollTick(){
  if(page!=="pipeline"){
    if(SH_WATCH_POLL)clearInterval(SH_WATCH_POLL);
    SH_WATCH_POLL=null;SH_WATCH_ACTIVE_ID=null;
    return;
  }
  await fetchJobsNow();
  const shot=(pShots()[PSHOT_I]||{}).shotId;
  const serverJob=shot?activeWatchJob(shot):null;
  const durableJob=shot?durableWatchJob(shLedger(shot)):null;
  const active=serverJob&&durableJob?{...serverJob,...durableJob,step:serverJob.step||durableJob.step}:(serverJob||durableJob);
  renderJobBanner();
  if(active){
    SH_WATCH_ACTIVE_ID=active.id||active.jobId||Object.keys(PJOBS).find(key=>PJOBS[key]===active)||String(active.providerTaskId||shot);
    updateWatchLiveStatus(active);
    return;
  }
  if(SH_WATCH_ACTIVE_ID&&!SH_JOB){
    SH_WATCH_ACTIVE_ID=null;
    SH_VOICE_CACHE={};SH_SEEDANCE_CACHE={};SH_STRUCTURE_CACHE={};SH_READBACK_CACHE={};SH_REFERENCE_CACHE={};SH_PROMPTLAB_CACHE={};SH_PROMPTLAB_DRAFTS={};
    await shFetchPkg();
    if(page==="pipeline")await renderControl();
  }
}
function startWatchServerPoll(){
  if(SH_WATCH_POLL)clearInterval(SH_WATCH_POLL);
  _watchServerPollTick();
  SH_WATCH_POLL=setInterval(_watchServerPollTick,2500);
}
function shPollStart(){
  if(SH_POLL)clearInterval(SH_POLL);
  SH_POLL_MISSES=0;
  _shPollTick();   // fire immediately — don't make the banner wait out the first 2.5s tick
  SH_POLL=setInterval(_shPollTick,2500);
}
if(SH_JOB)setTimeout(()=>shPollStart(),0);
function shDismissLastJob(){SH_LAST_JOB=null;renderJobBanner();}
function shJobHTML(j){
  // Two refusals are EXPECTED, informative behaviour, never a malfunction: the no-token spend DISCLOSURE
  // (the designed step 1) and the unconfirmed-billing-profile hard block — both render amber, not red.
  const raw=j.log||"";
  const billing=/billing_profile/i.test(raw);
  const disclosure=/SPEND DISCLOSURE|SPEND NOT APPROVED|spend token/i.test(raw)&&j.status!="running"&&j.status!="done";
  const informative=billing||disclosure;
  const col=j.status=="running"?"var(--info)":(j.status=="done"?"var(--ok)":(informative?"var(--warn)":"var(--danger)"));
  const log=_esc(raw.split("\n").slice(-14).join("\n"));
  return `<div style="border:1px solid var(--line);border-left:3px solid ${col};border-radius:8px;padding:9px 11px;margin:0 0 12px">
    <div style="font-size:12px;font-weight:600;color:${col}">${j.status=="running"?"⟳":(j.status=="done"?"✓":(informative?"ℹ":"✗"))} ${_esc(String(j.gate))} — ${_esc(j.step||j.status||"")}</div>
    ${log?`<pre style="font-size:10px;line-height:1.45;color:var(--hint);white-space:pre-wrap;margin:6px 0 0;max-height:150px;overflow:auto">${log}</pre>`:""}
    ${disclosure&&!billing?`<div style="font-size:11px;color:var(--warn);margin-top:6px">ℹ This REFUSED run is the designed disclosure step — the spend token is now stored on the shot; review the numbers above, then “💳 Approve spend &amp; fire”.</div>`:""}
    ${billing?`<div style="font-size:11px;color:var(--warn);margin-top:6px">ℹ Billing profile not confirmed — every paid generation (voice / keyframe / fire) is hard-blocked by design until Julian confirms the plan in billing_profile.json. This refusal is expected protective behaviour, not a malfunction.</div>`:""}
  </div>`;
}
function closeM(){document.getElementById("modal").classList.remove("show")}
function gateLog(job){
  if(!job||(!job.log&&job.status!="running"))return"";
  return `<details ${job.status=="running"?"open":""} style="margin:10px 0 0"><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Gate ${job.gate} log · ${job.status}</summary><pre style="white-space:pre-wrap;font-size:11px;background:var(--bg);color:var(--ink);padding:11px;border-radius:8px;max-height:260px;overflow:auto;margin:6px 0 0">${(job.log||"(running…)").replace(/</g,"&lt;")}</pre></details>`;
}
async function renderBible(){
  const view=document.getElementById("view");
  let C={},L={current:false,episodeReady:false,blockers:[],episodeBlockers:[],warnings:[],characters:[]};
  try{[C,L]=await Promise.all([
    fetch(BASE+"/"+projConfig()+"/characters.json",{cache:"no-store"}).then(r=>r.json()),
    fetch(BASE+"/api/canon-lock?episode=Ep1",{cache:"no-store"}).then(r=>r.json())
  ]);}catch(e){}
  const chars=Object.entries(C).filter(([k,v])=>k[0]!=="_"&&v&&typeof v==="object"&&!Array.isArray(v)&&k!=="sizeClasses");
  const lockChars=Object.fromEntries((L.characters||[]).map(x=>[x.name,x]));
  const url=p=>p?BASE+"/"+String(p).replace(/^\.\.\//,"")+"?v="+Date.now():"";
  const chip=([name,c])=>{const row=lockChars[name]||{},ready=!!row.productionReady;return `<button type="button" onclick='openCharacter(${JSON.stringify(name).replace(/'/g,"&#39;")})' style="font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;width:118px;text-align:center" title="Open ${_attr(name)}'s bible page"><div style="aspect-ratio:3/4;background:var(--surface2);border-radius:8px;overflow:hidden;border:2px solid ${ready?'var(--ok)':'var(--warn)'}">${c.anchor?`<img src="${url(c.anchor)}" style="width:100%;height:100%;object-fit:cover"/>`:''}</div><div style="font-size:12px;font-weight:600;margin-top:4px">${_esc(name)}</div><div style="font-size:10px;color:${ready?'var(--ok)':'var(--warn)'}">${ready?'Locked':_esc(row.status||'Incomplete')}</div>${(c.bible&&c.bible.pillar)?`<div style="font-size:10px;color:var(--hint);line-height:1.3">${_esc(c.bible.pillar)}</div>`:''}</button>`};
  const readyCount=(L.characters||[]).filter(x=>x.productionReady).length;
  const stubs=(L.characters||[]).filter(x=>x.status==="stub").map(x=>x.name);
  const issues=[...(L.blockers||[]),...(L.episodeBlockers||[])];
  const issueRows=issues.map(x=>`<div class="canonissue"><span class="canonissue-msg">${_esc(x.message||x.code)}</span><span class="canonissue-action">${_esc(x.action||"")}</span></div>`).join("");
  const aliasWarnings=(L.warnings||[]).filter(x=>x.code==="SCRIPT_CHARACTER_ALIAS");
  const locationPending=(L.warnings||[]).filter(x=>x.code==="LOCATION_VISUAL_MASTER_PENDING").length;
  const creativePending=(L.warnings||[]).filter(x=>x.code==="CANON_CREATIVE_GAP"&&!String(x.message||"").includes("optional performance-overlay"));
  const lockColour=L.current?(L.episodeReady?'var(--ok)':'var(--danger)'):'var(--danger)';
  const lockTitle=L.current?(L.episodeReady?'Canon lock current · Episode 1 ready':'Canon lock current · Episode 1 blocked'):'Canon lock missing or stale';
  const lockPanel=`<div style="border-top:3px solid ${lockColour};border-bottom:1px solid var(--line);padding:12px 0 14px;margin:14px 0 18px">
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap"><div><div style="font-weight:700;color:${lockColour}">${lockTitle}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${L.sourceCount||0} signed sources · ${L.assetCount||0} signed assets · ${readyCount} production-ready characters${stubs.length?` · ${_esc(stubs.join(", "))} stub`:''}</div></div><code style="font-size:11px">${_esc((L.manifestDigest||"").slice(0,12))}</code></div>
    ${issueRows?`<div style="margin-top:10px">${issueRows}</div>`:`<div style="font-size:12px;color:var(--ok);margin-top:8px">All Episode 1 cast, script and canon checks pass.</div>`}
    ${aliasWarnings.map(x=>`<div style="font-size:12px;color:var(--warn);margin-top:7px">${_esc(x.message)}</div>`).join("")}
    ${creativePending.map(x=>`<div style="font-size:12px;color:var(--warn);margin-top:7px">${_esc(x.character+": "+x.message)}</div>`).join("")}
    ${locationPending?`<div style="font-size:12px;color:var(--muted);margin-top:7px">${locationPending} scene visual masters will be locked through Scene Look approval.</div>`:""}
  </div>`;
  view.innerHTML=`${projectScreenHeaderHTML({eyebrow:`${(CURRENT_PROJECT&&CURRENT_PROJECT.name)||"Project"} canon`,title:"Show Bible",subtitle:"Shared canon across every episode.",art:CURRENT_PROJECT&&CURRENT_PROJECT.coverImage})}
    ${lockPanel}
    <div class="mc"><div class="lab" style="font-weight:600;color:var(--brandink)">Characters (${chars.length})</div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">${chars.map(chip).join("")}</div></div>
    <div id="bb" class="bible" style="margin-top:16px">Loading canon…</div>`;
  const bibleFile=CURRENT_PROJECT&&CURRENT_PROJECT.showBibleFile;
  let md="";
  if(!bibleFile)md="No show bible has been attached to this project yet.";
  else try{md=await (await fetch(BASE+"/"+bibleFile,{cache:"no-store"})).text();}catch(e){md="Could not load the canon.";}
  document.getElementById("bb").innerHTML=window.marked?marked.parse(md):("<pre style='white-space:pre-wrap'>"+md.replace(/</g,"&lt;")+"</pre>");
}
// ── click-to-enlarge lightbox: any img.zoom (keyframes + scene plate) opens an in-app graphical view ──
function openLightbox(src,cap){var lb=document.getElementById('lightbox'),im=document.getElementById('lbimg');im.classList.remove('zoomed');im.style.transform='';im.src=src;document.getElementById('lbcaptxt').textContent=cap||'';document.getElementById('lborig').href=src;lb.classList.add('open');}
function closeLightbox(){var lb=document.getElementById('lightbox');lb.classList.remove('open');document.getElementById('lbimg').src='';}
function lbToggleZoom(e){if(e)e.stopPropagation();var im=document.getElementById('lbimg'),z=im.classList.toggle('zoomed');im.style.transform=z?'scale(2)':'';}
document.addEventListener('click',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('zoom')){e.preventDefault();e.stopPropagation();var cap=t.getAttribute('data-cap')||decodeURIComponent((t.src.split('/').pop()||'').split('?')[0]);openLightbox(t.src,cap);}},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});
// A literal refresh restores project/episode/scene/stage from the URL/hash (2026-07-17) —
// falls back to the existing default (the Projects screen) when there is none.
// "REMEMBER YOUR PLACE": try the real URL hash first (a same-tab refresh); if there's no
// hash at all (fresh tab, bookmark to the bare URL, browser restart), fall back to the last
// place saved in localStorage before giving up to the Projects screen.
const EXPLICIT_START_HASH=(location.hash||"").replace(/^#/,"");
_restoreFromHash(EXPLICIT_START_HASH).then(restored=>{
  if(restored) return;
  // An explicit Projects URL is authoritative. Do not replace it with the last remembered
  // episode just because Projects intentionally has no project id in its hash.
  if(EXPLICIT_START_HASH){bootProjects();return;}
  let saved=null; try{saved=localStorage.getItem("cb_last_place");}catch(e){}
  if(saved) return _restoreFromHash(saved).then(r2=>{ if(!r2) bootProjects(); });
  bootProjects();
});
// Hash changes can come from the browser address bar, Back/Forward, or an in-app
// redirect after a scoped correction. replaceState() in _syncHash does not emit this
// event, so explicit navigation remains authoritative without creating a render loop.
let HASH_RESTORE_SEQ=0;
window.addEventListener("hashchange",async()=>{
  const raw=(location.hash||"").replace(/^#/,"");
  if(!raw)return;
  const seq=++HASH_RESTORE_SEQ;
  const restored=await _restoreFromHash(raw);
  if(seq!==HASH_RESTORE_SEQ)return;
  if(!restored)bootProjects();
});
</script>
