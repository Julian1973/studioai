// ── THE PRODUCTION WORKFLOW, MADE VISIBLE AND SEQUENCED (2026-07-19, Julian's own words:
// "Cinematography review → Voice review → Animation Director → inspect the final Seedance
// prompt → generate one candidate... the workflow activates and all the director producer
// skills etc fire based on where they are in the pipe and whose jurisdiction it comes
// under"): every piece this names already existed (departmentPanelHTML for each
// department's prepare/decide, structurePanelHTML for the compiled prompt, the disclosure-
// modal generate button) but as five independently-navigable tabs a human had to remember
// to click through in the right order themselves — nothing ever SEQUENCED them or showed
// which one was current. This is the missing orchestration layer: a pure, read-only status
// function plus a persistent stepper, reusing every existing panel/action unchanged.
// Deliberately does NOT add a new blocking gate anywhere — the real safety gate is
// already the server-side department check (THE CORE LAW); this only decides which
// already-safe step to SHOW as current and auto-navigates there.
function productionWorkflowStatus(shotId){
  const shots=pShots(), s=shots.find(x=>x.shotId==shotId);
  if(!s) return null;
  const led=shLedger(shotId)||{}, m=shMedia(shotId)||{};
  const needsKeyframe=(s.sourceType=="opener");
  const talky=(s.dialogueLines||[]).length>0;
  const dept=shDeptFor(shotId)||{};
  const cinApproved=!!(led.keyframeApproval&&led.keyframeApproval.approved);
  const voiceApproved=!!(led.voiceApproval&&led.voiceApproval.approved);
  const animDirected=!!(dept.animation&&dept.animation.approvalCurrent);
  const generated=(led.status=="approved");
  // "READY TO GENERATE" ON A SHOT THAT'S ALREADY DONE (2026-07-21, Julian, live — "if the
  // voice is there and has been historically generated then its fine"): these two steps
  // used to require BOTH the underlying approval (a real, already-generated keyframe/voice
  // take Julian actually signed off) AND the specialist's own department direction being
  // marked "current" — so a shot whose real, historical, approved take is completely fine
  // still showed as an undone step the instant that separate direction-freshness check
  // drifted (the exact same class of fact the top-ribbon "Cinematography — Awaiting
  // approval" mislabel, fixed earlier this session, was built on). The approval IS the real
  // deliverable; a stale direction behind it is a flag worth surfacing (still visible in
  // that department's own panel/checklist the instant you step into it), never grounds to
  // tell Julian a shot he already finished still needs generating.
  // THE "FINAL PROMPT" STEP, MERGED INTO "ANIMATION DIRECTOR" (2026-07-22, Julian, live —
  // "i dont see the point having this as well" on the AD review card): these were always
  // ONE screen underneath (the Direction row already shows the department
  // panel + seedancePanelHTML + structurePanelHTML together, unconditionally) — the rail
  // was the only place that counted them as two separate gated moments, which read as
  // redundant, no-value friction rather than a real second decision. Folded to one step;
  // the free structure check still auto-fires the instant this step is CURRENT (see the
  // auto-run block below, now keyed off "animation" instead of the retired "promptreview").
  const steps=[
    {id:"keyframe", pstage:"keyframe", label:"Cinematography", role:"Director (staging) / DP (execution)",
     applicable:needsKeyframe, done:!needsKeyframe||cinApproved},
    {id:"voice", pstage:"voice", label:"Voice", role:"Director with the Voice Director",
     applicable:talky, done:!talky||voiceApproved},
    {id:"animation", pstage:"animation", label:"Animation", role:"Director",
     applicable:true, done:animDirected},
    {id:"generate", pstage:"animation", label:"Generate", role:"Producer — spend authorisation",
     applicable:true, done:generated},
  ];

  for(const st of steps){ st.reachable=priorDone; if(st.applicable) priorDone=priorDone&&st.done; }
  const current=steps.find(st=>st.applicable&&!st.done)||steps[steps.length-1];
  return {steps, current, complete:steps.every(st=>!st.applicable||st.done)};

    // Prompt row and the Fire disclosure. Both are about the TAKE. The opening frame, which
    // is the one artifact actually COMPOSED from the plate and the turnarounds, never showed
    // them. Fourth time this week the answer was computed and no screen carried it.
    //
    // It goes on every branch that offers or holds a real frame decision, and NOT on the
    // relay branch — an inherited frame is resolved from the previous shot's take at fire
    // time and has no reference stack of its own to show.
    if(pst.needsKeyframe) body+=`<div style="margin-top:12px">${refStripHTML(tok)}</div>`;
    // THE AUTHORISATION HALF, IN THE SAME ROW AS THE BUTTON IT UNLOCKS. Only where a paid
    // Generate is actually on offer — the inherited/relay and Scene-Look-held branches have
    // no keyframe generation of their own, so they need no direction either.
    if(auth&&acts.indexOf(genBtn)>=0){
      body=auth.body+body;
      acts=auth.actions.concat(acts);
      // An ALREADY-APPROVED opening frame stays done: its direction only matters again for a
      // REPLACEMENT, and re-opening a landed row over that would be the same "summary and
      // controls disagree" bug pointed the other way.
      if(!authOK&&st!="done"){
        // The row states the true next step, not the one further down the page. A row whose
        // summary and whose controls disagree is the exact defect this pass exists to end.
        st="ready";
        lab=(auth.phase=="approve")?"Approve direction"
           :(auth.phase=="stale")?"Re-prepare direction"
           :(auth.phase=="loading")?"Working…":"Prepare direction";
        sum=(auth.phase=="approve")
              ?"The direction for this frame is below, in full — approve it and Generate unlocks. Approving spends nothing."
           :(auth.phase=="stale")
              ?"This frame's approved direction is out of date — prepare and approve it again before generating."
           :(auth.phase=="loading")
              ?"Preparing this frame's direction — a text-only consult, nothing is being spent."
              :"No direction prepared for this frame yet. Prepare it (free, text only), read it, approve it — then Generate unlocks.";
      }
    }
    {
      let more="";
      if(pst.needsKeyframe) more+=keyframePanelHTML(s.shotId,SH_KEYFRAME_CACHE[s.shotId]);
      if(led.keyframeRejected){
        const rf=led.keyframeRejected.rejectedFile;
        more+=`<div class="dec-caption" style="margin-top:14px;font-weight:600">History</div><div class="histrow">
          ${rf?`<img class="zoom" data-cap="${_esc(s.shotId)} · rejected keyframe (History only)" src="${BASE}/engine/${_esc(rf)}?v=${MEDIA_V}" style="width:64px;height:36px;object-fit:cover;border-radius:5px;flex:none"/>`:""}
          <span class="stbadge" style="color:var(--danger);background:var(--dangerbg)">rejected</span>
          <span class="histmeta">${_esc((led.keyframeRejected.rejectedAt||"").slice(0,16))}</span>
          <div class="histnote">${_esc(led.keyframeRejected.reason||"")}</div></div>`;
      }
      body+=rowMore(more,"Keyframe workbench & history",tok+"|frame");
    }
    rows.push({id:"frame",title:"Opening frame",state:st,stateLabel:lab,summary:sum,
               mini:(m.keyframeCandidateUrl||m.keyframe||refAnchorUrl(s.shotId)),body,actions:acts});
  }

  // ── 3 · SPECIAL REFERENCES ──
  {
    const slots=s.referenceSlots||{};
    const findRole=p=>Object.entries(slots).find(([k,v])=>String(v).startsWith(p))||null;
    const faceE=findRole("face state"), fxE=findRole("pollen effect target");
    const refCard=(e,kind,name)=>e?`<div class="runref">
        <img class="zoom" data-cap="${_esc(s.shotId)} · ${_esc(name)}" src="${BASE}/engine/media/shots/${_esc(SH_EP)}_${tok}_${kind}.png?v=${MEDIA_V}"
             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'runempty',textContent:'slot declared — file missing on disk'}))"/>
        <div class="rl"><b>${_esc(e[0])}</b> · ${_esc(e[1])}</div></div>`:"";
    const present=[faceE&&"face state",fxE&&"effect target"].filter(Boolean);
    rows.push({id:"refs",title:"Special references",
      state:present.length?"done":"pending",
      stateLabel:present.length?(present.length+" attached"):"Optional",
      summary:present.length?("Attached: "+present.join(" + ")+" — pinned with images, not words."):
        "Optional — pin a face state or an effect material with a prepared image.",
      body:(faceE||fxE)?`<div class="runrefs">${refCard(faceE,"face_state","face-state reference")}${refCard(fxE,"effect_target","effect-target reference")}</div>`
        :`<div class="runempty">Pin the exact intended face state (e.g. the pollen moustache + goatee) or an effect material (loose golden pollen) with an IMAGE — prepared references win fights that prompt text loses. Uploading registers the @图N slot on the package automatically; the next fire attaches it.</div>`,
      actions:[
        `<button class="btn ghost" onclick="document.getElementById('srFace_${tok}').click()">⇧ Upload face reference</button>
         <input type="file" id="srFace_${tok}" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="shSpecialRefUpload('${tok}','face_state',this)"/>`,
        `<button class="btn ghost" onclick="document.getElementById('srFx_${tok}').click()">⇧ Upload effect reference</button>
         <input type="file" id="srFx_${tok}" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="shSpecialRefUpload('${tok}','effect_target',this)"/>`]});
  }

  // ── 4 · VOICE — LEDGER TRUTH ONLY (2026-07-23, Julian live: his approve clicks REFUSED
  // because a stray on-disk file was presented as a take while led.voPath was None; a take
  // EXISTS only when the ledger says so, never by file existence) ──
  {
    let st,lab,sum,body="",acts=[];
    if(!talky){ st="done";lab="No dialogue";sum="No dialogue in this shot — nothing to voice."; }
    else{
      const hasTake=!!led.voPath;
      const voApproved=hasTake&&!!(led.voiceApproval&&led.voiceApproval.approved);
      const takeUrl=hasTake?(shAbsUrl(led.voPath)||m.vo):null;
      const isMaster=String(led.voPath||"").includes("_vo_master15");
      const vDept=dept.voice||{};
      const dirCurrent=!!vDept.approvalCurrent;
      const player=takeUrl?`<audio controls src="${BASE}${takeUrl}?v=${MEDIA_V}" style="width:100%;margin-top:10px"></audio>`:"";
      const dlg=(s.dialogueLines||[]).map(l=>`<div class="dlgline"><b>${_esc(l.speaker)}:</b> "${_esc(l.exactText)}"</div>`).join("");
      const padCtl=(hasTake&&voApproved)?`<div class="dec-caption" style="margin-top:14px">Build a 15.0s padded master — a mechanical ffmpeg pad of the approved take (lead-in silence + silent tail), no new voice generation:</div>
        <div style="display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap">
          <label style="font-size:12px;color:var(--muted)">Offset&nbsp;<input type="number" id="voOff_${tok}" class="tnum" min="0" max="14" step="0.1" value="0" style="width:74px;padding:5px 7px;border:1px solid var(--line);border-radius:7px"/>&nbsp;s of leading silence</label>
          <button class="btn ghost" style="margin:0" onclick="shBuildVoMaster('${tok}')">⧉ Build 15s padded master</button>
        </div>`:"";
      const hist=(led.voiceRejections||[]).length?`<div class="dec-caption" style="margin-top:14px;font-weight:600">History</div>`+
          led.voiceRejections.slice().reverse().map(r=>`<div class="histrow"><span class="stbadge" style="color:var(--danger);background:var(--dangerbg)">rejected</span>
            <span class="histmeta">${_esc((r.rejectedAt||"").slice(0,16))}</span><div class="histnote">${_esc(r.reason||"")}</div></div>`).join(""):"";
      // THE DECIDED CONTENT, OPEN (2026-07-23, same live defect as Direction): whatever a
      // voice click approves or generates — the performed lines, the take itself — renders
      // in full above the button, never behind Details.
      const vRec=shDeptRec('voice',s.shotId);
      const vOut=((vRec&&vRec.candidate)||{}).output||((vRec&&vRec.approved)||{}).output||null;
      const vLines=voDiffHTML((vOut&&vOut.lines)||[]);
      if(!hasTake){
        if(!dirCurrent){
          // THE SAME ROW SHAPE AS EVERY OTHER GATED SECTION (2026-07-26). This branch used
          // to offer Approve and nothing else — which reads fine while something has already
          // been auto-prepared, and is a dead end the moment nothing has: an Approve button
          // over an empty box, with no way to fill it. Now it goes through the shared
          // prepare -> read -> approve block, so "nothing prepared yet" produces a Prepare
          // button instead of a decision the human cannot make.
          const vStage=panelAuthStage("voice")||"voice";
          const vAuth=authBlockHTML(vStage,tok);
          st="ready";
          // THE ROW MUST NEVER DENY A DIRECTION IT IS HOLDING (2026-07-27, Julian: "we have
          // signed this off this time — does the direction then fire automatically? i cant
          // see what its doing nor have an approve or reject button"). This switch handled
          // authBlockHTML's "approve" phase (a candidate awaiting him) but never its
          // "approved" one — so the instant a direction WAS approved while dirCurrent still
          // read false, every branch missed and the row fell through to the last else,
          // announcing "No voice direction prepared yet" over a direction he had just signed,
          // with a lone Prepare-again button. The screen stating the opposite of the truth,
          // which is the one defect class this whole panel exists to end.
          lab=(vAuth.phase=="approve")?"Approve direction"
             :(vAuth.phase=="approved")?"Directed"
             :(vAuth.phase=="stale")?"Re-prepare direction"
             :(vAuth.phase=="loading")?"Working…":"Prepare direction";
          sum=(vAuth.phase=="approve")
                ?"The Voice Director's performed lines are below, in full — approving never generates; the paid take is the separate step after."
             :(vAuth.phase=="approved")
                ?"Voice direction approved. Nothing fires on its own — generating the take is the next, separate click below."
             :(vAuth.phase=="stale")
                ?"This shot's approved voice direction is out of date — prepare and approve it again before generating."
             :(vAuth.phase=="loading")
                ?"Preparing the voice direction — a text-only consult, nothing is being spent."
                :"No voice direction prepared yet. Prepare it (free, text only), read the performed lines, approve them — then the paid take unlocks.";
          body=vAuth.body
            +(vAuth.phase=="prepare"?"":runDecideBlock("The locked lines it performs",dlg))
            +(vAuth.phase=="approved"
                ?voicePanelHTML(s.shotId,SH_VOICE_CACHE[s.shotId])+hist
                :rowMore(voicePanelHTML(s.shotId,SH_VOICE_CACHE[s.shotId])+hist,VOICE_EDIT_LABEL,tok+"|voice"));
          // AN APPROVED DIRECTION MUST OFFER THE THING IT UNLOCKS. authBlockHTML's approved
          // phase returns only "Prepare again" — correct for a row whose job ends at the
          // signature, wrong for this one, whose whole point is the take that follows.
          acts=(vAuth.phase=="approved")
            ?[`<button class="btn" onclick="openDisclosureModal('voice-regen',{shotId:'${tok}'})">🎙 Generate voice for this shot</button>`].concat(vAuth.actions)
            :vAuth.actions;
        } else {
          st="ready";lab="Generate";
          sum="Direction approved — no take on the ledger yet; generating voices these exact lines (paid ElevenLabs call).";
          // THE LAST MOMENT TO TUNE THE TAGS IS BEFORE YOU PAY FOR THEM (2026-07-27, Julian:
          // "I would like to be able to edit the voice prompt to see if adding the [cadence]
          // in v3 using the brackets"). This editor has existed since 2026-07-19 and has
          // always said, in its own words, "Edit acting direction, cadence and [bracketed] v3
          // tags directly" — behind a disclosure labelled "Voice workbench & history", which
          // tells a director nothing about what is inside it. Open, here, at the one moment
          // the edit is free and the take is not yet bought.
          body=runDecideBlock("The lines this will voice",vLines||dlg)
            +voicePanelHTML(s.shotId,SH_VOICE_CACHE[s.shotId])+hist;
          acts=[`<button class="btn" onclick="openDisclosureModal('voice-regen',{shotId:'${tok}'})">🎙 Generate voice for this shot</button>`];
        }
      }
      else if(voApproved){ st="done";lab="Approved";
        sum="Take approved"+(isMaster?" — padded to the 15s master":"")+" — un-approving it is free if you want it back.";
        body=player+rowMore(dlg+padCtl+voicePanelHTML(s.shotId,SH_VOICE_CACHE[s.shotId])+hist,VOICE_EDIT_LABEL+", the 15s master, and history",tok+"|voice");
        // TWO WAYS BACK, AND THEY ARE NOT THE SAME (2026-07-26). Un-approve clears the
        // approval and leaves the take on disk to listen to again — free, no reason needed,
        // no regeneration. Reject ARCHIVES the take, demands a written reason, and the only
        // route on from there is a fresh paid ElevenLabs call. The cheap one goes first.
        acts=[unapproveBtn('unapprove-voice',tok,'this take',
                'Clears the approval; the take stays on disk, back to awaiting your ear.'),
              `<button class="btn ghost" onclick="shRun('reject-voice','${tok}')">Reject this take (archives it — refiring is a paid call)</button>`]; }
      else { st="ready";lab="Your call";sum="The take you're approving plays below — one click approves direction + take together.";
        body=(player||`<div class="runmsg err">The ledger records a take but its file could not be resolved — check the Voice job log.</div>`)
          +runDecideBlock("The locked lines this take performs",dlg)
          +rowMore(voicePanelHTML(s.shotId,SH_VOICE_CACHE[s.shotId])+hist,VOICE_EDIT_LABEL,tok+"|voice");
        acts=[`<button class="btn" onclick="shApproveStageAll('${tok}','voice')">Approve voice</button>`,
              `<button class="btn ghost" onclick="shRun('reject-voice','${tok}')">Reject with reason</button>`]; }
    }
    rows.push({id:"voice",title:"Voice",state:st,stateLabel:lab,summary:sum,body,actions:acts});
  }

  // ── 5 · DIRECTION (Animation Director) — THE DECIDED CONTENT IS ALWAYS VISIBLE
  // (2026-07-23, Julian live: "its asking me to approve direction but i cant see it" —
  // an Approve button must sit directly under the full brief it approves, open, no clicks) ──
  {
    let st,lab,sum,body="",acts=[];
    const aRec=shDeptRec('animation',s.shotId)||animRec;
    const aCand=aRec&&aRec.candidate;
    // THE SHARED BLOCK (2026-07-26): this row is where the prepare -> read -> approve shape
    // was first built, one row at a time, and never carried to 02 or 04. It now renders from
    // the same function they do, so the three cannot drift apart again.
    const dStage=panelAuthStage("direction")||"animation";
    const dAuth=authBlockHTML(dStage,tok);
    if(led.status=="approved"&&!anim.approvalCurrent){
      // THE APPROVAL IS THE DELIVERABLE (the standing 2026-07-21 doctrine): a landed shot
      // never re-presents as needing direction over a stale record behind it.
      st="done";lab="Directed";
      sum="Take already approved — the direction record behind it is stale/pending; see Departments below if you re-fire.";
      // RENDER IT OR DON'T COMPUTE IT (2026-07-26): this was the one branch in the panel that
      // had a direction in hand and showed nothing at all. The terminality pass below may
      // still blank it on a landed shot — that is deliberate — but the row no longer throws
      // the document away on its own.
      body=dAuth.body;
      acts=[`<button class="btn ghost" onclick="deptRun('animation','${tok}')">↻ Refire direction</button>`];
    }
    else if(anim.approvalCurrent){ st="done";lab="Directed";sum=panelLabelForStage("animation")+" approved and current.";
      body=dAuth.body;
      acts=dAuth.actions; }
    else if(aCand){ st="ready";lab="Your call";sum="The Director's animation brief is below, in full — approve it, or reject with a reason.";
      body=dAuth.body
        +rowMore(`<div class="dec-caption" style="margin-top:8px">To EDIT the brief before approving, use the Animation panel in Departments below (Save edit, then Approve).</div>`,"How to edit this brief before approving",tok+"|dir");
      acts=dAuth.actions; }
    else {
      // NOTHING PREPARED YET: never "approve" content that doesn't exist on screen —
      // prepare first (text-only consult, no spend), then the brief renders above a real,
      // informed Approve.
      st="ready";
      lab=(dAuth.phase=="loading")?"Working…":(dAuth.phase=="stale")?"Re-prepare":"Prepare";
      sum=(dAuth.phase=="loading")
            ?"Preparing the Director's animation brief — a text-only consult, nothing is being spent."
         :(dAuth.phase=="stale")
            ?"This shot's approved direction is out of date — prepare and approve it again before firing."
            :"Prepare the Director's animation brief (text-only specialist consult, no spend) — it renders here in full for your approval.";
      body=dAuth.body;
      acts=dAuth.actions;
    }
    rows.push({id:"direction",title:"Direction",state:st,stateLabel:lab,summary:sum,body,actions:acts});
  }

  // ── 6 · PROMPT (the working Seedance prompt) ──
  {
    const sw=SH_SEEDANCE_CACHE[s.shotId];
    const wp=led.workingSeedancePrompt||null;
    let promptActs=[];
    const dlgConfirmed=!!(wp&&wp.dialogueInPromptConfirmed);
    let st,lab,sum;
    // A resolvable prompt is INFORMATION, not a decision — it never claims the "NOW"
    // slot (2026-07-23 fix: with candidates awaiting review, NOW wrongly read PROMPT).
    // The editor stays fully accessible; only the chip semantics changed.
    // THE BLOCKED ROW MUST NAME ITS OWN FIX (2026-07-25, Julian live: "i have clicked the
    // prepare direction and the prompt is saying unavailable and it cant fire... we make
    // this ux so complicated"). The prompt was blocked by a stale/missing Animation
    // Direction — which is a DIFFERENT row further up the page — and this row just
    // printed the raw server refusal, a wall of doctrine, with no button. The fix lives
    // one click away and the screen never said so. Now it says exactly what is missing
    // and carries the button that resolves it.
    const _aRec=shDeptRec('animation',s.shotId)||animRec;
    const _aCand=_aRec&&_aRec.candidate;
    if(sw&&sw.error){
      st="blocked";lab="Unavailable";
      if(_aCand){
        sum="Waiting on you: the direction in "+panelLabelForStage("animation")+" is prepared but not approved yet. "
           +"Approve it and the prompt appears here, ready to fire.";
        promptActs=[`<button class="btn" onclick="shApproveStageAll('${tok}','animation')">Approve the direction</button>`];
      } else {
        sum="No current direction in "+panelLabelForStage("animation")+" for this shot — prepare one (text-only, no "
           +"spend) and the prompt compiles from it.";
        promptActs=[`<button class="btn" onclick="deptRun('animation','${tok}')">Prepare the direction</button>`];
      }
    }
    else if(sw&&sw.currentPrompt){
      st="done";
      lab=sw.isWorking?"Working copy":"Compiled";
      sum=sw.isWorking?("Working version saved"+(sw.savedAt?" · "+sw.savedAt.slice(0,16).replace("T"," "):"")+(dlgConfirmed?" · ⚠ Law-6 bypass on record":""))
                      :"Compiled from the approved direction — exactly what will be submitted.";
    } else { st="pending";lab="Waiting";sum="Compiles once the direction in "+panelLabelForStage("animation")+" is approved."; }
    // THE REFERENCE STRIP RENDERS HERE UNCONDITIONALLY (2026-07-23, Julian — "no
    // references in the prompt"): what the @图N handles in the text actually point at,
    // as real thumbnails, whatever stage the shot is in — only @图1 can be pending.
    const body=refStripHTML(tok)+((sw&&sw.currentPrompt)?
      rowMore(`<div class="dec-caption" style="margin-top:10px">Exactly as it will be submitted. Edit action, timing, physical comedy, camera and performance direction directly.</div>
       <textarea id="swPrompt_${tok}" class="ccta" style="min-height:220px;font-size:13.5px;line-height:1.6;margin-top:8px">${_esc(sw.currentPrompt)}</textarea>
       <label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:12px;color:var(--warn);cursor:pointer">
         <input type="checkbox" id="swDlg_${tok}" ${dlgConfirmed?"checked":""} style="margin-top:2px"/>
         <span>Dialogue words in prompt (director-confirmed Law-6 bypass) — the model may voice these words itself over @Audio1. Saved on the record with your name; never a default.</span>
       </label>
       <div class="runrow-actions">
         <button class="btn ghost" onclick="shSaveSeedanceWork('${tok}')">Save as working version</button>
         <button class="btn ghost" onclick="shRestoreSeedanceWork('${tok}')">Restore compiled</button>
       </div>`
       +structurePanelHTML(s.shotId,SH_STRUCTURE_CACHE[s.shotId]),"Edit the prompt & run the free structure check",tok+"|prompt")
      :`<div class="runempty">${_esc(sum)}</div>`
        +((sw&&sw.error)?`<details style="margin-top:8px"><summary class="dec-caption" style="cursor:pointer">Technical detail</summary><pre class="techpre">${_esc(sw.error)}</pre></details>`:""));
    rows.push({id:"prompt",title:"Prompt",state:st,stateLabel:lab,summary:sum,body,actions:promptActs});
  }

  // ── 7 · FIRE ──
  {
    const auth=led.pendingSpendAuth||null;
    const batch=led.batch||null;
    const liveJob=jobFor("shot",SH_SC);
    const cost480=shResCost("480p",fireDur), cost720=shResCost("720p",fireDur);
    const seg=`<div class="runseg">
      <div class="runseg-card ${SH_RES=="480p"?"active":""}" onclick="shSetRes('480p')">
        <div class="runseg-tier">480p · Test</div>
        <div class="runseg-cost">${cost480!=null?"$"+cost480.toFixed(2):"—"}</div>
        <div class="runseg-note">per candidate · <span class="tnum">${fireDur}</span>s est.</div></div>
      <div class="runseg-card ${SH_RES=="720p"?"active":""}" onclick="shSetRes('720p')">
        <div class="runseg-tier">720p · Final</div>
        <div class="runseg-cost">${cost720!=null?"$"+cost720.toFixed(2):"—"}</div>
        <div class="runseg-note">per candidate · <span class="tnum">${fireDur}</span>s est.</div></div>
    </div>`;
    let st,lab,sum,body="",acts=[];
    if(led.status=="approved"){ st="done";lab="Fired";sum="A take is approved — reject it in Review to re-fire."; }
    // A ROW THAT SAYS "DONE" WHILE IT IS THE THING BLOCKING YOU (2026-07-27, Julian, after
    // approving a freshly-prepared direction: "I have approved it but cant fire"). Every
    // engine precondition passed — the prompt resolved, the anchor resolved, voice and Scene
    // Look were current. What actually held it was an UNDECIDED BATCH from an earlier fire:
    // fire_shot will not open a second one, correctly. But this row reported "done · Batch
    // fired · candidates rendered", which reads as though the thing he just approved had
    // already gone off — so the one row that knew why he was stuck was the one row claiming
    // success, and it offered no way out. Same fact, stated as the block it is, naming the
    // action that clears it.
    else if(led.status=="candidates-pending"){
      st="blocked";lab="Held";
      sum="An earlier batch is still undecided — nothing new can fire until you approve or reject it in Review below. This is not about the direction you just approved.";
      body=`<div class="runempty">There is already a rendered take on this shot waiting on your decision, `
          +`in <b>08 · REVIEW</b> directly below. Approve it and the shot is done; reject it and this row `
          +`unlocks for a fresh batch off your current direction.</div>`;
      // Deliberately no jump button: Review is the very next row, and this panel has no
      // row-level scroll target to call — a control that throws is worse than a sentence
      // that points.
      acts=[];
    }
    else if(led.status=="model-limited"){
      // Never restate the attempt ceiling as a literal — it is a policy number in
      // cb_render.MAX_BATCH_ATTEMPTS (raised 2 -> 7, 2026-07-25) and this copy said
      // "Two batches" for hours after it moved. Describe the state, not the count.
      st="blocked";lab="Blocked";
      sum="The attempt limit for this shot was reached — a human redesign is required "
         +"before any re-fire. The redesign panel is below.";
      body=redesignPanelHTML(s.shotId,SH_REDESIGN_CACHE[s.shotId]);
    } else if(batch&&batch.status=="generating"){
      // THE VISIBLE RENDERING STATE (2026-07-23, Julian — "when you fire be good to see
      // please wait rendering"): the whole 10-20 minute window between approving the spend
      // and the candidates landing is a live card — pulsing, elapsed clock, honest
      // expectation, the fired parameters restated, NO fire button anywhere. Derived
      // entirely from the ledger batch + the job feed, so a fresh page load mid-render
      // shows the identical state.
      const done=(batch.done||[]).length,expected=batch.expected||0,failed=batch.failed||[];
      const bdisc=batch.disclosure||{};
      const startMs=_batchStartEpoch(led,liveJob);
      const paramsKV=`<div class="rundisc-kv" style="padding:10px 0 0">
          <span>Candidates <b class="tnum">${_esc(String(bdisc.candidateCount!=null?bdisc.candidateCount:(expected||"?")))}</b></span>
          <span>Resolution <b>${_esc(bdisc.resolution||"720p")}</b></span>
          <span>Max batch cost <b class="tnum">${bdisc.maxBatchCostUsd!=null?"$"+bdisc.maxBatchCostUsd:"—"}</b></span>
          ${expected>1?`<span>Progress <b class="tnum">${done}/${expected}</b></span>`:""}
        </div>`;
      const prevFail=failed.length?`<div class="runmsg err" style="margin-top:10px">${liveJob?"<i>Previous attempt (before this run):</i><br>":""}${failed.map(f=>
        `C${_esc(String(f.candidate))} — ${_esc(String(f.error||"").slice(0,220))}`).join("<br>")}</div>`:"";
      if(liveJob){
        st="generating";lab="Rendering";
        sum="Rendering — Seedance is generating your take"+(expected>1?` (${done}/${expected} done)`:"")+"…";
        body=`<div class="rendercard">
          <div class="rendercard-top"><span class="pulse" style="color:var(--info)">●</span>
            <span class="rendercard-title">Rendering — Seedance is generating your take</span>
            ${startMs?`<span class="rendercard-timer tnum" id="runElapsed" data-start="${startMs}">${_fmtElapsed((Date.now()-startMs)/1000)}</span>`:""}</div>
          <div class="dec-caption" style="margin-top:7px">Please wait — a 15-second clip typically takes <b>10–20 minutes</b>. You can leave this page; the batch is sealed server-side and this row picks it straight back up. The candidates appear in Review below the moment they land.</div>
          ${paramsKV}${prevFail}
        </div>`;
        acts=[];
      } else {
        st="blocked";lab="Stalled";
        sum="Batch stalled — "+done+"/"+expected+" done; resumable with its original sealed token (nothing already rendered is repaid).";
        body=(prevFail||`<div class="runempty">No live render job is running for this batch — the studio may have restarted mid-render. Nothing is lost: the batch is sealed server-side.</div>`)
          +`<div class="dec-caption" style="margin-top:10px">Resume re-uses the SAME single-use spend token — only the missing candidate(s) generate; completed ones are never repaid.</div>`
          +paramsKV;
        acts=[`<button class="btn" onclick="shResumeBatch('${_esc(batch.token)}','${tok}')">↻ Resume batch (same token, missing candidates only)</button>`];
      }
    } else if(auth&&auth.token){
      const disc=auth.disclosure||{}, env=auth.envelope||{};
      st="ready";lab="Authorise";sum="Disclosure issued — a single-use token is bound to this exact sealed envelope."
        +(disc.maxBatchCostUsd!=null?" Approving spends up to $"+disc.maxBatchCostUsd+".":"");
      body=`<div class="rundisc"><div class="rundisc-head">Spend disclosure — sealed envelope</div>
        <div class="rundisc-kv">
          <span>Candidates <b class="tnum">${_esc(String(disc.candidateCount!=null?disc.candidateCount:"?"))}</b></span>
          <span>Resolution <b>${_esc(disc.resolution||"720p")}</b></span>
          <span>Max batch cost <b class="tnum">${disc.maxBatchCostUsd!=null?"$"+disc.maxBatchCostUsd:"—"}</b></span>
          <span>Duration <b class="tnum">${_esc(String(disc.shotDurationSec!=null?disc.shotDurationSec:fireDur))}s</b></span>
          ${disc.usingWorkingPrompt?`<span style="color:var(--warn)">⚠ working prompt override in play</span>`:""}</div>
        <div style="padding:0 14px 12px">${refStripHTML(tok)}</div>
        ${env.prompt?`<pre>${_esc(env.prompt)}</pre>`:""}</div>`;
      acts=[`<button class="btn runfirebtn" onclick="shFireWithAuth('${tok}')">✦ Approve spend &amp; fire${disc.maxBatchCostUsd!=null?` — <span class="tnum">$${disc.maxBatchCostUsd}</span>`:""}</button>`];
    } else if(!pst.readyToAnimate){
      st="pending";lab="Waiting";sum=pst.label+(pst.sub?" — "+pst.sub:"");
      body=`<div class="runempty">Unlocks when ${_esc(panelLabelForStage("cinematography"))}${talky?", "+_esc(panelLabelForStage("voice")):""} and ${_esc(panelLabelForStage("animation"))} are approved. The spend itself always stays a two-step, token-sealed decision.</div>`;
    } else if(animRec&&animRec.readiness&&animRec.readiness.applicable!==false
              &&!animRec.readiness.readyForDisclosure){
      // TELL THE TRUTH ON THE ROW, NOT JUST THE BUTTON (2026-07-25, Julian: "how am i able
      // to fire when i dont have a prompt"). deptLocksGeneration already disabled the
      // button in this exact case, but the row still read READY / "Everything upstream is
      // approved" — so the summary line and the control disagreed, and the row won the
      // argument visually. Same fact, stated once, in the place the eye lands first.
      const why=(animRec.readiness.reasons&&(animRec.readiness.reasons.ready
                 ||animRec.readiness.reasons.inputs))
                ||("The direction in "+panelLabelForStage("animation")+" is not ready for disclosure.");
      st="pending";lab="Blocked";sum=why;
      body=`<div class="runempty">${_esc(why)}<br><br>The prompt is compiled from the direction approved in ${_esc(panelLabelForStage("animation"))} — until that resolves, there is nothing to fire.</div>`;
    } else {
      st="ready";lab="Ready";sum="Everything upstream is approved — firing discloses the sealed envelope, then the bound token spends.";
      body=seg+`<div style="margin-top:12px">${candCountPickerHTML(shCap)}</div>`;
      const fn=Math.min(SH_CANDS,shCap), fc=shResCost(SH_RES,fireDur);
      acts=[deptLocksGeneration(
        `<button class="btn spend runfirebtn" onclick="shRun('fire','${tok}',{candidates:Math.min(SH_CANDS,${shCap}),resolution:SH_RES})">◈ Generate ${fn} candidate${fn==1?"":"s"} · spends${fc!=null?` — est. <span class="tnum">$${(fc*fn).toFixed(2)}</span> (${SH_RES})`:` (${SH_RES})`}</button>`,
        animRec&&animRec.readiness,null,"animation")];
    }
    rows.push({id:"fire",title:"Fire",state:st,stateLabel:lab,summary:sum,body,actions:acts});
  }

  // THE PRICE OF REJECTING (2026-07-26). Reject is the most expensive control in this
  // product and it was the only one carrying no figure. Approve costs nothing — the take is
  // already rendered and paid for. Reject reopens the shot, and the ONLY way forward from a
  // reopened shot is another paid batch, so pressing it is what authorises that spend. The
  // number is the same estimate the Generate button beside it already shows, from the same
  // shResCost/SH_RES/SH_CANDS inputs — one figure, one source, never a second guess. This
  // adds no dialog, no confirmation and no gate: Julian's own ruling ("if I press render it
  // renders") stands. It states a fact on a control that had none.
  const _rjN=Math.min(SH_CANDS,shCap), _rjC=shResCost(SH_RES,fireDur);
  const rejectCost=(_rjC!=null)?` — next batch est. <span class="tnum">$${(_rjC*_rjN).toFixed(2)}</span>`:"";
  const rejectTitle=(_rjC!=null)
    ? `Rejecting reopens the shot; the only route on is another paid batch — currently ${_rjN} × ${SH_RES} × ${fireDur}s, est. $${(_rjC*_rjN).toFixed(2)}`
    : "Rejecting reopens the shot; the only route on is another paid batch.";

  // ── 8 · REVIEW ──
  {
    let st,lab,sum,body="",acts=[];
    const cands=m.candidates||[];
    if(led.status=="candidates-pending"&&cands.length){
      st="ready";lab="Your call";sum=cands.length+" candidate"+(cands.length==1?"":"s")+" awaiting your review — approve ONE or reject the batch.";
      body=cands.map(c=>`<div class="runmedia" style="margin-top:12px"><video controls src="${BASE}${c.url}?v=${MEDIA_V}"></video>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><b>C${c.n}</b>
        <button class="btn" style="margin:0;padding:6px 14px" onclick="shRun('approve','${tok}',{candidate:${c.n}})">Approve this take — C${c.n}</button></div></div>`).join("");
      acts=[`<select id="shCat_${tok}" class="reject-cat">${REJECT_CATS.map(c=>`<option${c=="other"?" selected":""}>${c}</option>`).join("")}</select>`,
            `<button class="btn ghost" title="${rejectTitle}" onclick="shRejectBatch('${tok}')">✗ Reject this batch${rejectCost}</button>`];
    } else if(led.status=="approved"&&(led.approvedTake||m.clip||m.finalFrame)){
      st="done";lab="Approved ✓";
      sum="Approved take on record"+(PSHOT_I<shots.length-1?" — its final frame is "+shots[PSHOT_I+1].shotId+"'s opening-frame source.":".");
      // the APPROVED TAKE itself, from the ledger's own recorded path (m.clip's conventional
      // filename predates the c<N> candidate naming and is often null — the ledger is truth)
      const takeUrl=shAbsUrl(led.approvedTake)||m.clip;
      body=`<div class="runmsg ok">✓ APPROVED${led.approvedCandidate?" · candidate C"+_esc(String(led.approvedCandidate)):""}${(led.disclosure&&led.disclosure.resolution)?" · "+_esc(led.disclosure.resolution):""} — this is the take that ships.</div>`
        +(takeUrl?`<div class="runmedia" style="margin-top:10px"><video controls src="${BASE}${takeUrl}?v=${MEDIA_V}"></video></div>`:"")
        +(m.finalFrame?`<div class="dec-caption" style="margin-top:12px">Harvested final frame — the next shot's continuity anchor:</div>
           <div class="runmedia" style="max-width:340px"><img class="zoom" data-cap="${_esc(s.shotId)} · harvested final frame" src="${BASE}${m.finalFrame}?v=${MEDIA_V}"/></div>`:"");
      // THE FREE WAY BACK, AHEAD OF THE PAID ONE (2026-07-26). Un-approve returns this take
      // to being candidate 1 of 1 awaiting your decision — the file and its harvested final
      // frame stay exactly where they are. Reject is the one that reopens the shot into
      // another paid batch, which is why it is the one carrying a figure.
      acts=[unapproveBtn('unapprove-shot',tok,'this take',
              'Returns the take to candidate 1 of 1, awaiting your decision. The clip and its harvested final frame stay on disk. Any LATER shot already fired off this frame is not rewound — un-approve those separately.'),
            `<button class="btn ghost" title="${rejectTitle}" onclick="shRun('reject','${tok}')">✗ Reject with note (allow re-fire)${rejectCost}</button>`];
    } else if(m.clip||m.finalFrame){
      st="done";lab="Rendered";
      sum="Rendered media exists on disk but the ledger doesn't mark this shot approved — trust the ledger.";
      body=(m.clip?`<div class="runmedia"><video controls src="${BASE}${m.clip}?v=${MEDIA_V}"></video></div>`
                  :`<div class="runmedia"><img src="${BASE}${m.finalFrame}?v=${MEDIA_V}"/></div>`);
      acts=[];
    } else {
      st="pending";lab="Waiting";sum="Candidates appear here after Fire.";
      body=`<div class="runempty">Once a batch renders, each candidate plays here with its own Approve — one winner per shot; a rejection goes on record with its category and drives the redesign ladder.</div>`;
    }
    if((led.rejections||[]).length){
      body+=rowMore(`<div class="dec-caption" style="margin-top:4px;font-weight:600">Rejection history</div>`+
        led.rejections.slice().reverse().map(r=>`<div class="histrow"><span class="stbadge" style="color:var(--danger);background:var(--dangerbg)">rejected</span>
          <span class="histmeta">${_esc((r.at||"").slice(0,16))} · ${_esc(r.category||"")}</span><div class="histnote">${_esc(r.correction||"")}</div></div>`).join(""),"Rejection history",tok+"|review");
    }
    rows.push({id:"review",title:"Review",state:st,stateLabel:lab,summary:sum,body,actions:acts});
  }

  // ── TERMINALITY FIRST (2026-07-23, Julian live — a completed S1.SH2 was still showing
  // "NOW · DIRECTION", a live Prepare button and a red STALE prompt): when the ledger says
  // the take is APPROVED the shot is TERMINAL — every stage renders as a quiet completed
  // row (✓, collapsed, no CTAs, no stale warnings; staleness against an approved take is
  // irrelevant noise). Review alone stays open with the approved take and the ONE action
  // that reopens the shot.
  if(led.status=="approved"){
    const TERMINAL_SUM={storyboard:"Storyboard approved.",
      frame:"Opening frame locked for the approved take.",
      voice:talky?"Voice approved and shipped with the take.":"No dialogue in this shot.",
      direction:"Direction shipped with the approved take.",
      prompt:"Prompt shipped with the approved take.",
      fire:"Fired — the approved take in Review is the result."};
    rows.forEach(r=>{
      if(r.id=="review"){
        // A LANDED SHOT STILL HAS A FREE WAY BACK (2026-07-26). The terminality pass blanks
        // every row's controls by design — but it must not blank the only reversible one, or
        // an approved shot's single remaining exit is the paid one.
        r.actions=[unapproveBtn('unapprove-shot',tok,'this take',
                     'Returns the take to candidate 1 of 1, awaiting your decision. The clip and its harvested final frame stay on disk. Any LATER shot already fired off this frame is not rewound — un-approve those separately.'),
                   `<button class="btn ghost" title="${rejectTitle}" onclick="shRun('reject','${tok}')">✗ Reject this take (reopens the shot)${rejectCost}</button>`];
        return;
      }
      r.state="done"; r.stateLabel="Done"; r.actions=[];
      if(TERMINAL_SUM[r.id]) r.summary=TERMINAL_SUM[r.id];
      if(r.id=="frame") r.body=m.keyframe?`<div class="runmedia" style="max-width:340px"><img class="zoom" data-cap="${_esc(s.shotId)} · opening frame" src="${BASE}${m.keyframe}?v=${MEDIA_V}"/></div>`:"";
      else if(r.id!=="refs") r.body="";
      else r.actions=[];
    });
  }
  // ── assemble: sticky header + status spine ──
  // A shot whose take is APPROVED is complete, full stop (the ledger's own led.status is
  // the one source of truth) — optional maintenance actions on earlier rows never present
  // as "the next step" on a landed shot.
  const current=(led.status=="approved")?null
    :(rows.find(r=>r.state=="ready"||r.state=="blocked"||r.state=="generating")||null);
  // THE ROW MODEL — THREE TIERS AND ONE OVERRIDE (2026-07-26).
  // Engine states (done|ready|blocked|generating|pending) are the truth and do not change.
  // They render into three TIERS, because the reviewer asks exactly one question of every
  // row: is this row my problem right now?
  //    DONE  — settled; closed; its controls are quiet and behind the caret
  //    NOW   — the one cursor row; open; one primary; honey ring
  //    LATER — everything else; closed; quiet; whole row at .62
  // THE ONE OVERRIDE — a row that is genuinely RENDERING keeps its --info pulse and its
  // "Rendering · …" summary regardless of tier, because a machine really is working and
  // quieting that is a lie.
  // Openness and quietness are properties of the row OBJECT, decided here — not a regex over
  // generated HTML afterwards. That is what let the two post-processing passes (the blind
  // `class="btn"`->`class="btn ghost"` sweep and the force-open `<details>` rewrite) be
  // DELETED rather than tuned.
  // When the take is approved there is no `current`, and REVIEW carries the one action that
  // reopens the shot — so it holds the cursor instead of being quieted into unreachability.
  const focusId=current?current.id:"review";
  rows.forEach(r=>{
    r.tier=(r.id==focusId)?"now":(r.state=="done"?"done":"later");
    r.bodyOpen=(r.tier=="now")||r.state=="generating";
  });
  // THE STATUS SPINE. The same component as before, in better clothes — number and name from
  // the engine's own SHOT_PANEL via panelSection(), never a literal, so
  // test_the_studio_holds_no_stage_list_of_its_own stays green by construction. It is the
  // panel's table of contents and the structural answer to "I'm lost".
  const meter=rows.map(r=>{
    const sec=panelSection(r.id);
    const num=sec?sec.number:"";
    const name=sec?sec.name:(r.title||"");
    const cls=r.state=="done"?"done":r.state=="generating"?"generating":r.state=="ready"?"ready":r.state=="blocked"?"blocked":"";
    const glyph=r.state=="done"?"✓":r.state=="generating"?"▮":r.state=="blocked"?"▬":(r.id==focusId?"◉":"○");
    const word=_esc(r.stateLabel||r.state);
    return `<button type="button" class="${cls}${r.id==focusId?" cur":""}" onclick="shOpenSection('${_esc(r.id)}')"`
      +` aria-label="${_esc(num)} ${_esc(name)} — ${word}" title="${_esc(num)} · ${_esc(name)} — ${word}">`
      +`<span class="msnum">${_esc(num)}</span><span class="msglyph">${glyph}</span>`
      +`<span class="msname">${_esc(name)}</span></button>`;
  }).join("");
  const lastDisc=(led.batch&&led.batch.disclosure)||led.disclosure||null;
  const estN=Math.min(SH_CANDS,shCap), estCost=shResCost(SH_RES,fireDur);
  // SPEND, BOTH DIRECTIONS (2026-07-26). Everything on this line used to point forward — an
  // estimate for the next fire, the last batch's authorised ceiling — so the one question a
  // director actually asks ("what has this shot cost me?") had no answer anywhere in the
  // product. The backward figures come from the real ledger via /api/spend; nothing renders
  // if the ledger could not be read, because a blank is honest and a zero is not.
  const sp=shSpendFor(s.shotId);
  const spendBits=[
    (estCost!=null&&led.status!="approved")?`<span>Next fire est. <b class="tnum">$${(estCost*estN).toFixed(2)}</b> (${estN} × ${SH_RES} · <span class="tnum">${fireDur}</span>s)</span>`:"",
    (lastDisc&&lastDisc.maxBatchCostUsd!=null)?`<span>Last authorised batch <b class="tnum">$${lastDisc.maxBatchCostUsd}</b>${lastDisc.resolution?" · "+_esc(lastDisc.resolution):""}</span>`:"",
    sp?`<span class="spent">This shot so far <b class="tnum">${_usd(sp.usd)}</b>`
       +`<span class="spent-sub"> · <span class="tnum">${sp.calls}</span> paid call${sp.calls==1?"":"s"}`
       +((sp.topFile&&sp.topFile.calls>1)?` · <span class="tnum">${sp.topFile.calls}</span>× ${_esc(sp.topFile.name)} = <span class="tnum">${_usd(sp.topFile.usd)}</span>`:"")
       +`</span></span>`:"",
    SH_SPEND?`<span class="spent">Scene <b class="tnum">${_usd(SH_SPEND.sceneUsd)}</b><span class="spent-sub"> · episode <span class="tnum">${_usd(SH_SPEND.episodeUsd)}</span> · estimated from the ledger, not a bill</span></span>`:""
  ].filter(Boolean).join("");
  // THE ENGINE'S OWN QC FINDINGS FOR THIS SHOT — already computed, previously rendered
  // nowhere. Open by default when anything is worse than a WARNING; a shot with no findings
  // renders no band at all rather than an empty "0 issues" reassurance.
  const qcMine=valFor(s.shotId);
  const qcBlocks=qcMine.filter(_valIsBlock).length;
  const qcBand=qcMine.length
    ?`<details class="qcband${qcBlocks?" has-block":""}"${qcBlocks?" open":""}>
        <summary><span class="qcband-n">${qcMine.length}</span> design-check finding${qcMine.length==1?"":"s"} on this shot${qcBlocks?` · <b style="color:var(--danger)">${qcBlocks} blocking</b>`:""} — from the package's own validation</summary>
        <div class="qcrows">${valRowsHTML(qcMine)}</div></details>`
    :"";
  // ONE PRIMARY CALL-TO-ACTION PER SHOT (2026-07-23, Julian, live — "its confusing in terms
  // of whats landed and whats not press continue or fire etc its all wrong"): the CURRENT
  // row alone keeps its primary button; every other row's actions are demoted to quiet
  // ghost buttons, and the header states the one true next step in words. Everything above
  // is derived from the REAL ledger (led.status / keyframeApproval / voiceApproval /
  // departmentWork / batch / pendingSpendAuth / rejections) — never from what the UI last
  // did, and never from file existence alone (the one file-only case is labelled as such).
  const rowsHTML=rows.map((r,i)=>{
    const isCur=(r.tier=="now");
    const k=tok+"|"+r.id;
    const def=r.bodyOpen;
    SH_RUN_DEFAULT[k]=def;
    const open=(SH_RUN_OPEN[k]!==undefined)?SH_RUN_OPEN[k]:def;
    const chip=RUN_CHIP[r.state]||RUN_CHIP.pending;
    // ACTIONS ARE RENDERED BY HIERARCHY, NOT REWRITTEN BY REGEX. The cursor row gets its own
    // decision zone with exactly one primary; every other row's controls are QUIET (a CSS
    // class on the container, never surgery on the button strings) and, because those rows
    // are closed, they are not competing for the eye at all. Nothing is made unreachable:
    // opening the row still shows every control it always had.
    const actionsHTML=runActionsHTML(r.actions,r.tier);
    const bodyHTML=r.body||"";
    // THE NUMBER AND THE NAME COME FROM THE ENGINE'S PANEL TABLE (2026-07-26). The number
    // used to be this loop's own array position and the name a string typed into each row —
    // which is why a document could describe "stage 3 Cinematography" while the screen said
    // "02 · OPENING FRAME" and nobody could tell which was wrong. One table now decides what
    // a human calls each section, and the same table tells the engine what to put in its
    // refusals. A section the table doesn't know falls back to the row's own title rather
    // than rendering blank.
    const sec=panelSection(r.id);
    const num=sec?sec.number:String(i+1).padStart(2,"0");
    const title=sec?sec.name:r.title;
    // The state word is delivered as a class-driven chip, not an inline style — one
    // data-st attribute, three consumers (the chip, the dot, the meter segment).
    const st=RUN_ST[r.state]||"pending";
    // The 52x30 head thumbnail is gone (2026-07-26): the head's job is state and next
    // action, and the artefact is already rendered full size in the body one click away.
    return `<div class="runrow ${r.state} tier-${r.tier} ${isCur?"current":""} ${open?"open":""}" id="runrow_${_esc(r.id)}">
      <span class="runrow-dot"></span>
      <div class="runrow-head" role="button" tabindex="0" aria-expanded="${open?"true":"false"}"
           onclick="shRowToggle('${tok}','${r.id}')"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();shRowToggle('${tok}','${r.id}')}">
        <span class="runrow-num">${_esc(num)}</span>
        <span class="runrow-title">${_esc(title)}</span>
        <span class="runrow-sum">${_esc(r.summary||"")}</span>
        <span class="runrow-state st-chip" data-st="${st}">${chip[0]} ${_esc(r.stateLabel||r.state)}</span>
        <span class="runrow-caret" aria-hidden="true">▶</span>
      </div>
      ${open?`<div class="runrow-body">${bodyHTML}${actionsHTML}</div>`:""}
    </div>`;
  }).join("");
  const terminal=(led.status=="approved");
  const nowLine=current
    ?`<span style="color:var(${(RUN_CHIP[current.state]||RUN_CHIP.pending)[1]})">● NOW · ${_esc(rowHeading(current).toUpperCase())}</span> — ${_esc(current.summary||"")}`
    :`<span style="color:var(--ok)">✓ COMPLETE</span> — approved take on record; it plays in Review below. Rejecting the take is the only action that reopens this shot.`;
  const techPrompt=isOpener?s.keyframePrompt:null;
  // THE INLINE DEPARTMENT SECTION (2026-07-23, Julian's pipeline-layout direction, item 6):
  // the department/decision panel is no longer a permanently-docked third column — it lives
  // inside the runner as a collapsible section. A TERMINAL shot gets no department panels
  // at all (no pending candidates, no approve buttons on a landed shot — reject the take
  // to reopen them).
  const deptOpen=SH_MORE_OPEN[tok+"|dept"]?" open":"";
  const deptToggle=` ontoggle="SH_MORE_OPEN['${tok}|dept']=this.open"`;
  const deptSection=terminal
    ?`<details class="runmore"${deptOpen}${deptToggle}><summary>Departments &amp; technical detail</summary><div id="rundec">
        <div class="dec-caption" style="margin-top:10px">Departments are closed for an approved take — reject the take in Review to reopen them.</div>
        ${s.seedancePrompt?`<details class="techdetails"><summary>Compiled prompts (as shipped)</summary>
          <pre class="techpre">${_esc(s.seedancePrompt||"")}</pre>
          ${techPrompt?`<pre class="techpre" style="margin-top:8px">${_esc(techPrompt)}</pre>`:""}</details>`:""}
      </div></details>`
    :`<details class="runmore"${deptOpen}${deptToggle}><summary>Departments &amp; technical detail</summary><div id="rundec">
        ${s.seedancePrompt?`<details class="techdetails"><summary>Technical details — compiled prompts</summary>
          <div class="techmeta">${s.promptWords?s.promptWords+" words · ":""}<span class="tnum">${_esc(s.durationSec||"")}</span>s · ${_esc(s.sourceType||"")}${s.sourceShotId?" ← "+_esc(s.sourceShotId):""}</div>
          <pre class="techpre">${_esc(s.seedancePrompt||"")}</pre>
          ${techPrompt?`<div class="techmeta" style="margin-top:10px">Keyframe prompt</div><pre class="techpre">${_esc(techPrompt)}</pre>`:""}</details>`:""}
      </div></details>`;
  art.innerHTML=`<div class="runner">
    <div class="runhead">
      <div class="runhead-row">
        <div><div class="runrow-num" style="letter-spacing:.14em">SCENE ${_esc(SH_SC)} · SHOT ${PSHOT_I+1} OF ${shots.length}</div>
          <div class="runhead-id">${_esc(s.shotId)}</div></div>
        <div class="runhead-purpose">${_esc(purpose)}</div>
      </div>
      <div class="runmeter" role="group" aria-label="Section status">${meter}</div>
      <div class="runnow">${nowLine}</div>
      ${spendBits?`<div class="runspend">${spendBits}</div>`:""}
      ${qcBand}
    </div>
    <div class="runrail">${rowsHTML}</div>
    ${deptSection}
  </div>`;
  if(SH_ARRIVED==s.shotId){

function renderContinuityStage(){
  const art=document.getElementById("wartefact"), dec=document.getElementById("wdecision");
  const shots=pShots();
  const rows=shots.map(s=>{
    const led=shLedger(s.shotId), m=shMedia(s.shotId);
    return `<div class="controw"><div class="controw-id">${_esc(s.shotId)}</div>
      <div class="controw-frames">
        ${m.finalFrame?`<img src="${BASE}${m.finalFrame}?v=${MEDIA_V}"/>`:`<div class="noimg">no outgoing frame</div>`}
        <span class="controw-arrow">→</span>
        ${m.keyframe?`<img src="${BASE}${m.keyframe}?v=${MEDIA_V}"/>`:`<div class="noimg">n/a</div>`}
      </div></div>`;
  }).join("");
  art.innerHTML=`<div class="artefact-center" style="text-align:left;overflow:auto">
    <div style="color:var(--muted);margin-bottom:14px">Each shot's outgoing frame beside the next shot's incoming frame.</div>${rows}</div>`;
  // 2026-07-18 correction: this used to say continuity is "verified once EVERY shot in
  // Animation is approved" — a scene-wide claim from the old all-or-nothing lock. Continuity
  // is now read PER SHOT (see shotPipelineState) — a given shot reads "complete" the moment
  // its OWN Animation is approved, independent of any other shot's own progress.
  const per=(SH_PKG&&SH_PKG.shots||[]).map((s,i)=>{
    const mediaMap=(SH_MEDIA&&SH_MEDIA.shots)||{};
    const lineageOk=!!(SH_MEDIA&&SH_MEDIA.lineage&&SH_MEDIA.lineage.current);
    return shotPipelineState(SH_PKG.shots,i,shLedger,mediaMap,lineageOk,shSceneLookOk());
  });
  const completeN=per.filter(p=>p.label=="Complete").length;
  dec.innerHTML=decisionShell("Continuity", completeN+" of "+per.length+" complete",
    [`<div class="dec-caption">Nothing to approve separately here — a shot's continuity reads complete the moment its own Animation is approved, independent of every other shot in the scene.</div>`],"");
  const rs=shots[Math.min(PSHOT_I,Math.max(0,shots.length-1))];

}

// ── THE PACKAGE'S OWN QC FINDINGS (2026-07-26) ───────────────────────────────────────────
// cb_engine validates every production package and writes `validation` into it: passed,
// errors, warnings, and an `issues` list where each entry carries a severity, a code, a
// human message and an EXACT path — "shots[3](S1.SH4).camera". Scene 1 carries ten of them.
// `grep -c "package.validation" app.html` returned 0: they had been rendered zero times,
// ever. The engine had already done the work of saying which field of which shot is wrong
// and why; the screen threw all of it away. Attribution is by the shot id the engine itself
// puts in the path — never by array position, which would silently mis-file every finding
// the moment a shot is inserted or promoted.
const _VAL_PATH_RE=/\(([^)]+)\)\.?(.*)$/;
function valIssues(){ return ((SH_PKG&&SH_PKG.validation&&SH_PKG.validation.issues)||[]); }
function valFor(sid){
  return valIssues().filter(i=>{
    const m=_VAL_PATH_RE.exec(String(i.path||""));
    return !!m&&m[1]==sid;
  });
}
// A finding whose path names no shot belongs to the scene, not to a shot — it is surfaced on
// the scene band so it can never be silently dropped for want of somewhere to put it.
function valSceneWide(){
  return valIssues().filter(i=>!_VAL_PATH_RE.exec(String(i.path||"")));
}
function _valField(path){
  const m=_VAL_PATH_RE.exec(String(path||""));

}

async function shRun(cmd,shotId,opts){
  opts=opts||{};
  let correction=null;
  if(cmd=="reject"){
    // 2026-07-19 fix: matches reject-keyframe/reject-scenelook/reject-voice below — a
    // pre-supplied opts.correction (shRejectBatch's own category dropdown) skips the
    // prompt entirely, never asking the same "why" twice through two different controls.
    correction=(opts.correction!=null?opts.correction:
      (prompt("One-sentence correction for the "+shotId+" batch (goes on record; drives the redesign — 2 rejected batches marks the shot model-limited):","")||"")).trim();
    if(!correction)return;   // cancelled or empty — a rejection always needs its correction
  }
  if(cmd=="reject-keyframe"){
    // THE KEYFRAME LIFECYCLE (2026-07-17): rejection is atomic on the server — archived to
    // History with this exact reason, cleared from the current candidate position, and it
    // can never approve or unlock anything again. A reason is always required, never optional.
    correction=(opts.correction!=null?opts.correction:
      (prompt("Why is this keyframe being rejected? (goes on record in History):","")||"")).trim();
    if(!correction)return;
  }
  if(cmd=="reject-scenelook"){
    // THE SCENE LOOK LIFECYCLE (2026-07-18): rejection archives the plate file itself (the
    // world anchor is never silently reused) and holds every shot's own keyframe validity
    // until a new approved plate lands — the same atomic-on-the-server discipline as
    // reject-keyframe.
    correction=(opts.correction!=null?opts.correction:
      (prompt("Why is this Scene Look Plate being rejected? (goes on record in History):","")||"")).trim();
    if(!correction)return;
  }
  if(cmd=="reject-voice"){
    // THE VOICE APPROVAL STEP (2026-07-19): the same atomic-on-the-server discipline —
    // archives the current take, clears the approval, requires a stated reason.
    correction=(opts.correction!=null?opts.correction:
      (prompt("Why is this voice take being rejected? (goes on record in History):","")||"")).trim();
    if(!correction)return;
  }
  const body={cmd,scene:String(SH_SC),episode:SH_EP};
  if(shotId)body.shotId=shotId;
  if(correction)body.correction=correction;
  if(opts.candidates!=null)body.candidates=opts.candidates;   // fire/next: batch size 1-4
  if(opts.resolution)body.resolution=opts.resolution;         // fire/next: 720p (final) or 480p (cheap test tier) — sealed into the binding hash/envelope server-side
  if(opts.spendToken)body.spendToken=opts.spendToken;         // fire/next: the SERVER-ISSUED single-use token from the shot's ledger pendingSpendAuth — without it the engine validates, prints the SPEND DISCLOSURE, stores the token and REFUSES (the designed step 1); the same token also resumes an interrupted batch
  if(opts.candidate!=null)body.candidate=opts.candidate;      // approve: which candidate wins (C1..CN)
  if(opts.category)body.category=opts.category;               // reject: failure category (REJECT_CATS)
  if(opts.sourcePath)body.sourcePath=opts.sourcePath;          // select-upload/select-library: the holding/library file's own path
  try{
    const r=await fetch(BASE+"/api/shot-run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();
    if(!j.ok){alert("Couldn't start: "+(j.error||"failed"));return;}
    SH_JOB=j.jobId;SH_LAST_JOB=null;SH_POLL_MISSES=0;
    if(typeof showToast=="function")showToast("▶ "+cmd+(shotId?" · "+shotId:"")+" — started",true);
    shPollStart();if(page=="pipeline")renderControl();
  }catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");}
}

    ${(advResult&&advResult.reason)?`<div style="font-size:11px;color:var(--warn);margin-top:6px">ℹ ${_esc(advResult.reason)}</div>`:""}
  </div>`;
}
function closeM(){document.getElementById("modal").classList.remove("show")}
function gateLog(job){
  if(!job||(!job.log&&job.status!="running"))return"";
  return `<details ${job.status=="running"?"open":""} style="margin:10px 0 0"><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Gate ${job.gate} log · ${job.status}</summary><pre style="white-space:pre-wrap;font-size:11px;background:var(--bg);color:var(--ink);padding:11px;border-radius:8px;max-height:260px;overflow:auto;margin:6px 0 0">${(job.log||"(running…)").replace(/</g,"&lt;")}</pre></details>`;
}
async function renderBible(){
  const view=document.getElementById("view");
  let C={};try{C=await fetch(BASE+"/"+projConfig()+"/characters.json",{cache:"no-store"}).then(r=>r.json());}catch(e){}
  const chars=Object.entries(C).filter(([k,v])=>k[0]!=="_"&&v&&typeof v==="object"&&!Array.isArray(v)&&k!=="sizeClasses");
  const url=p=>p?BASE+"/"+String(p).replace(/^\.\.\//,"")+"?v="+Date.now():"";
  const chip=([name,c])=>`<div onclick='openCharacter(${JSON.stringify(name).replace(/'/g,"&#39;")})' style="cursor:pointer;width:118px;text-align:center" title="Open ${name}'s bible page"><div style="aspect-ratio:3/4;background:var(--surface2);border-radius:8px;overflow:hidden">${c.anchor?`<img src="${url(c.anchor)}" style="width:100%;height:100%;object-fit:cover"/>`:''}</div><div style="font-size:12px;font-weight:600;margin-top:4px">${name}</div>${(c.bible&&c.bible.pillar)?`<div style="font-size:10px;color:var(--hint);line-height:1.3">${c.bible.pillar}</div>`:''}</div>`;
  view.innerHTML=`<h1 class="h1">Show Bible</h1><p class="sub">Shared canon across all Crystal Bears episodes. Each character has their own page — click to open their full bible.</p>
    <div class="mc"><div class="lab" style="font-weight:600;color:var(--brandink)">Characters (${chars.length}) — click for the full bible</div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">${chars.map(chip).join("")}</div></div>
    <div id="bb" class="bible" style="margin-top:16px">Loading canon…</div>`;
  const bibleFile=(CURRENT_PROJECT&&CURRENT_PROJECT.showBibleFile)||"CRYSTAL_BEARS_LOCKED_CANON.md";
  let md="";try{md=await (await fetch(BASE+"/"+bibleFile,{cache:"no-store"})).text();}catch(e){md="Could not load the canon.";}
  document.getElementById("bb").innerHTML=window.marked?marked.parse(md):("<pre style='white-space:pre-wrap'>"+md.replace(/</g,"&lt;")+"</pre>");
}
// ── click-to-enlarge lightbox: any img.zoom (keyframes + scene plate) opens an in-app graphical view ──
function openLightbox(src,cap){var lb=document.getElementById('lightbox'),im=document.getElementById('lbimg');im.classList.remove('zoomed');im.style.transform='';im.src=src;document.getElementById('lbcaptxt').textContent=cap||'';document.getElementById('lborig').href=src;lb.classList.add('open');}
function closeLightbox(){var lb=document.getElementById('lightbox');lb.classList.remove('open');document.getElementById('lbimg').src='';}
function lbToggleZoom(e){if(e)e.stopPropagation();var im=document.getElementById('lbimg'),z=im.classList.toggle('zoomed');im.style.transform=z?'scale(2)':'';}
document.addEventListener('click',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('zoom')){e.preventDefault();e.stopPropagation();var cap=t.getAttribute('data-cap')||decodeURIComponent((t.src.split('/').pop()||'').split('?')[0]);openLightbox(t.src,cap);}},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});
// A literal refresh restores project/episode/scene/stage from the URL/hash (2026-07-17) —
// falls back to the existing default (the Projects screen) when there is none.
// "REMEMBER YOUR PLACE": try the real URL hash first (a same-tab refresh); if there's no
// hash at all (fresh tab, bookmark to the bare URL, browser restart), fall back to the last
// place saved in localStorage before giving up to the Projects screen.
_restoreFromHash().then(restored=>{
  if(restored) return;
  let saved=null; try{saved=localStorage.getItem("cb_last_place");}catch(e){}
  if(saved) return _restoreFromHash(saved).then(r2=>{ if(!r2) bootProjects(); });
  bootProjects();
});
// Started exactly once, at real app load — independent of which project/page ends up
// rendering, so the global status bar is live before anything is even clicked.
globalPollTick();
GLOBAL_POLL=setInterval(globalPollTick,2000);
// THE "STUDIO UPDATED — REFRESH" TOAST (2026-07-23, Julian live — his open tab kept running
// the PRE-fix interface after the server had already hot-reloaded the fixed software behind
// it, so real fixes looked like they'd never landed): the server restarts itself on any
// source change (its own freshness watch) but a browser tab never does. Watch the server's
// own /api/health start fingerprint; when it changes, tell the user plainly, once per change.
let SRV_FP=null,SRV_TOAST_AT=0;
async function _srvFreshTick(){
  try{
    const h=await (await fetch(BASE+"/api/health",{cache:"no-store"})).json();
    if(SRV_FP==null){SRV_FP=h.started;return;}
    if(h.started!==SRV_FP&&Date.now()-SRV_TOAST_AT>60000){
      SRV_FP=h.started;SRV_TOAST_AT=Date.now();
      if(typeof showToast=="function")
        showToast("⟳ The Studio software just updated behind this page — refresh (Cmd-Shift-R) to load the latest interface.",true);
    }
  }catch(e){}
}
setInterval(_srvFreshTick,15000);_srvFreshTick();
