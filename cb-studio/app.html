    <div class="ofc-row"><button class="btn ghost" onclick="document.getElementById('slUpload').click()">⇧ Upload image — no generation cost</button>
      <input type="file" id="slUpload" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="slUpload(this)"/></div>
    <div class="ofc-row"><button class="btn ghost" onclick="slLibrary()">▤ Choose from library — no generation cost</button></div>
  </div>`;
}
async function slUpload(input){
  // THE NON-GENERATION SCENE LOOK UPLOAD (2026-07-19 — "still not letting me upload a
  // library image, i select it then it wants to generate"): mirrors shOpenFrameUpload's own
  // zero-cost pattern exactly — the uploaded file becomes the candidate directly via
  // select-scenelook-upload, never a reference fed into a fresh AI generation.
  const file=input.files&&input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=async()=>{
    try{
      const r=await fetch(BASE+"/api/scenelook-upload",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({scene:String(SH_SC),episode:SH_EP,filename:file.name,dataB64:reader.result})});
      const j=await r.json();
      if(!j.ok){alert("Upload failed: "+(j.error||"unknown error"));return;}
      await shRun('select-scenelook-upload',null,{sourcePath:j.sourcePath});
    }catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");}
    input.value="";
  };
  reader.readAsDataURL(file);
}
async function slLibrary(){
  // THE REAL REUSABLE LIBRARY (2026-07-19 correction — "the library has to come from the
  // scenes houses etc"): mirrors openScenePicker()'s own aggregation exactly (uploaded scene
  // refs + every episode scene's own plate + the cb-seed/assets/locations manifest + every
  // character's house imagery), the same sources the Scenes/Houses nav pages already show —
  // never a scene's own generation history alone. A pick becomes the CANDIDATE DIRECTLY (no
  // generation cost, 2026-07-19 correction — "still not letting me upload... it wants to
  // generate"), the same zero-cost contract as the keyframe Asset Library picker.
  const u=p=>String(p).replace(/^\.\.\//,"");
  let L={uploadedRefs:[],scenes:[],manifest:{}}, HS={houses:[]};
  try{L=await fetch(BASE+"/api/loclib",{cache:"no-store"}).then(r=>r.json());}catch(e){}
  try{HS=await fetch(BASE+"/api/houses",{cache:"no-store"}).then(r=>r.json());}catch(e){}
  const groups=[];
  const uploaded=(L.uploadedRefs||[]).map(r=>({file:u(r.file),name:r.name}));
  if(uploaded.length)groups.push(["Uploaded scene references",uploaded]);
  const scenePlates=(L.scenes||[]).filter(s=>s.plate).map(s=>({file:'engine/media/'+s.plate,name:'Scene '+s.scene+' · '+(s.name||s.locationId)}));
  if(scenePlates.length)groups.push(["Episode scene plates",scenePlates]);
  const manifestItems=Object.entries(L.manifest||{}).filter(([k])=>k[0]!=='_').map(([lid,e])=>({file:'cb-seed/assets/locations/'+e.file,name:(e.name||lid)}));
  if(manifestItems.length)groups.push(["Location library",manifestItems]);
  const houseItems=[];
  (HS.houses||[]).forEach(h=>{
    if(h.interior)houseItems.push({file:u(h.interior),name:h.character+"'s House — Inside"});
    if(h.exterior)houseItems.push({file:u(h.exterior),name:h.character+"'s House — Outside"});
  });
  if(houseItems.length)groups.push(["Houses",houseItems]);
  const body=groups.length?groups.map(([label,opts])=>`
      <div class="dec-caption" style="margin:14px 0 8px;font-weight:600">${_esc(label)}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px">
        ${opts.map(o=>`<button type="button" aria-label="Use ${_attr(o.name)}" onclick="slLibraryPick('${_esc(o.file).replace(/'/g,"\\'")}')" style="font:inherit;color:inherit;text-align:left;background:none;border:0;padding:0;cursor:pointer">
          <div style="aspect-ratio:16/9;background:var(--surface2);border-radius:8px;overflow:hidden;border:1px solid var(--line)"><img src="${BASE}/${_esc(o.file)}?v=${MEDIA_V}" style="width:100%;height:100%;object-fit:cover"/></div>
          <div style="font-size:11px;color:var(--hint);text-align:center;margin-top:4px">${_esc(o.name)}</div></button>`).join("")}
      </div>`).join("")
    : `<div class="artefact-empty"><div style="color:var(--muted)">No location, house or uploaded scene references exist yet — add one from the Scenes or Houses tab.</div></div>`;
  document.getElementById("sheet").innerHTML=`<button class="x" onclick="closeM()">×</button>
    <h3>Reference library</h3>
    <div class="dec-caption" style="margin-bottom:4px">The same locations, houses and uploaded scene references shown in the Scenes/Houses tabs. Click one to use it directly as Scene ${_esc(SH_SC)}'s Look Plate candidate — no generation cost, awaiting your approval.</div>
    ${body}
    <div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn ghost" onclick="closeM()">Cancel</button></div>`;
  document.getElementById("modal").classList.add("show");
}
async function slLibraryPick(file){
  closeM();
  await shRun('select-scenelook-library',null,{sourcePath:file});
}
function shNextLedger(){   // the shot `next` will fire — the FIRST unapproved shot's ledger carries the spend auth
  return ((SH_PKG&&SH_PKG.continuityLedger)||[]).find(e=>e.status!="approved")||null;
}
function shDiscSummary(auth){   // human summary of the server-stored disclosure — defensive against field-name drift while the engine lands in parallel
  const d=(auth&&auth.disclosure)||{};
  if(typeof d=="string")return d.slice(0,400);
  const pick=(...ks)=>{for(const k of ks)if(d[k]!=null&&d[k]!=="")return d[k];return "?";};
  return "candidates: "+pick("candidates","candidateCount","count")
       +"\ncost per candidate: $"+pick("costPerCandidateUsd","costPerCandidate","perCandidate","candidateCost")
       +"\nmax batch cost: $"+pick("maxBatchCostUsd","maxBatchCost","maxCost","batchCost")
       +"\nprompt version: "+pick("promptVersion","promptVer","version");
}
function shDiscCount(auth){   // the candidate count the token is BOUND to (null if unreadable — then omit --candidates and let the binding decide)
  const d=(auth&&auth.disclosure)||{};
  const n=d.candidates!=null?d.candidates:(d.candidateCount!=null?d.candidateCount:d.count);
  return (n!=null&&isFinite(+n))?+n:null;
}
function shApproveSpendFire(shotId){
  const led=shLedger(shotId);
  const auth=led&&led.pendingSpendAuth;
  if(!auth||!auth.token){alert("No pending spend authorization on "+((led&&led.shotId)||"the next shot")+" — run “📋 Disclose cost & prepare batch” first. The engine validates the batch, prints the disclosure and issues the single-use token.");return;}
  if(!confirm("PAID BATCH — approve this exact disclosed spend for "+(led.shotId||"the next shot")+"?\n\n"+shDiscSummary(auth)+"\n\nThe token is SINGLE-USE and bound to this exact prompt/keyframe/refs/audio/duration/count — if anything has changed since the disclosure, the engine refuses and you re-run the disclosure."))return;
  const n=shDiscCount(auth);
  const opts={spendToken:auth.token};
  if(n!=null)opts.candidates=n;   // send the BOUND count (a different N would just make the token stale); omit when unreadable
  shRun('fire',shotId,opts);
}
function shResumeBatch(token,shotId){
  if(!confirm("Resume the interrupted batch for "+shotId+"?\n\nOnly the MISSING candidates are generated — same single-use token, no new spend authorization, no repay of the finished ones."))return;
  shRun('fire',shotId,{spendToken:token});
}
function shRejectBatch(tok){
  const sel=document.getElementById("shCat_"+tok);
  shRun('reject',tok,{category:(sel&&sel.value)||"other"});
}
async function _shPollTick(){
  let jobs={};
  try{jobs=(((await (await fetch(BASE+"/api/jobs")).json())||{}).jobs)||{};}catch(e){return;}
  // THE LIVE PROGRESS BAR (2026-07-19, Julian — "when we fire anything we need a progress
  // or status bar, you don't know what's happening, is it firing etc"): the pulsing "●"
  // banner (renderJobBanner/jobFor) already existed but reads from PJOBS, which nothing
  // kept in sync with THIS poll's own live data — so for a job's entire running duration
  // the banner sat on whatever PJOBS happened to hold at the last full page load (almost
  // always nothing, since the job didn't exist yet then), showing literally nothing after
  // the one-time "started" toast until the job finished. Root-caused, not a symptom patch:
  // sync the shared PJOBS from every tick so the banner's own existing data source is
  // actually current.
  PJOBS=jobs;
  const j=SH_JOB?jobs[SH_JOB]:null;
  if(!j){
    // THE VANISHED-JOB CASE (2026-07-19): a job ID that's no longer in the server's JOBS
    // dict — most likely the server restarted mid-fire (JOBS is in-memory, wiped on
    // restart) — used to leave the poll spinning forever with zero feedback. Three
    // consecutive misses (~7.5s) before giving up, so one slow/racy fetch right after
    // the job was just created doesn't false-trigger this.
    SH_POLL_MISSES++;
    if(SH_POLL_MISSES>=3){
      clearInterval(SH_POLL);SH_POLL=null;SH_JOB=null;SH_POLL_MISSES=0;
      if(typeof showToast=="function")showToast("Lost track of that job — the studio server may have restarted mid-run. Reload to check the real status.",false);
      await shFetchPkg();if(page=="pipeline")renderControl();
    }
    return;
  }
  SH_POLL_MISSES=0;
  if(j.status!="running"){
    clearInterval(SH_POLL);SH_POLL=null;SH_JOB=null;
    // Stash the outcome so renderJobBanner() can show it — the running-only jobFor()
    // query would otherwise lose this the instant status flips (see SH_LAST_JOB above).
    SH_LAST_JOB=j;
    // A COMPLETED FIRE INVALIDATES THE WORKING-VERSION CACHES TOO (2026-07-19, found while
    // proving the progress-banner fix live): shFetchPkg() already refreshes SH_PKG/SH_MEDIA,
    // but SH_VOICE_CACHE/SH_SEEDANCE_CACHE/SH_STRUCTURE_CACHE are separate, lazily-loaded
    // caches (shLoadVoiceWork etc. only fetch when a shot's own entry is missing) — a real
    // voice regeneration just proved this stays silently stale: the "current take generated
    // at" / "previous take" comparison panel kept showing the PRE-fire take/timestamps
    // after the job finished, because nothing told it to re-fetch. Cleared unconditionally
    // on every completed job, not just voice ones — any fire (keyframe, animation) could
    // equally leave one of these three stale.
    SH_VOICE_CACHE={};SH_SEEDANCE_CACHE={};SH_STRUCTURE_CACHE={};SH_READBACK_CACHE={};
    await shFetchPkg();if(page=="pipeline")renderControl();else renderJobBanner();
    return;
  }
  // STILL RUNNING — refresh the visible banner every tick so the pulsing indicator and
  // the job's own real step text (cb-studio/serve.py's _humanise(line), updated live as
  // the subprocess prints progress) actually change on screen instead of sitting frozen.
  if(page=="pipeline")renderJobBanner();
}
function shPollStart(){
  if(SH_POLL)clearInterval(SH_POLL);
  SH_POLL_MISSES=0;
  _shPollTick();   // fire immediately — don't make the banner wait out the first 2.5s tick
  SH_POLL=setInterval(_shPollTick,2500);
}
function shDismissLastJob(){SH_LAST_JOB=null;renderJobBanner();}
function shJobHTML(j){
  // Two refusals are EXPECTED, informative behaviour, never a malfunction: the no-token spend DISCLOSURE
  // (the designed step 1) and the unconfirmed-billing-profile hard block — both render amber, not red.
  const raw=j.log||"";
  const billing=/billing_profile/i.test(raw);
  const disclosure=/SPEND DISCLOSURE|SPEND NOT APPROVED|spend token/i.test(raw)&&j.status!="running"&&j.status!="done";
  const informative=billing||disclosure;
  const col=j.status=="running"?"var(--info)":(j.status=="done"?"var(--ok)":(informative?"var(--warn)":"var(--danger)"));
  const log=_esc(raw.split("\n").slice(-14).join("\n"));
  return `<div style="border:1px solid var(--line);border-left:3px solid ${col};border-radius:8px;padding:9px 11px;margin:0 0 12px">
    <div style="font-size:12px;font-weight:600;color:${col}">${j.status=="running"?"⟳":(j.status=="done"?"✓":(informative?"ℹ":"✗"))} ${_esc(String(j.gate))} — ${_esc(j.step||j.status||"")}</div>
    ${log?`<pre style="font-size:10px;line-height:1.45;color:var(--hint);white-space:pre-wrap;margin:6px 0 0;max-height:150px;overflow:auto">${log}</pre>`:""}
    ${disclosure&&!billing?`<div style="font-size:11px;color:var(--warn);margin-top:6px">ℹ This REFUSED run is the designed disclosure step — the spend token is now stored on the shot; review the numbers above, then “💳 Approve spend &amp; fire”.</div>`:""}
    ${billing?`<div style="font-size:11px;color:var(--warn);margin-top:6px">ℹ Billing profile not confirmed — every paid generation (voice / keyframe / fire) is hard-blocked by design until Julian confirms the plan in billing_profile.json. This refusal is expected protective behaviour, not a malfunction.</div>`:""}
  </div>`;
}
function closeM(){document.getElementById("modal").classList.remove("show")}
function gateLog(job){
  if(!job||(!job.log&&job.status!="running"))return"";
  return `<details ${job.status=="running"?"open":""} style="margin:10px 0 0"><summary style="cursor:pointer;font-size:12px;color:var(--muted)">Gate ${job.gate} log · ${job.status}</summary><pre style="white-space:pre-wrap;font-size:11px;background:var(--bg);color:var(--ink);padding:11px;border-radius:8px;max-height:260px;overflow:auto;margin:6px 0 0">${(job.log||"(running…)").replace(/</g,"&lt;")}</pre></details>`;
}
async function renderBible(){
  const view=document.getElementById("view");
  let C={},L={current:false,episodeReady:false,blockers:[],episodeBlockers:[],warnings:[],characters:[]};
  try{[C,L]=await Promise.all([
    fetch(BASE+"/"+projConfig()+"/characters.json",{cache:"no-store"}).then(r=>r.json()),
    fetch(BASE+"/api/canon-lock?episode=Ep1",{cache:"no-store"}).then(r=>r.json())
  ]);}catch(e){}
  const chars=Object.entries(C).filter(([k,v])=>k[0]!=="_"&&v&&typeof v==="object"&&!Array.isArray(v)&&k!=="sizeClasses");
  const lockChars=Object.fromEntries((L.characters||[]).map(x=>[x.name,x]));
  const url=p=>p?BASE+"/"+String(p).replace(/^\.\.\//,"")+"?v="+Date.now():"";
  const chip=([name,c])=>{const row=lockChars[name]||{},ready=!!row.productionReady;return `<button type="button" onclick='openCharacter(${JSON.stringify(name).replace(/'/g,"&#39;")})' style="font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;width:118px;text-align:center" title="Open ${_attr(name)}'s bible page"><div style="aspect-ratio:3/4;background:var(--surface2);border-radius:8px;overflow:hidden;border:2px solid ${ready?'var(--ok)':'var(--warn)'}">${c.anchor?`<img src="${url(c.anchor)}" style="width:100%;height:100%;object-fit:cover"/>`:''}</div><div style="font-size:12px;font-weight:600;margin-top:4px">${_esc(name)}</div><div style="font-size:10px;color:${ready?'var(--ok)':'var(--warn)'}">${ready?'Locked':_esc(row.status||'Incomplete')}</div>${(c.bible&&c.bible.pillar)?`<div style="font-size:10px;color:var(--hint);line-height:1.3">${_esc(c.bible.pillar)}</div>`:''}</button>`};
  const readyCount=(L.characters||[]).filter(x=>x.productionReady).length;
  const stubs=(L.characters||[]).filter(x=>x.status==="stub").map(x=>x.name);
  const issues=[...(L.blockers||[]),...(L.episodeBlockers||[])];
  const issueRows=issues.map(x=>`<div class="canonissue"><span class="canonissue-msg">${_esc(x.message||x.code)}</span><span class="canonissue-action">${_esc(x.action||"")}</span></div>`).join("");
  const aliasWarnings=(L.warnings||[]).filter(x=>x.code==="SCRIPT_CHARACTER_ALIAS");
  const locationPending=(L.warnings||[]).filter(x=>x.code==="LOCATION_VISUAL_MASTER_PENDING").length;
  const creativePending=(L.warnings||[]).filter(x=>x.code==="CANON_CREATIVE_GAP"&&!String(x.message||"").includes("optional performance-overlay"));
  const lockColour=L.current?(L.episodeReady?'var(--ok)':'var(--danger)'):'var(--danger)';
  const lockTitle=L.current?(L.episodeReady?'Canon lock current · Episode 1 ready':'Canon lock current · Episode 1 blocked'):'Canon lock missing or stale';
  const lockPanel=`<div style="border-top:3px solid ${lockColour};border-bottom:1px solid var(--line);padding:12px 0 14px;margin:14px 0 18px">
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap"><div><div style="font-weight:700;color:${lockColour}">${lockTitle}</div><div style="font-size:12px;color:var(--muted);margin-top:3px">${L.sourceCount||0} signed sources · ${L.assetCount||0} signed assets · ${readyCount} production-ready characters${stubs.length?` · ${_esc(stubs.join(", "))} stub`:''}</div></div><code style="font-size:11px">${_esc((L.manifestDigest||"").slice(0,12))}</code></div>
    ${issueRows?`<div style="margin-top:10px">${issueRows}</div>`:`<div style="font-size:12px;color:var(--ok);margin-top:8px">All Episode 1 cast, script and canon checks pass.</div>`}
    ${aliasWarnings.map(x=>`<div style="font-size:12px;color:var(--warn);margin-top:7px">${_esc(x.message)}</div>`).join("")}
    ${creativePending.map(x=>`<div style="font-size:12px;color:var(--warn);margin-top:7px">${_esc(x.character+": "+x.message)}</div>`).join("")}
    ${locationPending?`<div style="font-size:12px;color:var(--muted);margin-top:7px">${locationPending} scene visual masters will be locked through Scene Look approval.</div>`:""}
  </div>`;
  view.innerHTML=`<h1 class="h1">Show Bible</h1><p class="sub">Shared canon across all Crystal Bears episodes. Each character has their own page — click to open their full bible.</p>
    ${lockPanel}
    <div class="mc"><div class="lab" style="font-weight:600;color:var(--brandink)">Characters (${chars.length}) — click for the full bible</div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:10px">${chars.map(chip).join("")}</div></div>
    <div id="bb" class="bible" style="margin-top:16px">Loading canon…</div>`;
  const bibleFile=(CURRENT_PROJECT&&CURRENT_PROJECT.showBibleFile)||"CRYSTAL_BEARS_LOCKED_CANON.md";
  let md="";try{md=await (await fetch(BASE+"/"+bibleFile,{cache:"no-store"})).text();}catch(e){md="Could not load the canon.";}
  document.getElementById("bb").innerHTML=window.marked?marked.parse(md):("<pre style='white-space:pre-wrap'>"+md.replace(/</g,"&lt;")+"</pre>");
}
// ── click-to-enlarge lightbox: any img.zoom (keyframes + scene plate) opens an in-app graphical view ──
function openLightbox(src,cap){var lb=document.getElementById('lightbox'),im=document.getElementById('lbimg');im.classList.remove('zoomed');im.style.transform='';im.src=src;document.getElementById('lbcaptxt').textContent=cap||'';document.getElementById('lborig').href=src;lb.classList.add('open');}
function closeLightbox(){var lb=document.getElementById('lightbox');lb.classList.remove('open');document.getElementById('lbimg').src='';}
function lbToggleZoom(e){if(e)e.stopPropagation();var im=document.getElementById('lbimg'),z=im.classList.toggle('zoomed');im.style.transform=z?'scale(2)':'';}
document.addEventListener('click',function(e){var t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('zoom')){e.preventDefault();e.stopPropagation();var cap=t.getAttribute('data-cap')||decodeURIComponent((t.src.split('/').pop()||'').split('?')[0]);openLightbox(t.src,cap);}},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});
// A literal refresh restores project/episode/scene/stage from the URL/hash (2026-07-17) —
// falls back to the existing default (the Projects screen) when there is none.
// "REMEMBER YOUR PLACE": try the real URL hash first (a same-tab refresh); if there's no
// hash at all (fresh tab, bookmark to the bare URL, browser restart), fall back to the last
// place saved in localStorage before giving up to the Projects screen.
_restoreFromHash().then(restored=>{
  if(restored) return;
  let saved=null; try{saved=localStorage.getItem("cb_last_place");}catch(e){}
  if(saved) return _restoreFromHash(saved).then(r2=>{ if(!r2) bootProjects(); });
  bootProjects();
});
