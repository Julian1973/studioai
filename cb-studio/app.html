:root{
  --bg:#14201a;--surface:#1c2921;--surface2:#223227;--ink:#edf4ee;--muted:#93a89b;--hint:#6b8074;--line:#33473a;
  --brand:#2f9e8f;--brandbg:#1d2f2b;--brandink:#6fe0cf;
  --spark:#f0b542;--sparkbg:#2a2419;--deep:#e8825f;--deepbg:#2c2119;--heart:#e893b5;--heartbg:#2a1e24;
  --conn:#a78bfa;--connbg:#241f36;--rip:#52c9b8;--ripbg:#1a2a28;--ok:#3ecf8e;--okbg:#16281f;--info:#6ab0e8;--infobg:#1a2430;
  --danger:#e8785a;--dangerbg:#2a1a16;
  --warn:#e8b25a;--warnbg:#2a2318;
}
*{box-sizing:border-box}
input,textarea,select{background:var(--surface2);color:var(--ink);accent-color:var(--brand)}
body{margin:0;font-family:'Body Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Label Sans',sans-serif;background:transparent;color:var(--ink);border:0;padding:0}
.logo{width:28px;height:28px;border-radius:8px;background:var(--brandbg);color:var(--brand);display:flex;align-items:center;justify-content:center}
.toplinks{display:flex;gap:8px;align-items:center}
.tl{font:inherit;font-size:13px;color:var(--muted);padding:6px 12px;border-radius:8px;cursor:pointer;background:transparent;border:0}
.tl:hover{background:var(--brandbg);color:var(--brandink)}
.tl.on{background:var(--brandbg);color:var(--brandink);font-weight:600}
.epchip{font-size:12px;color:var(--brandink);background:var(--brandbg);border-radius:8px;padding:5px 12px}
.gates{display:flex;gap:8px;align-items:center;padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--hint);flex-wrap:wrap}
.gates .on{color:var(--brandink);font-weight:600}.gates .done{color:var(--ok)}
.shell{display:flex;min-height:calc(100vh - 98px)}
.nav{width:172px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:10px}
.nav a,.nav button{display:flex;width:100%;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer;margin-bottom:2px;background:transparent;border:0;font:inherit;text-align:left}
.nav a.active,.nav button.active{background:var(--brandbg);color:var(--brandink);font-weight:600}.nav a:hover:not(.active),.nav button:hover:not(.active){background:var(--surface2)}
.nav .sep{border-top:1px solid var(--line);margin:8px 6px}
.main{flex:1;padding:22px 26px;min-width:0}
.h1{font-size:21px;font-weight:900;margin:0 0 2px;font-family:'Display Slab',Georgia,serif}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}
.epgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.epcard{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .12s;display:flex;flex-direction:column}
.epcard:hover{border-color:var(--brand)}
.epthumb{height:96px;background:#1a2b24;display:flex;align-items:center;justify-content:center;color:#7fd4c1;font-size:13px}
.epbody{padding:12px 14px;display:flex;flex-direction:column;flex:1}
.epbody .n{font-size:11px;color:var(--hint);font-weight:600}
.epbody .t{font-size:15px;font-weight:900;margin:2px 0 6px;font-family:'Display Slab',Georgia,serif}
.epbody .l{font-size:12px;color:var(--muted);line-height:1.4;height:50px;overflow:hidden}
.stat{display:inline-flex;align-items:center;gap:5px;font-size:10px;border-radius:6px;padding:3px 8px;margin-top:8px}
.epactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:12px}
.epactions .btn{margin:0;padding:8px 12px;font-size:12px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;font:inherit}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}
.addcard{border:1.5px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--brand);cursor:pointer;min-height:170px;font:inherit;font-weight:500;background:transparent}
.addcard:hover{border-color:var(--brand);background:var(--brandbg)}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;max-width:640px}

.coming{color:var(--hint);font-size:13px;padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ── Gate-flow spine: the 4-gate rail + active panel ── */
.grail{display:flex;align-items:stretch;gap:0;margin:14px 0 4px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.gnode{flex:1;min-width:118px;text-align:center;padding:11px 8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:box-shadow .25s,border-color .25s,transform .2s;position:relative}
.gnode:hover{border-color:var(--brand)}

.sstrip{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 2px}

/* ── Linear Gated Cascade (Ticket 4): stage rail + per-beat timeline + panel ── */

.cbeat .cbst{font-size:10.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}

/* THE PRODUCTION CONTROL ROOM (2026-07-17 UX replacement) — one sequential pipeline: */
:root{--honey:#d9a441;--honeybg:#2e2416}
:root{--deep:#e8825f;--deepbg:#2c2119}

/* ── THE PRODUCTION OPERATING SYSTEM — Scene Board + Scene Workspace ── */
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}

.cchead{font-size:13px;font-weight:600;margin-bottom:6px}

<script>
const BASE=window.location.origin;
const PILL={Spark:["--spark","--sparkbg"],Deepening:["--deep","--deepbg"],Heart:["--heart","--heartbg"],Connection:["--conn","--connbg"],Ripple:["--rip","--ripbg"]};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const v=n=>getComputedStyle(document.documentElement).getPropertyValue(n);
let EPISODES=[],MEDIA=[],CUR=null,SHOTS=[],PREFIX="",page="episodes",MEDIA_V=0,CHARCFG={},SCENELIB=null,RETAKES_DRAFT=[],RT_SN=null;

// ── ONE PIPE (scene-spine). Script in → the Pipeline runs each scene Storyboard→Keyframes→Animation→Post, locked
//    until the prior stage is signed, scenes unlocking in order. Cascade + the standalone boards are gone (one door per action).
const NAV=[["sceneboard","Production","◈"]];

function mediaFor(s){const codes=[s&&s.shotCode,s&&s.id].filter(x=>x!=null&&x!=="");const slug=s&&s.slug;
  // Show the keyframe/clip for the beat's CURRENT slug — NOT just the first .png matching the code. Multiple
  // generations can leave several files per code (old KF_v2, retired slugs); keying on the exact slug makes the
  // studio show the SAME file the backend writes (Ep1_{code}_{slug}.png), so a stale one can never shadow it.
  for(const c of codes){const pre=PREFIX+c+"_";const f=MEDIA.filter(m=>m.startsWith(pre));if(!f.length)continue;
    const exact=(ext)=>slug&&f.includes(pre+slug+ext)?pre+slug+ext:null;
    return{key:  exact(".png")||f.find(m=>m.endsWith(".png")),
           clip: exact(".mp4")||f.find(m=>m.endsWith(".mp4")&&!m.includes("BROADCAST")),
           final:f.find(m=>m.endsWith("BROADCAST.mp4"))};}
  return{};}
function statusOf(m){if(m.final)return["--ok","--okbg","● final"];if(m.clip)return["--info","--infobg","● clip"];if(m.key)return["--ok","--okbg","● keyframe"];return["--hint",null,"○ draft"];}
// ── THE UNIT IS THE BEAT (10–12s). A beat directs its own internal cuts. Old episodes may still be
//    shot-shaped — normalise a beat so every existing view renders it; legacy shots pass straight through. ──
function normBeat(b){
  if(!b||b.shotCode||!b.beatCode) return b;                 // already shot-shaped (legacy) or not a beat
  const cuts=b.cuts||[], dlg=cuts.filter(c=>c.dialogue).map(c=>c.dialogue).join("   ");
  const f0=(cuts[0]&&cuts[0].framing)||"";
  return Object.assign({}, b, {
    _beat:true, _cuts:cuts,
    shotCode:b.beatCode, duration:b.durationSec, action:b.storyBeat||"",
    dialogue:dlg||null, speaker:(b.speakers||[])[0]||null,
    shotSize:(f0?f0.split(/[,(]/)[0].trim():(cuts.length+" cuts")), movement:b.cameraArc||"", angle:"", lens:"",
    intent:{pillar:cap(b.pillar||"spark"), intensity:b.intensity, beat:b.emotionalIntent||"", emotion:"", musicMood:b.soundIntent||""}
  });
}

var CURRENT_PROJECT=null, PROJECTS=[], WIZ=null;

// ── NAVIGATION CONTEXT, IN THE URL/HASH — NEVER A SECOND PRODUCTION-STATE STORE (2026-07-17
// state-integrity checkpoint): the hash records WHERE the user is (project/episode/scene/
// stage) so a literal refresh returns them to the same place — it never carries any
// production DATA (approval, lineage, ledger fields), which is always re-fetched fresh from
// the server on every render, exactly as before this was added. This is the ONLY place the
// hash is read or written; everything else keeps working from the same live globals it
// always has (CURRENT_PROJECT/page/SH_EP/SH_SC/PSTAGE) — the hash just mirrors them.
function _navHash(){
  const p=new URLSearchParams();
  if(CURRENT_PROJECT) p.set('p',CURRENT_PROJECT.id);
  if(page) p.set('pg',page);
  if((page=="sceneboard"||page=="pipeline")&&SH_EP) p.set('ep',SH_EP.replace(/^Ep/,''));
  if(page=="pipeline"){
    if(SH_SC) p.set('sc',SH_SC);
    if(PSTAGE) p.set('st',PSTAGE);
    // 2026-07-19 addition: WHICH SHOT within the scene — by shotId, never the raw array
    // index, so a beat/shot added or removed before the next visit can't silently point
    // "your place" at the wrong shot. Falls back cleanly (index clamped to 0) if the
    // remembered shotId no longer exists.
    const shots=(SH_PKG&&SH_PKG.shots)||[];
    if(shots[PSHOT_I]) p.set('shot',shots[PSHOT_I].shotId);
  }
  return p.toString();
}
function _syncHash(){
  try{
    const h=_navHash();
    history.replaceState(null,'',h?('#'+h):(location.pathname+location.search));
    // "REMEMBER YOUR PLACE" (2026-07-19, Julian's directive): the hash alone only survives
    // a same-tab refresh — closing the tab, restarting the browser, or opening the bare
    // URL/a bookmark loses it, dropping back to Projects every time. Mirroring it into
    // localStorage means the LAST place synced is recoverable even with no hash in the URL
    // at all. Same "navigation context only, never production data" boundary as the hash
    // itself — this is just where you were, always re-fetched fresh from the server.
    localStorage.setItem("cb_last_place",h);
  }catch(e){}
}
// _restoreFromHash(raw) — restores from an explicit hash string when given (the localStorage
// fallback below passes its saved value here), else from the real location.hash.
async function _restoreFromHash(raw){
  if(raw==null) raw=(location.hash||"").replace(/^#/,"");
  if(!raw) return false;
  const params=new URLSearchParams(raw);
  const pid=params.get('p');
  if(!pid) return false;
  try{PROJECTS=(((await fetch(BASE+"/api/projects",{cache:"no-store"}).then(r=>r.json()))||{}).projects)||[];}catch(e){PROJECTS=[];}
  const proj=PROJECTS.find(x=>x.id===pid);
  if(!proj) return false;
  CURRENT_PROJECT=proj; CUR=null; SHOTS=[]; page="episodes";
  await boot();
  const pg=params.get('pg')||'episodes', epNum=params.get('ep');
  if(pg=='characters'){showCharacters();return true;}
  if(pg=='scenes'){showScenes();return true;}
  if(pg=='houses'){showHouses();return true;}
  if(pg=='bible'){showBible();return true;}
  if(pg=='episodes'||!epNum) return true;   // boot() already rendered + synced the hash
  if(!(await openEpisode(epNum))) return false;
  const scId=params.get('sc');
  if(pg=='sceneboard'||!scId) return true;
  openScene(scId);
  await pLoadAll();
  const shotId=params.get('shot');
  if(shotId){
    const i=pShots().findIndex(s=>s.shotId==shotId);
    if(i>=0) PSHOT_I=i;
  }
  const st=params.get('st');
  if(st){ PSTAGE=null; pFocusStage(st); }
  renderControl();
  return true;
}
// REVIEWER IDENTITY (2026-07-08, Production Management panel finding — "no reviewer/role concept in code
// at all"): a persisted name sent with every sign-off, so who-approved-what is recorded before a second
// reviewer ever joins. Not a real auth system — just an identity string on the lock.
var REVIEWER=localStorage.getItem("cb_reviewer")||"Julian";
function setReviewer(v){REVIEWER=(v||"Julian").trim()||"Julian";localStorage.setItem("cb_reviewer",REVIEWER);}
{const _ri=document.getElementById("reviewer_name"); if(_ri) _ri.value=REVIEWER;}
const ANIM_TYPES=[
  {v:"Premium stylized 3D CGI",d:"Rendered 3D — tactile materials, expressive staging and motivated light."},
  {v:"2D hand-drawn (cel)",d:"Traditional drawn — linework, painted frames."},
  {v:"2D vector / flat",d:"Modern flat / motion-graphic — clean bold shapes."},
  {v:"Stop-motion / claymation",d:"Tactile — clay, puppets, real-set lighting."}
];
function projConfig(){return (CURRENT_PROJECT&&CURRENT_PROJECT.configBase)||"engine/config";}
function projPkgBase(){return (CURRENT_PROJECT&&CURRENT_PROJECT.packageBase)||"cb-output";}
function _esc(s){return (''+(s==null?'':s)).replace(/[<>&]/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c];});}
function _attr(s){return _esc(s).replace(/"/g,"&quot;");}
function actionButtonHTML(action){
  if(!action||!action.label||!action.onclick)return "";
  const cls=action.kind==="secondary"?"btn ghost":"btn";
  return `<button type="button" class="${cls}" onclick="${_attr(action.onclick)}"${action.disabled?" disabled":""}>${_esc(action.label)}</button>`;
}
function outcomePanelHTML(opts){
  opts=opts||{};
  let actions=(opts.actions||[]).filter(a=>a&&a.label&&a.onclick);
  if(!actions.length){
    actions=[CURRENT_PROJECT
      ?{label:CUR?"Open production":"Open episodes",onclick:CUR?"go('sceneboard')":"goHome()"}
      :{label:"Open projects",onclick:"bootProjects()"}];
  }
  return `<section class="outcome ${_esc(opts.tone||"ready")}" aria-label="Current outcome">
    <div class="outcome-copy">
      <div class="outcome-kicker">${_esc(opts.kicker||"Outcome")}</div>
      <div class="outcome-title">${_esc(opts.title||"Choose the next action")}</div>
      ${opts.body?`<div class="outcome-body">${_esc(opts.body)}</div>`:""}
    </div>
    <div class="outcome-actions">${actions.map(actionButtonHTML).join("")}</div>
  </section>`;
}
async function bootProjects(){
  try{PROJECTS=(((await fetch(BASE+"/api/projects",{cache:"no-store"}).then(r=>r.json()))||{}).projects)||[];}catch(e){PROJECTS=[];}
  CURRENT_PROJECT=null; CUR=null; SHOTS=[]; page="projects"; renderTop(); renderNav(); renderProjects();
}
function renderProjects(){
  const initial=p=>_esc((p.name||"?").trim().charAt(0).toUpperCase());
  const card=p=>`<article class="projcard" id="pc_${_esc(p.id)}">

async function addCharacter(){

  const send=async()=>{try{const r=await fetch(BASE+"/api/character",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!j.ok){alert("Error: "+(j.error||"failed"));msg.textContent="";return;}msg.textContent="✓ "+name+" added";setTimeout(renderCharacters,700);}catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");msg.textContent="";}};
  const readF=(id)=>new Promise(res=>{const el=document.getElementById(id),f=el&&el.files[0];if(!f)return res(null);const rd=new FileReader();rd.onload=()=>res({data:rd.result,name:f.name});rd.readAsDataURL(f);});

}

async function renameEp(num){
  const ep=EPISODES.find(e=>e.number==num); const cur=(ep&&ep.title)||"";
  const t=prompt("Rename Episode "+num+":", cur);
  if(t==null) return;                          // cancelled
  const title=t.trim();
  if(!title){alert("The episode name can't be empty.");return;}
  if(title===cur) return;
  try{
    const r=await fetch(BASE+"/api/episode-rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number:+num,title})});
    const j=await r.json();
    if(!j.ok){alert("Rename failed: "+(j.error||"failed"));return;}
    EPISODES=j.episodes;
    if(CUR&&CUR.number==num) CUR=EPISODES.find(e=>e.number==num)||CUR;
    if(page=="episodes") renderEpisodes(); else { renderTop&&renderTop(); if(page=="pipeline") renderControl(); }
  }catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");}
}

function onDoc(e){
  const file=e.target.files[0]; if(!file) return;
  const name=file.name, ext=(name.split(".").pop()||"").toLowerCase();
  const tag=document.getElementById("f-docname");
  tag.textContent="Loading "+name+"…";
  const reader=new FileReader();
  if(["txt","md","markdown","fountain","text"].includes(ext)){
    reader.onload=()=>{document.getElementById("f-script").value=reader.result; DOC=null;
      tag.textContent="✓ "+name+" loaded into the script box (editable below)";};
    reader.readAsText(file);
  }else{
    reader.onload=()=>{DOC={name,data:reader.result};
      tag.textContent="✓ "+name+" attached — text is extracted on save";};
    reader.readAsDataURL(file);
  }
}

// ─────────────────────────────────────────────────────────────────────────────────────────
// ═══════════════════════════════════════════════════════════════════════════════════════
// THE PRODUCTION OPERATING SYSTEM (2026-07-17): Projects → Episodes → Scene Board → Scene
// Workspace. Story order (script) and production order (whatever the user works on next)
// are separate — every scene carries its OWN 7-stage pipeline, computed live from the same
// existing endpoints every gate action already uses (/api/loclib, /api/storyboard,
// /api/shot-package, /api/shot-run, /api/jobs, /api/rates — the last one read-only, exposing
// cb_costs.py's own RATES table so cost numbers never drift from the real ledger). No new
// persisted production state anywhere in this module.
// ─────────────────────────────────────────────────────────────────────────────────────────
// PSTAGES: Script → Storyboard → Scene Look → Voice/Timing → Cinematography →
// Animation → Continuity → Final. Voice and the timing slate are deliberately presented
// before final opening frames, even though silent shots and independent shot work remain
// navigable rather than being trapped behind a scene-wide UI lock.
// Kept as individually-navigable rail entries rather than collapsed into one "Shot
// Production" umbrella tab — the substance (each shot's own Opening-frame/Voice-ready/
// Animation/Final-frame-continuity dependency chain) already works correctly per shot via
// these four; only the visual grouping into a single umbrella screen is deferred, named
// explicitly in the same-session report rather than silently left undone.
const PSTAGES=[
  {id:"script",name:"Script",glyph:"✎"},
  {id:"storyboard",name:"Story & Direction",glyph:"▤"},
  {id:"scenelook",name:"Look Development",glyph:"◈"},
  {id:"voice",name:"Voice & Timing",glyph:"♪"},
  {id:"keyframe",name:"Cinematography",glyph:"◧"},
  {id:"animation",name:"Animation",glyph:"►"},
  {id:"continuity",name:"Director Review",glyph:"⇄"},
  {id:"final",name:"Final Master",glyph:"✓"}
];
const STATE_LABEL={ready:"Ready",generating:"Working",awaiting:"Ready for review",
                    approved:"Current",rejected:"Needs attention",blocked:"Needs attention",locked:"Waiting"};
const STATE_COLOR={ready:"--brandink",generating:"--info",awaiting:"--honey",approved:"--ok",
                    rejected:"--warn",blocked:"--warn",locked:"--hint"};

                    rejected:"--warnbg",blocked:"--warnbg",locked:"--surface2"};

let RATES=null;
async function fetchRates(){if(RATES)return RATES;try{RATES=(await (await fetch(BASE+"/api/rates")).json()).rates||{};}catch(e){RATES={};}return RATES;}
function estCost(op,opts){
  opts=opts||{}; const r=(RATES||{})[op]; if(!r)return null;
  // 2026-07-17 correction: r.usd for seedream5pro_image (0.144) is ALREADY the flat, ref-inclusive
  // rate cb_costs.py's own RATES comment documents ("0.144 assumes the common 3-ref case... as a
  // flat estimate") — the real backend cost function, cb_costs.estimate_image_cost(), returns this
  // rate UNCONDITIONALLY, with no ref-count adjustment at all. This used to add a SECOND
  // (refs-1)*0.0045 surcharge on top, double-counting the 2-extra-ref cost 0.144 already includes
  // (showing ~$0.153 for the standard 3-ref case instead of the real, correct $0.144) — removed so
  // the disclosure modal always matches what actually gets logged.
  if(r.unit=="1000 chars")return (opts.chars||0)/1000*r.usd;
  return r.usd;
}

let PJOBS={};

// ── relative-time + per-project production stats, for the Projects screen cards ──
function relTime(ts){
  if(!ts)return null;
  const s=Math.max(0,Math.floor((Date.now()-ts*1000)/1000));
  if(s<60)return "just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function _jobGateLabel(gate){
  gate=String(gate||"");
  if(gate=="write")return "Script";
  if(gate.startsWith("creative"))return "Storyboard";
  if(gate.startsWith("shot"))return "Production";
  return gate||"Activity";
}
// ONE project (the primary, live production) actually runs through the Scene Board's own
// story-order roster + per-scene bundles — reusing sceneRoster/fetchSceneBundle/deriveSceneState
// exactly as the Scene Board does, never a second parallel computation. Any other project (an
// archived reference, or a future non-primary one) has no live pipeline data to honestly show —
// its card says so plainly rather than rendering a fabricated 0%.
async function projectStats(p){
  if(p.archived)return {archived:true};
  if(!p.primary)return {unsupported:true};
  try{
    const roster=await sceneRoster("Ep1");
    if(!roster.length){
      const [intake,state]=await Promise.all([
        fetch(BASE+"/api/story-intake-status?episode=Ep1",{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
        fetch(BASE+"/api/production-state?scene=1&episode=Ep1",{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
      ]);
      const candidate=intake&&intake.candidate||{};
      const canonDecisions=state&&state.canonLock&&Array.isArray(state.canonLock.blockers)
        ? state.canonLock.blockers.length : 0;
      if(canonDecisions){
        return {completion:0,decisions:canonDecisions,outcome:"review",artwork:null,
                activity:canonDecisions+" Story & Direction decision"+(canonDecisions==1?"":"s")+" waiting",
                scenes:(candidate.scenes||[]).length};
      }
      if(intake&&intake.hasCandidate&&intake.candidateCurrent&&!intake.canonicalCurrent){
        return {completion:0,decisions:1,outcome:"review",artwork:null,
                activity:"Story & Direction review waiting",
                scenes:(candidate.scenes||[]).length};
      }
      if(intake&&intake.hasScript){
        return {completion:0,decisions:0,outcome:"ready",artwork:null,
                activity:"Story & Direction is ready to run",
                scenes:(candidate.scenes||[]).length};
      }
      return {empty:true};
    }
    const bundles=await Promise.all(roster.map(r=>fetchSceneBundle(r.scene,"Ep1")));
    await fetchJobsNow();
    let doneStages=0,totalStages=0,decisions=0,artwork=null;
    roster.forEach((r,i)=>{
      const stages=deriveSceneState(bundles[i],true,r.scene);
      const st=sceneCardStatus(stages);
      if(st=="needs-decision"||st=="rejected"||st=="blocked")decisions++;
      // whitelisted to the real stage ids only — deriveSceneState also stashes an internal
      // "_per" array (the shared per-shot computation keyframe/animation/continuity reuse),
      // which Object.values(stages) would otherwise miscount as an extra, always-incomplete
      // "stage" and skew this percentage low.
      PSTAGES.map(p=>p.id).forEach(id=>{const x=stages[id];if(!x)return;totalStages++;if(x.state=="approved")doneStages++;});
      if(!artwork&&r.plate)artwork="/engine/media/"+r.plate;
    });
    const jobs=Object.values(PJOBS).filter(j=>j.ended||j.started).sort((a,b)=>(b.ended||b.started)-(a.ended||a.started));
    const latest=jobs[0];
    const activity=latest
      ? relTime(latest.ended||latest.started)+" · "+_jobGateLabel(latest.gate)+(latest.scene&&latest.scene!="—"?" · Scene "+latest.scene:"")
      : "No activity yet";
    const completion=totalStages?Math.round(100*doneStages/totalStages):0;
    const outcome=completion===100?"complete":decisions?"review":latest&&latest.status==="running"?"working":"ready";
    return {completion, decisions, outcome, artwork, activity, scenes:roster.length};
  }catch(e){ return {error:true}; }
}
function jobFor(kind,scene){
  return Object.values(PJOBS).filter(j=>j.status=="running"&&
    (kind=="write"?String(j.gate)=="write":
     kind=="storyintake"?String(j.gate)=="storyintake":
     kind=="creative"?String(j.gate).startsWith("creative:"):
     String(j.gate).startsWith("shot:"))&&
    (kind=="write"||kind=="storyintake"||String(j.scene)==String(scene))
  ).sort((a,b)=>(a.started||0)-(b.started||0)).pop()||null;
}

// ── the scene roster (story order) — reused by the Scene Board and every scene selector ──
// SOURCE OF TRUTH (2026-07-19): the approved beat package (/api/scene-roster), NOT the
// reusable location-asset manifest. /api/loclib stays exactly what it always was — a
// persistent, cross-episode library of signed-off location plates, entirely separate from
// "which scenes exist in this episode." A scene here NEVER carries a plate automatically
// just because a loclib entry happens to share its name — that stays a deliberate, later,
// human selection (never wired here).
let SCENE_ROSTER=null;
async function sceneRoster(episode){

    const ep=episode||SH_EP||((CUR&&CUR.number)?("Ep"+CUR.number):"Ep1");

}

// ── one scene's full state: storyboard + production package + media, 404-tolerant ──
async function fetchSceneBundle(scene,episode){
  const [sb,pkgR,sl,pf,ps]=await Promise.all([
    fetch(BASE+"/api/storyboard?episode="+encodeURIComponent(episode)+"&scene="+encodeURIComponent(scene),{cache:"no-store"}).then(r=>r.json()).catch(()=>({error:"unreachable"})),
    fetch(BASE+"/api/shot-package?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>({error:"unreachable"})),
    fetch(BASE+"/api/scenelook?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>({status:"none"})),
    fetch(BASE+"/api/production-preflight?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>null),
    fetch(BASE+"/api/production-state?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>null)
  ]);
  return {
    storyboard: sb&&!sb.error?sb:null, storyboardError: (sb&&sb.error)||null,
    pkg: pkgR&&!pkgR.error?pkgR.package:null, media: pkgR&&!pkgR.error?pkgR.media:null,
    pkgFile: pkgR&&!pkgR.error?pkgR.file:null, pkgError: (pkgR&&pkgR.error)||null,
    scenelook: sl||{status:"none"}, preflight:pf,
    productionState: ps&&!ps.error?ps:(pkgR&&!pkgR.error?pkgR.productionState:null),

// ── pure status derivation — the ONE place the 7-state vocabulary is computed, reused by
// both the Scene Board (many scenes at once) and the Scene Workspace (the open scene) ──
// ── PER-SHOT PIPELINE STATE (2026-07-18 correction — "the user must never decide manually
// which shots require keyframes"): the ONE place a shot's own Keyframe/Voice/Animation/
// Continuity readiness is computed. Never a scene-wide lock — each shot's own dependency is
// its own IMMEDIATELY PRECEDING shot in shot order (never sourceShotId, which is null for an
// opener; continuityIn is always authored as "what carries in from the shot immediately
// before this one," matching cb_creative.py's own doctrine). sourceType (already mechanically
// derived upstream from transitionType — cb_creative.py's requiresNewKeyframe = is_opener or
// transitionType=="PLANNED_CUT", mapped 1:1 by cb_handover.py) is trusted as the authoritative
// keyframe-need signal; this function never re-reads transitionType or any prose field to
// decide it, so a shot's own creative-card prose can never silently override the structural
// truth (a contradiction between the two is a report, never a silent pick — see the SH6 case).
function shotPipelineStateLegacy(shots,i,ledgerFor,media,lineageOk,sceneLookOk,reassessFor,packageRevision){
  const s=shots[i], led=ledgerFor(s.shotId)||{};
  const isCurrent=rec=>!!(rec&&packageRevision&&rec.packageRevision===packageRevision);
  const prev=i>0?shots[i-1]:null;
  const prevLed=prev?ledgerFor(prev.shotId):null;
  const prevApproved=!prev||(prevLed&&prevLed.status=="approved");
  const needsKeyframe=(s.sourceType=="opener");
  let kf;   // "ready" | "waitingPrev" | "awaiting" | "approved" | "rejected" | "staleInputs" | "inherited"
  if(needsKeyframe){
    if(led.keyframeApproval&&led.keyframeApproval.approved&&isCurrent(led.keyframeApproval)) kf="approved";
    else if(led.keyframeCandidate&&isCurrent(led.keyframeCandidate)) kf="awaiting";
    else if(led.keyframeRejected) kf="rejected";
    else if(!prevApproved) kf="waitingPrev";
    else kf="ready";
  } else {
    kf = prevApproved ? "inherited" : "waitingPrev";
  }
  // DIRECT-INPUT LINEAGE (2026-07-18 production-safety directive, items 3/4/6): an existing
  // approved/awaiting keyframe is checked against its OWN recorded input signature — its own
  // card hash, the approved Scene Look hash, its own reference hashes, the compiled brief,
  // model/settings — never the whole storyboard/package md5. An unrelated shot's edit (e.g.
  // S1.SH6) never reaches here at all, because reassessFor only ever reports THIS shot's own
  // comparison. reassessFor is optional (defaults to reporting nothing) so callers that
  // haven't fetched reassessment data (the Scene Board's cross-scene aggregate, today) simply
  // fall back to the ledger-only kf value above, never a crash.
  const reassess = (reassessFor ? reassessFor(s.shotId) : null) || null;
  if((kf=="approved"||kf=="awaiting") && reassess && reassess.verdict=="regenerate"){
    kf = "staleInputs";
  }
  // SCENE LOOK GATE (2026-07-18, Julian's directive): checked BEFORE anything else — Scene
  // Look sits upstream of the whole Shot Production stage in the pipeline order (Storyboard
  // -> Scene Look -> Shot Production), so a not-current-approved plate holds EVERY shot here,
  // including one whose OWN keyframe was already approved before this gate existed (S1.SH1) —
  // the underlying approval fact is never erased, only its downstream readiness is held.
  const sceneLookGated = sceneLookOk===false;
  const keyframeSatisfied = needsKeyframe ? kf=="approved" : kf=="inherited";
  const talky=(s.dialogueLines||[]).length>0;
  // 2026-07-19: voiceOk means APPROVED, not merely generated — matching keyframe's own
  // "a generated-but-unapproved candidate is never a valid anchor" rule (the voice approval
  // step, cb_render.approve_voice/reject_voice).
  const voiceOk=!talky||!!(led.voiceApproval&&led.voiceApproval.approved&&isCurrent(led.voiceApproval));
  const animationCurrent=led.status=="approved"&&isCurrent(led.approval);
  const batchCurrent=led.status=="candidates-pending"&&isCurrent((led.batch||{}).disclosure||led.disclosure);
  const animState=animationCurrent?"approved":(batchCurrent?"candidates-pending":(led.status=="model-limited"?"model-limited":"designed"));
  // (2026-07-18 correction): lineageOk (whole-package/storyboard md5 match) is PROVENANCE
  // EVIDENCE ONLY now, surfaced in Technical Details — it no longer gates readiness at all.
  // A package rebuild triggered by an unrelated shot's edit must never block THIS shot's own
  // already-valid, already-approved keyframe from proceeding to animation.
  const readyToAnimate=keyframeSatisfied&&voiceOk&&!sceneLookGated;
  let label,sub=null,badgeState="ready";
  if(kf=="staleInputs"){
    label="Direct inputs changed — regenerate";
    sub=(reassess.changed||[]).length?`changed: ${reassess.changed.join(", ")}`:"this shot's own inputs no longer match its existing candidate";
    badgeState="blocked";
  } else if(sceneLookGated){
    label="Waiting for Scene Look approval";
    sub=(led.keyframeApproval&&led.keyframeApproval.approved)
        ?"this shot's own keyframe was approved before Scene Look existed as a gate — held pending its approval"
        :"the environment/palette/lighting anchor must be approved first";
    badgeState="locked";
  } else if(kf=="waitingPrev"){
    // (2026-07-18) label names the specific predecessor shot by ID, per Julian's own
    // "make the opening-frame source unmistakable" instruction — never a generic "previous".
    label=prev?`Waiting for ${prev.shotId} final frame`:"Waiting for previous final frame";
    sub=prev?`waiting on ${prev.shotId}'s animation to be approved`:null; badgeState="locked";
  } else if(needsKeyframe&&(kf=="ready"||kf=="rejected")){
    // (2026-07-18) cost read live from the fetched RATES table (never hardcoded) so this
    // label can never silently drift from cb_costs.py's own real, authoritative rate.
    { const kr=(RATES||{})["seedream5pro_image"];
      label="New keyframe required"+(kr?` — estimated cost $${kr.usd}`:""); }
    if(kf=="rejected") sub="rejected — ready to regenerate"; badgeState="ready";
  } else if(needsKeyframe&&kf=="awaiting"){
    label="Keyframe awaiting approval"; badgeState="awaiting";
  } else if(!keyframeSatisfied){
    // kf=="inherited" or "approved" already covers keyframeSatisfied==true, so this branch
    // is unreachable in practice — kept as an explicit, honest fallback, never a silent guess.
    label=needsKeyframe?"Keyframe awaiting approval":(prev?`Waiting for ${prev.shotId} final frame`:"Waiting for previous final frame"); badgeState="locked";
  } else if(!voiceOk){
    label=needsKeyframe?"Keyframe approved":"Opening frame inherited — no generation and no cost"; sub="awaiting this shot's voice"; badgeState="ready";
  } else if(animState=="designed"){

    else if(sl.status=="awaiting") out.scenelook={state:"awaiting", sub:"a plate is awaiting your decision"};
    else if(sl.status=="approved") out.scenelook={state:"approved", sub:"approved · current"};
    else if(sl.status=="stale") out.scenelook={state:"awaiting", sub:"approved once, but the storyboard has changed since — re-approve or regenerate"};

      ?{state:"approved", sub:"Silent timing slate is current"}
      :{state:"ready", sub:"Build the silent scene timing slate"};

    else if(done==talky.length) out.voice={state:"ready", sub:"Performances approved · build or refresh timing slate"};
    else if(generatedN>0) out.voice={state:"ready", sub:done+" of "+talky.length+" approved · "+generatedN+" awaiting your decision"};

  // shot the moment THAT shot has an approved keyframe/inherited frame + its own voice (if
  // any) + current lineage — never gated on every other shot's keyframe or voice first.

  else if(running("shot")){ out.animation={state:"generating"}; }
  else if(!ledger.length){ out.animation={state:"ready"}; }

    const lineageOk=!!((bundle.media&&bundle.media.lineage&&bundle.media.lineage.current));
    const per=out._per||shots.map((s,i)=>shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,null,bundle.pkg&&bundle.pkg.revision));
    const total=ledger.length;
    const approvedN=ledger.filter(e=>e.status=="approved"&&e.approval&&e.approval.packageRevision===(bundle.pkg&&bundle.pkg.revision)).length;

    // renderWorkspaceBody both hard-stop on it). "0 ready" is an honest SUMMARY, not a gate;
    // the per-shot screen (shotPipelineState) is what actually tells each shot why it's
    // waiting, and remains reachable regardless of what this aggregate says.
    else out.animation={state:"ready", sub:approvedN+" approved · "+readyN+" ready · "+(total-approvedN-readyN)+" waiting"};
  }
  // CONTINUITY — a real review screen exists (outgoing frame vs next incoming frame); per-shot
  // "complete" is mechanically inferred from that shot's own Animation approval (see
  // shotPipelineState's own comment — no separate persisted continuity sign-off exists today).
  {
    const lineageOk=!!((bundle.media&&bundle.media.lineage&&bundle.media.lineage.current));

function shotPipelineState(shots,i){

  const state=(currentBundle().productionState||{}).shots||[];
  return state.find(row=>row.shotId===sid)||{
    shotId:sid,needsKeyframe:false,kf:"ready",keyframeSatisfied:false,talky:false,
    voiceOk:false,animState:"designed",readyToAnimate:false,
    label:"Production state unavailable",sub:"Refresh the scene state",badgeState:"blocked",
    sceneLookGated:true,current:{},pending:{},allowedActions:{}

}
function deriveSceneState(bundle,scriptApproved,scene){
  const policy=bundle&&bundle.productionState;
  if(!policy||!policy.stages){
    const blocked={state:"blocked",sub:"Authoritative production state unavailable"};
    return {script:blocked,storyboard:blocked,scenelook:blocked,voice:blocked,
            keyframe:blocked,animation:blocked,continuity:blocked,final:blocked,_per:[]};
  }
  const out={};
  PSTAGES.forEach(stage=>{out[stage.id]=Object.assign({},policy.stages[stage.id]||{
    state:"blocked",sub:"No authoritative state returned for this stage"});});
  out._per=(policy.shots||[]).map(row=>Object.assign({},row));

  const writeJob=jobFor("write",scene), creativeJob=jobFor("creative",scene);
  if(writeJob)out.script={state:"generating"};
  if(creativeJob)out.storyboard={state:"generating"};
  const shotJob=jobFor("shot",scene);
  if(shotJob){
    const cmd=String(shotJob.gate||"").split(":")[1]||"";
    const target=(
      ["scenelook","approve-scenelook","reject-scenelook",
       "select-scenelook-upload","select-scenelook-library"].includes(cmd)?"scenelook":
      ["voice","voice-shot","regen-voice","approve-voice","reject-voice","animatic"].includes(cmd)?"voice":
      ["keyframe","approve-keyframe","reject-keyframe",
       "select-upload","select-library","select-previous"].includes(cmd)?"keyframe":
      cmd=="stitch"?"final":"animation"
    );
    out[target]={state:"generating",sub:out[target]&&out[target].sub};
  }

}
function nextReadyStage(stages){
  for(const s of PSTAGES) if(stages[s.id].state!="locked"&&stages[s.id].state!="approved") return s.id;

}
function sceneCardStatus(stages){
  const vals=Object.values(stages).map(s=>s.state);
  if(vals.some(v=>v=="blocked")) return "blocked";
  if(vals.some(v=>v=="generating")) return "generating";
  if(vals.some(v=>v=="rejected")) return "rejected";
  if(stages.final.state=="approved") return "complete";
  if(vals.some(v=>v=="awaiting")) return "needs-decision";
  return "ready";

async function loadBoard(){
  if(BOARD_LOADING)return; BOARD_LOADING=true;
  try{
    const roster=await sceneRoster(); SCENE_ROSTER=roster;
    const scriptApproved=!!(CUR&&CUR.script);
    await fetchJobsNow();
    if(jobFor("storyintake","-"))_sbStoryPollStart();   // resume the status bar after navigating back mid-run
    const bundles=await Promise.all(roster.map(r=>fetchSceneBundle(r.scene,SH_EP)));
    BOARD_SCENES=roster.map((r,i)=>{
      const bundle=bundles[i];
      const stages=deriveSceneState(bundle,scriptApproved,r.scene);
      const media=(bundle.media&&bundle.media.shots)||{};
      const shots=(bundle.pkg&&bundle.pkg.shots)||[];
      let latestFrame=null;
      for(const s of shots){ const m=media[s.shotId]; if(m&&(m.finalFrame||m.keyframe)) latestFrame=m.finalFrame||m.keyframe; }
      if(!latestFrame&&r.plate) latestFrame="/engine/media/"+r.plate;
      return Object.assign({},r,{bundle,stages,latestFrame,status:sceneCardStatus(stages)});
    });
  }finally{ BOARD_LOADING=false; }
}

async function storyIntakeDecide(verdict,presetNote){
  let note=presetNote||"";
  if(verdict=="reject"){ note=prompt("One-sentence reason for rejecting this candidate:")||""; if(!note.trim())return; }
  try{
    const r=await fetch(BASE+"/api/story-intake-decide",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({episode:SH_EP||("Ep"+(CUR&&CUR.number)),verdict,note})});
    const j=await r.json();
    if(!r.ok||!j.ok){alert(j.error||"Could not record the decision"); return;}
    showToast(verdict=="approve"?"Approved — the scene/storyboard process is now unlocked":"Rejected — archived, nothing canonical was written",true);
    // THE STALE-CACHE FIX (2026-07-19): an approval is the one moment the canonical beat
    // package first exists — invalidate the roster/bundle cache and refetch the Scene Board
    // so its 10 (or however many) scene cards appear immediately, no manual reload needed.
    SH_STORY_INTAKE=null; BOARD_SCENES=null; SCENE_ROSTER=null;

function prerequisiteStage(id){
  const idx=PSTAGES.findIndex(s=>s.id===id);
  for(let i=idx-1;i>=0;i--){const st=pStatus(PSTAGES[i].id);if(st!=="approved"&&st!=="locked")return PSTAGES[i].id;}
  return idx>1?PSTAGES[idx-1].id:"storyboard";

function defaultDecisionAction(){
  const current=pFocusedStage(), state=pStatus(current), idx=PSTAGES.findIndex(s=>s.id===current);
  if(current==="final"&&state==="approved")return {label:"Back to all scenes",onclick:"backToBoard()",kind:"secondary"};
  if(state==="blocked"||state==="rejected"){
    const target=prerequisiteStage(current), name=(PSTAGES.find(s=>s.id===target)||{}).name||"required step";
    if(target===current)return {label:"Open episode outcome",onclick:"backToBoard()"};
    return {label:"Resolve in "+name,onclick:`openStageOutcome('${target}')`};
  }
  for(let i=idx+1;i<PSTAGES.length;i++){
    const target=PSTAGES[i];if(pStatus(target.id)!=="locked")return {label:"Continue to "+target.name,onclick:`openStageOutcome('${target.id}')`};
  }
  const active=pActiveStage(), name=(PSTAGES.find(s=>s.id===active)||{}).name||"production";
  if(active===current)return {label:"Back to all scenes",onclick:"backToBoard()",kind:"secondary"};
  return {label:"Open "+name,onclick:`openStageOutcome('${active}')`};
}

      <button class="btn ghost" style="margin:0 0 0 10px;padding:4px 12px;font-size:12px" onclick="stopFiring('${_esc(j.jobId||'')}')">■ Stop</button></div>`;
    return;
  }
  // THE COMPLETED-JOB OUTCOME (2026-07-19 correction): jobFor() only ever returns a
  // job while it's still running — the moment it finishes, this banner used to go
  // completely blank with no trace of what happened, even for a fast, informative,
  // by-design refusal (e.g. an unconfirmed billing profile). SH_LAST_JOB (set in
  // shPollStart) carries that outcome here until dismissed or superseded by the next fire.
  if(SH_LAST_JOB&&String(SH_LAST_JOB.scene)==String(SH_SC)){

  const mediaMap=(SH_MEDIA&&SH_MEDIA.shots)||{};

function sceneContentsHTML(){
  const beats=(PSB&&PSB.beats)||[];

  if(beats.length){
    const shotsByBeat={};
    shots.forEach(s=>(s.beatIds||[]).forEach(b=>{(shotsByBeat[b]=shotsByBeat[b]||[]).push(s);}));

  // PSHOT_I mutations generally) — the same "one shared call site" convention renderTop()
  // already uses for project/episode/scene and pFocusStage() uses for the stage tab. Called
  // early, unconditionally, so it still fires even on this function's own early returns below.
  _syncHash();
  document.getElementById("railwrap").innerHTML=renderStageRail();

    return;

async function pFireCreative(){
  try{
    const r=await fetch(BASE+"/api/creative-run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cmd:"scene",scene:String(SH_SC),episode:SH_EP})});
    const j=await r.json();

async function pStoryboardDecide(verdict){
  const note=(document.getElementById("pSbNote")||{}).value||"";
  try{
    const r=await fetch(BASE+"/api/storyboard-approve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({episode:SH_EP,scene:String(SH_SC),target:"scene",verdict,note,by:REVIEWER})});
    const j=await r.json();
    if(!j.ok){alert("Couldn't record the decision: "+(j.error||"failed"));return;}

// ── SCENE LOOK — the gate between Storyboard and Shot Production (Julian's 2026-07-18
// directive). Establishes environment/location identity, world scale, palette, materials/
// texture, lighting, weather/atmosphere and overall visual feeling for the WHOLE scene —
// never shot composition, camera position, character pose or movement (those stay owned by
// each approved storyboard shot). Never assumes the plate file's mere presence on disk means
// approval — SH_SCENELOOK.status is always a real, server-computed decision state. ──
function renderSceneLookStage(){
  const art=document.getElementById("wartefact"), dec=document.getElementById("wdecision");
  const sl=SH_SCENELOOK||{status:"none"};
  // (2026-07-18 production-safety directive, item 1): the button/label text states its
  // EXACT scope — one image, this scene, never a generic "Generate" whose target is
  // inferred from broader state. Cost is read live from the fetched rates table (never
  // hardcoded), matching the identical discipline shotPipelineState's own keyframe label
  // already uses for the exact same reason.
  // the plate fires through the identical cb_gen.generate_image/Seedream path a keyframe
  // does (cb_render.generate_scenelook_plate calls it with refs=[]) — same real rate.
  const slRate=(RATES||{})["seedream5pro_image"];
  const slCostTxt=slRate?` — $${slRate.usd}`:"";
  const GEN_LABEL=`◈ Generate Scene ${_esc(SH_SC)} Look Plate — one image${slCostTxt}`;
  let body="", decVersion="—", decActions=[];
  if(sl.status=="none"){
    body=`<div class="artefact-empty"><div style="color:var(--muted)">No Scene Look plate yet for this scene.</div></div>`;
    decActions=[slSourceChoices(GEN_LABEL,false)];
  } else {
    body=`<img class="zoom pmedia img" data-cap="Scene ${_esc(SH_SC)} · Scene Look plate" src="${BASE}${sl.plateUrl}?v=${MEDIA_V}"/>`;
    if(sl.status=="awaiting"){
      decVersion="Awaiting your decision";
      decActions=[`<button class="btn" onclick="shRun('approve-scenelook')">✓ Approve</button>`,
        `<button class="btn ghost" onclick="shRun('reject-scenelook')">✗ Reject</button>`];
    } else if(sl.status=="approved"){
      decVersion="Approved · current";
      decActions=[`<span class="dec-caption">${badge("approved")}</span>`,
        `<div style="margin-top:8px">${slSourceChoices(`↻ Regenerate — ${GEN_LABEL.replace('◈ ','')}`,true)}</div>`];
    } else if(sl.status=="stale"){
      // (2026-07-18 direct-input-lineage correction): "stale" no longer means the
      // STORYBOARD changed — the plate was never actually built from it. It means the
      // plate's OWN direct inputs (locations.json/style.txt) changed since approval.
      decVersion="Approved once — its own environment brief has since changed";
      decActions=[`<div class="dec-caption" style="color:var(--warn)">This plate's own environment brief (location/lighting/style) has changed since it was approved — an unrelated storyboard/shot edit can never cause this. Re-approve it if the world still holds, or regenerate against the current brief.</div>`,
        `<button class="btn" onclick="shRun('approve-scenelook')">✓ Re-approve (current brief)</button>`,
        `<button class="btn ghost" onclick="shRun('reject-scenelook')">✗ Reject</button>`,
        `<div style="margin-top:8px">${slSourceChoices(GEN_LABEL,true)}</div>`];
    } else if(sl.status=="rejected"){
      decVersion="Rejected — see History below";
      body=`<div class="artefact-empty"><div style="color:var(--muted)">Rejected — see History below. Ready to generate a new candidate.</div></div>`;
      decActions=[slSourceChoices(GEN_LABEL,false)];
    }
  }
  art.innerHTML=`<div class="artefact-center">${body}</div>`;
  const history=(sl.history||[]).slice().reverse().map(h=>
    `<div class="histrow"><span class="stbadge" style="color:var(${h.status=="approved"?"--ok":"--danger"});background:var(${h.status=="approved"?"--okbg":"--dangerbg"})">${_esc(h.status||"")}</span>
     <span class="histmeta">${_esc(h.reviewedBy||"")} · ${_esc((h.approvedAt||h.rejectedAt||h.generatedAt||"").slice(0,16))}</span>
     ${h.rejectedNote?`<div class="histnote">${_esc(h.rejectedNote)}</div>`:""}</div>`).join("");
  dec.innerHTML=decisionShell("Scene Look", decVersion, decActions, history)+
    `<details class="techdetails"><summary>Technical details</summary>
      <div class="techmeta">plate hash ${_esc((sl.plateHash||"—").slice(0,12))}</div>
      <div class="techmeta">source storyboard md5 ${_esc((sl.sourceStoryboardMd5||"—").slice(0,12))}${sl.sourceStoryboardMd5&&sl.liveStoryboardMd5&&sl.sourceStoryboardMd5!=sl.liveStoryboardMd5?" (superseded by current "+_esc((sl.liveStoryboardMd5||"").slice(0,12))+")":""}</div>
    </details>`;
  attachDepartmentPanel(dec,"look",null);
}

function decisionShell(title,version,actionsHTML,historyHTML){
  const actions=(actionsHTML||[]).filter(Boolean);

}

  // anything"): editing and saving a working version deliberately never regenerates audio —
  // but nothing told the user the take they were hearing was built BEFORE their edit existed.
  // takeMatchesCurrent is server-computed (voGeneratedFrom vs the current text) — false means
  // a real mismatch, not a guess from timestamps.
  const stale = vw.hasTake && vw.takeMatchesCurrent===false;
  const staleBanner = stale ? `<div class="ccpanel" style="border-color:var(--warn);margin-bottom:10px">

  // THE CURRENT-TAKE LABEL + OLD-VS-NEW COMPARISON (2026-07-19, Julian — "give some
  // information this is the new one, or we show the old one and the new one to see the
  // difference, then get rid of one or the other"): a regeneration now archives whatever it
  // replaces (voice_shot's own pre-overwrite move) instead of silently overwriting it, so
  // both takes can sit side by side here until one is chosen. "previous" is null the very
  // first time a shot is ever voiced — there's nothing yet to compare against.
  const takeLabel = vw.hasTake ? `<div class="dec-caption" style="margin:8px 0 2px">

    <button class="btn ghost" style="margin-top:8px" onclick="shRestoreVoiceTake('${_esc(tok)}')">↺ Restore this take instead</button>

  return `<div class="ccpanel">
    ${staleBanner}

    ${lines}

      <button class="btn ghost" onclick="shSaveVoiceWork('${_esc(tok)}')">Save as working version</button>
      ${vw.isWorking?`<button class="btn ghost" onclick="shRestoreVoiceWork('${_esc(tok)}')">Restore approved version</button>`:""}
    </div>
    <div class="ccref" style="margin-top:14px;font-weight:600">Approved dialogue (locked, never edited here):</div>
    ${approvedDlg}
    ${takeLabel}
    ${prevBlock}

}

function renderShotStage(mode){

  SH_RSEQ++; const mySeq=SH_RSEQ;

    dec.innerHTML=decisionShell(PSTAGES.find(p=>p.id==(mode=="keyframe"?"keyframe":mode)).name,"—",
      [`<div class="dec-caption">Approve the Story & Direction department's storyboard to hand it directly into production.</div>`,
       `<button class="btn" onclick="openStageOutcome('storyboard')">Open Story &amp; Direction</button>`],"");
    return;
  }

  const nav=`<div class="pshotnav">
    <button class="btn ghost" style="padding:6px 12px" ${PSHOT_I==0?"disabled":""} onclick="PSHOT_I--;renderWorkspaceBody()">← Previous</button>
    <span class="cnt">${_esc(s.shotId)} · Shot ${PSHOT_I+1} of ${shots.length}</span>
    <button class="btn ghost" style="padding:6px 12px" ${PSHOT_I==shots.length-1?"disabled":""} onclick="PSHOT_I++;renderWorkspaceBody()">Next →</button>
  </div>`;
  let body="", decActions=[], decVersion="—", decHistory="";
  if(mode=="keyframe"){
    // PER-SHOT STATE (2026-07-18 correction): shotPipelineState is the ONE place a shot's own
    // keyframe readiness is computed. The old code drove this whole screen off the SCENE-WIDE
    // aggregate (currentStages().keyframe) — meaning one shot's own awaiting/approved candidate
    // leaked into every OTHER shot's screen in the same scene (approve/reject buttons pointing
    // at the wrong image, "No keyframe yet" hidden behind a sibling's "Awaiting your decision").
    // (2026-07-18 correction): package/storyboard LINEAGE no longer blocks this screen at all
    // (an unrelated shot's edit must never block every shot's keyframe screen — see
    // shotPipelineState's own direct-input-lineage correction). The only genuinely scene-wide
    // block left is the production package not existing yet at all.
    const sceneKf=currentStages().keyframe||{state:"ready"};
    const genBtn=(label)=>`<button class="btn" onclick="openDisclosureModal('keyframe',{shotId:'${tok}',refs:(${JSON.stringify((s.referenceSlots||[]).length||3)})})">${label}</button>`;
    if(sceneKf.state=="blocked"&&!(SH_STATE&&SH_STATE.packageCurrent)){
      body=`<div class="artefact-empty"><div style="color:var(--muted)">Preparing the approved storyboard for production</div></div>`;
      decVersion="Blocked — not yet compiled";
      decActions=[`<div class="histrow"><span class="stbadge" style="color:var(--warn);background:var(--warnbg)">Production handover</span>
          <div class="histnote">${_esc(sceneKf.sub||"The production package has not been compiled yet.")}</div></div>`,
          `<button class="btn" onclick="backToBoard()">Resolve Story &amp; Direction handover</button>`];
    } else {
      const mediaMap=(SH_MEDIA&&SH_MEDIA.shots)||{};
      const lineageOk=!!(SH_MEDIA&&SH_MEDIA.lineage&&SH_MEDIA.lineage.current);
      const pst=shotPipelineState(shots,PSHOT_I,shLedger,mediaMap,lineageOk,shSceneLookOk(),shReassess,SH_PKG&&SH_PKG.revision);
      if(pst.sceneLookGated){
        // THE SCENE LOOK GATE (2026-07-18): held here even for a shot whose own keyframe was
        // already approved before this gate existed (S1.SH1) — the approval fact stays on
        // record (still shown below in History if rejected later), only its downstream
        // readiness is paused pending Scene Look's own approval.
        body=`<div class="artefact-empty"><div style="color:var(--muted)">${_esc(pst.label)}${pst.sub?" — "+_esc(pst.sub):""}</div></div>`;
        decVersion=pst.label;
        decActions=[`<button class="btn" onclick="openStageOutcome('scenelook')">Open Look Development</button>`];
      } else if(pst.kf=="waitingPrev"){
        body=`<div class="artefact-empty"><div style="color:var(--muted)">${_esc(pst.label)}${pst.sub?" — "+_esc(pst.sub):""}</div></div>`;
        decVersion=pst.label;
        decActions=[`<button class="btn" onclick="openPreviousShotOutcome('animation')">Resolve the previous shot</button>`];
      } else if(!pst.needsKeyframe){
        body=`<div class="artefact-empty"><div style="color:var(--muted)">Opening frame inherited — no generation and no cost. Chains from the previous shot's own approved final frame, no separate keyframe.</div></div>`;
        decVersion="Opening frame inherited";
        decActions=[actionButtonHTML(pst.talky&&!((pst.current||{}).voice)
          ?{label:"Continue to Voice & Timing",onclick:"openStageOutcome('voice')"}
          :{label:"Continue to Animation",onclick:"openStageOutcome('animation')"})];
      } else if(pst.kf=="awaiting"){
        // SELECTION DOES NOT EQUAL APPROVAL (2026-07-18, Julian's source-choice directive):
        // this is the ONE approval area for every opening-frame source alike — generated,
        // uploaded, library-picked or carried from the previous shot's final frame. "Choose
        // another" (not "Reject") names what the button actually does regardless of source:
        // clears this candidate back to the four-choice screen. Rejection still requires the
        // same plain-language reason server-side (shRun's own reject-keyframe prompt).
        const src=(led.keyframeCandidate||{}).source||"generated";
        const srcLabel={generated:"generated",uploaded:"uploaded",library:"chosen from Library",
                         previousFinalFrame:"carried from the previous shot's final frame"}[src]||src;
        body=`<img class="zoom pmedia img" data-cap="${_esc(s.shotId)} · keyframe candidate (${_esc(srcLabel)})" src="${BASE}${m.keyframe}?v=${MEDIA_V}"/>`;
        decVersion="Awaiting your decision — "+srcLabel;
        decActions=[`<button class="btn" onclick="shRun('approve-keyframe','${tok}')">✓ Approve</button>`,
          `<button class="btn ghost" onclick="shRun('reject-keyframe','${tok}')">✗ Choose another</button>`];
      } else if(pst.kf=="approved"){
        // REPLACING AN APPROVED OPENING FRAME gets the SAME four-way source choice as a
        // first-time decision (2026-07-18) — a new candidate here is exactly as much "choose
        // its source" as the first one; it just happens to also have something to replace.
        // The current approved image is completely untouched until whatever's chosen next is
        // itself approved (the two-phase lifecycle, unchanged).
        body=`<img class="zoom pmedia img" data-cap="${_esc(s.shotId)} · keyframe" src="${BASE}${m.keyframe}?v=${MEDIA_V}"/>
          <div class="dec-caption" style="margin-top:16px">Replace this opening frame:</div>${shOpeningFrameChoices(tok,s)}`;

        const nextKf=shots.findIndex((shot,i)=>i!=PSHOT_I&&(()=>{const state=shotPipelineState(shots,i),cur=state.current||{};return state.needsKeyframe&&!cur.keyframe;})());

          ?`<button class="btn" onclick="openShotOutcome('keyframe',${nextKf})">Open next unresolved keyframe</button>`

        body=`<div class="artefact-empty"><div style="color:var(--muted)">${_esc(pst.label)}${pst.sub?" — "+_esc(pst.sub):""}</div></div>`;
        decVersion=pst.label;
        decActions=[shOpeningFrameChoices(tok,s)];
      }

      const mediaMap=(SH_MEDIA&&SH_MEDIA.shots)||{};

      // checking is useful even before every input is attached. "Generate animation" above
      // stays completely separate with its own cost disclosure; nothing here spends anything.
      body += `<div class="dec-caption" style="margin-top:14px">Animation generation uses only the approved Animation Director prompt. Legacy working-prompt overrides are disabled for production.</div>`;
      body += structurePanelHTML(tok,SH_STRUCTURE_CACHE[tok]);

    if((led.rejections||[]).length){
      decHistory=led.rejections.slice().reverse().map(r=>`<div class="histrow"><span class="stbadge" style="color:var(--danger);background:var(--dangerbg)">rejected</span>

    }
  }
  art.innerHTML=`${nav}<div class="artefact-center">${body}</div>`;
  // 2026-07-17 correction: this shared tail used to show s.seedancePrompt (the VIDEO/motion
  // brief, compile_shot_contract's output) unconditionally on EVERY mode — including
  // Keyframes, where the actual compiled artefact cb_render.keyframe_shot() sends to the
  // provider is s.keyframePrompt (compile_keyframe_prompt's output, a completely different,
  // still-frame-only text). Branch by mode so "Technical details" always shows the real

  const techWords=mode=="keyframe"?s.keyframePromptWords:s.promptWords;

  const techMeta=mode=="keyframe"
    ?`${techWords?techWords+" words · ":""}opening frame · ${_esc(s.sourceType||"")}`
    :`${techWords?techWords+" words · ":""}${_esc(s.durationSec||"")}s · ${_esc(s.sourceType||"")}${s.sourceShotId?" ← "+_esc(s.sourceShotId):""}`;
  dec.innerHTML=decisionShell(PSTAGES.find(p=>p.id==mode).name, decVersion, decActions, decHistory)+
    (techPrompt?`<details class="techdetails"><summary>Technical details</summary>
      <div class="techmeta">${techMeta}</div>
      <pre class="techpre">${_esc(techPrompt||"")}</pre></details>`:"");
  attachDepartmentPanel(dec,{keyframe:"cinematography",voice:"voice",animation:"animation"}[mode],s.shotId);
  if(mode=="keyframe"&&m.keyframe)attachDepartmentPanel(dec,"review-keyframe",s.shotId);
  if(mode=="animation"&&((m.candidates||[]).length||m.clip||m.finalFrame))
    attachDepartmentPanel(dec,"review-animation",s.shotId);
}
async function openDisclosureModal(kind,ctx){
  ctx=ctx||{}; await fetchRates();
  let title,rows,confirm;
  if(kind=="keyframe"){
    const inp=SH_PREFLIGHT&&SH_PREFLIGHT.approvedInputs&&SH_PREFLIGHT.approvedInputs.shots&&SH_PREFLIGHT.approvedInputs.shots[ctx.shotId];
    if(!inp||!inp.keyframePrompt){alert("Approve current Cinematography direction first.");return;}
    const cost=estCost("seedream5pro_image",{refs:ctx.refs||3});
    title="Generate keyframe";
    rows=[["Model","Seedream 5 Pro"],["Exact approved prompt",inp.keyframePrompt],["References",(ctx.refs||3)+" approved assets"],
          ["Estimated cost",cost!=null?("~$"+cost.toFixed(3)+" (estimated)"):"unknown"],
          ["Outputs","1 image"],["Downstream work","Nothing else will run"]];
    confirm=()=>{closeM();shRun('keyframe',ctx.shotId);};
  } else if(kind=="voice"){
    const inp=SH_PREFLIGHT&&SH_PREFLIGHT.approvedInputs&&SH_PREFLIGHT.approvedInputs.shots&&SH_PREFLIGHT.approvedInputs.shots[ctx.shotId];
    if(!inp||!inp.voiceLines){alert("Approve current Voice direction first.");return;}
    title="Generate voice";
    rows=[["Model","ElevenLabs (V3 dialogue)"],["Shot",ctx.shotId],["Exact approved performance",inp.voiceLines.map(x=>x.speaker+": "+x.performedText).join("\n")],
          ["Cost","Priced per character — shown in the job log once it fires"],
          ["Outputs","1 audio take"],["Downstream work","Nothing else will run"]];
    confirm=()=>{closeM();shRun('voice-shot',ctx.shotId);};
  } else if(kind=="voice-regen"){
    // THE EXPLICIT PER-SHOT FORCE (2026-07-19, Julian — "I've just regenerated voice b1
    // and I don't know if it's gone, if it's done, if the one on the screen is it"): the
    // scene-wide 'voice' cmd above only rebuilds a shot it can PROVE is stale — correct for
    // the batch "fill the gaps" button, but the wrong semantic for an explicit, per-shot
    // "↻ Regenerate" click, which used to route through that same scene-wide command and
    // could silently do nothing if the text already matched. This kind always fires for
    // exactly the one shot the button was clicked on, cb_render.regen_voice_shot, no
    // staleness check — the button's own job is "make me a new take," full stop.
    title="Regenerate this shot's voice";
    rows=[["Model","ElevenLabs (V3 dialogue)"],["Scope","Just "+_esc(ctx.shotId||"this shot")+"'s own dialogue — always fires, whether or not the text changed"],
          ["Cost","Priced per character — shown in the job log once it fires"],
          ["Outputs","1 audio take (the one it replaces is archived, not deleted — compare both below)"],
          ["Downstream work","Nothing else will run"]];
    confirm=()=>{closeM();shRun('regen-voice',ctx.shotId);};
  } else if(kind=="scenelook"){
    // THE APPROVED-SPECIALIST HARD GATE (2026-07-19 — the dog-and-fox misfire): Generate must
    // never fire without an approved Look Development specialist direction, and — when it can
    // fire — the disclosure must show the EXACT prompt that will be submitted, never a generic
    // summary. Reads the SAME department cache attachDepartmentPanel already populates.
    const approvedPrompt=SH_PREFLIGHT&&SH_PREFLIGHT.approvedInputs&&SH_PREFLIGHT.approvedInputs.look&&SH_PREFLIGHT.approvedInputs.look.prompt;
    if(!approvedPrompt){
      document.getElementById("sheet").innerHTML=`<button class="x" onclick="closeM()">×</button>
        <h3>Approve Look Development direction first.</h3>
        <div class="dec-caption">Scene ${_esc(SH_SC)} has no approved Look Development specialist direction yet — Generate is refused until one is approved in the Cinematographer / DP panel.</div>
        <div style="display:flex;justify-content:flex-end;margin-top:20px"><button class="btn ghost" onclick="closeM()">Close</button></div>`;
      document.getElementById("modal").classList.add("show");
      return;
    }
    // THE REFERENCE CHOICE (2026-07-19 UX fix): an optional, explicitly-selected reference
    // (uploaded or picked from the library) always still fires a real generation call with
    // that image as reference_path — never used directly as the plate. ctx.sourcePath/
    // ctx.sourceLabel are set by slUpload/slLibraryPick below; the plain Generate button
    // leaves both unset, unchanged from before.
    const cost=estCost("seedream5pro_image",{refs:ctx.sourcePath?1:0});
    title=ctx.regenerate?"Regenerate Scene Look plate":"Generate Scene Look plate";
    rows=[["Model","Seedream 5 Pro"],
          ["Approved specialist prompt",approvedPrompt],
          ["Reference",ctx.sourcePath?_esc(ctx.sourceLabel||"1 explicitly selected reference"):"None — text-to-image"],
          ["Estimated cost",cost!=null?("~$"+cost.toFixed(3)+" (estimated)"):"unknown"],
          ["Outputs","1 image"],
          ["Downstream work",ctx.regenerate?"The current plate is archived; every downstream keyframe held on the old plate goes stale until this one is approved":"Nothing else will run"]];
    confirm=()=>{closeM();shRun('scenelook',null,{sourcePath:ctx.sourcePath});};

  document.getElementById("sheet").innerHTML=`<button class="x" onclick="closeM()">×</button>
    <h3>${_esc(title)}</h3>
    <div class="disc-rows">${rows.map(([k,v])=>`<div class="disc-row"><span class="disc-k">${_esc(k)}</span><span class="disc-v">${_esc(String(v))}</span></div>`).join("")}</div>

  document.getElementById("modal").classList.add("show");
}

function renderContinuityStage(){
  const art=document.getElementById("wartefact"), dec=document.getElementById("wdecision");
  const shots=pShots();
  const rows=shots.map(s=>{
    const led=shLedger(s.shotId), m=shMedia(s.shotId);
    return `<div class="controw"><div class="controw-id">${_esc(s.shotId)}</div>
      <div class="controw-frames">
        ${m.finalFrame?`<img src="${BASE}${m.finalFrame}?v=${MEDIA_V}"/>`:`<div class="noimg">no outgoing frame</div>`}
        <span class="controw-arrow">→</span>
        ${m.keyframe?`<img src="${BASE}${m.keyframe}?v=${MEDIA_V}"/>`:`<div class="noimg">n/a</div>`}
      </div></div>`;
  }).join("");
  art.innerHTML=`<div class="artefact-center" style="text-align:left;overflow:auto">
    <div style="color:var(--muted);margin-bottom:14px">Each shot's outgoing frame beside the next shot's incoming frame.</div>${rows}</div>`;
  // Director Review is recorded per shot. The stage opens after every current animation take
  // exists, then advances each take through its own explicit review outcome.
  const per=(SH_PKG&&SH_PKG.shots||[]).map((s,i)=>{
    const mediaMap=(SH_MEDIA&&SH_MEDIA.shots)||{};
    const lineageOk=!!(SH_MEDIA&&SH_MEDIA.lineage&&SH_MEDIA.lineage.current);
    return shotPipelineState(SH_PKG.shots,i,shLedger,mediaMap,lineageOk,shSceneLookOk(),null,SH_PKG&&SH_PKG.revision);
  });
  const completeN=per.filter(p=>p.label=="Complete").length;
  const incompleteI=per.findIndex(p=>!((p.current||{}).continuity));
  const continuityAction=!per.length
    ?`<button class="btn" onclick="openStageOutcome('storyboard')">Open Story &amp; Direction</button>`
    :incompleteI>=0
      ?`<button class="btn" onclick="focusShotReview(${incompleteI})">Review ${_esc((shots[incompleteI]||{}).shotId||"next shot")}</button>`
      :`<button class="btn" onclick="openStageOutcome('final')">Continue to Final Master</button>`;
  dec.innerHTML=decisionShell("Continuity", completeN+" of "+per.length+" complete",
    [`<div class="dec-caption">Director Review must record an outcome for every current animation take before the final master can be built.</div>`,continuityAction],"");
  const rs=shots[Math.min(PSHOT_I,Math.max(0,shots.length-1))];
  if(rs){const rm=shMedia(rs.shotId),reviewStage=(rm.clip||rm.finalFrame)?"review-animation":"review-keyframe";

}

async function shRun(cmd,shotId,opts){
  opts=opts||{};

  if(cmd=="reject"){
    correction=(prompt("One-sentence correction for the "+shotId+" batch (goes on record; drives the redesign — 2 rejected batches marks the shot model-limited):","")||"").trim();
    if(!correction)return;   // cancelled or empty — a rejection always needs its correction
  }
  if(cmd=="reject-keyframe"){
    // THE KEYFRAME LIFECYCLE (2026-07-17): rejection is atomic on the server — archived to
    // History with this exact reason, cleared from the current candidate position, and it
    // can never approve or unlock anything again. A reason is always required, never optional.
    correction=(opts.correction!=null?opts.correction:
      (prompt("Why is this keyframe being rejected? (goes on record in History):","")||"")).trim();
    if(!correction)return;
  }
  if(cmd=="reject-scenelook"){
    // THE SCENE LOOK LIFECYCLE (2026-07-18): rejection archives the plate file itself (the
    // world anchor is never silently reused) and holds every shot's own keyframe validity
    // until a new approved plate lands — the same atomic-on-the-server discipline as
    // reject-keyframe.
    correction=(opts.correction!=null?opts.correction:
      (prompt("Why is this Scene Look Plate being rejected? (goes on record in History):","")||"")).trim();
    if(!correction)return;
  }
  if(cmd=="reject-voice"){
    // THE VOICE APPROVAL STEP (2026-07-19): the same atomic-on-the-server discipline —
    // archives the current take, clears the approval, requires a stated reason.
    correction=(opts.correction!=null?opts.correction:
      (prompt("Why is this voice take being rejected? (goes on record in History):","")||"")).trim();
    if(!correction)return;
  }
  const body={cmd,scene:String(SH_SC),episode:SH_EP};
  if(shotId)body.shotId=shotId;
  if(correction)body.correction=correction;
  if(opts.candidates!=null)body.candidates=opts.candidates;   // fire/next: batch size 1-4
  if(opts.spendToken)body.spendToken=opts.spendToken;         // fire/next: the SERVER-ISSUED single-use token from the shot's ledger pendingSpendAuth — without it the engine validates, prints the SPEND DISCLOSURE, stores the token and REFUSES (the designed step 1); the same token also resumes an interrupted batch
  if(opts.candidate!=null)body.candidate=opts.candidate;      // approve: which candidate wins (C1..CN)
  if(opts.category)body.category=opts.category;               // reject: failure category (REJECT_CATS)
  if(opts.sourcePath)body.sourcePath=opts.sourcePath;          // select-upload/select-library: the holding/library file's own path
  try{
    const r=await fetch(BASE+"/api/shot-run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});

    if(!j.ok){alert("Couldn't start: "+(j.error||"failed"));return;}

    if(typeof showToast=="function")showToast("▶ "+cmd+(shotId?" · "+shotId:"")+" — started",true);
    shPollStart();if(page=="pipeline")renderControl();
  }catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");}
}
