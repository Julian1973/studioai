async function renameEp(num){
  const ep=EPISODES.find(e=>e.number==num); const cur=(ep&&ep.title)||"";
  const t=prompt("Rename Episode "+num+":", cur);
  if(t==null) return;                          // cancelled
  const title=t.trim();
  if(!title){alert("The episode name can't be empty.");return;}
  if(title===cur) return;
  try{
    const r=await fetch(BASE+"/api/episode-rename",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({number:+num,title})});
    const j=await r.json();
    if(!j.ok){alert("Rename failed: "+(j.error||"failed"));return;}
    EPISODES=j.episodes;
    if(CUR&&CUR.number==num) CUR=EPISODES.find(e=>e.number==num)||CUR;
    if(page=="episodes") renderEpisodes(); else { renderTop&&renderTop(); if(page=="pipeline") renderControl(); }
  }catch(e){alert("Can't reach the studio server. Reload (Cmd-Shift-R).");}
}

let DOC=null;  // an attached binary script document {name, data} pending extraction on save
function addForm(){
  DOC=null;
  document.getElementById("view").innerHTML=`<h1 class="h1">Add episode</h1><p class="sub">Paste the script <b>or upload a document</b> — it's stored in the studio. (Run the Director afterward to break it into <b>beats</b>.)</p>
    <div class="form">
      <label>Episode number</label><input id="f-num" type="number" placeholder="e.g. 1"/>
      <label>Title</label><input id="f-title" type="text" placeholder="e.g. The Adventure Begins"/>
      <label>Script</label><textarea id="f-script" placeholder="Paste the full script here…"></textarea>

        <label class="btn ghost" style="cursor:pointer;margin:0">📄 Upload document
          <input id="f-doc" type="file" accept=".txt,.md,.markdown,.fountain,.docx,.pdf,.rtf,text/*" style="display:none" onchange="onDoc(event)"/>
        </label>
        <span id="f-docname" style="font-size:12px;color:var(--hint)">.txt · .md · .docx · .pdf · .rtf · .fountain</span>
      </div>
      <div style="margin-top:14px"><button class="btn" onclick="saveEp()">Save episode</button>
      <button class="btn ghost" onclick="goHome()">Cancel</button></div>
    </div>`;
}
function onDoc(e){
  const file=e.target.files[0]; if(!file) return;
  const name=file.name, ext=(name.split(".").pop()||"").toLowerCase();
  const tag=document.getElementById("f-docname");
  tag.textContent="Loading "+name+"…";
  const reader=new FileReader();
  if(["txt","md","markdown","fountain","text"].includes(ext)){
    reader.onload=()=>{document.getElementById("f-script").value=reader.result; DOC=null;
      tag.textContent="✓ "+name+" loaded into the script box (editable below)";};
    reader.readAsText(file);
  }else{
    reader.onload=()=>{DOC={name,data:reader.result};
      tag.textContent="✓ "+name+" attached — text is extracted on save";};
    reader.readAsDataURL(file);
  }
}
async function saveEp(){
  const num=document.getElementById("f-num").value,title=document.getElementById("f-title").value,script=document.getElementById("f-script").value;
  if(!num||(!script&&!DOC)){alert("Episode number and a script (pasted or uploaded) are required.");return;}
  const body={number:+num,title,script};
  if(DOC){body.docData=DOC.data; body.docName=DOC.name;}
  const r=await fetch(BASE+"/api/episode",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json();
  if(j.ok){EPISODES=j.episodes;openEpisode(+num);}else{alert("Error: "+(j.error||"failed"));}
}

    ${sd.title?`<div style="font-size:11px;color:var(--hint);margin-top:11px"><b>${sd.title.replace(/</g,'&lt;')}</b>${sd.logline?' — '+sd.logline.replace(/</g,'&lt;'):''}${sd.pillar?' · Pillar: '+sd.pillar:''}</div>`:''}</div>`;
}

// ── relative-time + per-project production stats, for the Projects screen cards ──
function relTime(ts){
  if(!ts)return null;
  const s=Math.max(0,Math.floor((Date.now()-ts*1000)/1000));
  if(s<60)return "just now";
  if(s<3600)return Math.floor(s/60)+"m ago";
  if(s<86400)return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function _jobGateLabel(gate){
  gate=String(gate||"");
  if(gate=="write")return "Script";
  if(gate.startsWith("creative"))return "Storyboard";
  if(gate.startsWith("shot"))return "Production";
  return gate||"Activity";
}
// ONE project (the primary, live production) actually runs through the Scene Board's own
// story-order roster + per-scene bundles — reusing sceneRoster/fetchSceneBundle/deriveSceneState
// exactly as the Scene Board does, never a second parallel computation. Any other project (an
// archived reference, or a future non-primary one) has no live pipeline data to honestly show —
// its card says so plainly rather than rendering a fabricated 0%.
async function projectStats(p){
  if(p.archived)return {archived:true};
  if(!p.primary)return {unsupported:true};
  try{
    const roster=await sceneRoster();
    if(!roster.length)return {empty:true};
    const bundles=await Promise.all(roster.map(r=>fetchSceneBundle(r.scene,"Ep1")));
    await fetchJobsNow();
    let doneStages=0,totalStages=0,decisions=0,artwork=null;
    roster.forEach((r,i)=>{
      const stages=deriveSceneState(bundles[i],true,r.scene);
      const st=sceneCardStatus(stages);
      if(st=="needs-decision"||st=="rejected"||st=="blocked")decisions++;
      // whitelisted to the real stage ids only — deriveSceneState also stashes an internal
      // "_per" array (the shared per-shot computation keyframe/animation/continuity reuse),
      // which Object.values(stages) would otherwise miscount as an extra, always-incomplete
      // "stage" and skew this percentage low.
      PSTAGES.map(p=>p.id).forEach(id=>{const x=stages[id];if(!x)return;totalStages++;if(x.state=="approved")doneStages++;});
      if(!artwork&&r.plate)artwork="/engine/media/"+r.plate;
    });
    const jobs=Object.values(PJOBS).filter(j=>j.ended||j.started).sort((a,b)=>(b.ended||b.started)-(a.ended||a.started));
    const latest=jobs[0];
    const activity=latest
      ? relTime(latest.ended||latest.started)+" · "+_jobGateLabel(latest.gate)+(latest.scene&&latest.scene!="—"?" · Scene "+latest.scene:"")
      : "No activity yet";
    return {completion:totalStages?Math.round(100*doneStages/totalStages):0, decisions, artwork, activity, scenes:roster.length};
  }catch(e){ return {error:true}; }
}
function jobFor(kind,scene){

    (kind=="write"?String(j.gate)=="write":
     kind=="storyintake"?String(j.gate)=="storyintake":
     kind=="creative"?String(j.gate).startsWith("creative:"):
     String(j.gate).startsWith("shot:"))&&
    (kind=="write"||kind=="storyintake"||String(j.scene)==String(scene))
  ).sort((a,b)=>(a.started||0)-(b.started||0)).pop()||null;

// 2026-07-19 fix ("does it all work properly" audit — a single in-flight shot job was
// lighting up FIVE separate pipeline stages as "Generating" at once, e.g. an Animation
// candidate fire showed Look Development/Cinematography/Voice/Final all "Generating" too,
// even while Look Development's own panel said "Approved · current" underneath): a job's
// gate string is "shot:<cmd>[:<shotId>]" (serve.py's shot_run_job builds it), and <cmd>
// already names exactly which stage it belongs to (serve.py's own SHOT_CMDS list) — jobFor's
// blanket "shot:" prefix match just never read that far. _shotJobCmd extracts <cmd>;
// STAGE_JOB_CMDS maps each PSTAGE id to the cmds that actually belong to it; jobForStage
// is the stage-scoped replacement for deriveSceneState's five identical `running("shot")`
// calls below. "animatic" isn't in any bucket — grepped clean, no UI button fires it today.
function _shotJobCmd(gate){
  const s=String(gate); if(!s.startsWith("shot:"))return null;
  const rest=s.slice(5), i=rest.indexOf(":");

// ── ONE ARTIFACT, ONE CARD, ONE DECISION ────────────────────────────────────────────────
// Julian, 2026-07-27: "I want a UI and interface that allows me to generate upload or use
// from library / agree or reject / re run / and then move... at the moment a gate can have
// multiple things to sign off like approve director create scene plate etc etc."
//
// That last clause is the defect named exactly. The capability was never missing — every one
// of these verbs already exists in cb_render and already reaches this file. What was wrong is
// the GROUPING: the affordances for one artifact were scattered across sections, so "approve"
// could mean two different things depending on where you clicked it.
//
// ARTIFACTS is the fix, and it is deliberately the same shape for every row: what MAKES this
// artifact (generate / upload / from library), what JUDGES it (agree / reject), and what
// REDOES it. A gate stops being a thing you sign; it is a heading over its cards. Approve
// always means this one artifact, because a card only ever holds one.
//
// The engine is the authority on which verbs exist — test_studio_artifact_cards.py refuses a
// card offering a verb cb_render does not have, and refuses an engine artifact with no card.
// A DISCLOSURE'S LABEL IS ITS ONLY ADVERTISEMENT (2026-07-27, Julian: "I would like to be
// able to edit the voice prompt to see if adding the [cadence] in v3 using the brackets").
// The editor he was asking for had existed for eight days, behind "Voice workbench & history"
// — a name that describes where the thing lives rather than what it lets you do, so it went
// unfound. One constant, so the three rows that open it can never again describe it three
// different ways.
const VOICE_EDIT_LABEL="✎ Edit the performance prompt — v3 [tags] and cadence";
const ARTIFACTS={
  scenelook:{name:"SCENE LOOK",  make:{generate:"scenelook", upload:"select-scenelook-upload", library:"select-scenelook-library"},
             agree:"approve-scenelook", reject:"reject-scenelook", redo:"unapprove-scenelook"},
  keyframe: {name:"OPENING FRAME", make:{generate:"keyframe", upload:"select-upload", library:"select-library"},
             agree:"approve-keyframe", reject:"reject-keyframe", redo:"unapprove-keyframe"},
  voice:    {name:"VOICE",       make:{generate:"voice"},
             agree:"approve-voice", reject:"reject-voice", redo:"regen-voice"},
  animation:{name:"TAKE",        make:{generate:"fire", upload:"select-upload", library:"select-library"},
             agree:"approve", reject:"reject", redo:"unapprove-shot"}
};
// The job-watcher's own view of the same table — every verb a card can fire, so a running job
// still lights up its own row. Derived, never hand-listed a second time.
const STAGE_JOB_CMDS=(()=>{
  const t={};
  for(const [k,a] of Object.entries(ARTIFACTS))
    t[k]=[...Object.values(a.make||{}),a.agree,a.reject,a.redo].filter(Boolean);
  t.keyframe.push("select-previous");   // a third library shape, keyframe only
  t.animation.push("next");             // advance_shot's own verb, fired from the take card
  t.final=["stitch"];
  return t;
})();
// ── "IS THIS ONE BEING MADE RIGHT NOW?" ──────────────────────────────────────────────────
// Julian, 2026-07-27: "when i click generate i want something on that card to tell me that
// is generating — maybe in the missing box section."
//
// He is describing a real hole. _shPollTick syncs PJOBS every tick but only REPAINTS when the
// job ends, so for the entire run the card kept showing "not made yet" — which is not merely
// unhelpful, it is untrue: it is being made, right now, and the screen says it isn't.
//
// Scoped to ONE artifact on ONE shot, from ARTIFACTS' own verb list rather than a hand-typed
// one, so a card can never watch for a job it doesn't fire (serve.py builds the gate string
// as "shot:<cmd>[:<shotId>]").
function artifactJob(key,shotId){
  const a=ARTIFACTS[key]; if(!a)return null;
  const mine=[...Object.values(a.make||{}),a.redo].filter(Boolean);
  return Object.values(PJOBS).filter(j=>{
    if(j.status!="running")return false;
    const g=String(j.gate); if(!g.startsWith("shot:"))return false;
    const rest=g.slice(5), i=rest.indexOf(":");
    const cmd=i===-1?rest:rest.slice(0,i), sid=i===-1?null:rest.slice(i+1);
    return mine.includes(cmd)&&(!shotId||!sid||sid===shotId);
  }).sort((x,y)=>(x.started||0)-(y.started||0)).pop()||null;
}

function workingBoxHTML(job,what){

  return `<div class="runworking" data-started="${job&&job.started||0}">
    <div class="runworking-bar"><i></i></div>
    <div class="runworking-txt">Generating ${_esc(what)}<span class="runworking-el tnum">${_fmtEl(el)}</span></div>
    <div class="runworking-sub">${_esc(step)} — you can leave this page; it keeps running.</div>
  </div>`;
}
function _fmtEl(s){const m=Math.floor(s/60);return m?`${m}m ${String(s%60).padStart(2,"0")}s`:`${s}s`;}
function jobForStage(stageId,scene){
  const cmds=STAGE_JOB_CMDS[stageId]; if(!cmds)return null;
  return Object.values(PJOBS).filter(j=>j.status=="running"&&String(j.scene)==String(scene)&&
    cmds.includes(_shotJobCmd(j.gate))
  ).sort((a,b)=>(a.started||0)-(b.started||0)).pop()||null;
}

// ── the scene roster (story order) — reused by the Scene Board and every scene selector ──

// reusable location-asset manifest. /api/loclib stays exactly what it always was — a
// persistent, cross-episode library of signed-off location plates, entirely separate from
// "which scenes exist in this episode." A scene here NEVER carries a plate automatically
// just because a loclib entry happens to share its name — that stays a deliberate, later,
// human selection (never wired here).

async function sceneRoster(){

// ── one scene's full state: storyboard + production package + media, 404-tolerant ──

    fetch(BASE+"/api/scenelook?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>({status:"none"})),

    fetch(BASE+"/api/shot-departments?scene="+encodeURIComponent(scene)+"&episode="+encodeURIComponent(episode),{cache:"no-store"}).then(r=>r.json()).catch(()=>({shots:{}})),
  ]);

// ── pure status derivation — the ONE place the 7-state vocabulary is computed, reused by
// both the Scene Board (many scenes at once) and the Scene Workspace (the open scene) ──
// ── PER-SHOT PIPELINE STATE (2026-07-18 correction — "the user must never decide manually
// which shots require keyframes"): the ONE place a shot's own Keyframe/Voice/Animation/
// Continuity readiness is computed. Never a scene-wide lock — each shot's own dependency is
// its own IMMEDIATELY PRECEDING shot in shot order (never sourceShotId, which is null for an
// opener; continuityIn is always authored as "what carries in from the shot immediately
// before this one," matching cb_creative.py's own doctrine). sourceType (derived upstream —
// cb_creative.py's requiresNewKeyframe, mapped 1:1 by cb_handover.py — is_opener is the ONLY
// mechanical/structural part; every other shot's value is the mind's own authored creative
// judgment, defaulting to relay/false even across a PLANNED_CUT, per the 2026-07-19 fix to
// the straightjacket that used to force True on every cut regardless of authored continuity)
// is trusted as the authoritative keyframe-need signal; this function never re-reads

function shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,reassessFor,deptFor){
  const s=shots[i], led=ledgerFor(s.shotId)||{};
  const prev=i>0?shots[i-1]:null;
  const prevLed=prev?ledgerFor(prev.shotId):null;
  const prevApproved=!prev||(prevLed&&prevLed.status=="approved");
  const needsKeyframe=(s.sourceType=="opener");
  // THE DEPARTMENT-DIRECTION REALITY CHECK (2026-07-19, Julian, live — "you're not firing
  // in the director's section, so it's coming through without any directing in it"):
  // keyframeApproval/voiceApproval only ever recorded that a HUMAN clicked approve on
  // generated media — never whether the real Cinematographer/DP or Voice Director
  // specialist consult (THE CORE LAW's own department gate) ever actually ran. Confirmed
  // live: S1.SH1's keyframeApproval/voiceApproval are both approved, reviewedBy Julian,
  // hours before the department system existed — its departmentWork ledger is empty.

  // Scene Board pass across the whole roster) degrades to "not yet known" rather than a

  const dept=(deptFor?deptFor(s.shotId):null)||{};

  const voiceDept=dept.voice||null;
  const cinDirected = !needsKeyframe ? true : (cinDept ? !!cinDept.approvalCurrent : null);
  const talkyForDept=(s.dialogueLines||[]).length>0;
  const voiceDirected = !talkyForDept ? true : (voiceDept ? !!voiceDept.approvalCurrent : null);
  // THE "NO DIRECTION ON RECORD" WORDING BUG (2026-07-20, found live — Julian: "I am still
  // stuck, I can't reauthorise the keyframe"): cinDirected/voiceDirected are FALSE both when
  // nothing was ever prepared AND when a real, approved direction exists but merely isn't
  // CURRENT right now (e.g. the sealed-evidence mismatch the Restore-from-history control
  // exists to fix) — a genuinely different, much less alarming situation. The message text
  // below must say which one is actually true, never "no ... on record" for a shot that HAS
  // an approved record sitting one panel above it (cinDept.prepared distinguishes the two;
  // /api/shot-departments already returns it, this file just never read it before now).
  const cinNeverPrepared = needsKeyframe && cinDept && !cinDept.prepared;
  const voiceNeverPrepared = talkyForDept && voiceDept && !voiceDept.prepared;
  let kf;   // "ready" | "waitingPrev" | "awaiting" | "approved" | "rejected" | "inherited" —
            // never "staleInputs": that used to be a real value here (removed 2026-07-20),
            // now `stale` is a separate additive flag returned alongside kf, never replacing it
  if(needsKeyframe){
    // A PENDING CANDIDATE ALWAYS WINS, EVEN OVER AN OLDER APPROVAL (2026-07-20 fix, found
    // live: S1.SH1 had a genuine keyframeApproval AND a genuine, unreviewed newer
    // keyframeCandidate at the same time — approve_keyframe/keyframe_shot on the backend
    // already treat keyframeCandidate as the one authoritative "something needs Julian's
    // decision right now" signal, regardless of whether an older approval also exists
    // (fire_shot's own refusal proves it: "already has a keyframe candidate awaiting a
    // decision" fires no matter what keyframeApproval says). This priority order used to
    // check keyframeApproval FIRST, so a real pending decision could become permanently
    // invisible the moment an older approval already existed — exactly what made S1.SH1's
    // real candidate structurally unreachable through the UI.
    if(led.keyframeCandidate) kf="awaiting";
    else if(led.keyframeApproval&&led.keyframeApproval.approved) kf="approved";
    else if(led.keyframeRejected) kf="rejected";
    else if(!prevApproved) kf="waitingPrev";
    else kf="ready";
  } else {
    kf = prevApproved ? "inherited" : "waitingPrev";
  }
  // DIRECT-INPUT LINEAGE (2026-07-18 production-safety directive, items 3/4/6): an existing
  // approved/awaiting keyframe is checked against its OWN recorded input signature — its own
  // card hash, the approved Scene Look hash, its own reference hashes, the compiled brief,
  // model/settings — never the whole storyboard/package md5. An unrelated shot's edit (e.g.
  // S1.SH6) never reaches here at all, because reassessFor only ever reports THIS shot's own
  // comparison. reassessFor is optional (defaults to reporting nothing) so callers that
  // haven't fetched reassessment data (the Scene Board's cross-scene aggregate, today) simply
  // fall back to the ledger-only kf value above, never a crash.
  const reassess = (reassessFor ? reassessFor(s.shotId) : null) || null;
  // THE ADVISORY-NEVER-A-SILENT-OVERRIDE FIX (2026-07-20, found live: S1.SH1 had a real,
  // genuine keyframeCandidate awaiting Julian's decision, but this used to REASSIGN kf to
  // a synthetic "staleInputs" value the instant reassess also flagged "regenerate" — which
  // then fell through to the SAME "ready to generate a new one" screen as a shot with no
  // candidate at all, hiding the real Approve/Reject buttons entirely and making the
  // pending decision structurally unreachable through the UI (the backend was never wrong:
  // it correctly refused to generate a second candidate while one was still pending — the
  // Studio just never showed the screen that would let it be resolved). `stale` is now a
  // separate, additive flag — never overwrites kf, keyframeSatisfied or readyToAnimate —
  // matching this exact function's own already-established pattern for the identical class
  // of fact one block below (cinDirected/voiceDirected's undirectedNotes, and the
  // 2026-07-18 correction just above that already made whole-package lineage "provenance
  // evidence only... never gates readiness"): a changed direct input is real information
  // worth surfacing, never grounds to hide the actual pending action.
  const stale = (kf=="approved"||kf=="awaiting") && reassess && reassess.verdict=="regenerate";
  // SCENE LOOK GATE (2026-07-18, Julian's directive): checked BEFORE anything else — Scene
  // Look sits upstream of the whole Shot Production stage in the pipeline order (Storyboard
  // -> Scene Look -> Shot Production), so a not-current-approved plate holds EVERY shot here,
  // including one whose OWN keyframe was already approved before this gate existed (S1.SH1) —
  // the underlying approval fact is never erased, only its downstream readiness is held.
  const sceneLookGated = sceneLookOk===false;
  const keyframeSatisfied = needsKeyframe ? kf=="approved" : kf=="inherited";
  const talky=(s.dialogueLines||[]).length>0;
  // 2026-07-19: voiceOk means APPROVED, not merely generated — matching keyframe's own
  // "a generated-but-unapproved candidate is never a valid anchor" rule (the voice approval
  // step, cb_render.approve_voice/reject_voice).
  const voiceOk=!talky||!!(led.voiceApproval&&led.voiceApproval.approved);
  const animState=led.status||"designed";
  // (2026-07-18 correction): lineageOk (whole-package/storyboard md5 match) is PROVENANCE
  // EVIDENCE ONLY now, surfaced in Technical Details — it no longer gates readiness at all.
  // A package rebuild triggered by an unrelated shot's edit must never block THIS shot's own
  // already-valid, already-approved keyframe from proceeding to animation.
  const readyToAnimate=keyframeSatisfied&&voiceOk&&!sceneLookGated;
  let label,sub=null,badgeState="ready";
  if(sceneLookGated){
    label="Waiting for Scene Look approval";

        ?"this shot's own keyframe was approved before Scene Look existed as a gate — held pending its approval"
        :"the environment/palette/lighting anchor must be approved first";

  } else if(kf=="waitingPrev"){
    // (2026-07-18) label names the specific predecessor shot by ID, per Julian's own
    // "make the opening-frame source unmistakable" instruction — never a generic "previous".
    label=prev?`Waiting for ${prev.shotId} final frame`:"Waiting for previous final frame";
    sub=prev?`waiting on ${prev.shotId}'s animation to be approved`:null; badgeState="locked";
  } else if(needsKeyframe&&(kf=="ready"||kf=="rejected")){
    // (2026-07-18) cost read live from the fetched RATES table (never hardcoded) so this
    // label can never silently drift from cb_costs.py's own real, authoritative rate.
    { const kr=(RATES||{})["seedream5pro_image"];
      label="New keyframe required"+(kr?` — estimated cost $${kr.usd}`:""); }
    if(kf=="rejected") sub="rejected — ready to regenerate"; badgeState="ready";
  } else if(needsKeyframe&&kf=="awaiting"){
    label="Keyframe awaiting approval"; badgeState="awaiting";
  } else if(!keyframeSatisfied){
    // kf=="inherited" or "approved" already covers keyframeSatisfied==true, so this branch
    // is unreachable in practice — kept as an explicit, honest fallback, never a silent guess.
    label=needsKeyframe?"Keyframe awaiting approval":(prev?`Waiting for ${prev.shotId} final frame`:"Waiting for previous final frame"); badgeState="locked";
  } else if(!voiceOk){
    label=needsKeyframe?"Keyframe approved":"Opening frame inherited — no generation and no cost"; sub="awaiting this shot's voice"; badgeState="ready";
  } else if(animState=="designed"){
    label="Ready to animate"; badgeState="ready";
  } else if(animState=="candidates-pending"){
    label="Animation awaiting approval"; badgeState="awaiting";
  } else if(animState=="model-limited"){
    label="Animation blocked"; sub="needs human redesign"; badgeState="blocked";
  } else {   // animState=="approved"
    // CONTINUITY (2026-07-18, honestly scoped): mechanically inferred from Animation approval
    // — there is no separate persisted human continuity sign-off in this pipeline today (the
    // existing Continuity screen is a report, not a decision). "Complete" is shown once this
    // shot's own Animation is approved, since that is the one real, persisted fact available;
    // a genuine per-join human check-off (using that same outgoing/incoming frame comparison)
    // would be a small, separate follow-on feature, not invented here.
    label="Complete"; badgeState="approved";
  }
  // THE UNDIRECTED-APPROVAL FLAG, APPLIED LAST, ACROSS EVERY BRANCH ABOVE (2026-07-19): a
  // human approval and a real department consult are two separate facts — this never
  // erases or contradicts the branch's own label/badgeState (the media genuinely IS
  // approved), it appends the one thing none of those branches could otherwise say: no
  // Cinematographer/DP or Voice Director specialist direction is on record for it. Skipped
  // entirely when deptFor wasn't supplied (cinDirected/voiceDirected stay null) — a Scene
  // Board pass across the whole roster reports nothing rather than guessing either way.
  const undirectedNotes=[];
  if(kf=="approved"&&cinDirected===false) undirectedNotes.push(
    cinNeverPrepared?"no Cinematography direction on record"
                    :"Cinematography direction not current — see the Cinematography panel");
  if(voiceOk&&talky&&voiceDirected===false) undirectedNotes.push(
    voiceNeverPrepared?"no Voice direction on record"
                       :"Voice direction not current — see the Voice panel");
  // `stale` folded in here, additively, the SAME way as the undirected-approval notes just
  // above — a changed direct input is real information worth surfacing, never grounds to
  // swap out the real kf/label/badgeState computed above (see the 2026-07-20 fix note where
  // `stale` is first computed).
  // THE RUN-ON-SENTENCE BUG (2026-07-21, found live — Julian: "this is a joke now", reading
  // the Voice panel's "Voice direction not current" note joined by "; " directly onto this
  // KEYFRAME reassessment note's own changed-fields list (briefHash/cardHash/model/
  // referenceHashes/sceneLookHash — cb_render.py's own keyframe input-signature fields, see
  // cb_render._keyframe_input_signature) as if the fields explained the Voice message,
  // when the two are completely unrelated facts about two different departments that just
  // happened to co-occur for this shot. Named explicitly here — "the keyframe's" — so the
  // joined sentence can never again read as one clause explaining the other, regardless of
  // which other notes it happens to sit next to in undirectedNotes.
  if(stale) undirectedNotes.push("the keyframe's own generation inputs changed"+
      ((reassess.changed||[]).length?`: ${reassess.changed.join(", ")}`:""));
  if(undirectedNotes.length){
    sub=(sub?sub+" — ":"")+"⚠ "+undirectedNotes.join("; ");
  }
  return {shotId:s.shotId,needsKeyframe,kf,keyframeSatisfied,talky,voiceOk,animState,readyToAnimate,
          cinDirected,voiceDirected,label,sub,badgeState,sceneLookGated,stale};
}
function deriveSceneState(bundle,scriptApproved,scene){
  const running=kind=>jobFor(kind,scene);
  const out={};
  out.script = running("write") ? {state:"generating"} : {state: scriptApproved?"approved":"ready"};
  if(out.script.state!="approved"){ out.storyboard={state:"locked"}; }
  else if(running("creative")){ out.storyboard={state:"generating"}; }
  else if(!bundle.storyboard){ out.storyboard={state:"ready"}; }
  else{
    const st=bundle.storyboard.approvalState||"";
    if(st=="approved") out.storyboard={state:"approved"};
    else if(/reject/i.test(st)) out.storyboard={state:"rejected", note:bundle.storyboard.humanNote||null};
    else out.storyboard={state:"awaiting"};
  }
  const shots=(bundle.pkg&&bundle.pkg.shots)||[];
  const media=(bundle.media&&bundle.media.shots)||{};
  const ledger=(bundle.pkg&&bundle.pkg.continuityLedger)||[];
  const ledgerFor=id=>ledger.find(e=>e.shotId==id)||{};
  // THE DEPARTMENT-DIRECTION LOOKUP (2026-07-19) — shared across the keyframe/voice/
  // animation blocks below, all of which need it to distinguish "a human approved this
  // media" from "a real specialist consult was ever prepared for it". bundle.departments
  // comes from /api/shot-departments (fetchSceneBundle), fetched fresh per scene bundle —
  // available for every scene, not just the one open in Shot Production.
  const deptFor = shotId => (bundle.departments||{})[shotId] || null;
  // SCENE LOOK (2026-07-18, Julian's directive): the gate between Storyboard and Shot
  // Production. Establishes environment/location identity, world scale, palette, materials/
  // texture, lighting, weather/atmosphere and overall visual feeling ONLY — never shot
  // composition, camera position, character pose or movement (those stay owned by each
  // approved storyboard shot). Never inferred from the plate file's mere existence — a real
  // human decision (approve or reject) is what the "awaiting"->"approved"/"rejected"
  // transition actually records.
  if(out.storyboard.state!="approved"){ out.scenelook={state:"locked"}; }
  else if(jobForStage("scenelook",scene)){ out.scenelook={state:"generating"}; }
  else{
    const sl=bundle.scenelook||{status:"none"};
    if(sl.status=="none") out.scenelook={state:"ready", sub:"no plate yet"};
    else if(sl.status=="awaiting") out.scenelook={state:"awaiting", sub:"a plate is awaiting your decision"};
    else if(sl.status=="approved") out.scenelook={state:"approved", sub:"approved · current"};
    else if(sl.status=="stale") out.scenelook={state:"awaiting", sub:"approved once, but the storyboard has changed since — re-approve or regenerate"};
    else if(sl.status=="rejected") out.scenelook={state:"rejected", sub:sl.rejectedNote||"rejected — ready to regenerate"};
    else out.scenelook={state:"ready"};
  }
  // sceneLookOk gates every shot's own readiness below (shotPipelineState's own leading
  // check) — true ONLY on a genuine current approval, never on "ready"/"awaiting"/"stale"/
  // "rejected"/"locked"/"generating".
  const sceneLookOk = out.scenelook.state=="approved";
  // KEYFRAME — THE STATE-INTEGRITY CHECKPOINT (2026-07-17), CORRECTED 2026-07-18 (direct-
  // input lineage): derived from the ledger's own keyframeCandidate/keyframeApproval/
  // keyframeRejected fields (never from whether a file happens to exist at a shot's
  // conventional media path) PLUS, for the currently-open scene, each shot's own direct-
  // input reassessment. Package/storyboard lineage (whole-md5 match) is NO LONGER a
  // blocking gate here — an edit to ONE shot (S1.SH6) used to read as "Production package
  // belongs to a superseded storyboard version" and block EVERY shot in the scene,
  // including ones whose own inputs never changed (S1.SH1). Lineage is still surfaced as
  // provenance in Technical Details, never as a reason nothing can proceed.
  if(out.storyboard.state!="approved"){ out.keyframe={state:"locked"}; }
  else if(jobForStage("keyframe",scene)){ out.keyframe={state:"generating"}; }
  else if(!bundle.pkg){ out.keyframe={state:"blocked", sub:"Approve the storyboard to hand it to production"}; }
  else{
    // PER-SHOT GATING (2026-07-18 correction): "Keyframes"/"Voice"/"Animation"/"Continuity"
    // are now PRODUCTION SUMMARIES, never scene-wide locks — the whole stage stays reachable
    // the instant the storyboard is approved; each shot's own generate/approve action is
    // gated by shotPipelineState alone (see renderShotRunner), never by every other shot in
    // the scene. A shot never needs to wait for every OTHER shot in the scene — only its own
    // immediately-preceding shot, exactly as the production line actually depends.
    const lineageOk=!!(bundle.media&&bundle.media.lineage&&bundle.media.lineage.current);
    // reassessFor is only meaningful for the scene currently open in the Shot Production
    // workspace (SH_REASSESS is fetched per that one scene) — a different scene in a
    // roster/Scene-Board pass simply reports nothing to reassess yet (falls back to plain
    // ledger state), never a false "blocked".
    const reassessFor = (scene==SH_SC) ? shReassess : (()=>null);
    const per=shots.map((s,i)=>shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,reassessFor,deptFor));
    const openerN=per.filter(p=>p.needsKeyframe).length;
    const kfApprovedN=per.filter(p=>p.needsKeyframe&&p.kf=="approved").length;
    const kfAwaitingN=per.filter(p=>p.needsKeyframe&&p.kf=="awaiting").length;
    // `stale` is now an ADDITIVE flag (2026-07-20 fix), never mutually exclusive with
    // approved/awaiting — a stale shot is already counted in kfApprovedN or kfAwaitingN
    // above, so it's NOT subtracted again here (that would double-count it out of
    // kfWaitingN, the real bug the old "kf=='staleInputs'" mutually-exclusive state used
    // to avoid by construction).
    const kfStaleN=per.filter(p=>p.needsKeyframe&&p.stale).length;
    const kfWaitingN=openerN-kfApprovedN-kfAwaitingN;
    // THE UNDIRECTED-APPROVAL COUNT (2026-07-19): an approved keyframe with cinDirected===
    // false never counted here before — the top strip could say "3 of 3 approved" while
    // zero of those three ever had a real Cinematography direction behind them (S1.SH1's
    // exact live state). cinDirected===null (deptFor genuinely unavailable) is treated as
    // directed, matching the pre-existing behaviour rather than a false negative.
    const kfUndirectedN=per.filter(p=>p.needsKeyframe&&p.kf=="approved"&&p.cinDirected===false).length;
    // THE "AWAITING APPROVAL" MISLABEL (2026-07-21, Julian, live — the ribbon read
    // "Cinematography — Awaiting approval" for S1.SH1 while its own department panel said
    // "Applied by system... already approved and current, nothing to approve"): this
    // branch used to jump straight to state:"awaiting" the instant ANY shot's keyframe was
    // flagged `stale` (its own generation inputs — cardHash/briefHash/referenceHashes/
    // sceneLookHash/model — drifted since it was built), even when every keyframe that
    // needs one is already approved and nothing is actually sitting there awaiting a human
    // decision. `stale` and `kfUndirectedN` are both real, worth-surfacing FLAGS about an
    // otherwise-approved keyframe (matching shotPipelineState's own additive-flag design,
    // never mutually exclusive with approved/awaiting) — they describe "you might want to
    // regenerate this" or "no department direction is on record for it," never "something
    // is waiting for your approval right now." Checking kfApprovedN==openerN FIRST (same
    // as the sibling branch used to, just reordered) means a fully-approved scene reports
    // state:"approved" with the flags folded into its own sub-text, instead of a label that
    // contradicts every per-shot panel underneath it.
    if(!openerN) out.keyframe={state: shots.length?"approved":"ready", sub:"no shot in this scene needs its own keyframe"};
    else if(kfApprovedN==openerN){
      const flags=[];
      if(kfStaleN>0) flags.push(kfStaleN+" flagged (direct inputs changed since generation)");
      if(kfUndirectedN>0) flags.push(kfUndirectedN+" with no Cinematography direction on record");
      out.keyframe={state:"approved", sub:kfApprovedN+" of "+openerN+" approved"+(flags.length?" — ⚠ "+flags.join("; "):"")};
    }
    else if(kfAwaitingN>0) out.keyframe={state:"awaiting", sub:kfApprovedN+" approved · "+kfAwaitingN+" awaiting your decision"+(kfStaleN>0?" · "+kfStaleN+" flagged (direct inputs changed)":"")};
    else out.keyframe={state:"ready", sub:kfApprovedN+" approved · "+kfWaitingN+" waiting"};
    out._per=per;   // shared per-shot computation, reused below for voice/animation/continuity
  }
  // VOICE — reachable as soon as the storyboard is approved; NEVER gated on every keyframe
  // being approved first (the prior bug this correction closes). Summary counts talky shots.
  // CORRECTED 2026-07-18: "done" used to mean "a voice file happens to exist"
  // ((media[s.shotId]||{}).vo) — the same file-existence-vs-approval conflation already
  // fixed in shotPipelineState's voiceOk. A generated-but-unapproved take was silently
  // counted as "approved" in this very card. Now mirrors the keyframe/animation summaries
  // just above/below: counts only shots whose ledger actually carries voiceApproval.approved.
  if(out.storyboard.state!="approved"){ out.voice={state:"locked"}; }
  else if(jobForStage("voice",scene)){ out.voice={state:"generating"}; }
  else{
    const talky=shots.filter(s=>(s.dialogueLines||[]).length);
    const done=talky.filter(s=>{const led=ledgerFor(s.shotId); return !!(led.voiceApproval&&led.voiceApproval.approved);}).length;
    const generatedN=talky.filter(s=>(media[s.shotId]||{}).vo).length;
    // same undirected check as keyframe — a voice approved with no current Voice Director
    // consult on record (S1.SH1's exact live state: voiceApproval.approved, departmentWork
    // empty — approved hours before the department system existed).
    const voiceUndirectedN=talky.filter(s=>{
      const led=ledgerFor(s.shotId);
      if(!(led.voiceApproval&&led.voiceApproval.approved)) return false;
      const d=(deptFor(s.shotId)||{}).voice;
      return d && d.approvalCurrent===false;
    }).length;
    if(!talky.length) out.voice={state:"approved", sub:"No dialogue in this scene"};
    else if(done==talky.length&&voiceUndirectedN>0) out.voice={state:"awaiting",
      sub:done+" of "+talky.length+" approved — ⚠ "+voiceUndirectedN+" with no Voice direction on record"};
    else if(done==talky.length) out.voice={state:"approved", sub:done+" of "+talky.length+" approved"};
    else if(generatedN>0) out.voice={state:"ready", sub:done+" of "+talky.length+" approved · "+generatedN+" awaiting your decision"};
    else out.voice={state:"ready", sub:"0 of "+talky.length+" generated"};
  }
  // ANIMATION — reachable as soon as the storyboard is approved; unlocks INDEPENDENTLY per
  // shot the moment THAT shot has an approved keyframe/inherited frame + its own voice (if
  // any) + current lineage — never gated on every other shot's keyframe or voice first.
  if(out.storyboard.state!="approved"){ out.animation={state:"locked"}; }
  else if(jobForStage("animation",scene)){ out.animation={state:"generating"}; }
  else if(!ledger.length){ out.animation={state:"ready"}; }
  else{
    const lineageOk=!!((bundle.media&&bundle.media.lineage&&bundle.media.lineage.current));
    const per=out._per||shots.map((s,i)=>shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,()=>null,deptFor));
    const total=ledger.length;
    const approvedN=ledger.filter(e=>e.status=="approved").length;
    const blockedN=ledger.filter(e=>e.status=="model-limited").length;
    const pendingN=ledger.filter(e=>e.status=="candidates-pending").length;
    const readyN=per.filter(p=>p.readyToAnimate&&p.animState=="designed").length;
    // same undirected check as keyframe/voice — an approved animation whose own Animation
    // Director consult was never prepared/approved (approvalCurrent read directly per shot,
    // since shotPipelineState doesn't compute an "animDirected" field of its own — animState
    // being "approved" already means a real fire happened, unlike keyframe/voice's legacy
    // pre-hardening approvals, so this checks the SAME live department_readiness reading).
    const animUndirectedN=ledger.filter(e=>{
      if(e.status!="approved") return false;
      const d=(deptFor(e.shotId)||{}).animation;
      return d && d.approvalCurrent===false;
    }).length;
    if(blockedN>0) out.animation={state:"blocked", sub:blockedN+" shot"+(blockedN>1?"s":"")+" need human redesign"};
    else if(pendingN>0) out.animation={state:"awaiting", sub:approvedN+" of "+total+" approved · "+pendingN+" awaiting your decision"};
    else if(approvedN==total&&animUndirectedN>0) out.animation={state:"awaiting",
      sub:total+" of "+total+" approved — ⚠ "+animUndirectedN+" with no current Animation direction on record"};
    else if(approvedN==total) out.animation={state:"approved", sub:total+" of "+total+" approved"};
    // NEVER "locked" here — that value disables navigation entirely (pFocusStage/
    // renderWorkspaceBody both hard-stop on it). "0 ready" is an honest SUMMARY, not a gate;
    // the per-shot screen (shotPipelineState) is what actually tells each shot why it's
    // waiting, and remains reachable regardless of what this aggregate says.
    else out.animation={state:"ready", sub:approvedN+" approved · "+readyN+" ready · "+(total-approvedN-readyN)+" waiting"};
  }
  // CONTINUITY — a real review screen exists (outgoing frame vs next incoming frame); per-shot
  // "complete" is mechanically inferred from that shot's own Animation approval (see
  // shotPipelineState's own comment — no separate persisted continuity sign-off exists today).
  {
    const lineageOk=!!((bundle.media&&bundle.media.lineage&&bundle.media.lineage.current));
    const per=out._per||shots.map((s,i)=>shotPipelineState(shots,i,ledgerFor,media,lineageOk,sceneLookOk,()=>null,deptFor));
    const total=shots.length;
    const completeN=per.filter(p=>p.label=="Complete").length;
    if(out.storyboard.state!="approved") out.continuity={state:"locked"};
    else if(!total) out.continuity={state:"ready", sub:"0 complete"};
    else out.continuity={state: completeN==total?"approved":"ready", sub:completeN+" of "+total+" complete"};
  }
  if(out.continuity.state!="approved"){ out.final={state:"locked"}; }
  else if(jobForStage("final",scene)){ out.final={state:"generating"}; }
  else if(bundle.media&&bundle.media.picture){ out.final={state:"approved"}; }
  else{ out.final={state:"ready"}; }
  return out;
}
function nextReadyStage(stages){
  for(const s of PSTAGES) if(stages[s.id].state!="locked"&&stages[s.id].state!="approved") return s.id;
  return "final";
}
function sceneCardStatus(stages){
  const vals=Object.values(stages).map(s=>s.state);
  if(vals.some(v=>v=="blocked")) return "blocked";
  if(vals.some(v=>v=="generating")) return "generating";
  if(vals.some(v=>v=="rejected")) return "rejected";
  if(stages.final.state=="approved") return "complete";
  if(vals.some(v=>v=="awaiting")) return "needs-decision";
  return "ready";
}
function badge(state,sub){
  return `<span class="stbadge" style="color:var(${STATE_COLOR[state]});background:var(${STATE_BG[state]})">${STATE_GLYPH[state]} ${_esc(STATE_LABEL[state])}</span>`+(sub?`<span class="badgesub">${_esc(sub)}</span>`:"");
}

  const view=document.getElementById("view");
  view.innerHTML=`<h1 class="h1">${_esc((CUR&&CUR.title)||("Episode "+(CUR&&CUR.number)))}</h1>
    <p class="sub">Every scene keeps its own pipeline, shown in script order. Work whichever one needs you next.</p>
    <div id="boardbody" class="coming">Loading scenes…</div>`;

async function loadBoard(){
  if(BOARD_LOADING)return; BOARD_LOADING=true;
  try{
    const roster=await sceneRoster(); SCENE_ROSTER=roster;
    const scriptApproved=!!(CUR&&CUR.script);
    await fetchJobsNow();
    if(jobFor("storyintake","-"))_sbStoryPollStart();   // resume the status bar after navigating back mid-run
    const bundles=await Promise.all(roster.map(r=>fetchSceneBundle(r.scene,SH_EP)));
    BOARD_SCENES=roster.map((r,i)=>{
      const bundle=bundles[i];
      const stages=deriveSceneState(bundle,scriptApproved,r.scene);
      const media=(bundle.media&&bundle.media.shots)||{};
      const shots=(bundle.pkg&&bundle.pkg.shots)||[];
      let latestFrame=null;
      for(const s of shots){ const m=media[s.shotId]; if(m&&(m.finalFrame||m.keyframe)) latestFrame=m.finalFrame||m.keyframe; }
      if(!latestFrame&&r.plate) latestFrame="/engine/media/"+r.plate;
      return Object.assign({},r,{bundle,stages,latestFrame,status:sceneCardStatus(stages)});
    });
  }finally{ BOARD_LOADING=false; }
}

async function storyIntakeDecide(verdict){

function sceneCardHTML(s){
  const active=nextReadyStage(s.stages);
  // 2026-07-19 fix (confirmed audit finding): this used to be a hand-typed subset of
  // PSTAGES that omitted "final" — a scene card's overall pill (sceneCardStatus, below)
  // already reads stages.final directly and could show "Complete," but the per-stage
  // breakdown never rendered a Final & Post row at all. Derive from PSTAGES itself
  // (minus "script", which the card's own CTA button already owns) so this can never
  // silently drift from the real stage list again.
  const stageRows=PSTAGES.filter(p=>p.id!="script").map(p=>{
    const st=s.stages[p.id];
    return `<div class="stagerow"><span class="stagerow-name">${_esc(p.name)}</span>${badge(st.state,st.sub)}</div>`;
  }).join("");
  const activeName=(PSTAGES.find(p=>p.id==active)||{}).name||"Script";
  // an untouched scene (nothing drafted yet) reads as an explicit invitation, not a review —
  // every other stage/state keeps its existing "Review <stage>" wording unchanged.
  const ctaLabel = active=="script" ? "Open script"
    : (active=="storyboard"&&(s.stages.storyboard||{}).state=="ready") ? "Ready for Story & Direction"
    : "Review "+activeName.toLowerCase();
  const dotColor=STATE_COLOR[(s.stages[active]||{}).state||"ready"];
  // THE STAGE-PROGRESS DOT STRIP + THE QUIET ✓ (2026-07-23, premium-UX pass): one dot per
  // stage, coloured from the SAME derived state the rows below read — a complete scene gets
  // a quiet ✓ on its thumbnail, never a shout.
  const dotStrip=`<div class="scenecard-dots">${PSTAGES.filter(p=>p.id!="script").map(p=>{
    const st=(s.stages[p.id]||{}).state;
    return `<i title="${_esc(p.name)}${st?" — "+_esc(STATE_LABEL[st]||st):""}" style="${st&&st!="locked"?`background:var(${STATE_COLOR[st]});border-color:var(${STATE_COLOR[st]});`:""}${st=="locked"?"opacity:.35":""}"></i>`;
  }).join("")}</div>`;
  return `<div class="scenecard" onclick="openScene('${s.scene}')">
    <div class="scenecard-thumb">${s.latestFrame?`<img src="${BASE}${s.latestFrame}?v=${MEDIA_V}"/>`:`<div class="scenecard-noimg">No frame yet</div>`}
      ${s.status=="complete"?`<span class="scenecard-tick">✓</span>`:""}
      <span class="scenecard-dot" style="background:var(${dotColor})"></span></div>
    <div class="scenecard-body">
      <div class="scenecard-title">SCENE ${_esc(s.scene)} — ${_esc((s.name||"").toUpperCase())}</div>
      ${dotStrip}
      <div class="scenecard-stages">${stageRows}</div>
      <button class="btn" style="width:100%;margin-top:12px" onclick="event.stopPropagation();${active=="script"?"go('script')":`openScene('${s.scene}')`}">${_esc(ctaLabel)}</button>
    </div>
  </div>`;
}

// THE GATE-FRESHNESS POLL (2026-07-21, Julian — "in the older UI I could un-assign and
// re-assign to get round these issues"): the old interface's un-assign/re-assign gave a
// manual lever to force a resync when the screen went stale. This screen had no such
// lever and no background refresh — the storyboard/gate ribbon was only ever fetched on
// initial navigation into a scene, so an approval made ANYWHERE ELSE (a different tab, a
// state-integrity repair run outside the Studio) left this screen showing a confidently
// wrong "Awaiting approval"/"Locked" ribbon indefinitely, with a hard reload as the only
// fix — and nothing on screen told you that was the fix. Found live: Scene 1's storyboard
// had genuinely been re-approved (Julian, 11:46) and Cinematography was genuinely open,
// but the open tab still showed Gate 2 "Awaiting approval" until manually reloaded.
// Silent, infrequent (storyboard/gate state is a rare-change signal, not a running job —
// GLOBAL_POLL/SH_POLL's faster cadences are for job progress, a different problem), and
// never disruptive: skips entirely whenever an input/textarea/select is focused, so it
// can never blow away an in-progress note or edit. Re-renders only the stage rail and
// workspace body — never the full "Loading scene…" interstitial renderControl() shows on
// a real navigation.
let SB_GATE_POLL=null;
function sbGatePollStart(){
  if(SB_GATE_POLL)clearInterval(SB_GATE_POLL);
  SB_GATE_POLL=setInterval(sbGatePollTick,15000);
}
function sbGatePollStop(){
  if(SB_GATE_POLL){clearInterval(SB_GATE_POLL);SB_GATE_POLL=null;}
}
async function sbGatePollTick(){
  if(page!="pipeline")return;
  const ae=document.activeElement,tag=ae&&ae.tagName;
  if(tag=="INPUT"||tag=="TEXTAREA"||tag=="SELECT")return;   // never disrupt an in-progress edit
  const sceneAtStart=SH_SC;
  try{ await Promise.all([pFetchStoryboard(),shFetchPkg()]); }catch(e){ return; }
  if(page!="pipeline"||SH_SC!=sceneAtStart)return;   // navigated away mid-fetch — discard silently
  // THE SAME STALENESS ONE LAYER DEEPER (found live, same session, immediately after the
  // fix above): attachDepartmentPanel() short-circuits on a non-null SH_DEPT_CACHE[key] and
  // NEVER refetches — so a department's readiness checklist (prepared/current/approved/
  // ready-for-disclosure dots) could sit showing all-green stale data while the real,
  // live department_readiness() had already gone STALE underneath it — the checklist and

// ═══ THE SCENE PIPELINE (2026-07-23, Julian — "I want the old pipeline style but better"):
// the scene reads as ONE horizontal pipe — STORYBOARD → SCENE LOOK → SHOTS → ASSEMBLY —
// with a filmstrip of every shot (promoted or draft) under SHOTS and the Shot Runner
// expanding INLINE beneath the strip. Two levels only: pipe+filmstrip (glance), runner
// (work). The old 8-tab rail and 3-column workspace were superseded as the scene's primary
// navigation; pFocusStage maps every legacy stage id onto its pipe node so every existing
// caller keeps working. (renderStageRail, the rail itself, was deleted 2026-07-26 — dead
// since this pass, and nothing had called it for three days.)
let PPIPE=null, PASM="final";
const PIPE_OF_STAGE={script:"storyboard",storyboard:"storyboard",scenelook:"scenelook",
  keyframe:"shots",voice:"shots",animation:"shots",continuity:"assembly",final:"assembly"};
function pFocusStage(id){
  PPIPE=PIPE_OF_STAGE[id]||"shots"; PSTAGE=id;
  if(id=="continuity")PASM="continuity"; if(id=="final")PASM="final";
  renderWorkspaceBody(); _syncHash();
}
function pFocusPipe(node){ PPIPE=node; if(node!="assembly")PASM="final"; renderWorkspaceBody(); _syncHash(); }
function pShotsAggState(){
  // truthful aggregate for the SHOTS node, from the real ledgers + the storyboard's own
  // draft list — never from what the UI last did.
  if(!(PSB&&PSB.approvalState=="approved")) return "locked";
  const leds=(SH_PKG&&SH_PKG.continuityLedger)||[];
  const drafts=shAllShotOrder().filter(o=>o.idx==null).length;
  if(leds.length&&leds.every(e=>e.status=="approved")&&!drafts) return "approved";
  if(leds.some(e=>e.status=="candidates-pending")) return "awaiting";
  return "ready";
}
function pActivePipe(){
  if(PPIPE) return PPIPE;
  if(PSTAGE&&PIPE_OF_STAGE[PSTAGE]) return PIPE_OF_STAGE[PSTAGE];
  try{
    const st=currentStages();
    if(st.storyboard.state!="approved") return "storyboard";
    if(st.scenelook.state!="approved") return "scenelook";
    if(pShotsAggState()!="approved") return "shots";
    return "assembly";

}
function scenePipeHTML(){

    {id:"scenelook",label:"Scene Look",state:st?st.scenelook.state:"ready",sub:st&&st.scenelook.sub},

    const col=STATE_COLOR[n.state]||"--muted";
    return `<div class="ppnode ${n.state} ${active==n.id?"active":""}" onclick="pFocusPipe('${n.id}')"
       title="${_esc(STATE_LABEL[n.state]||n.state)}${n.sub?" — "+_esc(n.sub):""}">
       <span class="ppglyph" style="color:var(${col})">${glyph}</span>

  }).join("")}</div>`;

// the full scene order — every storyboard-drafted shot plus every promoted shot, story
// order first, any promoted-but-no-longer-drafted shot appended (never silently dropped).
function shAllShotOrder(){
  const shots=pShots(); const canonIdx={}; shots.forEach((s,i)=>{canonIdx[s.shotId]=i;});
  const order=[]; const seen=new Set();
  (((PSB&&PSB.shots)||[])).forEach(s=>{
    if(!s.shotId||seen.has(s.shotId))return;
    seen.add(s.shotId);
    order.push({shotId:s.shotId, idx:(canonIdx[s.shotId]!==undefined?canonIdx[s.shotId]:null), draft:s});
  });
  shots.forEach((s,i)=>{ if(!seen.has(s.shotId)) order.push({shotId:s.shotId, idx:i, draft:null}); });
  return order;
}
let SH_DRAFT_SEL=null;   // a storyboard-drafted, not-yet-promoted shot currently open in the runner
function shGoToDraft(sid){ SH_DRAFT_SEL=sid; renderWorkspaceBody(); }
async function shPromoteShot(sid){
  // THE DRAFT-SHOT PROMOTION (2026-07-23, Julian live — "I have no way of going to the
  // next shot"). Server-side, the endpoint ALWAYS promotes the full cumulative shot list
  // (whole-array replace + ledger carry-forward — approved shots survive intact). After
  // the write we re-fetch and re-derive everything; never an optimistic flip.
  try{
    const r=await fetch(BASE+"/api/shot-promote",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({scene:String(SH_SC),episode:SH_EP,shotId:sid,by:REVIEWER})});
    const j=await r.json();
    if(!r.ok||!j.ok){showToast("Promotion refused — "+(j.error||"failed"),false);return;}
    showToast(sid+" promoted to production — package revision "+(j.revision||"?")+"; already-approved shots carried forward untouched",true);
    await pLoadAll();
    const idx=pShots().findIndex(x=>x.shotId==sid);
    SH_DRAFT_SEL=null; if(idx>=0)PSHOT_I=idx;
    renderWorkspaceBody();
  }catch(e){showToast("Can't reach the studio server. Reload (Cmd-Shift-R).",false);}
}
// ── THE BEATS, BACK IN THE VIEW WHERE HE WORKS (2026-07-26, the assessment's C5) ─────────
// sceneContentsHTML was built on 2026-07-22 in direct answer to Julian's own note — "i thought
// it was strange we had the opening shot then the storm" — and was orphaned the next day when
// filmstripHTML replaced the three-column workspace with a flat strip over shAllShotOrder().
// The strip has been beat-blind ever since: "S1.SH4 of 10" with no view of which of the
// scene's four beats it serves. This is that grouping, restored into the strip that is
// actually on screen. The beats and the shot→beat filing are the storyboard's own
// (PSB.beats / PSB.shots[].beatIds) — never a structure invented here.
//
// ONE DIFFERENCE FROM THE ORIGINAL, DELIBERATE: sceneContentsHTML pushed a shot into EVERY
// beat its beatIds named, so a shot spanning two beats appeared twice. In a filmstrip that
// would put the same card — the same thumbnail, the same Continue button — on screen twice,
// which reads as two shots. Here a shot is filed under the FIRST beat it names, and any other
// beat it serves is stated on the card instead.
function shBeatGroups(order){
  const beats=(PSB&&PSB.beats)||[];
  if(!beats.length) return null;
  const draftById={}; (((PSB&&PSB.shots)||[])).forEach(s=>{ if(s.shotId) draftById[s.shotId]=s; });
  const canonById={}; pShots().forEach(s=>{ canonById[s.shotId]=s; });
  const groups=beats.map(b=>({beat:b,items:[]}));
  const byId={}; groups.forEach(g=>{ byId[g.beat.beatId]=g; });
  const unfiled=[];
  order.forEach(o=>{
    // the storyboard's own filing first; a canonical shot the storyboard somehow lacks falls
    // back to its own beatCode — the same two-source rule the orphaned original used.
    let ids=((draftById[o.shotId]||{}).beatIds)||[];
    if(!ids.length){ const c=canonById[o.shotId]; if(c&&c.beatCode) ids=[c.beatCode]; }
    const known=ids.filter(x=>byId[x]);
    if(known.length){ byId[known[0]].items.push({o:o,alsoIn:known.slice(1)}); }
    else unfiled.push({o:o,alsoIn:[]});
  });
  return {groups:groups,unfiled:unfiled};
}
function filmstripHTML(){
  const order=shAllShotOrder();
  if(!order.length) return `<div class="runempty">No shots designed yet — approve the storyboard first.</div>`;
  const cardOf={};
  let selShotId=null;
  order.forEach(o=>{
    const sid=o.shotId, tok=shTok(sid);
    const promoted=o.idx!=null;
    const sel=promoted?(SH_DRAFT_SEL==null&&PSHOT_I==o.idx):(SH_DRAFT_SEL==sid);
    if(sel) selShotId=sid;
    let thumb=null,dots=[],statusWord="",statusColor="--hint",cta="",inheritBadge=false;
    if(promoted){
      const shots=pShots(), led=shLedger(sid), m=shMedia(sid);
      const terminal=(led.status=="approved");
      let pst=null; try{
        pst=shotPipelineState(shots,o.idx,shLedger,(SH_MEDIA&&SH_MEDIA.shots)||{},
          !!(SH_MEDIA&&SH_MEDIA.lineage&&SH_MEDIA.lineage.current),shSceneLookOk(),shReassess,shDeptFor);
      }catch(e){ pst={}; }
      thumb=m.finalFrame||m.keyframeCandidateUrl||m.keyframe||null;
      if(!thumb){ const a=refAnchorUrl(sid); if(a){ thumb=a; inheritBadge=true; } }
      const dept=shDeptFor(sid)||{};
      dots=[
        (PSB&&PSB.approvalState=="approved")?"done":"ready",
        pst.keyframeSatisfied?"done":(pst.kf=="awaiting"?"ready":"pending"),
        !pst.talky?"done":(pst.voiceOk?"done":"ready"),
        (terminal||(dept.animation||{}).approvalCurrent)?"done":"ready",
        (terminal||led.status=="candidates-pending")?"done":(pst.readyToAnimate?"ready":"pending"),
        terminal?"done":(led.status=="candidates-pending"?"ready":"pending"),
      ];
      if(terminal){ statusWord="Complete";statusColor="--ok";
        cta=`<span class="fcard-done">✓ Complete</span>`; }
      else if((led.batch||{}).status=="generating"){
        // THE VISIBLE RENDERING STATE, ON THE CARD TOO (2026-07-23): pulsing, CTA
        // suppressed — clicking the card still opens the live rendering row below.
        statusWord="Rendering…";statusColor="--info";
        dots[4]="rendering";
        cta=`<span class="fcard-rendering"><span class="pulse">●</span> Rendering — 10-20 min</span>`; }
      else if(led.status=="candidates-pending"){
        const n=(m.candidates||[]).length||(led.candidatePaths||[]).length||1;
        statusWord="Needs review";statusColor="--honey";
        cta=`<button class="btn fcard-cta" onclick="event.stopPropagation();shGoToShot(${o.idx})">Review ${n} candidate${n==1?"":"s"}</button>`; }
      else if(led.status=="model-limited"){ statusWord="Blocked";statusColor="--danger";
        cta=`<button class="btn ghost fcard-cta" onclick="event.stopPropagation();shGoToShot(${o.idx})">Open — needs redesign</button>`; }
      else{
        let wf=null; try{ wf=productionWorkflowStatus(sid); }catch(e){}
        const nextLabel=(wf&&wf.current)?wf.current.label:"next step";
        statusWord=pst.label||"In progress";statusColor="--honey";
        cta=`<button class="btn ghost fcard-cta" onclick="event.stopPropagation();shGoToShot(${o.idx})">Continue — ${_esc(nextLabel)}</button>`; }
    } else {
      dots=["ready","pending","pending","pending","pending","pending"];
      statusWord="Draft";statusColor="--hint";
      cta=`<button class="btn fcard-cta" onclick="event.stopPropagation();shGoToDraft('${tok}')">Promote to production</button>`;
    }
    const open=promoted?`shGoToShot(${o.idx})`:`shGoToDraft('${tok}')`;
    cardOf[sid]=`<div class="fcard ${sel?"sel":""} ${promoted?"":"draft"}" onclick="${open}">
      <div class="fcard-thumb">${thumb?`<img src="${BASE}${thumb}?v=${MEDIA_V}"/>${inheritBadge?`<span class="fcard-inh">inherits</span>`:""}`:`<div class="fcard-slate">${promoted?"no frame yet":"draft"}</div>`}</div>
      <div class="fcard-id">${_esc(sid)}</div>
      <div class="fcard-dots">${dots.map(d=>`<i class="${d}"></i>`).join("")}</div>
      <div class="fcard-status" style="color:var(${statusColor})">${_esc(statusWord)}</div>
      <div class="fcard-ctarow">${cta}</div>
    </div>`;
  });
  // THE STRIP, GROUPED BY BEAT. Falls back to the flat strip — byte-identical to what this
  // function produced before — whenever the storyboard carries no beats to group by, so a
  // scene without a beat structure is never worse off than it was.
  const bg=shBeatGroups(order);
  let strip;
  if(!bg){
    strip=`<div class="fstrip">${order.map(o=>cardOf[o.shotId]||"").join("")}</div>`;
  } else {
    const nb=bg.groups.length;
    const groupHTML=bg.groups.map((g,i)=>{
      const b=g.beat;
      const cur=g.items.some(it=>it.o.shotId===selShotId);
      const what=b.whatChanges||b.sourceScript||"";
      const cards=g.items.length
        ? g.items.map(it=>`<div class="fbeat-slot">${cardOf[it.o.shotId]||""}`
            +(it.alsoIn.length?`<div class="fbeat-also">also serves ${_esc(it.alsoIn.join(", "))}</div>`:"")
            +`</div>`).join("")
        : `<div class="fbeat-empty">No shot designed for this beat yet.</div>`;
      return `<div class="fbeat${cur?" cur":""}">
        <div class="fbeat-head" title="${_esc(what)}">

            <span class="fbeat-pos">Beat ${i+1} of ${nb} · ${g.items.length} shot${g.items.length==1?"":"s"}</span></div>

  // reachable from one place, above the strip: the per-shot ones are also shown on their own
  // shot, and any finding whose path names no shot (a scene-level check) would otherwise have
  // nowhere to appear at all. This band is the guarantee that a computed finding is never
  // dropped for want of a home. It says nothing when there is nothing to say.

        <summary><span class="qcband-n">${vAll.length}</span> design-check finding${vAll.length==1?"":"s"} in this scene`
        +(vBlocks.length?` · <b style="color:var(--danger)">${vBlocks.length} blocking</b>`:` · none blocking`)
        +(v&&v.passed===false?` · <b style="color:var(--danger)">the package did not pass validation</b>`:"")
        +` — each one names the exact field it is about</summary>

        ${orphan.length?`<div class="dec-caption" style="padding:0 13px 11px">${orphan.length} of these name no individual shot and are shown here only.</div>`:""}
      </details>`
    :"";
  return qcScene+strip;
}

// ── STORYBOARD ──
// ── THE TREATMENTS (2026-07-26) ──────────────────────────────────────────────────────────
// The creative room writes three fully-worked, NAMED approaches to the scene, then the
// reasoning that chose one and welded the other two into it. Scene 1's are 21,537 and 8,958
// characters. Until now the ONLY place any of it could appear was a collapsed "Technical
// details" disclosure holding `JSON.stringify(PSB,null,1).slice(0,4000)` — and `treatments`
// starts at character 5,966 of that dump, so the slice ended nearly 2,000 characters before
// the first treatment began. Nothing here is new work by the engine: it is already computed,
// already on disk, already paid for. It was simply never rendered.
//
// THE FIELD ORDER IS THE ENGINE'S, NOT A LIST TYPED HERE. Every key the room writes is shown;
// a key it stops writing disappears, a key it starts writing appears, and neither needs an
// edit in this file. Only `name` is positioned by hand (it is the headline) and only the two
// fields below are promoted above the fold, because they are the two a director reads first.
const TRT_LEDE_FIELDS=["audienceExperience","emotionalPointOfView"];
function _trtLabel(k){ return String(k).replace(/([a-z0-9])([A-Z])/g,"$1 $2").replace(/^./,c=>c.toUpperCase()); }
function _trtField(k,v){
  if(v===null||v===undefined||v==="") return "";
  const txt=Array.isArray(v)?v.join("\n"):String(v);
  if(!txt.trim()) return "";
  return `<dl class="trt-field"><dt>${_esc(_trtLabel(k))}</dt><dd>${_esc(txt)}</dd></dl>`;
}
function treatmentsHTML(){
  const trts=(PSB&&PSB.treatments)||[], sel=(PSB&&PSB.treatmentSelection)||null;
  if(!trts.length&&!sel) return "";
  // WHICH ONE IS THE SPINE — and why a substring test is the wrong instrument. The engine
  // states the choice in prose, not as an index: Scene 1's reads "THE WINGMAN'S EYE — spine,
  // welded to THE UNMOVED WITNESS's ... and THE POLLEN'S PROGRESS's ...". A naive "does this
  // treatment's name appear in selectedTreatment" match therefore marks ALL THREE as selected,
  // which is exactly what the first version of this did. The spine is the name the sentence
  // LEADS with — the text before its first em dash — so heads are compared, not searched for.
  // No head match means nothing is marked; a wrong badge is worse than no badge.
  const _head=s=>String(s||"").split("—")[0].trim().toUpperCase();
  const selHead=_head((sel&&sel.selectedTreatment)||"");
  const isSel=t=>!!selHead&&_head(t.name)===selHead;
  const card=(t)=>{
    const n=String(t.name||"Untitled approach");
    const parts=n.split("—");
    const head=parts.shift().trim(), sub=parts.join("—").trim();
    const rest=Object.keys(t).filter(k=>k!=="name"&&TRT_LEDE_FIELDS.indexOf(k)<0);
    return `<div class="trt${isSel(t)?" is-selected":""}">
      <div class="trt-tag">${isSel(t)?"◆ Selected — this scene's spine":"Considered"}</div>
      <div class="trt-name">${_esc(head)}${sub?`<em>${_esc(sub)}</em>`:""}</div>
      ${TRT_LEDE_FIELDS.map(k=>_trtField(k,t[k])).join("")}
      ${rest.length?`<details class="trt-more"><summary>The full treatment (${rest.length} more)</summary>
        ${rest.map(k=>_trtField(k,t[k])).join("")}</details>`:""}
    </div>`;
  };
  let selCard="";
  if(sel){
    // combinedFrom lists the spine itself alongside the two it absorbed; "welded from THE
    // WINGMAN'S EYE" on a card headlined THE WINGMAN'S EYE is noise, so the spine is dropped.
    const from=(sel.combinedFrom||[]).map(x=>String(x).split("—")[0].trim())
      .filter(x=>x&&x.toUpperCase()!==selHead);
    const rest=Object.keys(sel).filter(k=>["selectedTreatment","combinedFrom"].indexOf(k)<0);
    selCard=`<div class="trt-sel">
      <div class="trt-tag" style="color:var(--honey)">◆ The approach this scene is built on</div>
      <div class="trt-name">${_esc(String(sel.selectedTreatment||"—"))}</div>
      ${from.length?`<div class="trt-from">${from.map(f=>`<span>welded from ${_esc(f)}</span>`).join("")}</div>`:""}
      ${rest.map(k=>_trtField(k,sel[k])).join("")}
    </div>`;
  }
  const verdicts=[["showrunnerJudgement","The showrunner's verdict"],
                  ["treatmentComparison","Did the storyboard keep the treatment's promises"]]
    .map(([k,label])=>{
      const v=PSB&&PSB[k];
      return (v&&String(v).trim())?`<dl class="trt-field"><dt>${_esc(label)}</dt><dd>${_esc(String(v))}</dd></dl>`:"";
    }).join("");
  return `<div class="wcol-head" style="margin-top:var(--s6)">How this scene could have been made — and why it is being made this way</div>
    <div class="trt-lede">Three whole-scene approaches were written before a single shot existed. One became the spine; the others were not discarded, they were welded into it. This is the reasoning the shot list below is an implementation of.</div>
    ${selCard}
    ${verdicts?`<div class="trt-sel" style="border-color:var(--line)">${verdicts}</div>`:""}
    ${trts.length?`<div class="wcol-head" style="margin-top:var(--s5)">The three treatments, as written</div>
      <div class="trt-grid">${trts.map(card).join("")}</div>`:""}`;
}
function renderStoryboardStage(){
  const art=document.getElementById("wartefact"), dec=document.getElementById("wdecision");
  if(!PSB){
    art.innerHTML=`<div class="artefact-empty"><div style="color:var(--muted)">Nothing drafted yet for this scene.</div></div>`;
    dec.innerHTML=decisionShell("Storyboard","—",[`<button class="btn" onclick="pFireCreative()">✦ Draft the storyboard</button>`],"");
    return;
  }
  const v=PSB.scene||{}, beats=PSB.beats||[], shots=PSB.shots||[];

    <div class="shotcard-line">${_esc(s.purpose||"")}</div></div>`).join("");
  // THE PRODUCER'S GATE 6b FEASIBILITY CARD (2026-07-21): shown before Julian approves —
  // producerFeasibility is null until Gate 6 has passed and Production Detail exists (an
  // escalated scene never reaches Gate 6b at all, matching run_scene's own sequencing).
  const pf=PSB.producerFeasibility;
  let producerCard="";
  if(pf){
    const blocks=(pf.issues||[]).filter(i=>i.severity=="BLOCK");
    const notes=(pf.issues||[]).filter(i=>i.severity=="NOTE");
    const row=(i)=>`<div class="histrow"><span class="stbadge" style="color:var(${i.severity=="BLOCK"?"--danger":"--warn"});background:var(${i.severity=="BLOCK"?"--dangerbg":"--warnbg"})">${_esc(i.severity)}</span>
       <span class="histmeta">${_esc(i.shotId)}</span><div class="histnote">${_esc(i.issue)}</div></div>`;
    producerCard=`<div class="wcol-head" style="margin-top:18px">Producer — feasibility & scope

      <div class="dec-caption">${_esc(pf.judgement)}</div>
      ${blocks.map(row).join("")}${notes.map(row).join("")}`;
  }
  // THE RAW RECORD IS NO LONGER TRUNCATED (2026-07-26). It used to be cut at 4,000 characters
  // of a ~147,000-character document — which is how the treatments came to be invisible: they
  // begin at character 5,966, ~2,000 past where the slice ended. A truncation that silently
  // discards 97% of the record is not a disclosure, and the number was never a considered
  // limit. The full record is written; the well scrolls; the treatments above are where the
  // text is actually meant to be READ, and this stays what it always claimed to be — the raw
  // technical dump, for when the rendered view is not enough.
  art.innerHTML=`<div class="artefact-center" style="text-align:left;overflow:auto">
    <div class="sb-purpose">${purpose}</div>
    ${treatmentsHTML()}
    <div class="wcol-head" style="margin-top:var(--s6)">The beats</div>${beatRows}
    <details style="margin-top:16px"><summary style="cursor:pointer;color:var(--muted);font-size:12px">The complete shot sequence (${shots.length})</summary>
      <div style="margin-top:10px">${shotSeq}</div></details>
    ${producerCard}
    <details style="margin-top:10px"><summary style="cursor:pointer;color:var(--hint);font-size:11px">Technical details — the complete raw record</summary>
      <pre class="techpre">${_esc(JSON.stringify(PSB,null,1))}</pre></details>
  </div>`;
  const st=pStatus("storyboard");
  const history=(PSB.approvalLog||[]).slice().reverse().map(h=>
    `<div class="histrow"><span class="stbadge" style="color:var(${h.state=="approved"?"--ok":"--danger"});background:var(${h.state=="approved"?"--okbg":"--dangerbg"})">${_esc(h.state)}</span>
     <span class="histmeta">${_esc(h.by||"")} · ${_esc((h.at||"").slice(0,16))}</span>${h.note?`<div class="histnote">${_esc(h.note)}</div>`:""}</div>`).join("");
  let actions=[];
  if(st=="awaiting"||st=="rejected"){
    actions=[`<textarea id="pSbNote" class="pfeedback" placeholder="A note for the record (optional on approve, helpful on reject)"></textarea>`,
      `<div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn" onclick="pStoryboardDecide('approved')">Apply</button>
        <button class="btn ghost" onclick="pStoryboardDecide('rejected')">Reject</button>
      </div>`];
  }
  dec.innerHTML=decisionShell("Storyboard", "v"+(PSB.candidateProvenance&&PSB.candidateProvenance.revision||"1"), actions, history);
  dec.insertAdjacentHTML("beforeend",`<div class="deptpanel"><div class="deptperson"><div class="deptavatar">D</div><div>
    <div class="deptname">Director</div><div class="deptmeta">Story & Direction · Pete Docter / Andrew Stanton influences</div></div></div>
    <div class="dec-caption">The real Creative Room loads the Director and Cinematographer SKILL.md contracts while drafting. Approval now hands the storyboard directly to production and preserves every unchanged shot's existing work.</div></div>`);
  if(pf){
    dec.insertAdjacentHTML("beforeend",`<div class="deptpanel"><div class="deptperson"><div class="deptavatar">P</div><div>
      <div class="deptname">Producer</div><div class="deptmeta">Feasibility &amp; scope · Gate 6b</div></div></div>
      <div class="dec-caption">Runs after the creative room has already committed to this scene — checks only whether it can be built (locked references, credible durations, realistic scope), never whether it's good. ${pf.passes?"Clears production.":"BLOCKS production — resolve the finding(s) above before approving."}</div></div>`);
  }
}
async function pFireCreative(){
  try{
    const r=await fetch(BASE+"/api/creative-run",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cmd:"scene",scene:String(SH_SC),episode:SH_EP})});

}
async function pStoryboardDecide(verdict){
  const note=(document.getElementById("pSbNote")||{}).value||"";
  try{
    const r=await fetch(BASE+"/api/storyboard-approve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({episode:SH_EP,scene:String(SH_SC),target:"scene",verdict,note,by:REVIEWER})});
    const j=await r.json();
    if(!j.ok){alert("Couldn't record the decision: "+(j.error||"failed"));return;}
    showToast(verdict=="approved"?"✓ Storyboard approved and handed to production":"✗ Sent back for revision",verdict=="approved");

// ── SCENE LOOK — the gate between Storyboard and Shot Production (Julian's 2026-07-18
// directive). Establishes environment/location identity, world scale, palette, materials/
// texture, lighting, weather/atmosphere and overall visual feeling for the WHOLE scene —
// never shot composition, camera position, character pose or movement (those stay owned by
// each approved storyboard shot). Never assumes the plate file's mere presence on disk means
// approval — SH_SCENELOOK.status is always a real, server-computed decision state. ──
function castStripHTML(cast){
  // Characters in this scene + the exact canonical turnaround used as their identity
  // reference downstream (2026-07-19, Julian: "I want to see the characters who are in
  // the scene and the turnarounds we are using as their references"). Context only — the
  // Look Development plate itself is environment-only by design; no character ever
  // appears in its own fired prompt.
  if(!cast||!cast.length)return "";
  const chips=cast.map(c=>`<div class="castchip">
      ${c.turnaroundUrl?`<img class="zoom" data-cap="${_esc(c.name)} — canonical turnaround" src="${BASE}${c.turnaroundUrl}?v=${MEDIA_V}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;display:block"/>`
        :`<div style="width:56px;height:56px;border-radius:8px;background:var(--panel2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px">no ref</div>`}
      <div style="font-size:12px;color:var(--muted);text-align:center;margin-top:4px">${_esc(c.name)}</div>
    </div>`).join("");
  return `<div style="margin-bottom:14px">
      <div class="wcol-head" style="margin-bottom:6px">Characters in this scene</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap">${chips}</div>
    </div>`;
}

  // inferred from broader state. Cost is read live from the fetched rates table (never
  // hardcoded), matching the identical discipline shotPipelineState's own keyframe label

  // cost text, no confirmation step; see openDisclosureModal's own matching change.
  const GEN_LABEL=`◈ Generate Scene ${_esc(SH_SC)} Look Plate — one image`;

        `<div style="margin-top:8px">${slSourceChoices(`Refire — ${GEN_LABEL.replace('◈ ','')}`,true)}</div>`];
    } else if(sl.status=="stale"){

      // plate's OWN direct inputs (locations.json/style.txt) changed since approval.
      decVersion="Approved once — its own environment brief has since changed";
      decActions=[`<div class="dec-caption" style="color:var(--warn)">This plate's own environment brief (location/lighting/style) has changed since it was approved — an unrelated storyboard/shot edit can never cause this. Apply it again if the world still holds, or refire against the current brief.</div>`,
        `<button class="btn" onclick="shRun('approve-scenelook')">Apply (current brief)</button>`,

  const slAtLoad=SH_SC;

     <span class="histmeta">${_esc(h.reviewedBy||"")} · ${_esc((h.approvedAt||h.rejectedAt||h.generatedAt||"").slice(0,16))}</span>
     ${h.rejectedNote?`<div class="histnote">${_esc(h.rejectedNote)}</div>`:""}</div>`).join("");
  dec.innerHTML=decisionShell("Scene Look", decVersion, decActions, history)+
    `<details class="techdetails"><summary>Technical details</summary>
      <div class="techmeta">plate hash ${_esc((sl.plateHash||"—").slice(0,12))}</div>

    </details>`;
  attachDepartmentPanel(dec,"look",null,true);
}

function deptInitials(worker){return String(worker||"Department").split(/[ /]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("");}

// PLAIN-ENGLISH DIRECTOR REVIEW (2026-07-20, Julian — "the DR speaks in json and jargon
// how am i meant to understand it"): Director Review's own output (cb_departments.py's
// MediaReview schema — verdict/summary/intendedRead/actualRead/findings[]) was being
// dumped as a raw JSON.stringify blob, the one department whose whole job is to hand
// Julian a plain-language note. Every other stage already speaks in prose (a textarea of
// real sentences, or voice's per-line cards) — this was the one place still showing him
// the machine's own data shape instead of what it means. Renders every field this schema
// can actually carry; a field the model left out just doesn't produce a row, never a
// literal "undefined" or a blank JSON key.
function reviewVerdictBadge(v){
  const m={"recommend-approve":["✓ Recommend approve","--ok","--okbg"],
           "revise":["⚠ Needs revision","--warn","--warnbg"],
           "block":["✗ Blocked","--danger","--dangerbg"]}[v];
  const [label,fg,bg]=m||[v||"—","--muted","--surface2"];
  return `<span class="stbadge" style="color:var(${fg});background:var(${bg})">${_esc(label)}</span>`;
}
function reviewOutputHTML(out){
