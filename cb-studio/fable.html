<!-- FABLE — a truthful, decision-first client for the Crystal Bears Studio.
     One file. Drop into cb-studio/ next to serve.py and open /cb-studio/fable.html
     (via your normal launch link so the session cookie applies).
     Built to the Seven UX Laws. It renders only what the server says; when it
     does not understand a state it shows the raw truth instead of inventing. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fable · Animation Studio</title>
<style>
:root{
  --bg:#0b0f14; --panel:#121a23; --panel2:#0e141c; --line:#1f2b3a;
  --ink:#e8eef5; --dim:#8fa1b5; --faint:#5b6b7d;
  --gold:#e8b34b; --green:#3ecf8e; --red:#ff6b6b; --blue:#5aa9e6;
  --r:14px; font-synthesis:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"SF Pro Text",Segoe UI,Inter,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
button:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1060px;margin:0 auto;padding:18px 20px 90px}

/* ORIENTATION — Law 2: never lost */
.orient{position:sticky;top:0;z-index:50;display:flex;gap:14px;align-items:center;
  background:linear-gradient(180deg,var(--bg) 78%,transparent);padding:14px 2px 10px}
.orient .crumb{font-weight:650;letter-spacing:.2px}
.orient .crumb b{color:var(--gold)}
.orient .net{margin-left:auto;font-size:12.5px;color:var(--faint);display:flex;gap:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--green)} .dot.bad{background:var(--red)}

/* SHOT RAIL */
.rail{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
.rail button{background:var(--panel2);border:1px solid var(--line);color:var(--dim);padding:7px 13px;border-radius:999px;font-size:13px}
.rail button.cur{color:var(--ink);border-color:var(--gold);background:#1a2330}
.rail button.done{color:var(--green)}

/* DECISION CARD — Law 2: one current decision */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:16px}
.phase{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:21px;line-height:1.35;margin:8px 0 6px;font-weight:700}
.summary{color:var(--dim);max-width:70ch}

/* ARTIFACT — Law 7: media survives polls */
.art{margin:18px 0 6px}
.art img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.art video{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;background:#000}
.art audio{width:100%;margin-top:6px}
.art .vidgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.art figcaption{font-size:12.5px;color:var(--faint);margin:4px 2px}
.art .empty{color:var(--faint);font-size:14px;padding:26px;border:1px dashed var(--line);border-radius:10px;text-align:center}

/* CONFORMANCE — the score travels with the prompt */
.conf{display:flex;gap:14px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
.conf .score{font-size:26px;font-weight:800;min-width:96px;text-align:center;padding:8px 4px;border-radius:8px}
.conf.pass .score{color:var(--green);background:rgba(62,207,142,.08)}
.conf.block .score{color:var(--red);background:rgba(255,107,107,.08)}
.conf ul{list-style:none;font-size:13.5px;color:var(--dim)} .conf li{margin:2px 0}
.conf .verdict{font-size:12px;letter-spacing:.1em;font-weight:700}

/* PROMPT */
details.prompt{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin:12px 0}
details.prompt summary{padding:11px 14px;color:var(--dim);cursor:pointer;font-size:13.5px;user-select:none}
details.prompt pre{white-space:pre-wrap;font:12.5px/1.6 ui-monospace,SF Mono,Menlo,monospace;color:#c6d3e0;padding:0 16px 14px;max-height:420px;overflow:auto}
.copy{background:#1a2330;color:var(--dim);padding:5px 12px;font-size:12px;margin-left:10px;border:1px solid var(--line)}

/* ACTIONS — Law 4: immediate acknowledgement */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.actions .primary{background:var(--gold);color:#14100a;font-weight:700;padding:13px 26px;font-size:15.5px}
.actions .secondary{background:#1a2330;color:var(--ink);border:1px solid var(--line);padding:12px 18px}
.actions .danger{color:var(--red)}
.busy{display:none;align-items:center;gap:10px;color:var(--dim);font-size:13.5px;margin-top:12px}
.busy.on{display:flex}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* NOTES — Law 6: never lost */
.notes{margin-top:16px}
.notes label{font-size:12.5px;color:var(--faint);display:block;margin-bottom:6px}
.notes textarea{width:100%;min-height:64px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
.notes .saved{font-size:12px;color:var(--green);margin-top:4px;min-height:16px}

/* JOBS + FAILURES — Law 3 & 6: literal state, honest refusals */
.jobs{margin-bottom:16px}
.job{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13.5px}
.job.run{border-color:#3a4d66}
.job.fail{border-color:rgba(255,107,107,.5)}
.job .t{color:var(--faint);margin-left:auto;font-variant-numeric:tabular-nums}
.job .err{color:var(--red)}
.banner{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.4);color:var(--ink);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:none;font-size:14px}
.banner.on{display:block}
.banner button{background:#2a1a1a;color:var(--ink);padding:6px 14px;margin-left:10px;border:1px solid rgba(255,107,107,.4)}

/* RAW TRUTH — never invent */
details.raw{margin-top:14px}
details.raw summary{color:var(--faint);font-size:12.5px;cursor:pointer}
details.raw pre{font:11.5px/1.5 ui-monospace,Menlo,monospace;color:#7b8da0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:300px;overflow:auto;white-space:pre-wrap}

/* THAT FAILED — the founder's QA button */
.fail-btn{position:fixed;right:18px;bottom:18px;z-index:90;background:#241318;color:#ff9d9d;border:1px solid rgba(255,107,107,.5);padding:11px 18px;border-radius:999px;font-weight:650;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.45)}
.fail-btn:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#182230;border:1px solid var(--line);color:var(--ink);padding:10px 18px;border-radius:10px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media(max-width:640px){.wrap{padding:12px 12px 90px}.card{padding:16px}h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="orient">
    <span class="crumb" id="crumb">Loading…</span>
    <span class="net"><span class="dot" id="netdot"></span><span id="netlabel">connecting</span><span id="buildtag"></span></span>
  </div>

  <div class="banner" id="banner"></div>
  <div class="rail" id="rail"></div>
  <div class="jobs" id="jobs"></div>

  <div class="card" id="card">
    <div class="phase" id="phase">—</div>
    <h1 id="headline">Contacting the studio…</h1>
    <p class="summary" id="summary"></p>
    <div class="art" id="art"></div>
    <div id="conf"></div>
    <div id="promptbox"></div>
    <div class="actions" id="actions"></div>
    <div class="busy" id="busy"><span class="spin"></span><span id="busytext"></span></div>
    <div class="notes">
      <label for="note">Director's note — saved as a retake diagnosis, never discarded</label>
      <textarea id="note" placeholder="What's wrong, in your words…"></textarea>
      <div class="saved" id="notesaved"></div>
    </div>
    <details class="raw"><summary>Raw session (the untranslated truth)</summary><pre id="raw"></pre></details>
  </div>
</div>

<button class="fail-btn" id="thatfailed">✗ That failed</button>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ================= FABLE client =================
   Laws implemented:
   1 location truth: the hash owns scene+shot; refresh restores identically.
   2 one decision: primaryAction is the single gold button.
   3 literal state: labels come from the server; unknown => raw JSON shown.
   4 immediate ack: every click flips to busy instantly; polling projects results.
   5 human sign-off: this client only ever POSTs the server's own offered actions.
   6 honest refusals: server errors shown verbatim with a retry.
   7 continuity: media elements are keyed — src only changes when the URL changes,
     so playback position and images survive polls. Notes persist via the engine. */

const $ = (id)=>document.getElementById(id);
const state = {episode:"Ep1", scene:"1", shot:null, session:null, jobs:{},
               lastAction:null, acting:false, noteTimer:null, failures:[]};

/* ---------- Law 1: hash is the only location truth ---------- */
function readHash(){
  const h = new URLSearchParams(location.hash.replace(/^#/,""));
  state.scene = h.get("scene") || state.scene || "1";
  state.shot  = h.get("shot")  || state.shot  || null;
}
function writeHash(){
  const h = new URLSearchParams();
  h.set("scene", state.scene);
  if(state.shot) h.set("shot", state.shot);
  const next = "#"+h.toString();
  if(location.hash !== next) history.replaceState(null,"",next);
}
window.addEventListener("hashchange", ()=>{ readHash(); refresh(true); });

/* ---------- network, honest and timed ---------- */
async function api(path, body, timeout=25000){
  const ctl = new AbortController();
  const t = setTimeout(()=>ctl.abort(), timeout);
  try{
    const r = await fetch(path, body
      ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal:ctl.signal}
      : {signal:ctl.signal});
    const text = await r.text();
    let data; try{ data = JSON.parse(text); }catch{ data = {raw:text}; }
    if(!r.ok) throw new Error(data.error || data.message || (r.status+" "+r.statusText));
    net(true); return data;
  }catch(e){
    net(false);
    throw e;
  }finally{ clearTimeout(t); }
}
function net(ok){
  $("netdot").className = "dot "+(ok?"ok":"bad");
  $("netlabel").textContent = ok?"live":"offline";
}
function banner(msg, retry){
  const b = $("banner");
  if(!msg){ b.className="banner"; b.innerHTML=""; return; }
  b.className = "banner on";
  b.innerHTML = "";
  b.append(msg);
  if(retry){ const btn=document.createElement("button"); btn.textContent="Retry";
    btn.onclick=()=>{ banner(null); retry(); }; b.append(btn); }
}
function toast(msg){
  const t=$("toast"); t.textContent=msg; t.className="toast on";
  setTimeout(()=>t.className="toast", 2600);
}
const esc = (s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- session ---------- */
async function fetchSession(){
  const q = new URLSearchParams({episode:state.episode, scene:state.scene});
  if(state.shot) q.set("shotId", state.shot);
  return api("/api/director-session?"+q.toString(), null, 60000);
}
async function refresh(userNavigated){
  try{
    const s = await fetchSession();
    state.session = s;
    /* Law 1: an explicit hash is never overridden. Only adopt the server's
       selection when WE didn't specify a shot. */
    if(!state.shot && s.selectedShotId){ state.shot = s.selectedShotId; }
    writeHash();
    render(s, userNavigated);
    banner(null);
  }catch(e){
    banner("The studio did not answer: "+e.message, ()=>refresh());
  }
}

/* ---------- render (diff-conscious: media is keyed) ---------- */
function render(s, hard){
  const phase = s.phase || s.status || "unknown";
  const so = s.signOff || {};
  const orient = `Scene <b>${esc(state.scene)}</b>${s.sceneCount?` of ${esc(s.sceneCount)}`:""} · Shot <b>${esc(s.selectedShotId||state.shot||"—")}</b> · <b>${esc(phaseLabel(phase))}</b>${so.n?` · Sign-off ${esc(so.n)} of ${esc(so.of||3)}`:""}`;
  $("crumb").innerHTML = orient;
  if(s.build || s.version) $("buildtag").textContent = "· build "+(s.build||s.version);

  $("phase").textContent = phaseLabel(phase);
  $("headline").textContent = s.headline || "The server offered no headline — see the raw session below.";
  $("summary").textContent = s.summary || "";
  $("raw").textContent = JSON.stringify(s, null, 2);

  renderRail(s);
  renderArtifact(s, hard);
  renderConformance(s);
  renderPrompt(s);
  renderActions(s);
  renderJobsFromSession(s);
}
function phaseLabel(p){
  return ({keyframe:"SEE · keyframe", voice:"HEAR · voice", animation:"WATCH · render",
           post:"POST", complete:"COMPLETE"})[p] || String(p||"").toUpperCase();
}

/* shot rail */
function renderRail(s){
  const rail = $("rail"); rail.innerHTML = "";
  (s.shots||[]).forEach(sh=>{
    const id = sh.shotId || sh.id || sh.code; if(!id) return;
    const b = document.createElement("button");
    b.textContent = id + (sh.statusLabel?` · ${sh.statusLabel}`:"");
    b.className = (id===(s.selectedShotId||state.shot)?"cur ":"") + (sh.state==="complete"||sh.status==="accepted"?"done":"");
    b.onclick = ()=>{ state.shot = id; writeHash(); refresh(true); };
    rail.append(b);
  });
}

/* artifact — Law 7: keyed media, src touched only on real change */
function renderArtifact(s, hard){
  const host = $("art");
  const a = s.artifact || {};
  const key = a.type ? a.type + "|" + (a.url || (a.items||[]).map(i=>i.url).join(",")) : "";
  if(!hard && host.dataset.key === key) return;   // nothing changed — do not touch media
  host.dataset.key = key;
  host.innerHTML = "";
  if(a.type==="image" && a.url){
    const img=document.createElement("img"); img.src=a.url; host.append(img);
  }else if(a.type==="audio" && a.url){
    const au=document.createElement("audio"); au.controls=true; au.preload="metadata"; au.src=a.url; host.append(au);
  }else if(a.type==="video-set"){
    const grid=document.createElement("div"); grid.className="vidgrid";
    (a.items||[]).forEach(it=>{
      const f=document.createElement("figure");
      const v=document.createElement("video"); v.controls=true; v.playsInline=true; v.preload="metadata"; v.src=it.url;
      const c=document.createElement("figcaption"); c.textContent="Candidate "+(it.n??"");
      f.append(v,c); grid.append(f);
    });
    host.append(grid);
    if(!(a.items||[]).length){ const d=document.createElement("div"); d.className="empty"; d.textContent="No candidates yet."; host.append(d); }
  }else if(a.type==="video" && a.url){
    const v=document.createElement("video"); v.controls=true; v.playsInline=true; v.preload="metadata"; v.src=a.url; host.append(v);
  }else{
    const d=document.createElement("div"); d.className="empty";
    d.textContent = "Nothing to review yet for this stage."; host.append(d);
  }
}

/* conformance — fail closed, always visible at WATCH */
function renderConformance(s){
  const host=$("conf"); host.innerHTML="";
  const req = s.request || s.render || {};
  if(!(req.prompt || s.phase==="animation")) return;
  const c = req.conformance;
  const div=document.createElement("div");
  if(c && typeof c.score !== "undefined"){
    const pass = (c.verdict||"").toUpperCase()==="PASS" || Number(c.score)>=8;
    div.className = "conf "+(pass?"pass":"block");
    div.innerHTML = `<div class="score">${esc(Number(c.score).toFixed(2))}<div class="verdict">${pass?"PASS":"BLOCK"}</div></div>
      <ul>${(c.findings||[]).slice(0,5).map(f=>`<li>· ${esc(f.message||f)}</li>`).join("") || "<li>· clean — no findings</li>"}</ul>`;
  }else{
    div.className = "conf block";
    div.innerHTML = `<div class="score">0.00<div class="verdict">BLOCK</div></div>
      <ul><li>· The emission checker supplied no report. Fails closed — do not fire on an unscored prompt.</li></ul>`;
  }
  host.append(div);
}

/* prompt viewer */
function renderPrompt(s){
  const host=$("promptbox"); host.innerHTML="";
  const req = s.request || {};
  const text = req.prompt || (req.lines||[]).map(l=>`${l.speaker}: ${l.performedText}`).join("\n");
  if(!text) return;
  const d=document.createElement("details"); d.className="prompt";
  const sum=document.createElement("summary");
  sum.textContent = "The exact compiled prompt ("+text.split(/\s+/).length+" words)";
  const cp=document.createElement("button"); cp.className="copy"; cp.textContent="Copy";
  cp.onclick=(e)=>{ e.preventDefault(); navigator.clipboard.writeText(text).then(()=>toast("Prompt copied")); };
  sum.append(cp);
  const pre=document.createElement("pre"); pre.textContent=text;
  d.append(sum,pre); host.append(d);
}

/* actions — Law 2 + Law 4 */
function renderActions(s){
  const host=$("actions"); host.innerHTML="";
  const all=[["primary", s.primaryAction], ...(s.decisionActions||[]).map(a=>["secondary",a])].filter(x=>x[1]&&x[1].id);
  if(!all.length){
    const p=document.createElement("p"); p.style.color="var(--faint)"; p.style.fontSize="13.5px";
    p.textContent = s.blockers?.length
      ? "Blocked: "+s.blockers.map(b=>b.message||b).join(" · ")
      : "No decision is offered at this stage — the server holds the next move.";
    host.append(p); return;
  }
  all.forEach(([cls,a])=>{
    const b=document.createElement("button"); b.className=cls;
    if(/reject|cancel/.test(a.id)) b.classList.add("danger");
    b.textContent = a.label || a.id;
    b.onclick = ()=>act(a);
    host.append(b);
  });
}
async function act(a){
  if(state.acting) return;
  state.acting = true; state.lastAction = {id:a.id, at:new Date().toISOString()};
  $("busy").className="busy on"; $("busytext").textContent = (a.label||a.id)+" — sent, waiting for the studio…";
  const started = Date.now();
  const tick = setInterval(()=>{ $("busytext").textContent = (a.label||a.id)+" — "+Math.round((Date.now()-started)/1000)+"s"; }, 1000);
  try{
    await api("/api/director-action", {episode:state.episode, scene:state.scene,
      shotId: state.session?.selectedShotId || state.shot, action: a.id}, 120000);
    toast((a.label||a.id)+" ✓");
  }catch(e){
    state.failures.push({action:a.id, error:String(e.message), at:new Date().toISOString()});
    banner(`"${a.label||a.id}" was refused: ${e.message}`, ()=>act(a));
  }finally{
    clearInterval(tick); state.acting=false; $("busy").className="busy";
    refresh();
  }
}

/* notes — durable, saved on pause, never silently lost */
$("note").addEventListener("input", ()=>{
  clearTimeout(state.noteTimer);
  $("notesaved").textContent = "…";
  state.noteTimer = setTimeout(saveNote, 1200);
});
async function saveNote(){
  const v = $("note").value.trim();
  if(!v){ $("notesaved").textContent=""; return; }
  try{
    await api("/api/director-action", {episode:state.episode, scene:state.scene,
      shotId: state.session?.selectedShotId || state.shot, action:"save-retake-note", note:v});
    $("notesaved").textContent = "Saved as a production diagnosis ✓";
  }catch(e){
    $("notesaved").textContent = "";
    banner("Your note was NOT saved ("+e.message+"). It is still in the box — copy it before leaving.", saveNote);
  }
}

/* jobs — literal running/failed state with real errors */
function renderJobsFromSession(s){
  const host=$("jobs"); host.innerHTML="";
  const rj = s.runningJob;
  if(rj){
    const d=document.createElement("div"); d.className="job run";
    const started = rj.started ? Math.round((Date.now()/1000 - rj.started)) : null;
    d.innerHTML = `<span class="spin"></span><span>${esc(rj.label||rj.step||"Working")}</span>
      <span class="t">${started!==null? started+"s elapsed":""}</span>`;
    host.append(d);
  }
  const rf = s.recentFailure;
  if(rf){
    const d=document.createElement("div"); d.className="job fail";
    d.innerHTML = `<span class="err">✗ ${esc(rf.label||rf.step||"Failed")}</span>
      <span>${esc(rf.error||rf.message||"no error text supplied — that is itself a defect")}</span>`;
    if(rf.retryAction){
      const b=document.createElement("button"); b.className="secondary"; b.textContent="Retry";
      b.onclick=()=>act({id:rf.retryAction,label:"Retry"});
      d.append(b);
    }
    host.append(d);
  }
}

/* THAT FAILED — one tap files the whole context */
$("thatfailed").onclick = async ()=>{
  const report = {
    kind: "fable-defect-report", at: new Date().toISOString(),
    url: location.href, hash: location.hash,
    lastAction: state.lastAction, recentActionFailures: state.failures.slice(-5),
    note: $("note").value || null,
    session: state.session,
    userAgent: navigator.userAgent,
  };
  const text = JSON.stringify(report, null, 2);
  try{ await navigator.clipboard.writeText(text); }catch{}
  const blob = new Blob([text], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "fable-defect-"+Date.now()+".json";
  a.click();
  toast("Defect captured — copied to clipboard and downloaded. Paste it to Codex.");
};

/* boot + poll */
readHash();
refresh(true);
setInterval(()=>{ if(!state.acting) refresh(false); }, 5000);
</script>
</body>
</html>
